/* ---------- חדר הצ׳אט ---------- */
async function screenChat(conversationId) {
  const members = await call(db.from('conversation_members')
    .select('profile_id, profiles(id, username, full_name, avatar_url)')
    .eq('conversation_id', conversationId));

  if (!members.some((m) => m.profile_id === myId())) {
    return backHeader('שיחה', '#/messages') + emptyState('🔒', 'אין גישה לשיחה', 'רק משתתפי השיחה יכולים לקרוא אותה.');
  }

  const other = members.find((m) => m.profile_id !== myId())?.profiles;

  const messages = await call(db.from('messages')
    .select('id, sender_id, kind, body, attachment_url, created_at, read_at, deleted_at')
    .eq('conversation_id', conversationId).order('created_at', { ascending: true }).limit(200));

  setTimeout(() => {
    scrollChatToEnd();
    markConversationRead(conversationId);

    subscribe('messages', `conversation_id=eq.${conversationId}`, (payload) => {
      appendMessage(payload.new);
      markConversationRead(conversationId);
    }, 'INSERT');

    $('#chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('#chat-input');
      const body = input.value.trim();
      if (!body) return;

      input.value = '';
      const { data, error } = await db.from('messages')
        .insert({ conversation_id: conversationId, sender_id: myId(), kind: 'text', body })
        .select('id, sender_id, kind, body, created_at, deleted_at').single();

      if (error) { toastBad(errorMessage(error)); input.value = body; return; }
      appendMessage(data);   // לא מחכים ל־Realtime — ההודעה מופיעה מיד
    });
  });

  return `
    <div class="row" style="margin:.9rem 0">
      <button class="btn ghost icon" onclick="goBack('#/messages')" aria-label="חזרה">${icon('back')}</button>
      <a class="row grow" href="#/u/${encodeURIComponent(other?.username || '')}">
        ${avatar(other?.avatar_url, 'av-sm', other?.full_name)}
        <strong class="truncate">${esc(other?.full_name || 'שיחה')}</strong>
      </a>
    </div>

    <section class="card" style="display:flex;flex-direction:column;height:calc(100vh - 15rem);min-height:340px">
      <div class="bubbles grow" id="bubbles">
        ${messages.length ? messages.map(bubble).join('')
          : '<p class="muted sm center" style="margin:auto">אין עדיין הודעות. פתחו בשלום 👋</p>'}
      </div>
      <form class="row p" id="chat-form" style="border-top:1px solid hsl(var(--border))">
        <input class="input grow" id="chat-input" placeholder="כתבו הודעה…" maxlength="2000"
          autocomplete="off" aria-label="הודעה חדשה" />
        <button class="btn icon" type="submit" aria-label="שליחה">${icon('send', 18)}</button>
      </form>
    </section>`;
}

function bubble(message) {
  if (message.deleted_at) {
    return `<div class="bub sys">ההודעה נמחקה</div>`;
  }
  if (message.kind === 'system') {
    return `<div class="bub sys">${esc(message.body)}</div>`;
  }
  const mine = message.sender_id === myId();
  return `<div class="bub ${mine ? 'me' : 'you'}" data-message="${esc(message.id)}">
    ${message.attachment_url ? `<img src="${esc(message.attachment_url)}" alt="" style="border-radius:10px;margin-bottom:.3rem" />` : ''}
    ${esc(message.body)}
    <span class="tiny" style="display:block;opacity:.65;margin-top:.15rem">
      ${timeOf(message.created_at)}${mine && message.read_at ? ' · נקרא' : ''}</span>
  </div>`;
}

/** מוסיף הודעה פעם אחת בלבד — מונע כפילות מול אירוע Realtime. */
function appendMessage(message) {
  const box = $('#bubbles');
  if (!box || box.querySelector(`[data-message="${message.id}"]`)) return;
  if (box.querySelector('p')) box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', bubble(message));
  scrollChatToEnd();
}

function scrollChatToEnd() {
  const box = $('#bubbles');
  if (box) box.scrollTop = box.scrollHeight;
}

async function markConversationRead(conversationId) {
  await db.from('conversation_members')
    .update({ last_read_at: new Date().toISOString() })
    .eq('conversation_id', conversationId).eq('profile_id', myId());
}

        <h2>${esc(b.professional_services?.name || 'טיפול')}</h2>
        <span class="badge ${tone}">${label}</span>

      <div class="stack" style="gap:.4rem">
        ${summaryRow('מועד', dateTimeOf(b.scheduled_start))}
        ${summaryRow('משך', duration(b.duration_minutes))}
        ${summaryRow('מיקום', LOCATION_LABELS[b.location_type])}
        ${summaryRow('מספר אנשים', String(b.people_count))}
        ${b.price_amount ? summaryRow('מחיר הטיפול', money(b.price_amount)) : ''}
        ${Number(b.travel_fee) ? summaryRow('תוספת נסיעה', money(b.travel_fee)) : ''}
        ${b.total_price ? `<div class="between" style="font-weight:800">
          <span>סך הכול</span><span class="nums">${money(b.total_price)}</span></div>` : ''}
      </div>

      ${b.location_type === 'client_home' ? `
        <hr class="sep" />
        <div>
          <h3>כתובת השירות</h3>
          ${canSeeAddress && address ? `
            <p class="sm">${esc(address.street)} ${esc(address.house_number || '')}${
              address.apartment ? `, דירה ${esc(address.apartment)}` : ''}${
              address.floor ? `, קומה ${esc(address.floor)}` : ''}<br />
              ${esc(address.cities?.name || '')}</p>
            ${address.arrival_notes ? `<p class="tiny muted">${esc(address.arrival_notes)}</p>` : ''}`
            : `<p class="sm muted">🔒 הכתובת המלאה תיחשף לאחר אישור ההזמנה.</p>`}
        </div>` : ''}

      ${b.notes ? `<div><h3>הערות</h3><p class="sm muted">${esc(b.notes)}</p></div>` : ''}

      <hr class="sep" />
      <div class="row wrap">${bookingActions(b, proSide)}</div>

      ${b.status === 'completed' && !proSide ? (review

        : `<button class="btn block" id="write-review">כתיבת ביקורת</button>`) : ''}

    ${history.length ? `
      <section class="card p stack" style="margin-top:1rem">
        <h2>היסטוריית הסטטוסים</h2>
        <ol class="stack" style="gap:.35rem;list-style:none;padding:0">
          ${history.map((h) => `<li class="between tiny">
            <span>${esc((BOOKING_STATUS[h.to_status] || [h.to_status])[0])}</span>

/** הכפתורים המותרים בכל סטטוס, לכל צד. */
function bookingActions(b, proSide) {
  const button = (status, label, cls = 'btn') =>
    `<button class="${cls} grow" data-status="${status}">${label}</button>`;

  if (proSide) {
    switch (b.status) {
      case 'pending': return button('confirmed', 'אישור ההזמנה') + button('cancelled', 'דחייה', 'btn outline');
      case 'confirmed': return button('on_the_way', 'יוצא לדרך') + button('cancelled', 'ביטול', 'btn ghost');
      case 'on_the_way': return button('arrived', 'הגעתי');
      case 'arrived': return button('in_progress', 'התחלת הטיפול');
      case 'in_progress': return button('completed', 'סיום הטיפול');
      default: return '';
    }
  }

  if (['pending', 'confirmed'].includes(b.status)) {
    return button('cancelled', 'ביטול ההזמנה', 'btn outline');
  }
  return '';
}

async function changeBookingStatus(bookingId, status, button) {
  const confirmations = {
    cancelled: 'לבטל את ההזמנה?',
    completed: 'לסמן שהטיפול הושלם?',
  };
  if (confirmations[status] && !confirm(confirmations[status])) return;

  await withBusy(button, async () => {
    const { error } = await db.from('bookings').update({ status }).eq('id', bookingId);
    if (error) { toastBad(errorMessage(error)); return; }
    toastOk('הסטטוס עודכן');
    router();
  });
}

/* ---------- ביקורת ---------- */
function openReviewDialog(b) {
  openModal('ביקורת על הטיפול', `
    <div class="stack">
      <p class="sm muted">${esc(b.professional_profiles?.business_name)} · ${esc(b.professional_services?.name || '')}</p>
      <div class="field"><label>דירוג</label>
        <div class="row" id="stars" style="font-size:1.7rem;gap:.15rem">
          ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}"
            style="background:none;border:0;cursor:pointer;color:hsl(var(--warning))"
            aria-label="${n} כוכבים">☆</button>`).join('')}
        </div>
      </div>
      <div class="field"><label for="review-body">מה תרצו לספר?</label>
        <textarea class="input" id="review-body" maxlength="1000"
          placeholder="איך הייתה החוויה? מקצועיות, יחס, דיוק בזמנים…"></textarea></div>
    </div>`,
    `<button class="btn" id="send-review">פרסום הביקורת</button>`);

  let rating = 0;
  $$('#stars [data-star]').forEach((star) => {
    star.addEventListener('click', () => {
      rating = Number(star.dataset.star);
      $$('#stars [data-star]').forEach((s) => {
        s.textContent = Number(s.dataset.star) <= rating ? '★' : '☆';
      });
    });
  });

  $('#send-review').addEventListener('click', async (e) => {
    if (!rating) { toastBad('יש לבחור דירוג'); return; }
    await withBusy(e.currentTarget, async () => {
      const { error } = await db.from('reviews').insert({
        booking_id: b.id,
        professional_id: b.professional_profiles.id,
        client_id: myId(),
        service_id: b.professional_services ? undefined : undefined,
        rating,
        body: $('#review-body').value.trim() || null,
      });
      if (error) { toastBad(errorMessage(error)); return; }
      closeModal();
      toastOk('תודה! הביקורת פורסמה.');
      router();
    });
  });
}

/* ---------- סדרת מפגשים ---------- */
async function screenSeries(seriesId) {
  const s = await call(db.from('recurring_booking_series')
    .select(`*, professional_services(name, duration_minutes),
      professional_profiles(id, business_name, avatar_url,
        profiles!professional_profiles_profile_id_fkey(id, username, full_name)),
      profiles!recurring_booking_series_client_id_fkey(id, username, full_name, avatar_url)`)
    .eq('id', seriesId).maybeSingle());

  if (!s) return backHeader('סדרה', '#/bookings') + emptyState('🔍', 'הסדרה לא נמצאה', 'ייתכן שאין לכם גישה אליה.');

  const occurrences = await call(db.from('recurring_booking_occurrences')
    .select('id, sequence, scheduled_date, scheduled_start, status, note, booking_id')
    .eq('series_id', seriesId).order('sequence'));

  const proSide = s.professional_profiles?.profiles?.id === myId();
  const freq = FREQUENCIES.find((f) => f[0] === s.frequency)?.[1] || s.frequency;
  const weekdays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

  const needsMyApproval = s.status === 'pending'
    && ((proSide && !s.professional_approved_at) || (!proSide && !s.client_approved_at));

  setTimeout(() => {
    $('#approve-series')?.addEventListener('click', async (e) => {
      await withBusy(e.currentTarget, async () => {
        const field = proSide ? 'professional_approved_at' : 'client_approved_at';
        const { error } = await db.from('recurring_booking_series')
          .update({ [field]: new Date().toISOString() }).eq('id', seriesId);
        if (error) { toastBad(errorMessage(error)); return; }
        await db.rpc('materialize_series_bookings', { p_series_id: seriesId });
        toastOk('הסדרה אושרה!');
        router();
      });
    });

    $$('[data-skip]').forEach((button) => button.addEventListener('click', async () => {
      await withBusy(button, async () => {
        const { error } = await db.from('recurring_booking_occurrences')
          .update({ status: 'skipped' }).eq('id', button.dataset.skip);
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk('המפגש דולג');
        router();
      });
    }));

    $('#pause-series')?.addEventListener('click', async (e) => {
      const pausing = s.status === 'active';
      await withBusy(e.currentTarget, async () => {
        const { error } = await db.from('recurring_booking_series')
          .update({ status: pausing ? 'paused' : 'active', paused_at: pausing ? new Date().toISOString() : null })
          .eq('id', seriesId);
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk(pausing ? 'הסדרה הושהתה' : 'הסדרה חודשה');
        router();
      });
    });

    $('#cancel-series')?.addEventListener('click', async (e) => {
      if (!confirm('לבטל את כל המפגשים העתידיים בסדרה?')) return;
      await withBusy(e.currentTarget, async () => {
        const { error } = await db.from('recurring_booking_series')
          .update({ status: 'cancelled', cancelled_at: new Date().toISOString(), cancelled_by: myId() })
          .eq('id', seriesId);
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk('הסדרה בוטלה');
        router();
      });
    });
  });

  const OCC = { planned: ['מתוכנן', ''], booked: ['נקבע ביומן', 'pri'], skipped: ['דולג', 'warn'],
    moved: ['הוזז', 'warn'], cancelled: ['בוטל', 'dan'], completed: ['הושלם', 'ok'] };

  return `
    ${backHeader('מפגש קבוע', '#/bookings')}

    <section class="card p stack">
      <div class="row">
        ${avatar(proSide ? s.profiles?.avatar_url : s.professional_profiles?.avatar_url, 'av-md')}
        <div class="grow">
          <strong>${esc(proSide ? s.profiles?.full_name : s.professional_profiles?.business_name)}</strong>
          <span class="tiny muted" style="display:block">${esc(s.professional_services?.name || '')}</span>
        </div>
        <span class="badge ${s.status === 'active' ? 'ok' : s.status === 'pending' ? 'warn' : ''}">
          ${s.status === 'active' ? 'פעילה' : s.status === 'pending' ? 'ממתינה לאישור'
            : s.status === 'paused' ? 'מושהית' : s.status === 'cancelled' ? 'בוטלה' : 'הסתיימה'}</span>
      </div>

      <div class="stack" style="gap:.4rem">
        ${summaryRow('תדירות', freq)}
        ${summaryRow('יום ושעה', `יום ${weekdays[s.weekday]} בשעה ${String(s.start_time).slice(0, 5)}`)}
        ${summaryRow('מיקום', LOCATION_LABELS[s.location_type])}
        ${s.price_amount ? summaryRow('מחיר שסוכם', money(s.price_amount)) : ''}
        ${summaryRow('מספר מפגשים', String(s.planned_occurrences || occurrences.length))}
      </div>

      ${needsMyApproval ? `
        <div class="card p" style="background:hsl(var(--accent));box-shadow:none">
          <p class="sm">הסדרה תופעל רק אחרי ששני הצדדים יאשרו אותה.</p>
          <button class="btn block" id="approve-series" style="margin-top:.5rem">אישור הסדרה</button>
        </div>`
        : s.status === 'pending' ? '<p class="sm muted">ממתינים לאישור הצד השני…</p>' : ''}

      ${['active', 'paused'].includes(s.status) ? `
        <div class="row">
          <button class="btn outline grow" id="pause-series">
            ${s.status === 'active' ? 'השהיית הסדרה' : 'חידוש הסדרה'}</button>
          <button class="btn ghost grow" id="cancel-series">ביטול הסדרה</button>
        </div>` : ''}
    </section>

    <section class="card p stack" style="margin-top:1rem">
      <h2>כל המפגשים (${occurrences.length})</h2>
      <ol class="stack" style="gap:.4rem;list-style:none;padding:0">
        ${occurrences.map((o) => {
          const [label, tone] = OCC[o.status] || [o.status, ''];
          const isPast = new Date(o.scheduled_start) < new Date();
          const canEdit = !isPast && ['planned', 'booked', 'moved'].includes(o.status)
            && ['pending', 'active', 'paused'].includes(s.status);
          return `<li class="row" style="border:1px solid hsl(var(--border));border-radius:12px;padding:.6rem">
            <span class="badge">${o.sequence}</span>
            <span class="grow sm">${esc(dateTimeOf(o.scheduled_start))}</span>
            <span class="badge ${tone}">${label}</span>
            ${canEdit ? `<button class="btn ghost sm" data-skip="${esc(o.id)}"
              aria-label="דילוג על המפגש">דילוג</button>` : ''}
          </li>`;
        }).join('')}
      </ol>
    </section>`;
}

function needsOnboarding() {

    'אפשר להוסיף את עצמכם כבעלי מקצוע בכל שלב — אותו חשבון משמש לשני המצבים.',

async function screenProDashboard() {
  const pro = await myPro();
  if (!pro) return pageHeader('מצב בעל מקצוע') + needsOnboarding();

  const [pending, today, reviews] = await Promise.all([
    call(db.from('bookings').select(BOOKING_SELECT)
      .eq('professional_id', pro.id).eq('status', 'pending')
      .order('scheduled_start').limit(10)),
    call(db.from('bookings').select(BOOKING_SELECT)
      .eq('professional_id', pro.id)
      .gte('scheduled_start', `${ymd(new Date())}T00:00:00`)
      .lte('scheduled_start', `${ymd(new Date())}T23:59:59`)
      .order('scheduled_start')),
    call(db.from('reviews').select('rating, body, created_at, profiles!reviews_client_id_fkey(full_name)')
      .eq('professional_id', pro.id).is('deleted_at', null)
      .order('created_at', { ascending: false }).limit(3)),
  ]);

  setTimeout(() => {
    $('#available-now')?.addEventListener('change', async (e) => {
      const on = e.target.checked;

        .update({ available_now: on, available_now_until: on ? new Date(Date.now() + 4 * 3600000).toISOString() : null })

    });

    $('#available-today')?.addEventListener('change', async (e) => {
      const { error } = await db.from('professional_profiles')
        .update({ available_today: e.target.checked }).eq('id', pro.id);
      if (error) { toastBad(errorMessage(error)); e.target.checked = !e.target.checked; }
      else toastOk('הזמינות עודכנה');

    subscribe('bookings', `professional_id=eq.${pro.id}`, () => router());
  });

  const STATUS_LABEL = { draft: 'טיוטה', pending_review: 'ממתין לאישור', active: 'פעיל',
    paused: 'מושהה', rejected: 'נדחה' };

  return `
    ${pageHeader('לוח הבקרה המקצועי', pro.business_name,
      `<span class="badge ${pro.status === 'active' ? 'ok' : 'warn'}">${STATUS_LABEL[pro.status]}</span>`)}

    <section class="card p stack">
      <h2>זמינות מהירה</h2>
      <label class="between"><span class="sm">זמין/ה היום</span>

      <label class="between"><span class="sm">זמין/ה עכשיו (ל־4 שעות)</span>
        <input type="checkbox" id="available-now" ${pro.available_now ? 'checked' : ''} /></label>
    </section>

    <div class="grid2" style="margin-top:1rem">
      ${statTile('דירוג', pro.rating_count ? Number(pro.rating_avg).toFixed(1) : '—', `${pro.rating_count} ביקורות`)}
      ${statTile('טיפולים שהושלמו', fmtNum.format(pro.completed_bookings_count), 'מאז ההצטרפות')}
      ${statTile('עוקבים', fmtNum.format(pro.followers_count), '')}
      ${statTile('צפיות בפרופיל', fmtNum.format(pro.profile_views_count), '')}
    </div>

    <section class="card p stack" style="margin-top:1rem">
      <div class="between"><h2>בקשות חדשות (${pending.length})</h2>
        <a class="btn ghost sm" href="#/pro/bookings">הכול</a></div>
      ${pending.length ? pending.slice(0, 3).map((b) => bookingCard(b, true)).join('')
        : '<p class="muted sm">אין בקשות חדשות כרגע.</p>'}
    </section>

    <section class="card p stack" style="margin-top:1rem">
      <div class="between"><h2>היום ביומן (${today.length})</h2>
        <a class="btn ghost sm" href="#/pro/schedule">לוח הזמנים</a></div>
      ${today.length ? today.map((b) => bookingCard(b, true)).join('')
        : '<p class="muted sm">אין תורים היום.</p>'}
    </section>

    <section class="card p stack" style="margin-top:1rem">
      <h2>ביקורות אחרונות</h2>
      ${reviews.length ? reviews.map((r) => `
        <div class="between">
          <div class="grow"><strong class="sm">${esc(r.profiles?.full_name)}</strong>
            ${r.body ? `<p class="tiny muted truncate">${esc(r.body)}</p>` : ''}</div>
          <span style="color:hsl(var(--warning))">${'★'.repeat(r.rating)}</span>
        </div>`).join('')
        : '<p class="muted sm">אין עדיין ביקורות.</p>'}

    <div class="grid2" style="margin-top:1rem">
      <a class="btn outline" href="#/pro/services">ניהול שירותים</a>
      <a class="btn outline" href="#/pro/clients">לקוחות קבועים</a>
      <a class="btn outline" href="#/pro/stats">נתונים מקצועיים</a>
      <a class="btn outline" href="#/pro/schedule">לוח זמנים</a>

function statTile(label, value, sub) {
  return `<div class="card p center">
    <div class="big nums">${esc(value)}</div>
    <div class="sm" style="font-weight:600">${esc(label)}</div>
    ${sub ? `<div class="tiny muted">${esc(sub)}</div>` : ''}

}

/* ---------- הזמנות בעל המקצוע ---------- */
async function screenProBookings() {
  const pro = await myPro();
  if (!pro) return pageHeader('הזמנות') + needsOnboarding();

  const rows = await call(db.from('bookings').select(BOOKING_SELECT)
    .eq('professional_id', pro.id).order('scheduled_start', { ascending: false }).limit(80));

  const now = Date.now();
  const groups = {
    new: rows.filter((b) => b.status === 'pending'),
    upcoming: rows.filter((b) => ['confirmed', 'on_the_way', 'arrived', 'in_progress'].includes(b.status)
      && new Date(b.scheduled_start).getTime() >= now - 6 * 3600000),
    past: rows.filter((b) => ['completed', 'cancelled', 'no_show'].includes(b.status)),
  };

  setTimeout(() => {
    $$('#pb-tabs button').forEach((button) => {
      button.onclick = () => {
        $$('#pb-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b === button)));
        $$('[data-pb]').forEach((p) => { p.hidden = p.dataset.pb !== button.dataset.tab; });
      };
    });
    subscribe('bookings', `professional_id=eq.${pro.id}`, () => router());
  });

  return `
    ${pageHeader('הזמנות')}
    <div class="tabs" id="pb-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="new">חדשות (${groups.new.length})</button>
      <button role="tab" aria-selected="false" data-tab="upcoming">קרובות (${groups.upcoming.length})</button>
      <button role="tab" aria-selected="false" data-tab="past">היסטוריה</button>
    </div>

    ${Object.entries(groups).map(([key, list], index) => `
      <div data-pb="${key}" ${index ? 'hidden' : ''} class="stack" style="margin-top:1rem">
        ${list.length ? list.map((b) => bookingCard(b, true)).join('')
          : emptyState('📭', 'אין כאן הזמנות', key === 'new'
            ? 'בקשות חדשות יופיעו כאן מיד עם קבלתן.' : 'עדיין אין הזמנות בקטגוריה הזו.')}
      </div>`).join('')}`;
}

/* ---------- לוח זמנים ---------- */
async function screenProSchedule() {
  const pro = await myPro();
  if (!pro) return pageHeader('לוח זמנים') + needsOnboarding();

  const from = new Date(); from.setHours(0, 0, 0, 0);
  const to = new Date(from.getTime() + 7 * 86400000);

  const [bookings, blocked, availability] = await Promise.all([
    call(db.from('bookings').select(BOOKING_SELECT)
      .eq('professional_id', pro.id)
      .gte('scheduled_start', from.toISOString()).lt('scheduled_start', to.toISOString())
      .not('status', 'in', '(cancelled,no_show)').order('scheduled_start')),
    call(db.from('unavailable_dates').select('*').eq('professional_id', pro.id)
      .gte('end_at', from.toISOString()).order('start_at')),
    call(db.from('professional_availability').select('*').eq('professional_id', pro.id).order('weekday')),
  ]);

  setTimeout(() => {
    $('#block-time')?.addEventListener('click', () => openBlockDialog(pro.id));
    $$('[data-unblock]').forEach((button) => button.addEventListener('click', async () => {
      await withBusy(button, async () => {
        const { error } = await db.from('unavailable_dates').delete().eq('id', button.dataset.unblock);
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk('החסימה הוסרה');
        router();
      });
    }));
  });

  const weekdays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  const days = Array.from({ length: 7 }, (_, i) => new Date(from.getTime() + i * 86400000));

  return `
    ${pageHeader('לוח זמנים', 'שבוע קרוב', `<button class="btn sm" id="block-time">חסימת זמן</button>`)}

    <div class="stack">
      ${days.map((day) => {
        const key = ymd(day);
        const dayBookings = bookings.filter((b) => ymd(b.scheduled_start) === key);
        const windows = availability.filter((a) => a.weekday === day.getDay() && !a.is_break);
        const dayBlocks = blocked.filter((b) =>
          new Date(b.start_at) <= new Date(`${key}T23:59:59`) && new Date(b.end_at) >= new Date(`${key}T00:00:00`));
        const isToday = key === ymd(new Date());

        return `<section class="card p" ${isToday ? 'style="border-color:hsl(var(--primary)/.4)"' : ''}>
          <div class="between" style="margin-bottom:.5rem">
            <h2>${weekdays[day.getDay()]} · ${esc(dateOf(day))}
              ${isToday ? '<span class="badge pri">היום</span>' : ''}</h2>
            <span class="tiny muted nums">${windows.map((w) =>
              `${String(w.start_time).slice(0, 5)}–${String(w.end_time).slice(0, 5)}`).join(', ')}</span>
          </div>

          ${dayBlocks.map((b) => `<div class="row sm" style="color:hsl(var(--destructive));
            background:hsl(var(--destructive)/.08);border-radius:10px;padding:.4rem .6rem;margin-bottom:.35rem">
            <span class="grow">${b.is_vacation ? '✈️ חופשה' : '⛔ זמן חסום'}${b.reason ? ` · ${esc(b.reason)}` : ''}</span>
            <button class="btn ghost sm" data-unblock="${esc(b.id)}" aria-label="הסרת החסימה">הסרה</button>
          </div>`).join('')}

          ${dayBookings.length ? dayBookings.map((b) => `
            <a class="row sm" href="#/bookings/${esc(b.id)}"
              style="border:1px solid hsl(var(--border));border-radius:10px;padding:.5rem;margin-bottom:.35rem">
              <span class="center" style="width:3rem">
                <strong class="nums" style="display:block">${timeOf(b.scheduled_start)}</strong>
                <span class="tiny muted">${b.duration_minutes} דק׳</span></span>
              <span class="grow" style="min-width:0">
                <strong class="truncate" style="display:block">${esc(b.profiles?.full_name || '')}</strong>
                <span class="tiny muted truncate">${esc(b.professional_services?.name || '')}</span></span>
              <span class="badge ${(BOOKING_STATUS[b.status] || [])[1] || ''}">${(BOOKING_STATUS[b.status] || [])[0]}</span>
            </a>`).join('')
            : `<p class="sm muted">${windows.length ? 'אין הזמנות' : 'יום סגור'}</p>`}
        </section>`;
      }).join('')}
    </div>`;
}

function openBlockDialog(professionalId) {
  // ברירת המחדל מתחילה בשעה העגולה הקרובה, כדי שלא ייווצר טווח בעבר.
  const start = new Date();
  start.setMinutes(0, 0, 0);
  start.setHours(start.getHours() + 1);
  const end = new Date(start.getTime() + 3 * 3600000);

  openModal('חסימת זמן ביומן', `
    <div class="stack">
      <p class="sm muted">בזמן החסום לא ניתן יהיה להזמין אתכם.</p>
      <div class="field"><label for="block-start">מתאריך ושעה</label>
        <input class="input" id="block-start" type="datetime-local" value="${toLocalInput(start)}" /></div>
      <div class="field"><label for="block-end">עד תאריך ושעה</label>
        <input class="input" id="block-end" type="datetime-local" value="${toLocalInput(end)}" /></div>
      <div class="field"><label for="block-reason">סיבה (רשות)</label>
        <input class="input" id="block-reason" placeholder="לדוגמה: השתלמות מקצועית" /></div>
      <label class="row" style="font-weight:400">
        <input type="checkbox" id="block-vacation" /> <span class="sm">זו חופשה</span></label>
    </div>`,
    `<button class="btn" id="save-block">שמירה</button>`);

  $('#save-block').addEventListener('click', async (e) => {
    const startAt = $('#block-start').value;
    const endAt = $('#block-end').value;
    if (!startAt || !endAt || new Date(endAt) <= new Date(startAt)) {
      toastBad('תאריך הסיום חייב להיות אחרי תאריך ההתחלה');
      return;
    }

    await withBusy(e.currentTarget, async () => {
      const { error } = await db.from('unavailable_dates').insert({
        professional_id: professionalId,
        start_at: fromLocalInput(startAt),
        end_at: fromLocalInput(endAt),
        reason: $('#block-reason').value.trim() || null,
        is_vacation: $('#block-vacation').checked,
      });
      if (error) { toastBad(errorMessage(error)); return; }
      closeModal();
      toastOk('הזמן נחסם ביומן');
      router();
    });
  });
}

/* ---------- נתונים מקצועיים ---------- */
async function screenProStats() {
  const pro = await myPro();
  if (!pro) return pageHeader('נתונים מקצועיים') + needsOnboarding();

  const bookings = await call(db.from('bookings')
    .select('status, total_price, created_at, scheduled_start')
    .eq('professional_id', pro.id).limit(500));

  const completed = bookings.filter((b) => b.status === 'completed');
  const confirmed = bookings.filter((b) => !['pending', 'draft'].includes(b.status));
  const revenue = completed.reduce((sum, b) => sum + Number(b.total_price || 0), 0);
  const approvalRate = bookings.length
    ? Math.round((confirmed.filter((b) => b.status !== 'cancelled').length / bookings.length) * 100) : 0;

  return `
    ${pageHeader('נתונים מקצועיים', 'מבט על הפעילות שלכם')}

    <div class="grid2">
      ${statTile('טיפולים שהושלמו', fmtNum.format(completed.length), '')}
      ${statTile('הכנסה משוערת', money(revenue), 'מטיפולים שהושלמו')}
      ${statTile('שיעור אישור', `${approvalRate}%`, 'מתוך כלל הבקשות')}
      ${statTile('דירוג ממוצע', pro.rating_count ? Number(pro.rating_avg).toFixed(1) : '—',
        `${pro.rating_count} ביקורות`)}
      ${statTile('צפיות בפרופיל', fmtNum.format(pro.profile_views_count), '')}
      ${statTile('עוקבים', fmtNum.format(pro.followers_count), '')}
      ${statTile('לקוחות', fmtNum.format(pro.clients_count), '')}
      ${statTile('זמן תגובה', pro.response_time_minutes ? duration(pro.response_time_minutes) : '—', 'ממוצע')}
    </div>

    <section class="card p stack" style="margin-top:1rem">
      <h2>פילוח ההזמנות</h2>
      ${Object.entries(bookings.reduce((acc, b) => { acc[b.status] = (acc[b.status] || 0) + 1; return acc; }, {}))
        .sort((a, b) => b[1] - a[1])
        .map(([status, count]) => {
          const pct = bookings.length ? (count / bookings.length) * 100 : 0;
          return `<div class="row tiny">
            <span style="width:8rem">${esc((BOOKING_STATUS[status] || [status])[0])}</span>
            <span class="meter grow"><i style="width:${pct}%;background:hsl(var(--primary))"></i></span>
            <span class="nums muted" style="width:2rem">${count}</span></div>`;
        }).join('') || '<p class="muted sm">אין עדיין הזמנות.</p>'}
    </section>`;
}

  const s = service || {};
  openModal(service ? 'עריכת שירות' : 'שירות חדש', `
    <div class="stack">
      <div class="field"><label for="svc-name">שם השירות *</label>
        <input class="input" id="svc-name" value="${esc(s.name || '')}" /></div>

      <div class="field"><label for="svc-desc">תיאור</label>
        <textarea class="input" id="svc-desc" maxlength="500">${esc(s.description || '')}</textarea></div>

      ${professions.length > 1 ? `<div class="field"><label for="svc-prof">תחום</label>
        <select class="input" id="svc-prof">
          ${professions.map((p) => `<option value="${esc(p.profession_id)}"
            ${p.profession_id === s.profession_id ? 'selected' : ''}>${esc(p.professions?.name)}</option>`).join('')}
        </select></div>` : ''}

      <div class="field"><label for="svc-type">סוג תמחור</label>
        <select class="input" id="svc-type">
          <option value="fixed" ${s.price_type === 'fixed' ? 'selected' : ''}>מחיר קבוע</option>

        </select></div>

      <div class="row">
        <div class="field grow"><label for="svc-min">מחיר (₪)</label>
          <input class="input" id="svc-min" type="number" min="0" value="${esc(s.price_min ?? '')}" /></div>
        <div class="field grow"><label for="svc-max">עד (לטווח)</label>
          <input class="input" id="svc-max" type="number" min="0" value="${esc(s.price_max ?? '')}" /></div>
      </div>

      <div class="row">
        <div class="field grow"><label for="svc-dur">משך (דקות)</label>
          <input class="input" id="svc-dur" type="number" min="5" step="5" value="${esc(s.duration_minutes ?? 60)}" /></div>
        <div class="field grow"><label for="svc-buf">זמן התארגנות</label>

      </div>

      <label class="row" style="font-weight:400"><input type="checkbox" id="svc-home"
        ${s.at_client_home !== false ? 'checked' : ''} /> <span class="sm">ניתן להזמין בבית הלקוח</span></label>
      <label class="row" style="font-weight:400"><input type="checkbox" id="svc-studio"
        ${s.at_studio ? 'checked' : ''} /> <span class="sm">ניתן להזמין בסטודיו</span></label>
      <label class="row" style="font-weight:400"><input type="checkbox" id="svc-recurring"
        ${s.supports_recurring ? 'checked' : ''} /> <span class="sm">ניתן להזמין כמפגש קבוע</span></label>
      <label class="row" style="font-weight:400"><input type="checkbox" id="svc-active"
        ${s.is_active !== false ? 'checked' : ''} /> <span class="sm">השירות פעיל ומוצג ללקוחות</span></label>
    </div>`,
    `<button class="btn" id="save-service">שמירה</button>
     ${service ? `<button class="btn ghost" id="delete-service">מחיקה</button>` : ''}`);

  $('#save-service').addEventListener('click', async (e) => {
    const name = $('#svc-name').value.trim();
    if (!name) { toastBad('יש להזין שם שירות'); return; }

    const payload = {
      professional_id: professionalId,
      profession_id: $('#svc-prof')?.value || professions[0]?.profession_id,
      name,
      description: $('#svc-desc').value.trim() || null,
      price_type: $('#svc-type').value,
      price_min: $('#svc-min').value ? Number($('#svc-min').value) : null,
      price_max: $('#svc-max').value ? Number($('#svc-max').value) : null,
      duration_minutes: Number($('#svc-dur').value) || 60,
      buffer_minutes: Number($('#svc-buf').value) || 0,
      at_client_home: $('#svc-home').checked,
      at_studio: $('#svc-studio').checked,
      supports_recurring: $('#svc-recurring').checked,
      is_active: $('#svc-active').checked,
    };

    await withBusy(e.currentTarget, async () => {
      const { error } = service

        : await db.from('professional_services').insert(payload);
      if (error) { toastBad(errorMessage(error)); return; }
      closeModal();
      toastOk(service ? 'השירות עודכן' : 'השירות נוסף');

      const { error } = await db.from('professional_services')
        .update({ deleted_at: new Date().toISOString(), is_active: false }).eq('id', service.id);
      if (error) { toastBad(errorMessage(error)); return; }
      closeModal();
      toastOk('השירות נמחק');
      router();
    });
  });
}

  const draft = JSON.parse(localStorage.getItem('yofi.onboarding') || '{}');

  onboarding = {
    id: existing?.id || null,
    step: 1,
    professions,
    cities,
    data: {
      business_name: existing?.business_name ?? draft.business_name ?? me()?.full_name ?? '',
      headline: existing?.headline ?? draft.headline ?? '',
      bio: existing?.bio ?? draft.bio ?? '',
      years_experience: existing?.years_experience ?? draft.years_experience ?? '',
      city_id: existing?.city_id ?? draft.city_id ?? me()?.city_id ?? '',
      accepts_home_visits: existing?.accepts_home_visits ?? true,
      accepts_studio: existing?.accepts_studio ?? false,
      accepts_events: existing?.accepts_events ?? false,
      max_travel_km: existing?.max_travel_km ?? 25,
      travel_fee: existing?.travel_fee ?? 0,
      professionIds: chosen.map((c) => c.profession_id),
      otherProfession: '',
    },
  };

  setTimeout(renderOnboardingStep);
  return `${backHeader(existing ? 'הפרופיל המקצועי שלי' : 'הצטרפות כבעל/ת מקצוע')}<div id="onb-root"></div>`;
}

function renderOnboardingStep() {
  const root = $('#onb-root');
  if (!root) return;

  const steps = ['פרטים', 'מקצועות', 'מיקום השירות'];
  root.innerHTML = `

function bindOnboardingStep() {
  const d = onboarding.data;

  const collect = () => {
    if ($('#ob-name')) {
      d.business_name = $('#ob-name').value.trim();
      d.headline = $('#ob-headline').value.trim();
      d.bio = $('#ob-bio').value.trim();
      d.years_experience = $('#ob-years').value;
      d.city_id = $('#ob-city').value;
    }
    if ($('#ob-other')) d.otherProfession = $('#ob-other').value.trim();
    if ($('#ob-home')) {
      d.accepts_home_visits = $('#ob-home').checked;
      d.accepts_studio = $('#ob-studio').checked;
      d.accepts_events = $('#ob-events').checked;
      d.max_travel_km = Number($('#ob-km').value) || 0;
      d.travel_fee = Number($('#ob-fee').value) || 0;
    }
    localStorage.setItem('yofi.onboarding', JSON.stringify(d));
  };

  $$('[data-onb-next]').forEach((b) => b.addEventListener('click', () => {
    collect();
    if (onboarding.step === 1) {
      if (!d.business_name) { toastBad('יש להזין שם עסק'); return; }
      if (!d.city_id) { toastBad('יש לבחור עיר'); return; }
    }
    if (onboarding.step === 2 && !d.professionIds.length && !d.otherProfession) {
      toastBad('יש לבחור לפחות מקצוע אחד');
      return;
    }
    onboarding.step++;
    renderOnboardingStep();
  }));

  $$('[data-onb-back]').forEach((b) => b.addEventListener('click', () => {
    collect();
    onboarding.step--;
    renderOnboardingStep();
  }));

  $$('[data-prof-pick]').forEach((chip) => chip.addEventListener('click', () => {
    const id = chip.dataset.profPick;
    const on = chip.getAttribute('aria-pressed') === 'true';
    chip.setAttribute('aria-pressed', String(!on));
    d.professionIds = on ? d.professionIds.filter((x) => x !== id) : [...d.professionIds, id];
  }));

  $('#save-onboarding')?.addEventListener('click', async (e) => {
    collect();
    await withBusy(e.currentTarget, async () => {
      const payload = {
        profile_id: myId(),
        business_name: d.business_name,
        headline: d.headline || null,
        bio: d.bio || null,
        years_experience: d.years_experience ? Number(d.years_experience) : null,
        city_id: d.city_id,
        avatar_url: me()?.avatar_url || null,
        accepts_home_visits: d.accepts_home_visits,
        accepts_studio: d.accepts_studio,
        accepts_events: d.accepts_events,
        max_travel_km: d.max_travel_km,
        travel_fee: d.travel_fee,
        travel_fee_type: d.travel_fee ? 'fixed' : 'none',
      };

      const pro = onboarding.id
        ? await call(db.from('professional_profiles').update(payload).eq('id', onboarding.id).select('id').single())
        : await call(db.from('professional_profiles').insert(payload).select('id').single());

      // מקצועות
      await db.from('professional_professions').delete().eq('professional_id', pro.id);
      if (d.professionIds.length) {
        await db.from('professional_professions')
          .insert(d.professionIds.map((id) => ({ professional_id: pro.id, profession_id: id })));
      }

      // בקשה למקצוע חדש
      if (d.otherProfession) {
        const { error } = await db.from('profession_requests').insert({
          requested_by: myId(), raw_name: d.otherProfession,
        });
        if (!error) toastOk('הצעת המקצוע נשלחה לאישור');
      }

      localStorage.removeItem('yofi.onboarding');
      await restoreSession();
      renderShell();
      toastOk('הפרופיל המקצועי נשמר!');
      location.hash = '#/pro/services';
    });
  });
}

function openChangePassword() {
  openModal('שינוי סיסמה', `
    <div class="stack">
      <div class="field"><label for="cp-current">הסיסמה הנוכחית</label>
        <input class="input" id="cp-current" type="password" autocomplete="current-password" /></div>
      <div class="field"><label for="cp-new">סיסמה חדשה</label>
        <input class="input" id="cp-new" type="password" autocomplete="new-password" />
        <p class="hint">לפחות שמונה תווים, אות וספרה.</p></div>
      <div class="field"><label for="cp-confirm">אימות הסיסמה החדשה</label>
        <input class="input" id="cp-confirm" type="password" autocomplete="new-password" /></div>
    </div>`,
    `<button class="btn" id="do-change-password">עדכון</button>`);

  $('#do-change-password').addEventListener('click', async (e) => {
    const next = $('#cp-new').value;
    if (next !== $('#cp-confirm').value) { toastBad('הסיסמאות אינן זהות'); return; }
    if (!passwordStrength(next).ok) { toastBad('הסיסמה חייבת לכלול שמונה תווים, אות וספרה'); return; }

    await withBusy(e.currentTarget, async () => {
      const { error } = await db.rpc('auth_change_password', {
        p_current: $('#cp-current').value, p_new: next,
      });
      if (error) { toastBad(errorMessage(error)); return; }
      closeModal();
      toastOk('הסיסמה עודכנה');
    });
  });
}

async function openRotateCode() {

  const { data, error } = await db.rpc('auth_rotate_recovery_code');

  showRecoveryCode(data.recovery_code, false);

        const { error } = await db.rpc('approve_profession_request', { p_request_id: button.dataset.approveProf });
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk('המקצוע אושר והתווסף לרשימה');
        router();
      });
    }));

    $$('[data-verify]').forEach((button) => button.addEventListener('click', async () => {
      await withBusy(button, async () => {
        const { error } = await db.from('professional_profiles')
          .update({ is_verified: true, verified_at: new Date().toISOString() }).eq('id', button.dataset.verify);
        if (error) { toastBad(errorMessage(error)); return; }
        toastOk('בעל המקצוע אומת');
        router();
      });
    }));
  });

  return `
    ${pageHeader('פאנל ניהול')}

    ${stats ? `<div class="grid2">
      ${statTile('משתמשים', fmtNum.format(stats.users ?? stats.total_users ?? 0), '')}
      ${statTile('בעלי מקצוע פעילים', fmtNum.format(stats.active_professionals ?? 0), '')}
      ${statTile('הזמנות', fmtNum.format(stats.bookings ?? stats.total_bookings ?? 0), '')}
      ${statTile('פוסטים', fmtNum.format(stats.posts ?? stats.total_posts ?? 0), '')}
    </div>` : ''}

    <section class="card p stack" style="margin-top:1rem">
      <h2>בקשות למקצוע חדש (${requests.length})</h2>
      ${requests.length ? requests.map((r) => `
        <div class="between">
          <div><strong class="sm">${esc(r.raw_name)}</strong>
            <span class="tiny muted" style="display:block">
              הוצע על ידי ${esc(r.profiles?.full_name || '')} · ${relTime(r.created_at)}</span></div>
          <button class="btn sm" data-approve-prof="${esc(r.id)}">אישור</button>
        </div>`).join('')
        : '<p class="muted sm">אין בקשות ממתינות.</p>'}
    </section>

    <section class="card p stack" style="margin-top:1rem">
      <h2>בעלי מקצוע</h2>
      ${pros.map((p) => `
        <div class="between">
          <div class="grow" style="min-width:0">
            <strong class="sm truncate">${esc(p.business_name)}</strong>
            <span class="tiny muted" style="display:block">@${esc(p.profiles?.username || '')}</span>
          </div>
          <span class="badge ${p.status === 'active' ? 'ok' : 'warn'}">${esc(p.status)}</span>
          ${p.is_verified ? '<span class="badge ok">מאומת</span>'
            : `<button class="btn ghost sm" data-verify="${esc(p.id)}">אימות</button>`}
        </div>`).join('')}
    </section>`;
}

   21. הפעלה
   ========================================================== */

/**
 * טופס החיבור למסד הנתונים.
 *
 * אינו מסך פתיחה: האפליקציה נפתחת כרגיל, וכשאין חיבור מוצג במסך
 * הראשי הסבר קצר עם כפתור לכאן. אפשר להגיע לכאן גם מההגדרות.
 */
function screenConnect() {
  setTimeout(() => {
    $('#cfg-save')?.addEventListener('click', () => {
      const url = $('#cfg-url').value.trim().replace(/\/$/, '');
      const key = $('#cfg-key').value.trim();

      if (!/^https?:\/\/.+/.test(url)) { toastBad('כתובת הפרויקט אינה תקינה'); return; }
      if (key.length < 20) { toastBad('המפתח אינו תקין'); return; }
      if (key.includes('service_role')) { toastBad('אין להשתמש במפתח service_role בדפדפן'); return; }

      localStorage.setItem('yofi.url', url);
      localStorage.setItem('yofi.key', key);
      location.reload();
    });

    $('#cfg-clear')?.addEventListener('click', () => {
      localStorage.removeItem('yofi.url');
      localStorage.removeItem('yofi.key');
      localStorage.removeItem(TOKEN_KEY);
      location.reload();
    });
  });

  const connected = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

  return `
    ${backHeader('חיבור למסד הנתונים')}

    <section class="card p stack">
      ${connected
        ? `<p class="sm"><span class="badge ok">מחובר</span></p>
           <p class="sm muted" dir="ltr" style="word-break:break-all">${esc(CONFIG.SUPABASE_URL)}</p>`
        : `<p class="sm">כאן מחברים את האפליקציה למסד הנתונים שלכם. עד אז לא יוצג תוכן.</p>`}

      <ol class="sm muted" style="margin:0;padding-inline-start:1.2rem">
        <li><span dir="ltr">supabase.com</span> → הפרויקט שלכם</li>
        <li><strong>Project Settings → API</strong></li>
        <li>מעתיקים את שני הערכים לשדות כאן</li>
      </ol>

      <div class="field"><label for="cfg-url">Project URL</label>
        <input class="input" id="cfg-url" dir="ltr" placeholder="https://xxxx.supabase.co"
          value="${esc(CONFIG.SUPABASE_URL || '')}" /></div>

      <div class="field"><label for="cfg-key">anon public key</label>
        <input class="input" id="cfg-key" dir="ltr" placeholder="eyJhbGciOi…"
          value="${esc(CONFIG.SUPABASE_ANON_KEY || '')}" />
        <p class="hint">המפתח הארוך שמסומן <span dir="ltr">anon</span> / <span dir="ltr">public</span>.
          <strong>לא</strong> ה־service_role.</p></div>

      <button class="btn block" id="cfg-save">שמירה</button>
      ${connected ? `<button class="btn ghost block" id="cfg-clear">ניקוי החיבור</button>` : ''}

      <p class="tiny muted">
        שני הערכים ציבוריים ומיועדים לדפדפן — הם מוגנים על ידי Row Level Security.
        הם נשמרים בדפדפן שלכם בלבד. אפשר גם לקבע אותם בראש הקובץ, ואז המסך הזה
        לא יידרש כלל.
      </p>
    </section>`;
}

/** טוען את ספריית Supabase מ־CDN. */
function loadSupabaseLibrary() {
  return new Promise((resolve, reject) => {
    if (window.supabase?.createClient) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('טעינת ספריית Supabase נכשלה'));
    document.head.appendChild(script);
  });
}

async function boot() {
  try {
    await loadSupabaseLibrary();
  } catch {
    $('#app').innerHTML = `<div class="shell"><div style="margin-top:2rem">
      ${emptyState('📡', 'לא הצלחנו לטעון את הספרייה',
        'בדקו את החיבור לאינטרנט ורעננו את הדף.',
        `<button class="btn" onclick="location.reload()">רענון</button>`)}</div></div>`;
    return;
  }

  const configured = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

  // בלי הגדרות אין למי לפנות, אבל האפליקציה עדיין נפתחת: המעטפת,
  // הניווט והעיצוב נטענים, והנתב מציג הסבר עם מעבר למסך החיבור.
  if (configured) {
    db = makeClient(null);
    try {
      await restoreSession();
    } catch (error) {
      console.error('שחזור הסשן נכשל:', error);
    }
  }

  renderShell();
  await router();
  if (session) refreshUnread();

  if (configured) {
    // בדיקת חיבור בסיסית — נותנת הודעה ברורה במקום מסך ריק
    const { error } = await db.from('cities').select('id').limit(1);
    if (error) toastBad(`חיבור למסד הנתונים נכשל: ${errorMessage(error)}`);
  }
}

/* חשיפת הפונקציות שנקראות מתוך onclick ב־HTML */
Object.assign(window, {
  router, goBack, logout, startChat, closeModal, openReport, toggleSavePro,
  markRead, deleteComment, resetSearch, sharePost, openAddressDialog,
});

boot();

</script>
