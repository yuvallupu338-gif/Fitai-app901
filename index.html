<!DOCTYPE html>

<head>

<title>FitAI · תוכנית אישית</title>

<!-- The whole origin shares one localStorage jar, and this app's half of it
     holds the vendor API keys. script-src has no 'unsafe-inline' and there is
     nothing inline left to need it: no generated event handlers, no eval, no
     style attributes. connect-src names the two vendors this app actually
     talks to and nothing else, so a scripting bug could not beacon a key out.
     frame-ancestors is omitted on purpose — it is ignored in a meta tag. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com https://api.deepseek.com; media-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E1520'/><path d='M9 22V10h11M9 16h8' stroke='%23FFB13C' stroke-width='2.6' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>

    </p>
  </noscript>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
