  אין כאן שרת ואין שלב בנייה: אפשר לפתוח את הקובץ בדפדפן או

<script>
/* ==========================================================
   1. הגדרות, לקוח Supabase וניהול הסשן
   ========================================================== */

/**
 * הגדרות החיבור.
 *
 * שני הערכים האלה ציבוריים לחלוטין: כתובת הפרויקט ומפתח anon.
 * הם מוגנים על ידי Row Level Security ואינם מאפשרים לקרוא או לשנות
 * דבר שהמשתמש המחובר אינו רשאי לו. אין להוסיף כאן service_role או
 * את מפתח החתימה.
 *
 * אפשר למלא כאן, או להזין פעם אחת במסך ההגדרה שנפתח אוטומטית.
 */
const CONFIG = {
  SUPABASE_URL: window.YOFI_SUPABASE_URL || localStorage.getItem('yofi.url') || '',
  SUPABASE_ANON_KEY: window.YOFI_SUPABASE_ANON_KEY || localStorage.getItem('yofi.key') || '',
};

const TOKEN_KEY = 'yofi.token';
const THEME_KEY = 'yofi.theme';

let db = null;
let session = null;      // { token, profile }
let realtimeChannels = [];

/** יוצר לקוח Supabase. נוצר מחדש בכל התחברות/התנתקות כדי לעדכן את האסימון. */
function makeClient(token) {
  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;

  const client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    global: { headers },
    realtime: { params: { eventsPerSecond: 5 } },
  });

  // Realtime מקבל את אותו אסימון, כך שגם ההרשאות בזמן אמת נאכפות ב־RLS.
  if (token) client.realtime.setAuth(token);
  return client;
}

/** מחזיר את גוף האסימון בלי לאמת אותו — לשימוש תצוגתי בלבד. */
function readToken(token) {
  try {
    const body = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(body))));
  } catch { return null; }
}

/** טוען סשן קיים מהאחסון המקומי ומוודא שהוא עדיין בתוקף. */
async function restoreSession() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return null;

  const claims = readToken(token);
  if (!claims || claims.exp * 1000 < Date.now()) {
    localStorage.removeItem(TOKEN_KEY);
    return null;
  }

  db = makeClient(token);
  const { data, error } = await db.rpc('auth_me');
  if (error || !data) {
    localStorage.removeItem(TOKEN_KEY);
    db = makeClient(null);
    return null;
  }

  session = { token, profile: data };
  return session;
}

/** שומר סשן חדש. האסימון נשמר ב־localStorage — זו העדפת ממשק, לא מסד נתונים. */
function setSession(token, profile) {
  localStorage.setItem(TOKEN_KEY, token);
  session = { token, profile };
  db = makeClient(token);
}

function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  session = null;
  unsubscribeAll();
  db = makeClient(null);
}

const me = () => session?.profile ?? null;
const myId = () => session?.profile?.id ?? null;
const isPro = () => Boolean(session?.profile?.is_professional);

/* ---------- מצב תצוגה ---------- */
function applyTheme(theme) {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}
function currentTheme() { return localStorage.getItem(THEME_KEY) || 'system'; }
applyTheme(currentTheme());

/* ==========================================================
   2. עזרי תצוגה
   ========================================================== */

/** ממלט טקסט לפני הזרקה ל־HTML. כל טקסט שמגיע מהמסד עובר כאן. */
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/**
 * מנרמל תוצאת embed של PostgREST למערך.
 *
 * יחס "אחד לאחד" (למשל תגובה יחידה לביקורת) מוחזר כאובייקט ולא כמערך,
 * ולכן קריאה ישירה ל־map הייתה נכשלת בדיוק על השורות שיש בהן תוכן.
 */
function asArray(value) {
  if (Array.isArray(value)) return value;
  return value ? [value] : [];
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function toast(message, kind = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  el.textContent = message;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 3400);
}
const toastOk = (m) => toast(m, 'ok');
const toastBad = (m) => toast(m, 'bad');

/** מתרגם שגיאת Postgres/PostgREST להודעה קריאה בעברית. */
function errorMessage(error) {
  if (!error) return 'משהו השתבש. אפשר לנסות שוב.';
  const raw = error.message || String(error);

  if (/duplicate key|already exists/i.test(raw)) return 'הפריט כבר קיים.';
  if (/bookings_no_overlap/i.test(raw)) return 'המועד הזה כבר תפוס ביומן. בחרו שעה אחרת.';
  if (/violates row-level security|permission denied/i.test(raw)) return 'אין לכם הרשאה לבצע את הפעולה הזו.';
  if (/JWT|token is expired/i.test(raw)) return 'החיבור פג. יש להתחבר מחדש.';
  if (/Failed to fetch|NetworkError/i.test(raw)) return 'אין חיבור לשרת. בדקו את החיבור לאינטרנט.';
  return raw;
}

/* ---------- תאריכים ומספרים ---------- */
const TZ = 'Asia/Jerusalem';
const fmtDate = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtDateLong = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtNum = new Intl.NumberFormat('he-IL');

const toDate = (v) => (v instanceof Date ? v : new Date(v));
const dateOf = (v) => fmtDate.format(toDate(v));
const timeOf = (v) => fmtTime.format(toDate(v));
const dateTimeOf = (v) => `${fmtDateLong.format(toDate(v))} · ${timeOf(v)}`;

function money(amount) {
  if (amount === null || amount === undefined) return 'לפי פנייה';
  return `${fmtNum.format(Math.round(Number(amount) * 100) / 100)} ₪`;
}

function servicePrice(type, min, max) {
  if (type === 'on_request' || min === null || min === undefined) return 'מחיר לאחר שיחה';
  if (type === 'range' && max !== null && max !== undefined) return `${money(min)} – ${money(max)}`;
  return money(min);
}

function duration(minutes) {
  if (!minutes) return '';
  if (minutes < 60) return `${minutes} דק׳`;
  const h = Math.floor(minutes / 60), r = minutes % 60;
  const ht = h === 1 ? 'שעה' : h === 2 ? 'שעתיים' : `${h} שעות`;
  return r ? `${ht} ו־${r} דק׳` : ht;
}

function relTime(value) {
  const diff = Date.now() - toDate(value).getTime();
  const m = Math.round(diff / 60000);
  if (m < 1) return 'עכשיו';
  if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? 'לפני שעה' : h === 2 ? 'לפני שעתיים' : `לפני ${h} שעות`;
  const d = Math.round(h / 24);
  if (d === 1) return 'אתמול';
  if (d < 7) return `לפני ${d} ימים`;
  const w = Math.round(d / 7);
  if (w === 1) return 'לפני שבוע';
  if (w < 5) return `לפני ${w} שבועות`;
  const mo = Math.round(d / 30);
  if (mo === 1) return 'לפני חודש';
  if (mo < 12) return `לפני ${mo} חודשים`;
  return `לפני ${Math.round(d / 365)} שנים`;
}

function plural(count, one, many, zero) {
  if (count === 0 && zero) return zero;
  if (count === 1) return one;
  return `${fmtNum.format(count)} ${many}`;
}

/** ממיר Date לערך של <input type="datetime-local"> — הכול בשעון הדפדפן. */
function toLocalInput(value) {
  const d = toDate(value);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const fromLocalInput = (value) => new Date(value).toISOString();

/** "YYYY-MM-DD" בשעון ישראל. */
function ymd(value) {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(toDate(value));
  const get = (t) => parts.find((p) => p.type === t)?.value ?? '';
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function renderShell() {
  const app = $('#app');

    <header class="topbar">

function paintThemeButton() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('#btn-theme').innerHTML = icon(dark ? 'sun' : 'moon');
}

/** מצייר את הניווט. במצב בעל מקצוע מתווספים הקישורים המקצועיים. */
function paintNav() {
  const here = location.hash || '#/';
  const active = (path) => (path === '#/' ? here === '#/' || here === '' : here.startsWith(path));

  $('#bottom-links').innerHTML = NAV.map((n) => `
    <li><a href="${n.path}" ${active(n.path) ? 'aria-current="page"' : ''}>
      ${icon(n.ico, 21)}<span>${n.label}</span></a></li>`).join('');

  const links = [...NAV];
  if (isPro()) links.push({ sep: true }, ...PRO_NAV);
  links.push({ sep: true }, { path: '#/bookings', label: 'ההזמנות שלי', ico: 'calendar' },
    { path: '#/settings', label: 'הגדרות', ico: 'settings' });

  $('#rail-links').innerHTML = links.map((n) => (n.sep
    ? '<hr class="sep" />'
    : `<a href="${n.path}" ${active(n.path) ? 'aria-current="page"' : ''}>
        ${icon(n.ico, 19)}<span>${n.label}</span></a>`)).join('');

  paintBell();
}

function paintBell() {
  const dot = $('#bell-dot');
  if (!dot) return;
  dot.style.cssText = unreadCount > 0
    ? `position:absolute;top:4px;inset-inline-end:4px;min-width:16px;height:16px;padding:0 3px;
       border-radius:999px;background:hsl(var(--destructive));color:#fff;font-size:.6rem;font-weight:700;
       display:grid;place-items:center;line-height:1`
    : 'display:none';
  dot.textContent = unreadCount > 9 ? '9+' : String(unreadCount || '');
}

const ROUTES = [
  [/^#?\/?$/,                        () => (session ? screenFeed() : screenLanding())],
  [/^#\/connect$/,                   screenConnect],
  [/^#\/login$/,                     screenLogin],
  [/^#\/register$/,                  screenRegister],
  [/^#\/recover$/,                   screenRecover],
  [/^#\/search$/,                    screenSearch],
  [/^#\/create$/,                    screenCreate],

  [/^#\/messages\/([\w-]+)$/,        screenChat],
  [/^#\/profile$/,                   () => screenProfile(me()?.username)],
  [/^#\/u\/(.+)$/,                   (u) => screenProfile(decodeURIComponent(u))],
  [/^#\/p\/([\w-]+)$/,               screenPost],
  [/^#\/book\/([\w-]+)$/,            screenBooking],
  [/^#\/bookings$/,                  screenMyBookings],
  [/^#\/bookings\/([\w-]+)$/,        screenBookingDetail],
  [/^#\/recurring\/([\w-]+)$/,       screenSeries],
  [/^#\/settings$/,                  screenSettings],
  [/^#\/onboarding$/,                screenOnboarding],
  [/^#\/pro$/,                       screenProDashboard],
  [/^#\/pro\/bookings$/,             screenProBookings],
  [/^#\/pro\/schedule$/,             screenProSchedule],
  [/^#\/pro\/clients$/,              screenProClients],
  [/^#\/pro\/stats$/,                screenProStats],
  [/^#\/pro\/services$/,             screenProServices],
  [/^#\/admin$/,                     screenAdmin],
];

const PUBLIC_ROUTES = ['#/login', '#/register', '#/recover', '#/search', '#/connect'];

let renderToken = 0;

async function router() {
  const hash = location.hash || '#/';
  unsubscribeAll();
  paintNav();

  const main = $('#main');
  const token = ++renderToken;

  // בלי חיבור למסד אין מה להציג. במקום מסך שגיאה מבלבל — הסבר קצר
  // ומעבר למסך החיבור. מסך החיבור עצמו כמובן נשאר נגיש.
  if (!db && hash !== '#/connect') {
    main.innerHTML = `<div class="fade">${pageHeader('יופי')}
      ${emptyState('🔌', 'האפליקציה אינה מחוברת למסד נתונים',
        'כל התוכן — בעלי המקצוע, הפוסטים וההזמנות — מגיע ממסד הנתונים שלכם.',
        `<a class="btn" href="#/connect">חיבור למסד הנתונים</a>`)}</div>`;
    return;
  }

  // מסכים שמחייבים התחברות
  const needsAuth = !PUBLIC_ROUTES.includes(hash) && !/^#\/u\//.test(hash) && hash !== '#/';
  if (needsAuth && !session) {
    location.hash = '#/login';
    return;
  }

  for (const [pattern, handler] of ROUTES) {
    const match = hash.match(pattern);
    if (!match) continue;

    main.innerHTML = skeletonList(2);
    try {
      const html = await handler(...match.slice(1));
      if (token !== renderToken) return;   // ניווט חדש עקף את הקודם
      if (typeof html === 'string') {
        main.innerHTML = `<div class="fade">${html}</div>`;
        main.focus({ preventScroll: true });
        window.scrollTo({ top: 0 });
      }
    } catch (error) {
      if (token !== renderToken) return;
      console.error(error);
      main.innerHTML = emptyState('⚠️', 'לא הצלחנו לטעון את המסך', errorMessage(error),
        `<button class="btn" onclick="router()">נסו שוב</button>`);
    }
    return;
  }

  main.innerHTML = emptyState('🔍', 'הדף לא נמצא', 'הקישור שגוי או שהדף הוסר.',
    `<a class="btn" href="#/">חזרה לפיד</a>`);
}

window.addEventListener('hashchange', router);

/* רענון אוטומטי בחזרה למסך — כך המידע נשאר עדכני גם בלי Realtime. */
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 20000) {
    lastRefresh = Date.now();
    router();
    if (session) refreshUnread();
  }
});

/* ---------- משיכה לרענון בטלפון ---------- */
let touchStartY = 0;
document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', (e) => {
  const pulled = e.changedTouches[0].clientY - touchStartY;
  if (window.scrollY === 0 && pulled > 110) { toastOk('מרענן…'); router(); }
}, { passive: true });

/* ==========================================================
   5. Realtime
   ========================================================== */

/** נרשם לשינויים בטבלה. כל המנויים מנותקים אוטומטית במעבר מסך. */
function subscribe(table, filter, onChange, event = '*') {
  if (!db || !session) return;
  const name = `rt:${table}:${filter || 'all'}:${Math.random().toString(36).slice(2)}`;
  const channel = db.channel(name)
    .on('postgres_changes', { event, schema: 'public', table, ...(filter ? { filter } : {}) }, onChange)
    .subscribe();
  realtimeChannels.push(channel);
  return channel;
}

function unsubscribeAll() {
  realtimeChannels.forEach((c) => { try { db?.removeChannel(c); } catch { /* ignore */ } });
  realtimeChannels = [];
}

function openModal(title, bodyHtml, footerHtml = '') {
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-box">
        <div class="between" style="margin-bottom:.8rem">
          <h2>${esc(title)}</h2>
          <button class="btn ghost icon" data-close aria-label="סגירה">${icon('x')}</button>
        </div>
        <div id="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="row" style="margin-top:1rem;justify-content:flex-start">${footerHtml}</div>` : ''}
      </div>
    </div>`;

  const close = () => closeModal();
  root.querySelector('[data-close]').addEventListener('click', close);
  root.querySelector('.modal').addEventListener('click', (e) => { if (e.target.classList.contains('modal')) close(); });
  document.addEventListener('keydown', escClose);

  const focusable = root.querySelector('input,select,textarea,button:not([data-close])');
  focusable?.focus();
}

function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  $('#modal-root').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

/**
 * מריץ פעולה עם מצב טעינה על הכפתור, ומטפל בשגיאות במקום אחד.
 *
 * התוכן המקורי מוחזר רק אם הפעולה לא שינתה אותו בעצמה — אחרת היינו
 * דורסים עדכון מכוון (למשל כפתור "מעקב" שהופך ל"עוקב ✓").
 */
async function withBusy(button, fn) {
  if (!button) return fn();

  const original = button.innerHTML;
  const busy = '<span class="sr">בטעינה</span>⏳';
  button.disabled = true;
  button.innerHTML = busy;

  try {
    return await fn();
  } catch (error) {
    toastBad(errorMessage(error));
    return null;
  } finally {
    button.disabled = false;
    if (button.innerHTML === busy) button.innerHTML = original;
  }
}

/** עוטף קריאה ל־Supabase וזורק שגיאה מתורגמת. */
async function call(promise) {
  const { data, error } = await promise;
  if (error) throw new Error(errorMessage(error));
  return data;
}

function bindPasswordToggle() {
  $$('[data-toggle]').forEach((button) => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.toggle);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.textContent = show ? '🙈' : '👁';
      button.setAttribute('aria-label', show ? 'הסתרת הסיסמה' : 'הצגת הסיסמה');
    });
  });
}

/** מד חוזק סיסמה — אותם כללים כמו בשרת. */
function passwordStrength(value) {
  const hasLetter = /[A-Za-zא-ת]/.test(value);
  const hasDigit = /\d/.test(value);
  const hasSymbol = /[^A-Za-z0-9א-ת]/.test(value);
  const ok = value.length >= 8 && hasLetter && hasDigit;

  let score = 0;
  if (value.length >= 8) score++;
  if (value.length >= 12) score++;
  if (hasLetter && hasDigit) score++;
  if (hasSymbol || value.length >= 16) score++;
  if (!ok) score = Math.min(score, 1);

  return {
    score, ok, hasLetter, hasDigit,
    label: ['חלשה מאוד', 'חלשה', 'בינונית', 'טובה', 'חזקה מאוד'][score],
    color: ['var(--destructive)', 'var(--destructive)', 'var(--warning)', 'var(--success)', 'var(--success)'][score],
  };
}

function bindRegisterForm() {
  bindPasswordToggle();

  const password = $('#reg-password');
  password?.addEventListener('input', () => {
    const s = passwordStrength(password.value);
    $('#pw-meter').style.width = `${(s.score / 4) * 100}%`;
    $('#pw-meter').style.background = `hsl(${s.color})`;
    $('#pw-label').textContent = password.value ? s.label : '';
    $('#pw-label').style.color = `hsl(${s.color})`;
  });

  // מציג בזמן אמת את שם המשתמש שייגזר, כדי שלא יהיו הפתעות בהתחברות.
  let timer;
  const nameInput = $('#fullName');
  nameInput?.addEventListener('input', () => {
    clearTimeout(timer);
    const value = nameInput.value.trim();
    const status = $('#username-status');
    if (value.length < 2) { status.textContent = ''; return; }

    timer = setTimeout(async () => {
      const { data, error } = await db.rpc('derive_username', { p_name: value });
      if (error || !data) { status.textContent = ''; return; }
      status.innerHTML = `תתחברו בפעם הבאה עם: <strong dir="auto">${esc(data)}</strong>`;
      status.style.color = 'hsl(var(--muted-foreground))';
    }, 300);
  });

  $('#form-register')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = $('#reg-error');
    errorBox.textContent = '';

    const fullName = $('#fullName').value.trim();
    const pass = $('#reg-password').value;

    if (fullName.length < 2) { errorBox.textContent = 'יש להזין שם'; return; }
    if (!passwordStrength(pass).ok) {
      errorBox.textContent = 'הסיסמה חייבת לכלול שמונה תווים, אות וספרה';
      return;
    }

    await withBusy($('#reg-submit'), async () => {
      const { data, error } = await db.rpc('auth_register_simple', {
        p_name: fullName, p_password: pass,
      });
      if (error) { errorBox.textContent = errorMessage(error); return; }

      setSession(data.token, data.profile);
      await restoreSession();
      renderShell();
      showRecoveryCode(data.recovery_code, true, data.username);
    });
  });
}

const FEED_TABS = [
  { key: 'foryou', label: 'בשבילך' },
  { key: 'following', label: 'עוקב' },
  { key: 'popular', label: 'פופולרי' },
];

const PAGE_SIZE = 8;
let feedState = { tab: 'foryou', offset: 0, done: false, loading: false };

async function screenFeed() {
  feedState = { tab: feedState.tab, offset: 0, done: false, loading: false };

  setTimeout(async () => {
    $$('#feed-tabs button').forEach((button) => {
      button.addEventListener('click', () => {
        feedState = { tab: button.dataset.tab, offset: 0, done: false, loading: false };
        $$('#feed-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b === button)));
        $('#feed-list').innerHTML = skeletonList(2);
        loadFeedPage(true);
      });
    });

    await loadFeedPage(true);
    setupInfiniteScroll();

    // פוסט חדש או לייק חדש מתעדכנים בזמן אמת
    subscribe('professional_posts', null, () => { toastOk('יש פוסטים חדשים'); }, 'INSERT');
  });

  return `
    ${pageHeader('הפיד שלי', 'עבודות חדשות מבעלי מקצוע')}
    <div class="tabs" id="feed-tabs" role="tablist">
      ${FEED_TABS.map((t) => `<button role="tab" data-tab="${t.key}"
        aria-selected="${t.key === feedState.tab}">${t.label}</button>`).join('')}
    </div>
    <div class="stack" id="feed-list" style="margin-top:1rem">${skeletonList(2)}</div>
    <div id="feed-sentinel" style="height:1px"></div>
    <div id="feed-more" class="center muted sm" style="padding:1rem"></div>`;
}

async function loadFeedPage(reset = false) {
  if (feedState.loading || (feedState.done && !reset)) return;
  feedState.loading = true;
  if (reset) feedState.offset = 0;

  const rows = await call(db.rpc('feed_posts', {
    p_tab: feedState.tab,
    p_city_id: me()?.city_id ?? null,
    p_limit: PAGE_SIZE,
    p_offset: feedState.offset,
  }));

  const list = $('#feed-list');
  if (!list) { feedState.loading = false; return; }

  if (reset) list.innerHTML = '';
  if (!rows.length && reset) {
    list.innerHTML = emptyState('🌸',
      feedState.tab === 'following' ? 'עדיין לא עוקבים אחרי אף אחד' : 'אין כאן עדיין תוכן',
      feedState.tab === 'following'
        ? 'עקבו אחרי בעלי מקצוע כדי לראות את העבודות החדשות שלהם כאן.'
        : 'ברגע שבעלי מקצוע יפרסמו עבודות הן יופיעו כאן.',
      `<a class="btn" href="#/search">מצאו בעלי מקצוע</a>`);
    feedState.done = true;
    feedState.loading = false;
    return;
  }

  list.insertAdjacentHTML('beforeend', rows.map(postCard).join(''));
  feedState.offset += rows.length;
  feedState.done = rows.length < PAGE_SIZE;
  $('#feed-more').textContent = feedState.done && feedState.offset > 0 ? 'הגעתם לסוף 🎉' : '';
  feedState.loading = false;
}

function setupInfiniteScroll() {
  const sentinel = $('#feed-sentinel');
  if (!sentinel) return;
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) loadFeedPage(false);
  }, { rootMargin: '400px' });
  observer.observe(sentinel);
}

/** כרטיס פוסט מלא — כולל "הזמן טיפול דומה". */
function postCard(post) {
  const media = Array.isArray(post.media) ? post.media : [];
  const priceText = post.price_estimate !== null && post.price_estimate !== undefined
    ? servicePrice(post.price_type, post.price_estimate, null) : '';

  return `
  <article class="card" data-post="${esc(post.id)}">
    <header class="row p" style="padding-bottom:.6rem">
      <a href="#/u/${encodeURIComponent(post.username)}" class="row grow" style="min-width:0">
        ${avatar(post.author_avatar, 'av-md', post.business_name || post.username)}
        <span class="grow" style="min-width:0">
          <span class="row" style="gap:.25rem">
            <strong class="truncate">${esc(post.business_name || post.username)}</strong>
            ${post.is_verified ? `<span title="בעל מקצוע מאומת" style="color:hsl(var(--primary))">${icon('verified', 14)}</span>` : ''}
          </span>
          <span class="tiny muted truncate">
            ${esc(post.profession_name || '')}${post.city_name ? ` · ${esc(post.city_name)}` : ''}
          </span>
        </span>
      </a>
      ${post.followed_by_me || post.author_profile_id === myId() ? '' :
        `<button class="btn sm outline" data-follow="${esc(post.author_profile_id)}">מעקב</button>`}
    </header>

    ${media.length ? `
      <div class="media" data-gallery>
        <img src="${esc(media[0].url)}" alt="${esc(media[0].alt_text || post.title || 'עבודה')}" loading="lazy" />
        ${media.length > 1 ? `<div class="media-nav">${media.map((_, i) =>
          `<span class="dot ${i === 0 ? 'on' : ''}"></span>`).join('')}</div>` : ''}
        ${post.is_before_after ? '<span class="badge pri" style="position:absolute;top:.5rem;inset-inline-start:.5rem">לפני ואחרי</span>' : ''}
      </div>` : ''}

    <div class="p" style="padding-top:.5rem">
      <div class="acts">
        <button class="act ${post.liked_by_me ? 'on' : ''}" data-like="${esc(post.id)}"
          aria-pressed="${Boolean(post.liked_by_me)}" aria-label="לייק">
          ${post.liked_by_me ? iconFilled('heart', 19) : icon('heart', 19)}
          <span data-likes>${fmtNum.format(post.likes_count || 0)}</span>
        </button>
        <a class="act" href="#/p/${esc(post.id)}" aria-label="תגובות">
          ${icon('comment', 19)}<span>${fmtNum.format(post.comments_count || 0)}</span></a>
        <button class="act ${post.saved_by_me ? 'on' : ''}" data-save="${esc(post.id)}"
          aria-pressed="${Boolean(post.saved_by_me)}" aria-label="שמירה">
          ${post.saved_by_me ? iconFilled('bookmark', 19) : icon('bookmark', 19)}</button>
        <button class="act" data-share="${esc(post.id)}" aria-label="שיתוף">${icon('share', 19)}</button>
        <span class="grow"></span>
        <span class="act" style="cursor:default">${relTime(post.published_at)}</span>
      </div>

      ${post.title ? `<h2 style="margin-top:.25rem">${esc(post.title)}</h2>` : ''}
      ${post.description ? `<p class="sm" style="margin-top:.2rem">${esc(post.description)}</p>` : ''}

      <div class="row wrap tiny muted" style="margin-top:.5rem">
        ${post.service_name ? `<span class="badge">${esc(post.service_name)}</span>` : ''}
        ${priceText ? `<span class="badge">${esc(priceText)}</span>` : ''}
        ${post.duration_minutes ? `<span class="badge">${esc(duration(post.duration_minutes))}</span>` : ''}
        ${(post.tags || []).slice(0, 3).map((t) => `<span class="badge">#${esc(t)}</span>`).join('')}
      </div>

      ${post.professional_id ? `
        <a class="btn sec block" style="margin-top:.75rem"
          href="#/book/${esc(post.professional_id)}${post.service_id ? `?service=${esc(post.service_id)}` : ''}">
          ${icon('calendar', 17)} הזמן טיפול דומה</a>` : ''}
    </div>
  </article>`;
}

/* ---------- פעולות על פוסטים (מאזין יחיד לכל המסמך) ---------- */
document.addEventListener('click', async (event) => {
  const likeBtn = event.target.closest('[data-like]');
  const saveBtn = event.target.closest('[data-save]');
  const followBtn = event.target.closest('[data-follow]');
  const shareBtn = event.target.closest('[data-share]');

  if (likeBtn) { event.preventDefault(); await toggleLike(likeBtn); return; }
  if (saveBtn) { event.preventDefault(); await toggleSave(saveBtn); return; }
  if (followBtn) { event.preventDefault(); await toggleFollow(followBtn); return; }
  if (shareBtn) { event.preventDefault(); await sharePost(shareBtn.dataset.share); }
});

function requireLogin() {
  if (session) return true;
  toastBad('יש להתחבר כדי לבצע את הפעולה');
  location.hash = '#/login';
  return false;
}

async function toggleLike(button) {
  if (!requireLogin()) return;
  const postId = button.dataset.like;
  const on = button.getAttribute('aria-pressed') === 'true';
  const counter = button.querySelector('[data-likes]');
  const current = Number(String(counter.textContent).replace(/\D/g, '')) || 0;

  // עדכון אופטימי — נסוג אחורה אם השרת מסרב
  button.setAttribute('aria-pressed', String(!on));
  button.classList.toggle('on', !on);
  button.innerHTML = (on ? icon('heart', 19) : iconFilled('heart', 19))
    + `<span data-likes>${fmtNum.format(current + (on ? -1 : 1))}</span>`;

  const { error } = on
    ? await db.from('post_likes').delete().eq('post_id', postId).eq('profile_id', myId())
    : await db.from('post_likes').insert({ post_id: postId, profile_id: myId() });

  if (error) {
    button.setAttribute('aria-pressed', String(on));
    button.classList.toggle('on', on);
    button.innerHTML = (on ? iconFilled('heart', 19) : icon('heart', 19))
      + `<span data-likes>${fmtNum.format(current)}</span>`;
    toastBad(errorMessage(error));
  }
}

async function toggleSave(button) {
  if (!requireLogin()) return;
  const postId = button.dataset.save;
  const on = button.getAttribute('aria-pressed') === 'true';

  const { error } = on
    ? await db.from('saved_posts').delete().eq('post_id', postId).eq('profile_id', myId())
    : await db.from('saved_posts').insert({ post_id: postId, profile_id: myId() });

  if (error) { toastBad(errorMessage(error)); return; }

  button.setAttribute('aria-pressed', String(!on));
  button.classList.toggle('on', !on);
  button.innerHTML = on ? icon('bookmark', 19) : iconFilled('bookmark', 19);
  toastOk(on ? 'הוסר מהשמורים' : 'נשמר');
}

async function toggleFollow(button) {
  if (!requireLogin()) return;
  const targetId = button.dataset.follow;
  const following = button.dataset.following === '1';

  await withBusy(button, async () => {
    const { error } = following
      ? await db.from('follows').delete().eq('follower_id', myId()).eq('following_id', targetId)
      : await db.from('follows').insert({ follower_id: myId(), following_id: targetId });

    if (error) { toastBad(errorMessage(error)); return; }

    button.dataset.following = following ? '0' : '1';
    button.textContent = following ? 'מעקב' : 'עוקב ✓';
    button.classList.toggle('outline', !following);
    toastOk(following ? 'הפסקתם לעקוב' : 'עוקבים!');
  });
}

async function sharePost(postId) {
  const url = `${location.origin}${location.pathname}#/p/${postId}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'יופי', url }); return; } catch { /* המשתמש ביטל */ }
  }
  try { await navigator.clipboard.writeText(url); toastOk('הקישור הועתק'); }
  catch { toastBad('לא הצלחנו להעתיק את הקישור'); }
}

/* ==========================================================
   9. פוסט בודד + תגובות
   ========================================================== */

async function screenPost(postId) {
  const rows = await call(db.rpc('feed_posts', { p_tab: 'popular', p_city_id: null, p_limit: 200, p_offset: 0 }));
  const post = rows.find((p) => p.id === postId);

  if (!post) return backHeader('פוסט') + emptyState('🔍', 'הפוסט לא נמצא', 'ייתכן שהוא הוסר או שאינו פומבי.');

  if (session) db.rpc('record_post_view', { p_post_id: postId }).then(() => {});

  const comments = await call(db.from('post_comments')
    .select('id, body, created_at, profile_id, profiles!post_comments_profile_id_fkey(username, full_name, avatar_url)')
    .eq('post_id', postId).is('deleted_at', null).order('created_at', { ascending: true }).limit(100));

  setTimeout(() => {
    $('#comment-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('#comment-input');
      const body = input.value.trim();
      if (!body) return;

      await withBusy($('#comment-send'), async () => {
        const { error } = await db.from('post_comments')
          .insert({ post_id: postId, profile_id: myId(), body });
        if (error) { toastBad(errorMessage(error)); return; }
        input.value = '';
        toastOk('התגובה נוספה');
        router();
      });
    });

    subscribe('post_comments', `post_id=eq.${postId}`, () => router(), 'INSERT');
  });

  return `
    ${backHeader('פוסט')}
    ${postCard(post)}

    <section class="card p stack" style="margin-top:1rem">
      <h2>תגובות (${comments.length})</h2>
      ${comments.length === 0 ? '<p class="muted sm">אין עדיין תגובות. תהיו הראשונים.</p>' : ''}
      ${comments.map((c) => `
        <div class="row" style="align-items:flex-start">
          ${avatar(c.profiles?.avatar_url, 'av-sm', c.profiles?.full_name)}
          <div class="grow">
            <div class="row" style="gap:.4rem">
              <a href="#/u/${encodeURIComponent(c.profiles?.username || '')}"><strong class="sm">${esc(c.profiles?.full_name)}</strong></a>
              <span class="tiny muted">${relTime(c.created_at)}</span>
            </div>
            <p class="sm">${esc(c.body)}</p>
          </div>
          ${c.profile_id === myId()
            ? `<button class="btn ghost icon" onclick="deleteComment('${esc(c.id)}')" aria-label="מחיקת התגובה">${icon('x', 15)}</button>`
            : ''}
        </div>`).join('')}

      ${session ? `
        <form class="row" id="comment-form" style="margin-top:.5rem">
          <input class="input grow" id="comment-input" placeholder="כתבו תגובה…" maxlength="500" aria-label="תגובה חדשה" />
          <button class="btn" id="comment-send" type="submit">שליחה</button>
        </form>` : `<a class="btn outline block" href="#/login">התחברו כדי להגיב</a>`}
    </section>`;
}

async function deleteComment(commentId) {
  if (!confirm('למחוק את התגובה?')) return;
  const { error } = await db.from('post_comments')
    .update({ deleted_at: new Date().toISOString() }).eq('id', commentId);
  if (error) { toastBad(errorMessage(error)); return; }
  toastOk('התגובה נמחקה');
  router();
}


/* ==========================================================
   10. חיפוש וגילוי
   ========================================================== */

const SORTS = [
  ['recommended', 'מומלצים'], ['rating', 'דירוג גבוה'], ['distance', 'קרובים'],
  ['price', 'מחיר נמוך'], ['new', 'חדשים'], ['followers', 'פופולריים'], ['response', 'מגיבים מהר'],
];

let searchState = {
  term: '', professionIds: [], cityId: null, sort: 'recommended',
  homeVisit: false, studio: false, event: false, verified: false,
  availableToday: false, availableNow: false, recurring: false,
  minRating: null, priceMax: null, offset: 0, done: false, loading: false,
};

async function screenSearch() {
  const [professions, cities] = await Promise.all([
    call(db.from('professions').select('id,name,slug').eq('is_active', true).order('sort_order')),
    call(db.from('cities').select('id,name').eq('is_active', true)
      .order('population', { ascending: false, nullsFirst: false }).limit(400)),
  ]);

  const recent = JSON.parse(localStorage.getItem('yofi.recent') || '[]');
  const popular = await call(db.from('popular_searches')
    .select('term,search_count').order('search_count', { ascending: false }).limit(8)).catch(() => []);

  setTimeout(() => bindSearch(professions, cities));

  return `
    ${pageHeader('חיפוש', 'מצאו בעל מקצוע לפי תחום, עיר, מחיר וזמינות')}

    <div class="card p stack">
      <div style="position:relative">
        <input class="input" id="q" placeholder="נסו: ספר שמגיע הביתה, מניקוריסטית פנויה היום…"
          autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="חיפוש" />
        <div id="suggest" class="card" role="listbox"
          style="display:none;position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:20;max-height:280px;overflow:auto"></div>
      </div>

      <div class="chips" id="prof-chips">
        ${professions.map((p) => `<button class="chip" data-prof="${esc(p.id)}" aria-pressed="false">${esc(p.name)}</button>`).join('')}
      </div>

      <div class="row wrap">
        <select id="city-filter" class="input" style="flex:1;min-width:140px" aria-label="עיר">
          <option value="">כל הערים</option>
          ${cities.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
        </select>
        <select id="sort" class="input" style="flex:1;min-width:140px" aria-label="מיון">
          ${SORTS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}
        </select>
        <button class="btn outline" id="btn-filters">${icon('filter', 17)} מסננים</button>
      </div>

      <div id="active-filters" class="row wrap tiny"></div>
    </div>

    ${recent.length || popular.length ? `
      <div class="card p stack" id="search-hints" style="margin-top:.75rem">
        ${recent.length ? `<div><h3 class="muted tiny">חיפושים אחרונים</h3>
          <div class="chips" style="margin-top:.35rem">
            ${recent.slice(0, 6).map((t) => `<button class="chip" data-term="${esc(t)}">${esc(t)}</button>`).join('')}
          </div></div>` : ''}
        ${popular.length ? `<div><h3 class="muted tiny">חיפושים פופולריים</h3>
          <div class="chips" style="margin-top:.35rem">
            ${popular.map((p) => `<button class="chip" data-term="${esc(p.term)}">${esc(p.term)}</button>`).join('')}
          </div></div>` : ''}
      </div>` : ''}

    <div id="results" class="stack" style="margin-top:1rem"></div>
    <div id="search-sentinel" style="height:1px"></div>`;
}

function bindSearch(professions, cities) {
  const input = $('#q');
  let suggestTimer;

  input.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    const term = input.value.trim();
    if (term.length < 2) { hideSuggest(); return; }
    suggestTimer = setTimeout(() => showSuggestions(term), 220);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); hideSuggest(); runSearch(true); }
    if (e.key === 'Escape') hideSuggest();
  });

  $('#city-filter').addEventListener('change', (e) => {
    searchState.cityId = e.target.value || null;
    runSearch(true);
  });

  $('#sort').addEventListener('change', (e) => { searchState.sort = e.target.value; runSearch(true); });

  $$('#prof-chips .chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.prof;
      const on = chip.getAttribute('aria-pressed') === 'true';
      chip.setAttribute('aria-pressed', String(!on));
      searchState.professionIds = on
        ? searchState.professionIds.filter((x) => x !== id)
        : [...searchState.professionIds, id];
      runSearch(true);
    });
  });

  document.addEventListener('click', (e) => {
    const termChip = e.target.closest('[data-term]');
    if (termChip) { input.value = termChip.dataset.term; runSearch(true); }
  });

  $('#btn-filters').addEventListener('click', openFilters);

  // חיפוש התחלתי
  runSearch(true);

  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) runSearch(false);
  }, { rootMargin: '400px' });
  observer.observe($('#search-sentinel'));
}

async function showSuggestions(term) {
  const rows = await call(db.rpc('search_suggestions', { p_term: term })).catch(() => []);
  const box = $('#suggest');
  if (!rows.length) { hideSuggest(); return; }

  const KIND = { professional: '👤', profession: '💇', city: '📍', service: '✨' };
  box.innerHTML = rows.map((r) => `
    <button class="list-btn" role="option" data-kind="${esc(r.kind)}" data-id="${esc(r.id || '')}"
      data-label="${esc(r.label)}">
      <span>${KIND[r.kind] || '🔎'}</span>
      <span class="grow"><span class="sm" style="font-weight:600">${esc(r.label)}</span>
      ${r.sublabel ? `<span class="tiny muted" style="display:block">${esc(r.sublabel)}</span>` : ''}</span>
    </button>`).join('');

  box.style.display = 'block';
  $('#q').setAttribute('aria-expanded', 'true');

  $$('#suggest .list-btn').forEach((button) => {
    button.addEventListener('click', () => {
      const { kind, id, label } = button.dataset;
      hideSuggest();
      if (kind === 'city') { searchState.cityId = id; $('#city-filter').value = id; $('#q').value = ''; }
      else if (kind === 'profession') {
        searchState.professionIds = [id];
        $$('#prof-chips .chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.prof === id)));
        $('#q').value = '';
      } else { $('#q').value = label; }
      runSearch(true);
    });
  });
}

function hideSuggest() {
  const box = $('#suggest');
  if (box) box.style.display = 'none';
  $('#q')?.setAttribute('aria-expanded', 'false');
}

function openFilters() {
  openModal('מסננים', `
    <div class="stack">
      <div class="field"><label>מיקום השירות</label>
        <div class="row wrap">
          ${[['homeVisit', 'מגיע/ה הביתה'], ['studio', 'בסטודיו'], ['event', 'לאירועים']]
            .map(([k, l]) => `<button class="chip" data-flag="${k}"
              aria-pressed="${searchState[k]}">${l}</button>`).join('')}
        </div>
      </div>

      <div class="field"><label>זמינות</label>
        <div class="row wrap">
          ${[['availableToday', 'זמין היום'], ['availableNow', 'זמין עכשיו'], ['recurring', 'מקבל/ת מפגשים קבועים']]
            .map(([k, l]) => `<button class="chip" data-flag="${k}"
              aria-pressed="${searchState[k]}">${l}</button>`).join('')}
        </div>
      </div>

      <div class="field"><label>אמון</label>
        <div class="row wrap">
          <button class="chip" data-flag="verified" aria-pressed="${searchState.verified}">בעל/ת מקצוע מאומת</button>
        </div>
      </div>

      <div class="field">
        <label for="f-rating">דירוג מינימלי: <span id="f-rating-val">${searchState.minRating || 'הכול'}</span></label>
        <input type="range" id="f-rating" min="0" max="5" step="0.5" value="${searchState.minRating || 0}" />
      </div>

      <div class="field">
        <label for="f-price">מחיר מקסימלי: <span id="f-price-val">${searchState.priceMax ? money(searchState.priceMax) : 'הכול'}</span></label>
        <input type="range" id="f-price" min="0" max="1000" step="50" value="${searchState.priceMax || 0}" />
      </div>
    </div>`,
    `<button class="btn" id="apply-filters">החלת המסננים</button>
     <button class="btn ghost" id="clear-filters">ניקוי</button>`);

  $$('#modal-body [data-flag]').forEach((chip) => {
    chip.addEventListener('click', () => {
      const on = chip.getAttribute('aria-pressed') === 'true';
      chip.setAttribute('aria-pressed', String(!on));
    });
  });

  $('#f-rating').addEventListener('input', (e) => {
    $('#f-rating-val').textContent = Number(e.target.value) ? e.target.value : 'הכול';
  });
  $('#f-price').addEventListener('input', (e) => {
    $('#f-price-val').textContent = Number(e.target.value) ? money(e.target.value) : 'הכול';
  });

  $('#apply-filters').addEventListener('click', () => {
    $$('#modal-body [data-flag]').forEach((chip) => {
      searchState[chip.dataset.flag] = chip.getAttribute('aria-pressed') === 'true';
    });
    searchState.minRating = Number($('#f-rating').value) || null;
    searchState.priceMax = Number($('#f-price').value) || null;
    closeModal();
    runSearch(true);
  });

  $('#clear-filters').addEventListener('click', () => {
    Object.assign(searchState, {
      homeVisit: false, studio: false, event: false, verified: false,
      availableToday: false, availableNow: false, recurring: false,
      minRating: null, priceMax: null,
    });
    closeModal();
    runSearch(true);
  });
}

async function runSearch(reset) {
  if (searchState.loading || (searchState.done && !reset)) return;
  searchState.loading = true;

  const term = $('#q')?.value.trim() || '';
  if (reset) { searchState.offset = 0; searchState.done = false; searchState.term = term; }

  const results = $('#results');
  if (reset) results.innerHTML = skeletonList(3);

  const rows = await call(db.rpc('search_professionals', {
    p_term: searchState.term || null,
    p_profession_ids: searchState.professionIds.length ? searchState.professionIds : null,
    p_city_id: searchState.cityId,
    p_max_distance_km: null,
    p_price_min: null,
    p_price_max: searchState.priceMax,
    p_min_rating: searchState.minRating,
    p_min_experience: null,
    p_home_visit: searchState.homeVisit || null,
    p_studio: searchState.studio || null,
    p_event: searchState.event || null,
    p_online: null,
    p_available_today: searchState.availableToday || null,
    p_available_now: searchState.availableNow || null,
    p_recurring: searchState.recurring || null,
    p_verified: searchState.verified || null,
    p_sort: searchState.sort,
    p_limit: 10,
    p_offset: searchState.offset,
  })).catch((error) => { toastBad(errorMessage(error)); return []; });

  if (reset) results.innerHTML = '';

  if (!rows.length && reset) {
    results.innerHTML = emptyState('🔍', 'לא נמצאו בעלי מקצוע',
      'נסו להסיר חלק מהמסננים או לחפש בעיר אחרת.',
      `<button class="btn outline" onclick="resetSearch()">ניקוי כל המסננים</button>`);
    searchState.done = true;
    searchState.loading = false;
    paintActiveFilters();
    return;
  }

  if (reset && searchState.term) {
    // שמירת החיפוש להיסטוריה ולחיפושים הפופולריים
    const recent = JSON.parse(localStorage.getItem('yofi.recent') || '[]');
    localStorage.setItem('yofi.recent',
      JSON.stringify([searchState.term, ...recent.filter((t) => t !== searchState.term)].slice(0, 10)));
    if (session) db.rpc('log_search', { p_term: searchState.term }).then(() => {});
  }

  const total = rows[0]?.total_count;
  if (reset && total !== undefined) {
    results.insertAdjacentHTML('beforeend',
      `<p class="muted sm">${plural(Number(total), 'תוצאה אחת', 'תוצאות', 'אין תוצאות')}</p>`);
  }

  results.insertAdjacentHTML('beforeend', rows.map(proCard).join(''));
  searchState.offset += rows.length;
  searchState.done = rows.length < 10;
  searchState.loading = false;
  paintActiveFilters();
}

function resetSearch() {
  searchState = { ...searchState, term: '', professionIds: [], cityId: null, homeVisit: false, studio: false,
    event: false, verified: false, availableToday: false, availableNow: false, recurring: false,
    minRating: null, priceMax: null };
  if ($('#q')) $('#q').value = '';
  if ($('#city-filter')) $('#city-filter').value = '';
  $$('#prof-chips .chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
  runSearch(true);
}

function paintActiveFilters() {
  const box = $('#active-filters');
  if (!box) return;

  const labels = [];
  if (searchState.homeVisit) labels.push('מגיע הביתה');
  if (searchState.studio) labels.push('בסטודיו');
  if (searchState.event) labels.push('לאירועים');
  if (searchState.verified) labels.push('מאומת');
  if (searchState.availableToday) labels.push('זמין היום');
  if (searchState.availableNow) labels.push('זמין עכשיו');
  if (searchState.recurring) labels.push('מפגשים קבועים');
  if (searchState.minRating) labels.push(`דירוג ${searchState.minRating}+`);
  if (searchState.priceMax) labels.push(`עד ${money(searchState.priceMax)}`);

  box.innerHTML = labels.length
    ? labels.map((l) => `<span class="badge pri">${esc(l)}</span>`).join('')
      + `<button class="btn ghost sm" onclick="resetSearch()">ניקוי</button>`
    : '';
}

/** כרטיס בעל מקצוע בתוצאות החיפוש. */
function proCard(pro) {
  const professions = Array.isArray(pro.professions) ? pro.professions : [];
  return `
  <a class="card p row" href="#/u/${encodeURIComponent(pro.username)}" style="align-items:flex-start">
    ${avatar(pro.avatar_url, 'av-lg', pro.business_name)}
    <div class="grow">
      <div class="row" style="gap:.3rem">
        <strong class="truncate">${esc(pro.business_name || pro.full_name)}</strong>
        ${pro.is_verified ? `<span title="מאומת" style="color:hsl(var(--primary))">${icon('verified', 14)}</span>` : ''}
      </div>

      <p class="tiny muted truncate">${professions.map((p) => esc(p.name)).join(' · ')}</p>
      ${pro.headline ? `<p class="sm truncate">${esc(pro.headline)}</p>` : ''}

      <div class="row wrap tiny muted" style="margin-top:.35rem">
        <span>${icon('pin', 13)} ${esc(pro.city_name || '')}</span>
        ${pro.rating_count > 0
          ? `<span style="color:hsl(var(--warning))">★ ${Number(pro.rating_avg).toFixed(1)}</span>
             <span>(${pro.rating_count})</span>`
          : '<span class="badge">חדש/ה באפליקציה</span>'}
        ${pro.distance_km !== null && pro.distance_km !== undefined
          ? `<span>${Math.round(pro.distance_km)} ק״מ</span>` : ''}
      </div>

      <div class="row wrap tiny" style="margin-top:.4rem">
        ${pro.min_price !== null && pro.min_price !== undefined ? `<span class="badge">מ־${money(pro.min_price)}</span>` : ''}
        ${pro.available_now ? '<span class="badge ok">זמין/ה עכשיו</span>'
          : pro.available_today ? '<span class="badge ok">זמין/ה היום</span>' : ''}
        ${pro.accepts_home_visits ? '<span class="badge">מגיע/ה הביתה</span>' : ''}
      </div>
    </div>
  </a>`;
}


/* ==========================================================
   11. פרופיל — משתמש רגיל ובעל מקצוע
   ========================================================== */

async function screenProfile(username) {
  if (!username) { location.hash = '#/login'; return ''; }

  const profile = await call(db.from('profiles')
    .select('id, username, full_name, avatar_url, bio, city_id, followers_count, following_count, is_professional, created_at, cities(name)')
    .eq('username', username).is('deleted_at', null).maybeSingle());

  if (!profile) {
    return backHeader('פרופיל') + emptyState('🔍', 'המשתמש לא נמצא', 'ייתכן שהשם השתנה או שהחשבון הוסר.');
  }

  const isMe = profile.id === myId();

  const [pro, following] = await Promise.all([
    profile.is_professional
      ? call(db.from('professional_profiles')
          .select('*, cities(name)')
          .eq('profile_id', profile.id).is('deleted_at', null).maybeSingle())
      : null,
    session && !isMe
      ? call(db.from('follows').select('follower_id')
          .eq('follower_id', myId()).eq('following_id', profile.id).maybeSingle())
      : null,
  ]);

  if (session && !isMe && pro) db.rpc('record_profile_view', { p_professional_id: pro.id }).then(() => {});

  return pro && pro.status === 'active'
    ? renderProfessionalProfile(profile, pro, Boolean(following), isMe)
    : renderUserProfile(profile, Boolean(following), isMe, pro);
}

/* ---------- פרופיל משתמש רגיל ---------- */

      <div class="row">
        ${avatar(profile.avatar_url, 'av-lg', profile.full_name)}
        <div class="grow">
          <h2>${esc(profile.full_name)}</h2>

          ${profile.cities?.name ? `<p class="tiny muted">${icon('pin', 12)} ${esc(profile.cities.name)}</p>` : ''}
        </div>
      </div>

          ${draftPro
            ? `<a class="btn grow" href="#/onboarding">השלמת הפרופיל העסקי</a>`

          <button class="btn outline grow" onclick="startChat('${esc(profile.id)}')">הודעה</button>
        </div>` : `<a class="btn block" href="#/login">התחברו כדי לעקוב</a>`}

      </div>
      <div id="saved-body" class="stack" style="margin-top:1rem">${skeletonList(2)}</div>` : ''}`;
}

async function loadSavedTab(profileId, tab = 'posts') {
  $$('#saved-tabs button').forEach((button) => {
    button.onclick = () => {
      $$('#saved-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b === button)));
      loadSavedTab(profileId, button.dataset.saved);
    };
  });

  const body = $('#saved-body');
  if (!body) return;
  body.innerHTML = skeletonList(2);

  if (tab === 'posts') {
    const rows = await call(db.from('saved_posts')
      .select('post_id, created_at, professional_posts(id, title, description, likes_count, published_at, post_media(url, position))')
      .eq('profile_id', profileId).order('created_at', { ascending: false }).limit(30));

    const items = rows.filter((r) => r.professional_posts);
    body.innerHTML = items.length ? `<div class="grid3">${items.map((r) => {
      const media = (r.professional_posts.post_media || []).sort((a, b) => a.position - b.position)[0];
      return `<a href="#/p/${esc(r.post_id)}">
        <img class="sq" loading="lazy" src="${esc(media?.url || AVATAR_FALLBACK)}"
          alt="${esc(r.professional_posts.title || 'פוסט שמור')}" /></a>`;
    }).join('')}</div>`
      : emptyState('🔖', 'אין פוסטים שמורים', 'שמרו עבודות שאהבתם כדי לחזור אליהן בקלות.');
    return;
  }

  if (tab === 'pros') {
    const rows = await call(db.from('saved_professionals')
      .select('professional_id, professional_profiles(id, business_name, headline, avatar_url, rating_avg, rating_count, is_verified, profiles!professional_profiles_profile_id_fkey(username), cities(name))')
      .eq('profile_id', profileId).limit(30));

    const items = rows.filter((r) => r.professional_profiles);
    body.innerHTML = items.length ? items.map((r) => {
      const p = r.professional_profiles;
      return `<a class="card p row" href="#/u/${encodeURIComponent(p.profiles?.username || '')}">
        ${avatar(p.avatar_url, 'av-md', p.business_name)}
        <span class="grow"><strong class="sm">${esc(p.business_name)}</strong>
        <span class="tiny muted" style="display:block">${esc(p.cities?.name || '')}</span></span>
        ${p.rating_count > 0 ? `<span class="tiny" style="color:hsl(var(--warning))">★ ${Number(p.rating_avg).toFixed(1)}</span>` : ''}
      </a>`;
    }).join('')
      : emptyState('⭐', 'אין בעלי מקצוע שמורים', 'שמרו בעלי מקצוע כדי להזמין אותם שוב בקלות.');
    return;
  }

  const rows = await call(db.from('reviews')
    .select('id, rating, body, created_at, professional_profiles(business_name, profiles!professional_profiles_profile_id_fkey(username))')
    .eq('client_id', profileId).is('deleted_at', null).order('created_at', { ascending: false }).limit(30));

  body.innerHTML = rows.length ? rows.map((r) => `
    <div class="card p stack" style="gap:.4rem">
      <div class="between">
        <a href="#/u/${encodeURIComponent(r.professional_profiles?.profiles?.username || '')}">
          <strong class="sm">${esc(r.professional_profiles?.business_name || '')}</strong></a>
        <span style="color:hsl(var(--warning))">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
      </div>
      ${r.body ? `<p class="sm">${esc(r.body)}</p>` : ''}
      <span class="tiny muted">${relTime(r.created_at)}</span>
    </div>`).join('')
    : emptyState('✍️', 'עדיין לא כתבתם ביקורות', 'אחרי טיפול שהושלם אפשר לדרג את בעל המקצוע.');
}

        ${pro.cancellation_policy ? `<div><h3>מדיניות ביטול</h3>
          <p class="sm muted">${esc(pro.cancellation_policy)}</p></div>` : ''}
        ${pro.website_url ? `<a class="btn outline block" href="${esc(pro.website_url)}"
          target="_blank" rel="noopener noreferrer">האתר של ${esc(pro.business_name)}</a>` : ''}
      </div>

      ${similar.length ? `<div class="card p stack">
        <h3>בעלי מקצוע דומים</h3>
        ${similar.map((s) => `<a class="list-btn" href="#/u/${encodeURIComponent(s.username)}">
          ${avatar(s.avatar_url, 'av-sm', s.business_name)}
          <span class="grow"><span class="sm" style="font-weight:600">${esc(s.business_name)}</span>
          <span class="tiny muted" style="display:block">${esc(s.city_name || '')}</span></span>
          ${s.rating_count ? `<span class="tiny" style="color:hsl(var(--warning))">★ ${Number(s.rating_avg).toFixed(1)}</span>` : ''}
        </a>`).join('')}
      </div>` : ''}
    </div>`;
}

async function toggleSavePro(professionalId, button) {
  if (!requireLogin()) return;
  const on = button.dataset.saved === '1';

  const { error } = on
    ? await db.from('saved_professionals').delete()
        .eq('profile_id', myId()).eq('professional_id', professionalId)
    : await db.from('saved_professionals').insert({ profile_id: myId(), professional_id: professionalId });

  if (error) { toastBad(errorMessage(error)); return; }
  button.dataset.saved = on ? '0' : '1';
  button.innerHTML = on ? icon('bookmark', 18) : iconFilled('bookmark', 18);
  toastOk(on ? 'הוסר מהשמורים' : 'נשמר');
}

/** דיווח על משתמש, פוסט או תגובה. */
function openReport(entityType, entityId) {
  openModal('דיווח', `
    <div class="stack">
      <p class="sm muted">הדיווח נשלח לצוות הניהול ואינו נחשף לצד השני.</p>
      <div class="field"><label for="report-reason">סיבה</label>
        <select class="input" id="report-reason">
          <option value="spam">ספאם או פרסום</option>
          <option value="inappropriate">תוכן לא הולם</option>
          <option value="fake">פרופיל מזויף</option>
          <option value="harassment">הטרדה</option>
          <option value="other">אחר</option>
        </select></div>
      <div class="field"><label for="report-details">פירוט (רשות)</label>
        <textarea class="input" id="report-details" maxlength="600"></textarea></div>
    </div>`,
    `<button class="btn" id="send-report">שליחת דיווח</button>`);

  $('#send-report').addEventListener('click', async (e) => {
    await withBusy(e.currentTarget, async () => {
      const { error } = await db.from('reports').insert({
        reporter_id: myId(), target_type: entityType, target_id: entityId,
        reason: $('#report-reason').value, details: $('#report-details').value.trim() || null,
      });
      if (error) { toastBad(errorMessage(error)); return; }

}


/* ==========================================================
   12. הזמנת תור — חד־פעמי ומפגש קבוע
   ========================================================== */

const LOCATION_LABELS = {
  client_home: 'אצלי בבית', studio: 'בסטודיו של בעל המקצוע',
  event: 'באירוע', online: 'אונליין',
};

const BOOKING_STATUS = {
  draft: ['טיוטה', ''], pending: ['ממתין לאישור', 'warn'], confirmed: ['אושר', 'ok'],
  change_proposed: ['הוצע שינוי', 'warn'], cancelled: ['בוטל', 'dan'],
  on_the_way: ['בעל המקצוע בדרך', 'ok'], arrived: ['הגיע', 'ok'],
  in_progress: ['בטיפול', 'ok'], completed: ['הושלם', 'ok'], no_show: ['לא התקיים', 'dan'],
};

const FREQUENCIES = [
  ['weekly', 'כל שבוע'], ['biweekly', 'כל שבועיים'], ['every_3_weeks', 'כל שלושה שבועות'],
  ['every_4_weeks', 'כל ארבעה שבועות'], ['monthly', 'כל חודש'],
];

let booking = null;

async function screenBooking(professionalId) {
  const preselected = new URLSearchParams(location.hash.split('?')[1] || '').get('service');

  const pro = await call(db.from('professional_profiles')
    .select('*, cities(name), profiles!professional_profiles_profile_id_fkey(id, username, full_name, avatar_url)')
    .eq('id', professionalId).maybeSingle());

  if (!pro) return backHeader('הזמנה') + emptyState('🔍', 'בעל המקצוע לא נמצא', 'ייתכן שהפרופיל הוסר או הושהה.');

  const [services, addresses] = await Promise.all([
    call(db.from('professional_services')
      .select('*').eq('professional_id', pro.id).eq('is_active', true).is('deleted_at', null).order('sort_order')),
    call(db.from('service_addresses')
      .select('*, cities(name)').eq('profile_id', myId()).is('deleted_at', null).order('is_default', { ascending: false })),
  ]);

  if (!services.length) {
    return backHeader('הזמנה') + emptyState('💰', 'אין שירותים להזמנה',
      'בעל המקצוע עדיין לא הגדיר מחירון.');
  }

  booking = {
    pro, services, addresses,
    serviceId: preselected && services.some((s) => s.id === preselected) ? preselected : services[0].id,
    locationType: pro.accepts_home_visits ? 'client_home' : 'studio',
    addressId: addresses.find((a) => a.is_default)?.id || addresses[0]?.id || null,
    date: ymd(new Date(Date.now() + 86400000)),
    slot: null, people: 1, notes: '',
    recurring: false, frequency: 'biweekly', occurrences: 6,
    step: 1,
  };

  setTimeout(renderBookingStep);
  return `${backHeader(`הזמנת תור אצל ${pro.business_name}`)}<div id="booking-root"></div>`;
}

const currentService = () => booking.services.find((s) => s.id === booking.serviceId);

function renderBookingStep() {
  const root = $('#booking-root');
  if (!root) return;

  const steps = ['שירות', 'מיקום', 'מועד', 'סיכום'];
  const header = `
    <div class="row" style="margin-bottom:1rem">
      ${steps.map((label, index) => `
        <div class="grow center">
          <div style="height:4px;border-radius:2px;background:hsl(var(${index < booking.step ? '--primary' : '--border'}))"></div>
          <span class="tiny ${index < booking.step ? '' : 'muted'}">${label}</span>
        </div>`).join('')}
    </div>`;

  const body = [stepService, stepLocation, stepWhen, stepSummary][booking.step - 1]();
  root.innerHTML = header + body;
  bindBookingStep();
}

function stepService() {
  return `
    <section class="card p stack">
      <h2>איזה טיפול תרצו?</h2>
      ${booking.services.map((s) => `
        <label class="list-btn" style="border:1px solid hsl(var(--${s.id === booking.serviceId ? 'primary' : 'border'}))">
          <input type="radio" name="service" value="${esc(s.id)}" ${s.id === booking.serviceId ? 'checked' : ''} />
          <span class="grow">
            <span class="sm" style="font-weight:600">${esc(s.name)}</span>
            ${s.description ? `<span class="tiny muted" style="display:block">${esc(s.description)}</span>` : ''}
            <span class="tiny muted">${duration(s.duration_minutes)}</span>
          </span>
          <span class="sm nums" style="font-weight:700">${esc(servicePrice(s.price_type, s.price_min, s.price_max))}</span>
        </label>`).join('')}

      ${currentService()?.supports_recurring ? `
        <label class="row" style="align-items:flex-start;gap:.5rem;background:hsl(var(--accent));padding:.7rem;border-radius:12px">
          <input type="checkbox" id="want-recurring" ${booking.recurring ? 'checked' : ''} style="margin-top:.25rem" />
          <span class="sm"><strong>להפוך את זה למפגש קבוע</strong>
            <span class="tiny muted" style="display:block">
              למשל: כל שבועיים ביום חמישי — נקבע את כל המפגשים מראש.</span></span>
        </label>` : ''}

      <button class="btn block" data-next>המשך</button>
    </section>`;
}

function stepLocation() {
  const pro = booking.pro;
  const options = [
    pro.accepts_home_visits && ['client_home', 'אצלי בבית', 'בעל המקצוע מגיע אליכם'],
    pro.accepts_studio && ['studio', 'בסטודיו', `${pro.business_name}, ${pro.cities?.name || ''}`],
    pro.accepts_events && ['event', 'באירוע', 'חתונה, אירוע משפחתי או צילומים'],
  ].filter(Boolean);

  return `
    <section class="card p stack">
      <h2>איפה יתקיים הטיפול?</h2>
      ${options.map(([value, title, sub]) => `
        <label class="list-btn" style="border:1px solid hsl(var(--${value === booking.locationType ? 'primary' : 'border'}))">
          <input type="radio" name="loc" value="${value}" ${value === booking.locationType ? 'checked' : ''} />
          <span class="grow"><span class="sm" style="font-weight:600">${title}</span>
          <span class="tiny muted" style="display:block">${esc(sub)}</span></span>
        </label>`).join('')}

      <div id="address-block" ${booking.locationType === 'client_home' ? '' : 'hidden'}>
        <hr class="sep" />
        <h3>כתובת השירות</h3>
        <p class="tiny muted" style="margin-bottom:.5rem">
          הכתובת המלאה נחשפת לבעל המקצוע רק אחרי שההזמנה מאושרת.</p>
        <div class="stack" id="address-list">
          ${booking.addresses.map((a) => `
            <label class="list-btn" style="border:1px solid hsl(var(--${a.id === booking.addressId ? 'primary' : 'border'}))">
              <input type="radio" name="addr" value="${esc(a.id)}" ${a.id === booking.addressId ? 'checked' : ''} />
              <span class="grow"><span class="sm" style="font-weight:600">${esc(a.label)}</span>
              <span class="tiny muted" style="display:block">
                ${esc(a.street)} ${esc(a.house_number || '')}, ${esc(a.cities?.name || '')}</span></span>
            </label>`).join('')}
        </div>
        <button class="btn outline block" style="margin-top:.5rem" id="add-address">+ הוספת כתובת</button>
      </div>

      <div class="row">
        <button class="btn ghost" data-back>חזרה</button>
        <button class="btn grow" data-next>המשך</button>
      </div>
    </section>`;
}

function stepWhen() {
  return booking.recurring ? stepRecurring() : `
    <section class="card p stack">
      <h2>מתי נוח לכם?</h2>

      <div class="field">
        <label for="book-date">תאריך</label>
        <input class="input" id="book-date" type="date" value="${booking.date}" min="${ymd(new Date())}" />
      </div>

      <div>
        <h3>שעות פנויות</h3>
        <p class="tiny muted">השעות מגיעות מהיומן האמיתי של בעל המקצוע.</p>
        <div id="slots" class="row wrap" style="margin-top:.5rem">${skeletonList(1)}</div>
      </div>

      <div class="field">
        <label for="people">מספר אנשים</label>
        <input class="input" id="people" type="number" min="1" max="20" value="${booking.people}" />
      </div>

      <div class="field">
        <label for="notes">הערות לבעל המקצוע (רשות)</label>
        <textarea class="input" id="notes" maxlength="600"
          placeholder="למשל: יש חניה בחצר, נא לצלצל בפעמון העליון">${esc(booking.notes)}</textarea>
      </div>

      <div class="row">
        <button class="btn ghost" data-back>חזרה</button>
        <button class="btn grow" data-next ${booking.slot ? '' : 'disabled'}>המשך לסיכום</button>
      </div>
    </section>`;
}

function stepRecurring() {
  return `
    <section class="card p stack">
      <h2>מפגש קבוע</h2>

      <div class="field">
        <label for="freq">כל כמה זמן?</label>
        <select class="input" id="freq">
          ${FREQUENCIES.map(([v, l]) => `<option value="${v}" ${v === booking.frequency ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label for="first-date">תאריך המפגש הראשון</label>
        <input class="input" id="first-date" type="date" value="${booking.date}" min="${ymd(new Date())}" />
      </div>

      <div>
        <h3>שעה</h3>
        <div id="slots" class="row wrap" style="margin-top:.5rem">${skeletonList(1)}</div>
      </div>

      <div class="field">
        <label for="occurrences">מספר מפגשים</label>
        <input class="input" id="occurrences" type="number" min="2" max="52" value="${booking.occurrences}" />
      </div>

      <div id="preview-dates"></div>

      <div class="row">
        <button class="btn ghost" data-back>חזרה</button>
        <button class="btn grow" data-next ${booking.slot ? '' : 'disabled'}>המשך לסיכום</button>
      </div>
    </section>`;
}

function stepSummary() {
  const service = currentService();
  const address = booking.addresses.find((a) => a.id === booking.addressId);
  const price = service.price_min ?? 0;
  const travelFee = booking.locationType === 'client_home' ? Number(booking.pro.travel_fee || 0) : 0;
  const count = booking.recurring ? Number(booking.occurrences) : 1;

  return `
    <section class="card p stack">
      <h2>סיכום לפני שליחה</h2>

      <div class="stack" style="gap:.45rem">
        ${summaryRow('בעל/ת המקצוע', booking.pro.business_name)}
        ${summaryRow('השירות', service.name)}
        ${summaryRow('משך משוער', duration(service.duration_minutes))}
        ${summaryRow('מיקום', LOCATION_LABELS[booking.locationType])}
        ${address && booking.locationType === 'client_home'
          ? summaryRow('כתובת', `${address.street} ${address.house_number || ''}, ${address.cities?.name || ''}`)
          : ''}
        ${booking.recurring
          ? summaryRow('תדירות', `${FREQUENCIES.find((f) => f[0] === booking.frequency)[1]} · ${count} מפגשים`)
          : ''}
        ${summaryRow(booking.recurring ? 'המפגש הראשון' : 'מועד', dateTimeOf(booking.slot))}
        ${summaryRow('מספר אנשים', String(booking.people))}
      </div>

      <hr class="sep" />

      <div class="stack" style="gap:.35rem">
        ${summaryRow('מחיר הטיפול', servicePrice(service.price_type, service.price_min, service.price_max))}
        ${travelFee ? summaryRow('תוספת נסיעה', money(travelFee)) : ''}
        <div class="between" style="font-weight:800">
          <span>סך הכול${booking.recurring ? ' לכל מפגש' : ''}</span>
          <span class="nums">${service.price_type === 'on_request' ? 'לפי פנייה' : money(price + travelFee)}</span>
        </div>
      </div>

      ${booking.pro.cancellation_policy ? `
        <div class="card p sm" style="background:hsl(var(--muted));box-shadow:none">
          <strong class="tiny">מדיניות ביטול</strong>
          <p class="tiny">${esc(booking.pro.cancellation_policy)}</p>
        </div>` : ''}

      <p class="tiny muted">
        ${booking.recurring
          ? 'הסדרה תופעל רק אחרי שגם בעל המקצוע יאשר אותה.'
          : 'ההזמנה תישלח לאישור בעל המקצוע. הכתובת המלאה תיחשף רק לאחר האישור.'}
      </p>

      <div class="row">
        <button class="btn ghost" data-back>חזרה</button>
        <button class="btn grow" id="submit-booking">
          ${booking.recurring ? 'שליחת בקשה לסדרה' : 'שליחת בקשת הזמנה'}</button>
      </div>
    </section>`;
}

function summaryRow(label, value) {
  return `<div class="between"><span class="muted sm">${esc(label)}</span>
    <span class="sm" style="font-weight:600;text-align:end">${esc(value)}</span></div>`;
}

function bindBookingStep() {
  $$('[data-next]').forEach((b) => b.addEventListener('click', () => {
    if (booking.step === 2 && booking.locationType === 'client_home' && !booking.addressId) {
      toastBad('יש לבחור או להוסיף כתובת');
      return;
    }
    if (booking.step === 3) {
      booking.people = Number($('#people')?.value || 1);
      booking.notes = $('#notes')?.value.trim() || '';
      booking.occurrences = Number($('#occurrences')?.value || booking.occurrences);
      if (!booking.slot) { toastBad('יש לבחור שעה'); return; }
    }
    booking.step = Math.min(4, booking.step + 1);
    renderBookingStep();
  }));

  $$('[data-back]').forEach((b) => b.addEventListener('click', () => {
    booking.step = Math.max(1, booking.step - 1);
    renderBookingStep();
  }));

  $$('input[name="service"]').forEach((input) => input.addEventListener('change', () => {
    booking.serviceId = input.value;
    booking.slot = null;
    renderBookingStep();
  }));

  $('#want-recurring')?.addEventListener('change', (e) => { booking.recurring = e.target.checked; });

  $$('input[name="loc"]').forEach((input) => input.addEventListener('change', () => {
    booking.locationType = input.value;
    const block = $('#address-block');
    if (block) block.hidden = booking.locationType !== 'client_home';
    renderBookingStep();
  }));

  $$('input[name="addr"]').forEach((input) => input.addEventListener('change', () => {
    booking.addressId = input.value;
  }));

  $('#add-address')?.addEventListener('click', openAddressDialog);

  const dateInput = $('#book-date') || $('#first-date');
  if (dateInput) {
    dateInput.addEventListener('change', () => {
      booking.date = dateInput.value;
      booking.slot = null;
      loadSlots();
    });
    loadSlots();
  }

  $('#freq')?.addEventListener('change', (e) => { booking.frequency = e.target.value; previewSeries(); });
  $('#occurrences')?.addEventListener('change', (e) => {
    booking.occurrences = Number(e.target.value) || 6;
    previewSeries();
  });

  $('#submit-booking')?.addEventListener('click', (e) => submitBooking(e.currentTarget));
}

/** מביא שעות פנויות אמיתיות מהיומן. */
async function loadSlots() {
  const box = $('#slots');
  if (!box) return;
  box.innerHTML = '<span class="muted sm">בודק זמינות…</span>';

  const service = currentService();
  const slots = await call(db.rpc('available_slots', {
    p_professional_id: booking.pro.id,
    p_date: booking.date,
    p_duration_minutes: service.duration_minutes || 60,
    p_buffer_minutes: service.buffer_minutes ?? booking.pro.default_buffer_minutes ?? 0,
    p_step_minutes: 30,
  })).catch(() => []);

  if (!slots.length) {
    box.innerHTML = `<p class="muted sm">אין שעות פנויות בתאריך הזה. נסו תאריך אחר.</p>`;
    return;
  }

  box.innerHTML = slots.map((s) => `
    <button class="chip" data-slot="${esc(s.slot)}"
      aria-pressed="${booking.slot === s.slot}">${timeOf(s.slot)}</button>`).join('');

  $$('#slots [data-slot]').forEach((chip) => {
    chip.addEventListener('click', () => {
      booking.slot = chip.dataset.slot;
      $$('#slots [data-slot]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      $$('[data-next]').forEach((b) => { b.disabled = false; });
      if (booking.recurring) previewSeries();
    });
  });
}

/** תצוגה מקדימה של כל מועדי הסדרה. */
async function previewSeries() {
  const box = $('#preview-dates');
  if (!box || !booking.slot) return;

  const start = new Date(booking.slot);
  const rows = await call(db.rpc('preview_series_dates', {
    p_frequency: booking.frequency,
    p_interval_weeks: null,
    p_weekday: start.getDay(),
    p_start_time: `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`,
    p_start_date: ymd(start),
    p_end_date: null,
    p_count: Number(booking.occurrences) || 6,
  })).catch(() => []);

  box.innerHTML = rows.length ? `
    <div class="card p" style="background:hsl(var(--muted));box-shadow:none">
      <h3 class="sm">המועדים הצפויים</h3>
      <ol class="tiny muted" style="margin:.4rem 0 0;padding-inline-start:1.1rem">
        ${rows.map((r) => `<li>${esc(dateTimeOf(r.scheduled_start))}</li>`).join('')}
      </ol>
      <p class="tiny" style="margin-top:.4rem">אפשר לדלג או להזיז כל מפגש בנפרד אחרי האישור.</p>
    </div>` : '';
}

/** שולח את ההזמנה או את הסדרה. */
async function submitBooking(button) {
  await withBusy(button, async () => {
    const service = currentService();
    const start = new Date(booking.slot);
    const travelFee = booking.locationType === 'client_home' ? Number(booking.pro.travel_fee || 0) : 0;

    if (booking.recurring) {
      const series = await call(db.from('recurring_booking_series').insert({
        client_id: myId(),
        professional_id: booking.pro.id,
        service_id: booking.serviceId,
        address_id: booking.locationType === 'client_home' ? booking.addressId : null,
        location_type: booking.locationType,
        frequency: booking.frequency,
        weekday: start.getDay(),
        start_time: `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`,
        duration_minutes: service.duration_minutes || 60,
        start_date: ymd(start),
        planned_occurrences: Number(booking.occurrences),
        price_amount: service.price_min,
        travel_fee: travelFee,
        notes: booking.notes || null,
        approval_mode: 'whole_series',
        status: 'pending',
        client_approved_at: new Date().toISOString(),
      }).select('id').single());

      await db.rpc('generate_series_occurrences', { p_series_id: series.id });
      toastOk('הבקשה נשלחה! הסדרה תופעל אחרי אישור בעל המקצוע.');
      location.hash = `#/recurring/${series.id}`;
      return;
    }

    const end = new Date(start.getTime() + (service.duration_minutes || 60) * 60000);
    const row = await call(db.from('bookings').insert({
      client_id: myId(),
      professional_id: booking.pro.id,
      service_id: booking.serviceId,
      address_id: booking.locationType === 'client_home' ? booking.addressId : null,
      location_type: booking.locationType,
      status: 'pending',
      scheduled_start: start.toISOString(),
      scheduled_end: end.toISOString(),
      duration_minutes: service.duration_minutes || 60,
      buffer_minutes: service.buffer_minutes ?? booking.pro.default_buffer_minutes ?? 0,
      price_type: service.price_type,
      price_amount: service.price_min,
      travel_fee: travelFee,
      people_count: booking.people,
      notes: booking.notes || null,
    }).select('id').single());

    toastOk('הבקשה נשלחה לבעל המקצוע!');
    location.hash = `#/bookings/${row.id}`;
  });
}

async function screenConversations() {

    .select('conversation_id, last_read_at, conversations(id, last_message_at, last_message_preview, last_sender_id)')
    .eq('profile_id', myId()).order('joined_at', { ascending: false }).limit(60));

  const conversationIds = rows.map((r) => r.conversation_id);

  // הצד השני בכל שיחה
  const others = conversationIds.length ? await call(db.from('conversation_members')
    .select('conversation_id, profile_id, profiles(id, username, full_name, avatar_url)')
    .in('conversation_id', conversationIds).neq('profile_id', myId())) : [];

  const byConversation = new Map();
  others.forEach((o) => { if (!byConversation.has(o.conversation_id)) byConversation.set(o.conversation_id, o); });

  const items = rows
    .filter((r) => r.conversations)

        && (!r.last_read_at || new Date(r.conversations.last_message_at) > new Date(r.last_read_at))
        && r.conversations.last_sender_id !== myId();

      return `<a class="list-btn" href="#/messages/${esc(r.conversation_id)}">
        ${avatar(other?.avatar_url, 'av-md', other?.full_name)}
        <span class="grow" style="min-width:0">
          <span class="row" style="gap:.4rem">
            <strong class="sm truncate">${esc(other?.full_name || 'שיחה')}</strong>

          <span class="tiny muted truncate" style="display:block">
