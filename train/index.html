<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="description" content="THE LAST TRAIN — a first-person psychological horror game about the 00:47 service, and whether to get off.">
<title>THE LAST TRAIN</title>

<link rel="stylesheet" href="src/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2305070a'/><rect x='9' y='6' width='14' height='17' rx='3' fill='none' stroke='%23ffb03a' stroke-width='2'/><rect x='12' y='10' width='8' height='5' fill='%23ffb03a'/><path d='M11 27l3-4M21 27l-3-4' stroke='%23ffb03a' stroke-width='2' stroke-linecap='round'/></svg>">
</head>
<body>

<div id="app">
  <canvas id="view" aria-label="game view"></canvas>

  <!-- in-world HUD -->
  <div id="hud" class="hud" hidden>
    <div id="crosshair" class="crosshair"><span></span></div>
    <div id="prompt" class="prompt" hidden></div>
    <div id="captions" class="captions" aria-live="polite"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="hints" class="hints" aria-live="polite"></div>
    <div id="stationcard" class="stationcard" hidden></div>
  </div>

  <!-- reading something, or being spoken to -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- menus -->
  <div id="menu" class="menu"></div>

  <div id="grain" class="grain" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">
      <h1>THE LAST TRAIN</h1>
      <p>This game needs JavaScript and WebGL 2.</p>
    </div>
  </noscript>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
