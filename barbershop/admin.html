<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<title>יומן ההזמנות · רון מלכה</title>
<meta name="robots" content="noindex, nofollow">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B0B0D'/><path d='M10 8l12 16M10 24L22 8' stroke='%23C9A24A' stroke-width='2.2' stroke-linecap='round'/><circle cx='9.5' cy='9.5' r='2.6' fill='none' stroke='%23C9A24A' stroke-width='2'/><circle cx='9.5' cy='22.5' r='2.6' fill='none' stroke='%23C9A24A' stroke-width='2'/></svg>">

<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/admin.css">
</head>
<body class="admin">

<!-- The lock screen. It is the only thing in the document until a correct
     password opens a session — see the long note at the top of src/js/auth.js
     about exactly how much that is worth on a static site. -->
<section class="lock" id="lock">
  <div class="lock__card">
    <div class="lock__mark" id="lockMark"></div>
    <h1>יומן ההזמנות</h1>
    <p>האזור הזה מיועד לרון בלבד.</p>
    <form class="lock__form" id="lockForm" novalidate>
      <label class="field">
        <span class="field__label">סיסמה</span>
        <input class="input" id="lockInput" type="password" autocomplete="current-password"
               aria-describedby="lockError" required>
        <span class="field__error" id="lockError"></span>
      </label>
      <button class="btn btn--block btn--lg" id="lockSubmit" type="submit">כניסה</button>
    </form>
    <a class="lock__back" href="index.html">חזרה לאתר</a>
  </div>
</section>

<!-- Built entirely by src/js/admin.js once unlocked. -->
<div class="admin-app" id="app" hidden>
  <header class="admin-bar">
    <div class="container admin-bar__inner" id="appBar"></div>
  </header>
  <main class="container section" id="appMain"></main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet__card" id="sheetCard"></div>
</div>

<noscript>
  <p class="noscript-note">היומן דורש JavaScript.</p>
</noscript>

<script type="module" src="src/js/main-admin.js"></script>
</body>
</html>
