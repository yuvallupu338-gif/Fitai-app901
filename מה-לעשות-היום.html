<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d1560">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="מה לעשות היום?">
<meta property="og:description" content="גלגל מזל שמחליט בשבילכם מה לעשות היום — בלי הרשמה, בלי שרת, בלי מעקב.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta name="description" content="גלגל מזל שבוחר בשבילכם מה לעשות היום. רשימה שאפשר לערוך, בלי הרשמה ובלי שרת.">
<title>מה לעשות היום?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23FFC63C'/><path d='M16 2a14 14 0 0 1 12.1 7L16 16z' fill='%23FF6B9D'/><path d='M28.1 9A14 14 0 0 1 16 30V16z' fill='%236C8CFF'/><path d='M16 30A14 14 0 0 1 3.9 9L16 16z' fill='%232FC4A5'/><circle cx='16' cy='16' r='4' fill='%23fff'/></svg>">

<style>
/* ------------------------------------------------------------------ *
 * מה לעשות היום — קובץ אחד, בלי שרת, בלי תלויות.                      *
 * ------------------------------------------------------------------ */

:root{
  --ink:#241536;
  --muted:#6d5d8d;
  --card:#ffffff;
  --accent:#FFC63C;
  --accent-2:#FF6B9D;
  --line:rgba(36,21,54,.12);
  --radius:22px;
  --shadow:0 18px 44px rgba(9,3,28,.42);
  --stage: min(88vw, 380px);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

/* הרקע יושב על <html> ולא על <body>: רקע קבוע על body נעצר בגובה החלון,
   וכל מה שמתחת לקיפול נשאר על לבן — כולל כפתורים לבנים. */
html{
  background:
    radial-gradient(1100px 620px at 50% -12%, #7a2fa0 0%, rgba(122,47,160,0) 62%),
    linear-gradient(168deg,#1a0f36 0%,#2d1560 52%,#3d1c66 100%) ,
    #2d1560;
  background-attachment:fixed, fixed, fixed;
  min-height:100%;
}

body{
  font-family:'Rubik','Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:#fff;
  min-height:100svh;
  overflow-x:hidden;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}

button{ font:inherit; color:inherit; touch-action:manipulation; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:12px; }

/* ---------- פריסה ---------- */

.wrap{
  width:100%; max-width:540px; margin-inline:auto;
  padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; gap:18px;
}

header{ text-align:center; }

h1{
  margin:0; font-size:clamp(28px,7.5vw,38px); font-weight:900; letter-spacing:-.5px;
  background:linear-gradient(92deg,#fff 10%,var(--accent) 55%,var(--accent-2) 95%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tagline{ margin:6px 0 0; font-size:15px; color:rgba(255,255,255,.72); }

/* ---------- שבבי קטגוריות ---------- */

.cats{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
  width:100%;
}
.chip{
  border:1.5px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.62);
  border-radius:999px; padding:7px 13px;
  font-size:13.5px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.chip:active{ transform:scale(.95); }
.chip[aria-pressed="true"]{
  background:rgba(255,255,255,.96); color:var(--ink);
  border-color:transparent; font-weight:700;
}
.chip .dot{ font-size:15px; line-height:1; }

/* ---------- הגלגל ---------- */

.stage{
  position:relative;
  width:var(--stage); height:var(--stage);
  flex:none;
  margin-top:2px;
}

.bezel{
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,#FFC63C,#FF6B9D,#6C8CFF,#2FC4A5,#FFC63C);
  padding:10px;
  box-shadow:
    var(--shadow),
    inset 0 0 0 3px rgba(255,255,255,.28),
    0 0 60px rgba(255,198,60,.22);
}

.rotor{
  position:absolute; inset:10px; border-radius:50%;
  cursor:pointer;
  will-change:transform;
  transform:rotate(0deg);
  background:#fff;          /* מציץ מבעד לפלחים שהועמעמו — מבהיר ולא מלכלך */
  overflow:hidden;
}
.rotor svg{ display:block; width:100%; height:100%; }

.rotor text{
  direction:rtl;
  font-family:'Rubik','Assistant',system-ui,Arial,sans-serif;
  font-weight:700;
  fill:#1b1029;
  paint-order:stroke;
  stroke:rgba(255,255,255,.85);
  stroke-width:1.4px;
  stroke-linejoin:round;
  pointer-events:none;
  user-select:none;
}

.seg{ stroke:rgba(255,255,255,.5); stroke-width:1.2; transition:opacity .35s ease; }
.rotor.settled .seg{ opacity:.6; }
.rotor.settled .seg.win{ opacity:1; }

#winOutline{ fill:none; stroke:#fff; stroke-width:4; opacity:0; pointer-events:none; }
.rotor.settled #winOutline{ opacity:1; animation:winPulse 1.1s ease-out 2; }
@keyframes winPulse{ 0%,100%{ stroke-opacity:1 } 50%{ stroke-opacity:.35 } }

.rotor.settled text{ opacity:.85; transition:opacity .35s ease; }
.rotor.settled text.win{ opacity:1; }

/* מחוג */
.pin{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:36px; height:50px; z-index:5;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.5));
  pointer-events:none;
}
.pin svg{ display:block; width:100%; height:100%; transform-origin:50% 16%; }
.pin.kick svg{ animation:pinkick .13s ease-out; }
@keyframes pinkick{ 0%{ transform:rotate(0) } 35%{ transform:rotate(-13deg) } 100%{ transform:rotate(0) } }

/* ציר מרכזי — הוא כפתור הסיבוב */
.hub{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:29%; aspect-ratio:1; border-radius:50%;
  border:none; cursor:pointer; z-index:4;
  background:radial-gradient(circle at 32% 28%, #fff 0%, #ffe9b0 38%, var(--accent) 100%);
  color:#3a2205; font-weight:900; font-size:clamp(15px,4.4vw,20px);
  letter-spacing:-.3px;
  box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 6px rgba(255,255,255,.16);
  display:grid; place-items:center;
  transition:box-shadow .18s ease, filter .18s ease;
}
.hub:hover{ filter:brightness(1.05); }
.hub:active{ transform:translate(-50%,-50%) scale(.94); }
.hub[disabled]{ filter:grayscale(.65) brightness(.85); cursor:not-allowed; }
/* הזמנה ללחיצה — הילה פועמת ולא שינוי גודל, כדי שהכפתור לא "יזוז" */
.hub.idle{ animation:invite 2.6s ease-in-out infinite; }
@keyframes invite{
  0%,100%{ box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 6px rgba(255,255,255,.16); }
  50%    { box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 15px rgba(255,255,255,.06); }
}

.poolnote{
  margin:0; text-align:center; font-size:13px; line-height:1.6;
  color:rgba(255,255,255,.6); min-height:1.2em;
}
.poolnote b{ color:rgba(255,255,255,.9); font-weight:700; }
.poolnote.warn{ color:#FFD9A0; }

/* ---------- כרטיס תוצאה ---------- */

.result{
  width:100%; background:var(--card); color:var(--ink);
  border-radius:var(--radius); padding:22px 18px 18px;
  box-shadow:var(--shadow); text-align:center;
  animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{
  0%  { opacity:0; transform:scale(.72) translateY(14px); }
  60% { opacity:1; }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
.result[hidden]{ display:none; }

.result .kicker{
  margin:0; font-size:13px; font-weight:700; color:var(--muted);
  letter-spacing:.4px;
}
.result .emoji{
  font-size:clamp(52px,15vw,68px); line-height:1.1; margin:6px 0 2px;
  animation:bounceIn .7s cubic-bezier(.2,1.5,.4,1) both .1s;
}
@keyframes bounceIn{
  0%  { transform:scale(0) rotate(-25deg); }
  70% { transform:scale(1.22) rotate(6deg); }
  100%{ transform:scale(1) rotate(0); }
}
.result h2{
  margin:2px 0 4px; font-size:clamp(23px,6.4vw,30px); font-weight:900;
  line-height:1.25; letter-spacing:-.4px;
}
.result .cat{
  display:inline-block; margin:2px 0 16px; padding:4px 12px;
  background:rgba(36,21,54,.07); border-radius:999px;
  font-size:12.5px; font-weight:600; color:var(--muted);
}

.actions{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.actions .wide{ grid-column:1 / -1; }

.btn{
  border:none; border-radius:14px; padding:13px 12px; cursor:pointer;
  font-size:15px; font-weight:700; line-height:1.2;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s ease, filter .18s ease, background .18s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:linear-gradient(135deg,#6C8CFF,#A855F7); color:#fff; box-shadow:0 8px 18px rgba(108,140,255,.35); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-soft{ background:rgba(36,21,54,.07); color:var(--ink); }
.btn-soft:hover{ background:rgba(36,21,54,.12); }
.btn svg{ width:17px; height:17px; flex:none; }

/* ---------- פעולות תחתונות ---------- */

.tools{ display:flex; gap:9px; width:100%; }
.tools .btn{ flex:1; background:rgba(255,255,255,.11); color:#fff; border:1.5px solid rgba(255,255,255,.2); font-size:14.5px; }
.tools .btn:hover{ background:rgba(255,255,255,.18); }

footer{ font-size:12px; color:rgba(255,255,255,.55); text-align:center; line-height:1.7; }

/* ---------- דיאלוג עריכה ---------- */

dialog{
  width:min(94vw,560px); max-height:88svh; padding:0; border:none;
  border-radius:24px; color:var(--ink); background:var(--card);
  box-shadow:0 30px 70px rgba(0,0,0,.5);
  overflow:hidden;
}
dialog::backdrop{ background:rgba(12,4,32,.7); backdrop-filter:blur(3px); }
.dlg{ display:flex; flex-direction:column; max-height:88svh; }

.dlg-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 12px; border-bottom:1px solid var(--line); flex:none;
}
.dlg-head h2{ margin:0; font-size:19px; font-weight:900; }
.x{
  border:none; background:rgba(36,21,54,.07); color:var(--ink);
  width:36px; height:36px; border-radius:50%; font-size:19px; cursor:pointer; flex:none;
  display:grid; place-items:center;
}
.x:hover{ background:rgba(36,21,54,.14); }

.dlg-body{ overflow-y:auto; padding:14px 16px 6px; -webkit-overflow-scrolling:touch; }

.addform{
  display:grid; grid-template-columns:64px 1fr; gap:8px;
  background:rgba(108,140,255,.09); border:1.5px dashed rgba(108,140,255,.45);
  border-radius:16px; padding:12px; margin-bottom:16px;
}
.addform label{ font-size:12px; font-weight:700; color:var(--muted); grid-column:1 / -1; margin-bottom:-2px; }
.addform input, .addform select{
  font:inherit; font-size:15px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:11px; padding:10px;
  background:#fff; width:100%; min-width:0;
}
.addform input:focus, .addform select:focus{ outline:none; border-color:#6C8CFF; }
.addform .emoji-in{ text-align:center; font-size:20px; padding:9px 4px; }
.addform .row2{ grid-column:1 / -1; display:grid; grid-template-columns:1fr auto; gap:8px; }
.addform .btn{ background:linear-gradient(135deg,#6C8CFF,#A855F7); color:#fff; padding:11px 18px; }
.emoji-picks{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:5px; }
.emoji-picks button{
  border:none; background:rgba(36,21,54,.06); border-radius:9px;
  width:33px; height:33px; font-size:17px; cursor:pointer; line-height:1;
}
.emoji-picks button:hover{ background:rgba(36,21,54,.14); }

.grp{ margin-bottom:14px; }
.grp-head{
  display:flex; align-items:center; gap:9px;
  padding:8px 2px; border-bottom:1px solid var(--line); margin-bottom:4px;
}
.grp-head h3{ margin:0; font-size:15.5px; font-weight:800; flex:1; }
.grp-head .count{ font-size:12px; color:var(--muted); font-weight:600; }
.grp.off .items{ opacity:.42; }

.switch{
  position:relative; width:44px; height:25px; border-radius:999px; flex:none;
  border:none; cursor:pointer; background:rgba(36,21,54,.2); transition:background .2s ease;
}
.switch::after{
  content:""; position:absolute; top:3px; right:3px; width:19px; height:19px;
  border-radius:50%; background:#fff; transition:transform .2s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch[aria-checked="true"]{ background:#34D399; }
.switch[aria-checked="true"]::after{ transform:translateX(-19px); }

.items{ list-style:none; margin:0; padding:0; }
.items li{
  display:flex; align-items:center; gap:10px; padding:8px 4px;
  border-bottom:1px solid rgba(36,21,54,.06);
}
.items li:last-child{ border-bottom:none; }
.items .tog{
  width:23px; height:23px; border-radius:7px; flex:none; cursor:pointer;
  border:2px solid rgba(36,21,54,.28); background:#fff;
  display:grid; place-items:center; font-size:14px; color:#fff; padding:0;
}
.items .tog[aria-checked="true"]{ background:#34D399; border-color:#34D399; }
.items .em{ font-size:19px; flex:none; width:24px; text-align:center; }
.items .tx{ flex:1; font-size:15px; line-height:1.35; word-break:break-word; }
.items li.off .tx, .items li.off .em{ opacity:.4; text-decoration:line-through; }
.items .del{
  border:none; background:transparent; color:#e11d48; cursor:pointer;
  font-size:17px; width:32px; height:32px; border-radius:9px; flex:none;
}
.items .del:hover{ background:rgba(225,29,72,.1); }
.tag-new{
  font-size:10.5px; font-weight:700; background:rgba(168,85,247,.14);
  color:#7c3aed; border-radius:6px; padding:2px 6px; flex:none;
}

.dlg-foot{
  flex:none; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); display:flex; gap:9px;
}
.dlg-foot .btn{ flex:1; }
.btn-danger{ background:rgba(225,29,72,.1); color:#be123c; }
.btn-danger:hover{ background:rgba(225,29,72,.18); }

/* ---------- קונפטי + טוסט ---------- */

#fx{
  position:fixed; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:60; display:none;
}

#toast{
  position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px);
  background:rgba(20,10,40,.94); color:#fff; padding:11px 18px; border-radius:999px;
  font-size:14px; font-weight:600; z-index:70; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  max-width:88vw; text-align:center;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

.noscript{
  background:#fff; color:var(--ink); border-radius:16px; padding:16px;
  font-size:15px; text-align:center; width:100%;
}

/* ---------- נורות קרנבל על המסגרת ---------- */

.leds{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.led{
  position:absolute; top:50%; left:50%; width:8px; height:8px; margin:-4px;
  border-radius:50%;
  background:#FFE9B0;
  box-shadow:0 0 7px 1.5px rgba(255,210,110,.8);
  transform:rotate(var(--a)) translateY(calc(var(--stage) / -2 + 5px));
  opacity:.5;
  animation:ledtwinkle 2.6s ease-in-out infinite;
  animation-delay:calc(var(--i) * .37s);
}
.stage.spinning .led{ animation:ledchase .55s linear infinite; animation-delay:calc(var(--i) * -0.023s); }
.stage.won .led{ animation:ledwin .3s ease-in-out 6; }
@keyframes ledtwinkle{ 0%,100%{ opacity:.3 } 50%{ opacity:.9 } }
@keyframes ledchase{ 0%{ opacity:.12 } 12%{ opacity:1 } 45%{ opacity:.12 } 100%{ opacity:.12 } }
@keyframes ledwin{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }

/* ---------- השתקה ---------- */

.mute{
  position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px; z-index:30;
  width:44px; height:44px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  font-size:20px; cursor:pointer; display:grid; place-items:center;
  transition:background .18s ease, transform .12s ease;
}
.mute:hover{ background:rgba(255,255,255,.18); }
.mute:active{ transform:scale(.92); }

/* ---------- משפט אווירה בכרטיס ---------- */

.result .quip{
  margin:-8px 0 14px; font-size:14px; font-weight:500;
  color:var(--muted); min-height:1.2em;
}

:root{ color-scheme:dark; }
dialog{ color-scheme:light; }

@media (min-width:560px){
  :root{ --stage:400px; }
  .wrap{ padding-top:30px; gap:20px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .hub.idle{ animation:none; }
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<button class="mute" id="muteBtn" type="button" aria-pressed="true" aria-label="השתקת צלילים">🔊</button>

<div class="wrap">

  <header>
    <h1>מה לעשות היום?</h1>
    <p class="tagline">אין לכם כוח להחליט? תנו לגלגל.</p>
  </header>

  <noscript>
    <p class="noscript">הגלגל צריך JavaScript כדי להסתובב. הפעילו אותו בדפדפן ונסו שוב 🙂</p>
  </noscript>

  <div class="cats" id="cats" role="group" aria-label="קטגוריות פעילות"></div>

  <div class="stage">
    <div class="bezel" aria-hidden="true"></div>
    <div class="leds" id="leds" aria-hidden="true"></div>

    <div class="rotor" id="rotor" aria-hidden="true">
      <svg viewBox="-150 -150 300 300" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <defs>
          <radialGradient id="gloss" cx="38%" cy="30%" r="78%">
            <stop offset="0%"   stop-color="#fff" stop-opacity=".30"/>
            <stop offset="52%"  stop-color="#fff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#1a0f36" stop-opacity=".30"/>
          </radialGradient>
        </defs>
        <g id="segs"></g>
        <g id="labels"></g>
        <circle r="147.5" fill="url(#gloss)" pointer-events="none"/>
        <path id="winOutline" d=""/>
      </svg>
    </div>

    <div class="pin" aria-hidden="true">
      <svg viewBox="0 0 36 50" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 50 C18 50 3 26 3 16 A15 15 0 0 1 33 16 C33 26 18 50 18 50 Z" fill="#fff"/>
        <path d="M18 47 C18 47 6 25.5 6 16.5 A12 12 0 0 1 30 16.5 C30 25.5 18 47 18 47 Z" fill="#FF3D71"/>
        <circle cx="18" cy="16" r="5" fill="#fff"/>
      </svg>
    </div>

    <button class="hub idle" id="spinBtn" type="button" aria-label="סובב את הגלגל ובחר פעילות אקראית">סובב!</button>
  </div>

  <p class="poolnote" id="poolNote"></p>
  <p class="sr-only" id="announce" role="status" aria-live="polite"></p>

  <section class="result" id="result" hidden>
    <p class="kicker">היום אתם הולכים על…</p>
    <div class="emoji" id="rEmoji" aria-hidden="true">🎯</div>
    <h2 id="rText">—</h2>
    <span class="cat" id="rCat">—</span>
    <p class="quip" id="rQuip"></p>
    <div class="actions">
      <button class="btn btn-primary wide" id="againBtn" type="button">🎡 סובב שוב</button>

  var QUICK_EMOJI = ['✨','🎯','☕','🍕','🎬','📚','🏃','🎨','🎧','🌊','🧘','🎲','💬','🛠️','🐶','🌱'];

  var QUIPS = [
    'יאללה, נשמע מושלם 🙌',
    'זה הסימן שחיכיתם לו',
    'הגלגל אמר — הולכים על זה',
    'למה לא, בעצם?',
    'נשמע כמו יום טוב',

    'הגורל דיבר ✨',
    'קדימה, לפני שמתחרטים'
  ];

  var STORE_KEY = 'mah-laasot-hayom.v1';
  var MAX_SEG = 12;          /* כמה פלחים הגלגל מציג לכל היותר */
  var MAX_CUSTOM = 200;

  /* ================================================================
   * 2. מצב + שמירה
   * ================================================================ */

  var state = { disabled: {}, catsOff: {}, custom: [], soundOff: false };

  function storageGet() {
    try { return window.localStorage.getItem(STORE_KEY); }
    catch (e) { return null; }
  }
  function storageSet(v) {
    try { window.localStorage.setItem(STORE_KEY, v); return true; }
    catch (e) { return false; }
  }
  function storageDel() {
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  function load() {
    var raw = storageGet();
    if (!raw) return;
    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    if (!data || typeof data !== 'object') return;

    var known = {};
    DEFAULTS.forEach(function (d) { known[d.id] = true; });
    var catIds = {};
    CATS.forEach(function (c) { catIds[c.id] = true; });

    if (Array.isArray(data.disabled)) {
      data.disabled.forEach(function (id) { if (typeof id === 'string') state.disabled[id] = true; });
    }
    if (Array.isArray(data.catsOff)) {
      data.catsOff.forEach(function (id) { if (catIds[id]) state.catsOff[id] = true; });
    }
    state.soundOff = data.soundOff === true;
    if (Array.isArray(data.custom)) {
      data.custom.slice(0, MAX_CUSTOM).forEach(function (it) {
        if (!it || typeof it.text !== 'string') return;
        var text = it.text.trim().slice(0, 46);
        if (!text) return;
        var cat = catIds[it.cat] ? it.cat : CATS[0].id;
        var id = (typeof it.id === 'string' && it.id.indexOf('c.') === 0 && !known[it.id]) ? it.id : newId();
        known[id] = true;
        state.custom.push({
          id: id,
          cat: cat,
          emoji: (typeof it.emoji === 'string' && it.emoji.trim()) ? it.emoji.trim().slice(0, 4) : '✨',
          text: text,
          custom: true
        });
      });
    }
    /* כל קטגוריה שהופעלה מחדש לא יכולה להישאר מכובה בטעות */
    Object.keys(state.catsOff).forEach(function (id) { if (!catIds[id]) delete state.catsOff[id]; });
  }

  function save() {
    var payload = {
      v: 1,
      disabled: Object.keys(state.disabled),
      catsOff: Object.keys(state.catsOff),
      soundOff: !!state.soundOff,
      custom: state.custom.map(function (it) {
        return { id: it.id, cat: it.cat, emoji: it.emoji, text: it.text };
      })

    if (!storageSet(JSON.stringify(payload))) {
      toast('לא הצלחנו לשמור — הדפדפן חוסם אחסון מקומי');
    }
  }

  var idSeq = 0;
  function newId() {
    idSeq += 1;
    return 'c.' + Date.now().toString(36) + '.' + idSeq.toString(36);
  }

  /* ================================================================
   * 3. אקראיות הוגנת
   * ================================================================ */

  var cryptoObj = window.crypto || window.msCrypto;

  function randInt(n) {                       /* מספר שלם אחיד ב-[0,n) */
    if (n <= 1) return 0;
    if (cryptoObj && cryptoObj.getRandomValues) {
      var limit = Math.floor(0x100000000 / n) * n;
      var buf = new Uint32Array(1), v;
      do { cryptoObj.getRandomValues(buf); v = buf[0]; } while (v >= limit);
      return v % n;
    }
    return Math.floor(Math.random() * n);
  }
  function rand() {                            /* מספר ב-[0,1) */
    if (cryptoObj && cryptoObj.getRandomValues) {
      var buf = new Uint32Array(1);
      cryptoObj.getRandomValues(buf);
      return buf[0] / 0x100000000;
    }
    return Math.random();
  }
  function shuffle(arr) {                      /* פישר-ייטס */
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

   * 4. שאילתות על המאגר

  function allItems() { return DEFAULTS.concat(state.custom); }

  function itemsOfCat(catId) {
    return allItems().filter(function (it) { return it.cat === catId; });
  }

  function activePool() {
    return allItems().filter(function (it) {
      return !state.catsOff[it.cat] && !state.disabled[it.id];
    });
  }

  function catName(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;

  function catEmoji(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].emoji;
    return '✨';
  }

  /* דגימה אחידה: בוחרים k מתוך n באקראי ואז אחד מתוך k —
     ההגרלה נשארת אחידה על כל המאגר, והגלגל נשאר קריא. */
  function pickCandidates(pool, excludeId) {
    var p = pool;
    if (excludeId && pool.length > 1) {
      var filtered = pool.filter(function (it) { return it.id !== excludeId; });
      if (filtered.length) p = filtered;
    }
    var copy = shuffle(p.slice());
    return copy.length > MAX_SEG ? copy.slice(0, MAX_SEG) : copy;
  }

  /* ================================================================
   * 5. גאומטריה של הגלגל
   * ================================================================ */

  var SVG_NS = 'http://www.w3.org/2000/svg';

  var R_HUB = 44;           /* מתחת לזה יושב כפתור הסיבוב */

  /* זווית a נמדדת במעלות עם כיוון השעון, החל מ-12 */
  function polar(a, r) {
    var t = (a - 90) * Math.PI / 180;
    return { x: Math.round(r * Math.cos(t) * 1000) / 1000,
             y: Math.round(r * Math.sin(t) * 1000) / 1000 };
  }

  function wedgePath(a0, a1, r) {
    var p0 = polar(a0, r), p1 = polar(a1, r);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return 'M 0 0 L ' + p0.x + ' ' + p0.y +
           ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1.x + ' ' + p1.y + ' Z';
  }

  function labelMax(n) { return n <= 4 ? 20 : (n <= 8 ? 16 : 13); }
  function labelSize(n) { return n <= 4 ? 15 : (n <= 8 ? 13.5 : 12); }

  function clip(text, max) {
    var t = text.trim();
    return t.length > max ? t.slice(0, max - 1).trim() + '…' : t;
  }

  var segsG   = document.getElementById('segs');
  var labelsG = document.getElementById('labels');
  var rotor   = document.getElementById('rotor');
  var winOut  = document.getElementById('winOutline');

  var wheelItems = [];   /* הפריטים שמצוירים כרגע על הגלגל */

  function renderWheel(items) {
    wheelItems = items.slice();
    segsG.textContent = '';
    labelsG.textContent = '';
    winOut.setAttribute('d', '');
    rotor.classList.remove('settled');

    var n = items.length;

    if (n === 0) {
      var empty = document.createElementNS(SVG_NS, 'circle');
      empty.setAttribute('r', R_OUT);
      empty.setAttribute('fill', '#3a2b5c');
      segsG.appendChild(empty);
      return;
    }

    var seg = 360 / n;
    var maxChars = labelMax(n);
    var fontSize = labelSize(n);
    var rLabel = (R_HUB + R_OUT) / 2;

    for (var i = 0; i < n; i++) {
      var it = items[i];

      var path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'seg');
      path.setAttribute('fill', PALETTE[i % PALETTE.length]);
      if (n === 1) {
        /* קשת של 360° לא ניתנת לציור — פלח יחיד הוא עיגול מלא */
        path.setAttribute('d',
          'M 0 -' + R_OUT +
          ' A ' + R_OUT + ' ' + R_OUT + ' 0 1 1 -0.01 -' + R_OUT +
          ' Z');
      } else {
        path.setAttribute('d', wedgePath(i * seg, (i + 1) * seg, R_OUT));
      }
      segsG.appendChild(path);

      var label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('font-size', fontSize);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('dominant-baseline', 'middle');
      /* ההילה הלבנה עוזרת לאותיות ורק מלכלכת את האימוג'י */
      var badge = document.createElementNS(SVG_NS, 'tspan');
      badge.setAttribute('stroke', 'none');
      badge.textContent = it.emoji + ' ';
      label.appendChild(badge);
      label.appendChild(document.createTextNode(clip(it.text, maxChars)));

      if (n === 1) {
        label.setAttribute('x', 0);
        label.setAttribute('y', -(R_HUB + 42));
      } else {
        var ac = i * seg + seg / 2;
        /* בחצי השמאלי הופכים את הכיתוב כדי שלא יעמוד על הראש */
        var flip = (ac > 180 && ac < 360) ? 90 : -90;
        label.setAttribute('x', 0);
        label.setAttribute('y', -rLabel);
        label.setAttribute('transform',
          'rotate(' + ac + ') rotate(' + flip + ' 0 ' + (-rLabel) + ')');
      }
      labelsG.appendChild(label);
    }
  }

  /* ================================================================
   * 6. סיבוב
   * ================================================================ */

  var rotation = 0;
  var spinning = false;
  var lastWinner = null;
  var endTimer = null;

  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced() { return !!(reduceQ && reduceQ.matches); }

  var spinBtn  = document.getElementById('spinBtn');
  var resultEl = document.getElementById('result');
  var rEmoji   = document.getElementById('rEmoji');
  var rText    = document.getElementById('rText');
  var rCat     = document.getElementById('rCat');
  var rQuip    = document.getElementById('rQuip');
  var announce = document.getElementById('announce');

  function spin(excludeId) {
    if (spinning) return;
    var pool = activePool();
    if (!pool.length) { toast('אין פעילויות פעילות — הפעילו קטגוריה או הוסיפו פעילות'); return; }

    var cands = pickCandidates(pool, excludeId);
    renderWheel(cands);

    var n = cands.length;
    var winIdx = randInt(n);
    var seg = 360 / n;
    var centerAngle = winIdx * seg + seg / 2;
    /* רעש קטן כדי שהמחוג לא ינחת תמיד באמצע המדויק — ותמיד בתוך הפלח */
    var jitter = (rand() - 0.5) * seg * 0.7;

    /* המחוג יושב בזווית מסך 0. צריך שזווית הפלח + הסיבוב תתאפס. */
    var base = (((-(centerAngle + rotation + jitter)) % 360) + 360) % 360;
    /* בלי אנימציות: הדרך הקצרה לתשובה, לא ארבעה סיבובים מהירים */
    var turns = reduced() ? 0 : 4 + randInt(3);
    var dur = reduced() ? 320 : 2700 + randInt(1200);

    var fromRot = rotation;
    rotation += turns * 360 + base;

    spinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.remove('idle');
    spinBtn.setAttribute('aria-busy', 'true');
    spinBtn.textContent = '…';
    resultEl.hidden = true;
    announce.textContent = '';

    rotor.style.transition = 'transform ' + dur + 'ms cubic-bezier(.16,.72,.13,1)';
    /* מאלצים חישוב סגנון כדי שהמעבר יתחיל מהמצב הנוכחי */
    void rotor.offsetWidth;
    rotor.style.transform = 'rotate(' + rotation + 'deg)';

    ac();                                   /* מחוות המשתמש מעירות את האודיו */
    stageEl.classList.remove('won');
    stageEl.classList.add('spinning');
    startTicker(n, fromRot);

    var winner = cands[winIdx];
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      rotor.removeEventListener('transitionend', onEnd);
      if (endTimer) { clearTimeout(endTimer); endTimer = null; }
      settle(winner, winIdx, n);
    }
    function onEnd(e) { if (e.propertyName === 'transform') finish(); }

    rotor.addEventListener('transitionend', onEnd);
    endTimer = setTimeout(finish, dur + 400);   /* רשת ביטחון אם transitionend לא נורה */
  }

  var wonTimer = null;

  function settle(winner, winIdx, n) {
    spinning = false;
    lastWinner = winner;
    stopTicker();
    stageEl.classList.remove('spinning');
    stageEl.classList.add('won');
    if (wonTimer) clearTimeout(wonTimer);
    wonTimer = setTimeout(function () { stageEl.classList.remove('won'); }, 2600);

    spinBtn.disabled = false;
    spinBtn.removeAttribute('aria-busy');
    spinBtn.textContent = 'שוב!';

    /* הדגשת הפלח הזוכה */
    var segEls = segsG.querySelectorAll('.seg');
    var txtEls = labelsG.querySelectorAll('text');
    for (var i = 0; i < segEls.length; i++) {
      segEls[i].classList.toggle('win', i === winIdx);
      if (txtEls[i]) txtEls[i].classList.toggle('win', i === winIdx);
    }
    if (n > 1) {
      var seg = 360 / n;
      winOut.setAttribute('d', wedgePath(winIdx * seg, (winIdx + 1) * seg, R_OUT - 2));
    } else {
      winOut.setAttribute('d',
        'M 0 -' + (R_OUT - 2) + ' A ' + (R_OUT - 2) + ' ' + (R_OUT - 2) + ' 0 1 1 -0.01 -' + (R_OUT - 2) + ' Z');
    }
    rotor.classList.add('settled');

    rEmoji.textContent = winner.emoji;
    rText.textContent = winner.text;
    rQuip.textContent = QUIPS[randInt(QUIPS.length)];
    rCat.textContent = catEmoji(winner.cat) + ' ' + catName(winner.cat);
    resultEl.hidden = false;
    announce.textContent = 'יצא לכם: ' + winner.text + '. קטגוריה: ' + catName(winner.cat) + '.';

    if (!reduced()) {
      /* מפעילים מחדש את אנימציות הכניסה של הכרטיס */
      resultEl.style.animation = 'none';
      void resultEl.offsetWidth;
      resultEl.style.animation = '';
      confetti();
    }
    if (navigator.vibrate) { try { navigator.vibrate([18, 40, 26]); } catch (e) {} }
    fanfareSound();
  }

  /* ================================================================
   * 6ב. צליל — מסונתז ב-WebAudio, בלי קבצי מדיה
   * ================================================================ */

  var AC = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null;

  function soundOn() { return !state.soundOff; }

  function ac() {
    if (!AC || !soundOn()) return null;
    if (!audioCtx) { try { audioCtx = new AC(); } catch (e) { return null; } }
    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
    return audioCtx;
  }

  function blip(freq, at, dur, vol, type) {
    var c = ac();
    if (!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime + at);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + at);
      o.stop(c.currentTime + at + dur + 0.02);
    } catch (e) {}
  }

  function tickSound() { blip(2600, 0, 0.035, 0.05, 'square'); }
  function fanfareSound() {
    blip(523.25, 0,    0.28, 0.09);
    blip(659.25, 0.09, 0.28, 0.09);
    blip(783.99, 0.18, 0.34, 0.09);
    blip(1046.5, 0.30, 0.50, 0.11);
  }

  /* ================================================================
   * 6ג. רצ'ט — נקישה ובעיטת מחוג בכל תפר שחולף מתחת למחוג.
   * קוראים את הזווית האמיתית מתוך המטריצה של האנימציה, פריים-פריים,
   * כך שהנקישות מסונכרנות לפלחים באמת ולא מזויפות בטיימר.
   * ================================================================ */

  var pinEl = document.querySelector('.pin');
  var stageEl = document.querySelector('.stage');
  var tickRaf = null;

  function stopTicker() {
    if (tickRaf) { cancelAnimationFrame(tickRaf); tickRaf = null; }
  }

  function startTicker(n, fromRot) {
    stopTicker();
    if (!n) return;
    var seg = 360 / n;
    var prev = null;
    var acc = ((fromRot % 360) + 360) % 360;
    var lastAt = 0;

    function frame(ts) {
      var tr = getComputedStyle(rotor).transform, ang = null;
      if (tr && tr !== 'none') {
        var m = tr.match(/matrix\(([^)]+)\)/);
        if (m) {
          var v = m[1].split(',');
          ang = Math.atan2(parseFloat(v[1]), parseFloat(v[0])) * 180 / Math.PI;
        }
      }
      if (ang !== null) {
        if (prev !== null) {
          var d = ((ang - prev) % 360 + 360) % 360;
          if (d < 180) {                         /* הגלגל נע קדימה בלבד */
            var before = Math.floor(acc / seg);
            acc += d;
            if (Math.floor(acc / seg) > before && ts - lastAt > 40) {
              lastAt = ts;
              tickSound();
              pinEl.classList.remove('kick');
              void pinEl.offsetWidth;
              pinEl.classList.add('kick');
            }
          }
        }
        prev = ang;
      }
      tickRaf = spinning ? requestAnimationFrame(frame) : null;
    }
    tickRaf = requestAnimationFrame(frame);
  }

  /* ================================================================
   * 7. קונפטי
   * ================================================================ */

  var fx = document.getElementById('fx');
  var fxRaf = null;

  function confetti() {
    var ctx = fx.getContext && fx.getContext('2d');
    if (!ctx) return;
    if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = null; }

    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = window.innerWidth, h = window.innerHeight;
    fx.width = Math.round(w * dpr);
    fx.height = Math.round(h * dpr);
    fx.style.display = 'block';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var box = rotor.getBoundingClientRect();
    var ox = box.left + box.width / 2;
    var oy = box.top + box.height / 2;

    var parts = [];
    var count = 130;
    for (var i = 0; i < count; i++) {
      var ang = rand() * Math.PI * 2;
      var speed = 4 + rand() * 11;
      parts.push({
        x: ox, y: oy,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed - 5,
        size: 5 + rand() * 7,
        rot: rand() * Math.PI * 2,
        vr: (rand() - 0.5) * 0.35,
        color: PALETTE[randInt(PALETTE.length)],
        round: rand() < 0.35
      });
    }

    var DURATION = 2300;
    var start = null;

    function frame(ts) {
      if (start === null) start = ts;
      var t = ts - start;
      if (t > DURATION) {
        ctx.clearRect(0, 0, w, h);
        fx.style.display = 'none';
        fxRaf = null;
        return;
      }
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = t > DURATION - 600 ? Math.max(0, (DURATION - t) / 600) : 1;

      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.vy += 0.32;          /* כבידה */
        p.vx *= 0.992;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.round) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        }
        ctx.restore();
      }
      fxRaf = requestAnimationFrame(frame);
    }
    fxRaf = requestAnimationFrame(frame);
  }

  /* ================================================================
   * 8. טוסט
   * ================================================================ */

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* ================================================================
   * 9. שיתוף
   * ================================================================ */

  function shareText() {
    if (!lastWinner) return '';
    var t = 'מה לעשות היום? יצא לי: ' + lastWinner.emoji + ' ' + lastWinner.text;
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      t += '\n' + location.href;
    }
    return t;
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* כרטיס שיתוף מצויר בקנבס — 1080×1080, באותה שפה עיצובית של העמוד */

  function cardWrap(x, text, maxW) {
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var probe = line ? line + ' ' + words[i] : words[i];
      if (x.measureText(probe).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = probe;
    }
    if (line) lines.push(line);
    return lines.slice(0, 3);
  }

  function roundRectPath(x, rx, ry, w, h, r) {
    x.beginPath();
    x.moveTo(rx + r, ry);
    x.arcTo(rx + w, ry, rx + w, ry + h, r);
    x.arcTo(rx + w, ry + h, rx, ry + h, r);
    x.arcTo(rx, ry + h, rx, ry, r);
    x.arcTo(rx, ry, rx + w, ry, r);
    x.closePath();
  }

  function buildCardCanvas(w) {
    var c = document.createElement('canvas');
    c.width = 1080; c.height = 1080;
    var x = c.getContext('2d');

    var g = x.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, '#1a0f36'); g.addColorStop(.55, '#2d1560'); g.addColorStop(1, '#3d1c66');
    x.fillStyle = g;
    x.fillRect(0, 0, 1080, 1080);

    for (var i = 0; i < 42; i++) {          /* קונפטי סטטי */
      x.globalAlpha = 0.18 + rand() * 0.3;
      x.fillStyle = PALETTE[randInt(PALETTE.length)];
      x.beginPath();
      x.arc(rand() * 1080, rand() * 1080, 5 + rand() * 9, 0, Math.PI * 2);
      x.fill();
    }
    x.globalAlpha = 1;

    x.direction = 'rtl';
    x.textAlign = 'center';
    x.textBaseline = 'middle';

    x.fillStyle = '#FFC63C';
    x.font = "900 64px Rubik, Arial, sans-serif";
    x.fillText('מה לעשות היום?', 540, 130);

    x.save();
    x.shadowColor = 'rgba(9,3,28,.55)';
    x.shadowBlur = 60; x.shadowOffsetY = 22;
    x.fillStyle = '#ffffff';
    roundRectPath(x, 110, 220, 860, 640, 48);
    x.fill();
    x.restore();

    x.font = '200px "Segoe UI Emoji", "Noto Color Emoji", serif';
    x.fillText(w.emoji, 540, 400);

    x.fillStyle = '#241536';
    x.font = "900 72px Rubik, Arial, sans-serif";
    var lines = cardWrap(x, w.text, 780);
    var y0 = 590 - (lines.length - 1) * 44;
    for (var l = 0; l < lines.length; l++) x.fillText(lines[l], 540, y0 + l * 88);

    x.fillStyle = '#6d5d8d';
    x.font = "500 40px Rubik, Arial, sans-serif";
    x.fillText(catEmoji(w.cat) + ' ' + catName(w.cat), 540, 790);

    x.fillStyle = 'rgba(255,255,255,.75)';
    x.font = "500 36px Rubik, Arial, sans-serif";
    x.fillText('גלגל שמחליט בשבילכם ✨', 540, 960);

    return c;
  }

  function plainShare(text) {
    if (navigator.share) {
      var p;
      try { p = navigator.share({ title: 'מה לעשות היום', text: text }); } catch (e) { p = null; }
      if (p && typeof p.then === 'function') {
        p.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          copyFallback(text);
        });
        return;
      }
    }
    copyFallback(text);
  }

  function doShare() {
    if (!lastWinner) return;
    var text = shareText();

    /* עם תמונה איפה שאפשר, בלעדיה בכל מקום אחר */
    if (navigator.share && navigator.canShare && typeof File === 'function') {
      try {
        buildCardCanvas(lastWinner).toBlob(function (blob) {
          var sent = false;
          if (blob) {
            try {
              var f = new File([blob], 'מה-לעשות-היום.png', { type: 'image/png' });
              if (navigator.canShare({ files: [f] })) {
                sent = true;
                navigator.share({ files: [f], title: 'מה לעשות היום', text: text })
                  .catch(function (err) {
                    if (err && err.name === 'AbortError') return;
                    plainShare(text);
                  });
              }
            } catch (e) { sent = false; }
          }
          if (!sent) plainShare(text);
        }, 'image/png');
        return;
      } catch (e) { /* ממשיכים לנתיב הטקסט */ }
    }
    plainShare(text);
  }

  function copyFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast('הועתק! אפשר להדביק ולשלוח 📋'); },
        function () { toast(legacyCopy(text) ? 'הועתק! אפשר להדביק ולשלוח 📋' : 'לא הצלחנו להעתיק'); }
      );
      return;
    }
    toast(legacyCopy(text) ? 'הועתק! אפשר להדביק ולשלוח 📋' : 'לא הצלחנו להעתיק');
  }

  /* ================================================================
   * 10. שבבי קטגוריות + שורת המצב
   * ================================================================ */

  var catsEl = document.getElementById('cats');
  var poolNote = document.getElementById('poolNote');

  var chipEls = [];

  function renderChips() {
    catsEl.textContent = '';
    chipEls = CATS.map(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';

      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = c.emoji;
      b.appendChild(dot);
      b.appendChild(document.createTextNode(c.name));

      b.addEventListener('click', function () {
        toggleCat(c.id);
      });
      catsEl.appendChild(b);
      return b;
    });
    syncChips();
  }

  /* מעדכנים במקום ולא בונים מחדש — בנייה מחדש מאבדת את הפוקוס
     של מי שמנווט במקלדת, והשבב שנלחץ נעלם מתחת לאצבע. */
  function syncChips() {
    CATS.forEach(function (c, i) {
      var b = chipEls[i];
      if (!b) return;
      var on = !state.catsOff[c.id];
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', c.name + (on ? ' — פעילה, לחצו לכיבוי' : ' — כבויה, לחצו להפעלה'));
    });
  }

  function toggleCat(id) {
    if (state.catsOff[id]) delete state.catsOff[id];
    else state.catsOff[id] = true;
    save();
    syncChips();
    syncEditorCat(id);
    refreshPool();
  }

  function refreshPool() {
    var pool = activePool();
    poolNote.classList.toggle('warn', pool.length === 0);

    if (!pool.length) {
      poolNote.textContent = 'אין פעילויות פעילות. הפעילו קטגוריה או הוסיפו פעילות משלכם.';
      spinBtn.disabled = true;
      spinBtn.classList.remove('idle');
      renderWheel([]);
      return;
    }

    spinBtn.disabled = false;
    if (resultEl.hidden) spinBtn.classList.add('idle');

    poolNote.textContent = '';
    var b = document.createElement('b');
    b.textContent = pool.length;
    poolNote.appendChild(document.createTextNode('מגרילים מתוך '));
    poolNote.appendChild(b);
    poolNote.appendChild(document.createTextNode(' פעילויות'));
    if (pool.length > MAX_SEG) {
      poolNote.appendChild(document.createElement('br'));
      poolNote.appendChild(document.createTextNode(
        'הגלגל מציג ' + MAX_SEG + ' מועמדות אקראיות בכל סיבוב — לכולן סיכוי שווה'));
    }

    if (!spinning) renderWheel(pickCandidates(pool, null));
  }

  /* ================================================================
   * 11. עורך הרשימה
   * ================================================================ */

  var dlg       = document.getElementById('editor');
  var edGroups  = document.getElementById('edGroups');
  var addForm   = document.getElementById('addForm');
  var newText   = document.getElementById('newText');
  var newEmoji  = document.getElementById('newEmoji');
  var newCat    = document.getElementById('newCat');
  var picksEl   = document.getElementById('emojiPicks');

  function editorOpen() { return dlg.hasAttribute('open'); }

  function openEditor() {
    renderEditor();
    if (typeof dlg.showModal === 'function') {
      if (!dlg.open) dlg.showModal();
    } else {
      dlg.setAttribute('open', '');      /* דפדפנים ישנים בלי <dialog> */

  function fillCatSelect() {

  function fillEmojiPicks() {
    picksEl.textContent = '';
    QUICK_EMOJI.forEach(function (e) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = e;
      b.setAttribute('aria-label', 'בחירת האימוג\'י ' + e);
      b.addEventListener('click', function () { newEmoji.value = e; newText.focus(); });
      picksEl.appendChild(b);
    });
  }

  var catSwitches = {};

  function liveCount(catId) {
    return itemsOfCat(catId).filter(function (it) { return !state.disabled[it.id]; }).length;
  }

  function paintRow(li, tog, it, on) {
    li.classList.toggle('off', !on);
    tog.setAttribute('aria-checked', on ? 'true' : 'false');
    tog.setAttribute('aria-label', (on ? 'כיבוי' : 'הפעלת') + ' הפעילות ' + it.text);
    tog.textContent = on ? '✓' : '';
  }

  /* השבב והמתג בעורך מתארים את אותו מצב — מי שמשנה אחד מהם מסנכרן את השני */
  function syncEditorCat(catId) {
    var ref = catSwitches[catId];
    if (!ref || !ref.sw.isConnected) return;
    var on = !state.catsOff[catId];
    ref.sw.setAttribute('aria-checked', on ? 'true' : 'false');
    ref.grp.classList.toggle('off', !on);
  }

  function renderEditor() {
    edGroups.textContent = '';
    catSwitches = {};

    CATS.forEach(function (c) {
      var items = itemsOfCat(c.id);
      var catOn = !state.catsOff[c.id];
      var activeCount = items.filter(function (it) { return !state.disabled[it.id]; }).length;

      var grp = document.createElement('section');
      grp.className = 'grp' + (catOn ? '' : ' off');

      var head = document.createElement('div');
      head.className = 'grp-head';

      var sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'switch';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', catOn ? 'true' : 'false');
      sw.setAttribute('aria-label', 'הפעלת הקטגוריה ' + c.name);
      sw.addEventListener('click', function () { toggleCat(c.id); });
      catSwitches[c.id] = { sw: sw, grp: grp };

      var h3 = document.createElement('h3');
      h3.textContent = c.emoji + ' ' + c.name;

      var cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = activeCount + '/' + items.length;

      head.appendChild(sw);
      head.appendChild(h3);
      head.appendChild(cnt);
      grp.appendChild(head);

      var ul = document.createElement('ul');
      ul.className = 'items';

      items.forEach(function (it) {
        var on = !state.disabled[it.id];
        var li = document.createElement('li');
        if (!on) li.className = 'off';

        var tog = document.createElement('button');
        tog.type = 'button';
        tog.className = 'tog';
        tog.setAttribute('role', 'checkbox');
        tog.setAttribute('aria-checked', on ? 'true' : 'false');
        tog.setAttribute('aria-label', (on ? 'כיבוי' : 'הפעלת') + ' הפעילות ' + it.text);
        tog.textContent = on ? '✓' : '';
        tog.addEventListener('click', function () {
          var nowOff = !state.disabled[it.id];
          if (nowOff) state.disabled[it.id] = true;
          else delete state.disabled[it.id];
          save();
          paintRow(li, tog, it, !nowOff);
          cnt.textContent = liveCount(c.id) + '/' + itemsOfCat(c.id).length;
          refreshPool();
        });

        var em = document.createElement('span');
        em.className = 'em';
        em.textContent = it.emoji;

        var tx = document.createElement('span');
        tx.className = 'tx';
        tx.textContent = it.text;

        li.appendChild(tog);
        li.appendChild(em);
        li.appendChild(tx);

        if (it.custom) {
          var tag = document.createElement('span');
          tag.className = 'tag-new';
          tag.textContent = 'שלי';
          li.appendChild(tag);

          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'del';
          del.textContent = '🗑';
          del.setAttribute('aria-label', 'מחיקת הפעילות ' + it.text);
          del.addEventListener('click', function () {
            state.custom = state.custom.filter(function (x) { return x.id !== it.id; });
            delete state.disabled[it.id];
            save();
            var next = li.nextElementSibling || li.previousElementSibling;
            li.parentNode.removeChild(li);
            cnt.textContent = liveCount(c.id) + '/' + itemsOfCat(c.id).length;
            if (next) { var b = next.querySelector('.del') || next.querySelector('.tog'); if (b) b.focus(); }
            else sw.focus();
            refreshPool();
            toast('נמחק');
          });
          li.appendChild(del);
        }

        ul.appendChild(li);
      });

      grp.appendChild(ul);
      edGroups.appendChild(grp);
    });
  }

  function addCustom(e) {
    e.preventDefault();
    var text = newText.value.trim().replace(/\s+/g, ' ').slice(0, 46);
    if (!text) { newText.focus(); toast('צריך לכתוב מה לעשות 🙂'); return; }
    if (state.custom.length >= MAX_CUSTOM) { toast('הרשימה מלאה — מחקו משהו קודם'); return; }

    var cat = newCat.value;
    var emoji = newEmoji.value.trim().slice(0, 4) || catEmoji(cat);

    state.custom.push({ id: newId(), cat: cat, emoji: emoji, text: text, custom: true });
    save();

    newText.value = '';
    newEmoji.value = '✨';
    newText.focus();

    renderEditor();
    syncChips();
    refreshPool();
    toast('נוסף לרשימה ✨');
  }

  function resetAll() {
    if (!window.confirm('לאפס את הרשימה לברירת המחדל? כל הפעילויות שהוספתם יימחקו.')) return;
    storageDel();
    state = { disabled: {}, catsOff: {}, custom: [], soundOff: false };
    syncMute();
    resultEl.hidden = true;
    lastWinner = null;
    spinBtn.textContent = 'סובב!';
    renderChips();
    refreshPool();
    if (editorOpen()) renderEditor();
    toast('הרשימה אופסה ↺');
  }

  /* ================================================================
   * 12. חיווט
   * ================================================================ */

  spinBtn.addEventListener('click', function () { spin(null); });
  document.getElementById('againBtn').addEventListener('click', function () { spin(null); });
  document.getElementById('rerollBtn').addEventListener('click', function () {
    spin(lastWinner ? lastWinner.id : null);
  });
  document.getElementById('shareBtn').addEventListener('click', doShare);

  var muteBtn = document.getElementById('muteBtn');
  function syncMute() {
    muteBtn.textContent = soundOn() ? '🔊' : '🔇';
    muteBtn.setAttribute('aria-pressed', soundOn() ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', soundOn() ? 'השתקת צלילים' : 'הפעלת צלילים');
  }
  muteBtn.addEventListener('click', function () {
    state.soundOff = !state.soundOff;
    if (!state.soundOff) ac();
    save();
    syncMute();
  });

  /* הקשה על הגלגל עצמו מסובבת — הציר נשאר הכפתור הנגיש */
  rotor.addEventListener('click', function () {
    if (!spinning && !spinBtn.disabled) spin(null);
  });

  document.getElementById('editBtn').addEventListener('click', openEditor);
  document.getElementById('closeEd').addEventListener('click', closeEditor);
  document.getElementById('doneBtn').addEventListener('click', closeEditor);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  document.getElementById('resetBtn2').addEventListener('click', resetAll);
  addForm.addEventListener('submit', addCustom);

  /* רווח או Enter על הגלגל עצמו — נוח במקלדת */
  document.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Spacebar') return;
    if (editorOpen()) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON')) return;
    e.preventDefault();
    spin(null);
  });

  window.addEventListener('resize', function () {
    if (fx.style.display === 'block' && fxRaf) {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      fx.width = Math.round(window.innerWidth * dpr);
      fx.height = Math.round(window.innerHeight * dpr);
      fx.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  });

  /* ================================================================
   * 13. הפעלה
   * ================================================================ */

  load();

  (function initLeds() {
    var box = document.getElementById('leds');
    for (var i = 0; i < 24; i++) {
      var d = document.createElement('span');
      d.className = 'led';
      d.style.setProperty('--a', (i * 15) + 'deg');
      d.style.setProperty('--i', i);
      box.appendChild(d);
    }
  })();

  syncMute();
  fillCatSelect();
  fillEmojiPicks();
  renderChips();
  refreshPool();

  /* עוזר קטן לבדיקות אוטומטיות — לא משנה כלום בהתנהגות */
  window.__wheel = {
    pool: activePool,
    items: function () { return wheelItems; },
    rotation: function () { return rotation; },
    winner: function () { return lastWinner; },
    spinning: function () { return spinning; },
    card: function () {
      return buildCardCanvas(lastWinner || DEFAULTS[0]).toDataURL('image/png');
    }
  };

})();
</script>

</body>
</html>
