/* ------------------------------------------------------------------ *
 * מה לעשות היום — קובץ אחד, בלי שרת, בלי תלויות.                      *
 * ------------------------------------------------------------------ */

:root{
  --ink:#241536;
  --muted:#6d5d8d;
  --card:#ffffff;
  --accent:#FFC63C;
  --accent-2:#FF6B9D;
  --line:rgba(36,21,54,.12);
  --radius:22px;
  --shadow:0 18px 44px rgba(9,3,28,.42);
  --stage: min(88vw, 380px);
  --stage: min(88vw, 380px, 58svh);      /* אופקי בטלפון: הגובה הוא האילוץ */
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

/* הרקע יושב על <html> ולא על <body>: רקע קבוע על body נעצר בגובה החלון,
   וכל מה שמתחת לקיפול נשאר על לבן — כולל כפתורים לבנים. */
html{
  background:
    radial-gradient(1100px 620px at 50% -12%, #7a2fa0 0%, rgba(122,47,160,0) 62%),
    linear-gradient(168deg,#1a0f36 0%,#2d1560 52%,#3d1c66 100%) ,
    #2d1560;
  background-attachment:fixed, fixed, fixed;
  min-height:100%;
}

body{
  font-family:'Rubik','Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:#fff;
  min-height:100svh;
  overflow-x:hidden;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}

button{ font:inherit; color:inherit; touch-action:manipulation; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:12px; }

/* ---------- פריסה ---------- */

.wrap{
  width:100%; max-width:540px; margin-inline:auto;
  padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; gap:18px;
}

header{ text-align:center; }

h1{
  margin:0; font-size:clamp(28px,7.5vw,38px); font-weight:900; letter-spacing:-.5px;
  background:linear-gradient(92deg,#fff 10%,var(--accent) 55%,var(--accent-2) 95%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tagline{ margin:6px 0 0; font-size:15px; color:rgba(255,255,255,.72); }

/* ---------- שבבי קטגוריות ---------- */

.cats{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
  width:100%;
}
.chip{
  border:1.5px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.62);
  border-radius:999px; padding:7px 13px;
  font-size:13.5px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.chip:active{ transform:scale(.95); }
.chip[aria-pressed="true"]{
  background:rgba(255,255,255,.96); color:var(--ink);
  border-color:transparent; font-weight:700;
}
.chip .dot{ font-size:15px; line-height:1; }

/* ---------- כמה זמן יש לכם ---------- */

.timebar{
  display:flex; align-items:center; justify-content:center; gap:7px;
  flex-wrap:wrap; width:100%; margin-top:-6px;
}
.timebar .lbl{ font-size:13px; color:rgba(255,255,255,.55); font-weight:500; }
.time{
  border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.6);
  border-radius:999px; padding:6px 12px;
  font-size:13px; font-weight:600; cursor:pointer;
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.time:active{ transform:scale(.95); }
.time[aria-pressed="true"]{
  background:linear-gradient(135deg,#6C8CFF,#A855F7);
  color:#fff; border-color:transparent;
  box-shadow:0 5px 14px rgba(108,140,255,.35);
}

/* ---------- הגלגל ---------- */

.stage{
  position:relative;
  width:var(--stage); height:var(--stage);
  flex:none;
  margin-top:2px;
}

.bezel{
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,#FFC63C,#FF6B9D,#6C8CFF,#2FC4A5,#FFC63C);
  padding:10px;
  box-shadow:
    var(--shadow),
    inset 0 0 0 3px rgba(255,255,255,.28),
    0 0 60px rgba(255,198,60,.22);
}

.rotor{
  position:absolute; inset:10px; border-radius:50%;
  cursor:pointer;
  will-change:transform;
  transform:rotate(0deg);
  background:#fff;          /* מציץ מבעד לפלחים שהועמעמו — מבהיר ולא מלכלך */
  overflow:hidden;
}
.rotor svg{ display:block; width:100%; height:100%; }

.rotor text{
  direction:rtl;
  font-family:'Rubik','Assistant',system-ui,Arial,sans-serif;
  font-weight:700;
  fill:#1b1029;
  paint-order:stroke;
  stroke:rgba(255,255,255,.85);
  stroke-width:1.4px;
  stroke-linejoin:round;
  pointer-events:none;
  user-select:none;
}

.seg{ stroke:rgba(255,255,255,.5); stroke-width:1.2; transition:opacity .35s ease; }
.rotor.settled .seg{ opacity:.6; }
.rotor.settled .seg.win{ opacity:1; }

#winOutline{ fill:none; stroke:#fff; stroke-width:4; opacity:0; pointer-events:none; }
.rotor.settled #winOutline{ opacity:1; animation:winPulse 1.1s ease-out 2; }
@keyframes winPulse{ 0%,100%{ stroke-opacity:1 } 50%{ stroke-opacity:.35 } }

.rotor.settled text{ opacity:.85; transition:opacity .35s ease; }
.rotor.settled text.win{ opacity:1; }

/* מחוג */
.pin{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:36px; height:50px; z-index:5;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.5));
  pointer-events:none;
}
.pin svg{ display:block; width:100%; height:100%; transform-origin:50% 16%; }
.pin.kick svg{ animation:pinkick .13s ease-out; }
@keyframes pinkick{ 0%{ transform:rotate(0) } 35%{ transform:rotate(-13deg) } 100%{ transform:rotate(0) } }

/* ציר מרכזי — הוא כפתור הסיבוב */
.hub{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:29%; aspect-ratio:1; border-radius:50%;
  border:none; cursor:pointer; z-index:4;
  background:radial-gradient(circle at 32% 28%, #fff 0%, #ffe9b0 38%, var(--accent) 100%);
  color:#3a2205; font-weight:900; font-size:clamp(15px,4.4vw,20px);
  letter-spacing:-.3px;
  box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 6px rgba(255,255,255,.16);
  display:grid; place-items:center;
  transition:box-shadow .18s ease, filter .18s ease;
}
.hub:hover{ filter:brightness(1.05); }
.hub:active{ transform:translate(-50%,-50%) scale(.94); }
.hub[disabled]{ filter:grayscale(.65) brightness(.85); cursor:not-allowed; }
/* הזמנה ללחיצה — הילה פועמת ולא שינוי גודל, כדי שהכפתור לא "יזוז" */
.hub.idle{ animation:invite 2.6s ease-in-out infinite; }
@keyframes invite{
  0%,100%{ box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 6px rgba(255,255,255,.16); }
  50%    { box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 -4px 10px rgba(180,110,0,.35), 0 0 0 15px rgba(255,255,255,.06); }
}

.poolnote{
  margin:0; text-align:center; font-size:13px; line-height:1.6;
  color:rgba(255,255,255,.6); min-height:1.2em;
}
.poolnote b{ color:rgba(255,255,255,.9); font-weight:700; }
.poolnote.warn{ color:#FFD9A0; }

/* ---------- כרטיס תוצאה ---------- */

.result{
  width:100%; background:var(--card); color:var(--ink);
  border-radius:var(--radius); padding:22px 18px 18px;
  box-shadow:var(--shadow); text-align:center;
  animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{
  0%  { opacity:0; transform:scale(.72) translateY(14px); }
  60% { opacity:1; }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
.result[hidden]{ display:none; }

.result .kicker{
  margin:0; font-size:13px; font-weight:700; color:var(--muted);
  letter-spacing:.4px;
}
.result .emoji{
  font-size:clamp(52px,15vw,68px); line-height:1.1; margin:6px 0 2px;
  animation:bounceIn .7s cubic-bezier(.2,1.5,.4,1) both .1s;
}
@keyframes bounceIn{
  0%  { transform:scale(0) rotate(-25deg); }
  70% { transform:scale(1.22) rotate(6deg); }
  100%{ transform:scale(1) rotate(0); }
}
.result h2{
  margin:2px 0 4px; font-size:clamp(23px,6.4vw,30px); font-weight:900;
  line-height:1.25; letter-spacing:-.4px;
}
.result .cat{
  display:inline-block; margin:2px 0 16px; padding:4px 12px;
  background:rgba(36,21,54,.07); border-radius:999px;
  font-size:12.5px; font-weight:600; color:var(--muted);
}

.actions{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.actions .wide{ grid-column:1 / -1; }

.btn{
  border:none; border-radius:14px; padding:13px 12px; cursor:pointer;
  font-size:15px; font-weight:700; line-height:1.2;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s ease, filter .18s ease, background .18s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:linear-gradient(135deg,#6C8CFF,#A855F7); color:#fff; box-shadow:0 8px 18px rgba(108,140,255,.35); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-soft{ background:rgba(36,21,54,.07); color:var(--ink); }
.btn-soft:hover{ background:rgba(36,21,54,.12); }
.btn svg{ width:17px; height:17px; flex:none; }

/* ---------- פעולות תחתונות ---------- */

.tools{ display:flex; gap:9px; width:100%; }
.tools .btn{ flex:1; background:rgba(255,255,255,.11); color:#fff; border:1.5px solid rgba(255,255,255,.2); font-size:14.5px; }
.tools .btn:hover{ background:rgba(255,255,255,.18); }

footer{ font-size:12px; color:rgba(255,255,255,.55); text-align:center; line-height:1.7; }

/* ---------- דיאלוג עריכה ---------- */

dialog{
  width:min(94vw,560px); max-height:88svh; padding:0; border:none;
  border-radius:24px; color:var(--ink); background:var(--card);
  box-shadow:0 30px 70px rgba(0,0,0,.5);
  overflow:hidden;
}
dialog::backdrop{ background:rgba(12,4,32,.7); backdrop-filter:blur(3px); }
.dlg{ display:flex; flex-direction:column; max-height:88svh; }

.dlg-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 12px; border-bottom:1px solid var(--line); flex:none;
}
.dlg-head h2{ margin:0; font-size:19px; font-weight:900; }
.x{
  border:none; background:rgba(36,21,54,.07); color:var(--ink);
  width:36px; height:36px; border-radius:50%; font-size:19px; cursor:pointer; flex:none;
  display:grid; place-items:center;
}
.x:hover{ background:rgba(36,21,54,.14); }

.dlg-body{ overflow-y:auto; padding:14px 16px 6px; -webkit-overflow-scrolling:touch; }

.addform{
  display:grid; grid-template-columns:64px 1fr; gap:8px;
  background:rgba(108,140,255,.09); border:1.5px dashed rgba(108,140,255,.45);
  border-radius:16px; padding:12px; margin-bottom:16px;
}
.addform label{ font-size:12px; font-weight:700; color:var(--muted); grid-column:1 / -1; margin-bottom:-2px; }
.addform input, .addform select{
  font:inherit; font-size:15px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:11px; padding:10px;
  background:#fff; width:100%; min-width:0;
}
.addform input:focus, .addform select:focus{ outline:none; border-color:#6C8CFF; }
.addform .emoji-in{ text-align:center; font-size:20px; padding:9px 4px; }
.addform .row2{ grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr auto; gap:8px; }
.addform .editing-note{
  grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
  gap:8px; font-size:12.5px; font-weight:700; color:#4f46e5;
}
.addform .editing-note button{
  border:none; background:transparent; color:var(--muted);
  font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:underline; padding:2px 4px;
}
.addform .editing-note[hidden]{ display:none; }
.addform .btn{ background:linear-gradient(135deg,#6C8CFF,#A855F7); color:#fff; padding:11px 18px; }
.emoji-picks{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:5px; }
.emoji-picks button{
  border:none; background:rgba(36,21,54,.06); border-radius:9px;
  width:33px; height:33px; font-size:17px; cursor:pointer; line-height:1;
}
.emoji-picks button:hover{ background:rgba(36,21,54,.14); }

.search{
  position:relative; margin-bottom:14px;
}
.search input{
  font:inherit; font-size:15px; color:var(--ink); width:100%;
  border:1.5px solid var(--line); border-radius:12px; padding:11px 38px 11px 12px;
  background:#fff;
}
.search input:focus{ outline:none; border-color:#6C8CFF; }
.search::before{
  content:"🔎"; position:absolute; top:50%; right:12px; transform:translateY(-50%);
  font-size:14px; opacity:.5; pointer-events:none;
}
.no-results{
  text-align:center; color:var(--muted); font-size:14.5px; padding:26px 10px;
}

.grp{ margin-bottom:14px; }
.grp-head{
  display:flex; align-items:center; gap:9px;
  padding:8px 2px; border-bottom:1px solid var(--line); margin-bottom:4px;
}
.grp-head h3{ margin:0; font-size:15.5px; font-weight:800; flex:1; }
.grp-head .count{ font-size:12px; color:var(--muted); font-weight:600; }
.grp-head .bulk{
  border:none; background:rgba(36,21,54,.07); color:var(--muted);
  border-radius:8px; padding:5px 9px; font-size:11.5px; font-weight:700; cursor:pointer; flex:none;
}
.grp-head .bulk:hover{ background:rgba(36,21,54,.15); color:var(--ink); }
.grp.off .items{ opacity:.42; }

.switch{
  position:relative; width:44px; height:25px; border-radius:999px; flex:none;
  border:none; cursor:pointer; background:rgba(36,21,54,.2); transition:background .2s ease;
}
.switch::after{
  content:""; position:absolute; top:3px; right:3px; width:19px; height:19px;
  border-radius:50%; background:#fff; transition:transform .2s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch[aria-checked="true"]{ background:#34D399; }
.switch[aria-checked="true"]::after{ transform:translateX(-19px); }

.items{ list-style:none; margin:0; padding:0; }
.items li{
  display:flex; align-items:center; gap:10px; padding:8px 4px;
  border-bottom:1px solid rgba(36,21,54,.06);
}
.items li:last-child{ border-bottom:none; }
.items .tog{
  width:23px; height:23px; border-radius:7px; flex:none; cursor:pointer;
  border:2px solid rgba(36,21,54,.28); background:#fff;
  display:grid; place-items:center; font-size:14px; color:#fff; padding:0;
}
.items .tog[aria-checked="true"]{ background:#34D399; border-color:#34D399; }
.items .em{ font-size:19px; flex:none; width:24px; text-align:center; }
.items .tx{ flex:1; font-size:15px; line-height:1.35; word-break:break-word; }
.items li.off .tx, .items li.off .em{ opacity:.4; text-decoration:line-through; }
.items .del, .items .edit{
  border:none; background:transparent; cursor:pointer;
  font-size:16px; width:31px; height:31px; border-radius:9px; flex:none;
}
.items .del{ color:#e11d48; }
.items .del:hover{ background:rgba(225,29,72,.1); }
.items .edit{ color:#4f46e5; }
.items .edit:hover{ background:rgba(108,140,255,.14); }
.items .len{
  font-size:10.5px; font-weight:700; color:var(--muted);
  background:rgba(36,21,54,.06); border-radius:6px; padding:2px 6px; flex:none;
}
.tag-new{
  font-size:10.5px; font-weight:700; background:rgba(168,85,247,.14);
  color:#7c3aed; border-radius:6px; padding:2px 6px; flex:none;
}

.dlg-foot{
  flex:none; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); display:flex; gap:9px;
}
.dlg-foot{ flex-wrap:wrap; }
.dlg-foot .btn{ flex:1; min-width:120px; }
.btn-link{ background:rgba(108,140,255,.12); color:#4f46e5; }
.btn-link:hover{ background:rgba(108,140,255,.22); }
.btn-danger{ background:rgba(225,29,72,.1); color:#be123c; }
.btn-danger:hover{ background:rgba(225,29,72,.18); }

/* ---------- קונפטי + טוסט ---------- */

#fx{
  position:fixed; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:60; display:none;
}

#toast{
  position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px);
  background:rgba(20,10,40,.94); color:#fff; padding:9px 10px 9px 18px; border-radius:999px;
  font-size:14px; font-weight:600; z-index:70; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  max-width:92vw;
  display:flex; align-items:center; gap:10px;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }
#toast.has-undo{ pointer-events:auto; }
#toastText{ flex:1; text-align:center; }
#toastUndo{
  border:none; background:var(--accent); color:#3a2205; cursor:pointer;
  border-radius:999px; padding:7px 15px; font-size:13.5px; font-weight:800; flex:none;
}
#toastUndo:hover{ filter:brightness(1.07); }
#toastUndo[hidden]{ display:none; }

.noscript{
  background:#fff; color:var(--ink); border-radius:16px; padding:16px;
  font-size:15px; text-align:center; width:100%;
}

/* ---------- נורות קרנבל על המסגרת ---------- */

.leds{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.led{
  position:absolute; top:50%; left:50%; width:8px; height:8px; margin:-4px;
  border-radius:50%;
  background:#FFE9B0;
  box-shadow:0 0 7px 1.5px rgba(255,210,110,.8);
  transform:rotate(var(--a)) translateY(calc(var(--stage) / -2 + 5px));
  opacity:.5;
  animation:ledtwinkle 2.6s ease-in-out infinite;
  animation-delay:calc(var(--i) * .37s);
}
.stage.spinning .led{ animation:ledchase .55s linear infinite; animation-delay:calc(var(--i) * -0.023s); }
.stage.won .led{ animation:ledwin .3s ease-in-out 6; }
@keyframes ledtwinkle{ 0%,100%{ opacity:.3 } 50%{ opacity:.9 } }
@keyframes ledchase{ 0%{ opacity:.12 } 12%{ opacity:1 } 45%{ opacity:.12 } 100%{ opacity:.12 } }
@keyframes ledwin{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }

/* ---------- השתקה ---------- */

.mute{
  position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px; z-index:30;
  width:44px; height:44px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  font-size:20px; cursor:pointer; display:grid; place-items:center;
  transition:background .18s ease, transform .12s ease;
}
.mute:hover{ background:rgba(255,255,255,.18); }
.mute:active{ transform:scale(.92); }

/* ---------- משפט אווירה בכרטיס ---------- */

.result .quip{
  margin:-8px 0 14px; font-size:14px; font-weight:500;
  color:var(--muted); min-height:1.2em;
}

:root{ color-scheme:dark; }
dialog{ color-scheme:light; }

@media (min-width:560px){
  :root{ --stage:400px; }
  :root{ --stage: min(400px, 62svh); }
  .wrap{ padding-top:30px; gap:20px; }
}

/* טלפון שמוחזק לרוחב: הכותרת והשבבים דחפו את הגלגל אל מתחת לקיפול,
   אז הם מתכווצים לשורה אחת נגללת והגלגל נמדד לפי הגובה. */
@media (max-height: 520px) and (orientation: landscape){
  :root{ --stage: min(88vw, 380px, 46svh); }
  .wrap{ padding-top:10px; gap:10px; }
  h1{ font-size:22px; }
  .tagline{ display:none; }
  .cats{
    flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
    padding-bottom:3px; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; padding:5px 11px; font-size:12.5px; }
  .timebar{ margin-top:0; }
  .timebar .lbl{ display:none; }
  .time{ padding:4px 10px; font-size:12px; }
  .poolnote{ font-size:11.5px; }
  .mute{ width:38px; height:38px; font-size:17px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .hub.idle{ animation:none; }
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<button class="mute" id="muteBtn" type="button" aria-pressed="true" aria-label="השתקת צלילים">🔊</button>

<div class="wrap">

  <header>
    <h1>מה לעשות היום?</h1>
    <p class="tagline">אין לכם כוח להחליט? תנו לגלגל.</p>
  </header>

  <noscript>
    <p class="noscript">הגלגל צריך JavaScript כדי להסתובב. הפעילו אותו בדפדפן ונסו שוב 🙂</p>
  </noscript>

  <div class="cats" id="cats" role="group" aria-label="קטגוריות פעילות"></div>

  <div class="timebar" id="timebar" role="group" aria-label="כמה זמן יש לכם">
    <span class="lbl">כמה זמן יש לכם?</span>
  </div>

  <div class="stage">
    <div class="bezel" aria-hidden="true"></div>
    <div class="leds" id="leds" aria-hidden="true"></div>

    <div class="rotor" id="rotor" aria-hidden="true">

  var LENS = [
    { id: 's', name: 'עד חצי שעה',  short: 'קצרה',  emoji: '⏱️', takes: ['s'] },
    { id: 'm', name: 'עד שעתיים',   short: 'בינונית', emoji: '🕑', takes: ['s', 'm'] },

  function storageGet() {
    try { return window.localStorage.getItem(STORE_KEY); }

    try { window.localStorage.setItem(STORE_KEY, v); return true; }

    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}

  function sanitizeCustom(list) {
    if (!Array.isArray(list)) return [];
    var catIds = catIdSet();
    var known = {};
    DEFAULTS.forEach(function (d) { known[d.id] = true; });

    var out = [];
    list.slice(0, MAX_CUSTOM).forEach(function (it) {
      if (!it || typeof it.text !== 'string') return;
      var text = it.text.trim().replace(/\s+/g, ' ').slice(0, 46);
      if (!text) return;
      var id = (typeof it.id === 'string' && it.id.indexOf('c.') === 0 && !known[it.id]) ? it.id : newId();
      known[id] = true;
      out.push({
        id: id,
        cat: catIds[it.cat] ? it.cat : CATS[0].id,
        len: (it.len === 's' || it.len === 'm' || it.len === 'l') ? it.len : 'm',
        emoji: (typeof it.emoji === 'string' && it.emoji.trim()) ? it.emoji.trim().slice(0, 4) : '✨',
        text: text,
        custom: true
      });
    });
    return out;
  }

      data.disabled.forEach(function (id) { if (typeof id === 'string') next.disabled[id] = true; });
    }

      data.catsOff.forEach(function (id) { if (catIds[id]) next.catsOff[id] = true; });
    }
    if (typeof data.soundOff === 'boolean') next.soundOff = data.soundOff;
    next.custom = sanitizeCustom(data.custom);
    state = next;
  }

  function randInt(n) {                       /* מספר שלם אחיד ב-[0,n) */
    if (n <= 1) return 0;
    if (cryptoObj && cryptoObj.getRandomValues) {
      var limit = Math.floor(0x100000000 / n) * n;
      var buf = new Uint32Array(1), v;
      do { cryptoObj.getRandomValues(buf); v = buf[0]; } while (v >= limit);
      return v % n;
    }
    return Math.floor(Math.random() * n);
  }
  function rand() {                            /* מספר ב-[0,1) */
    if (cryptoObj && cryptoObj.getRandomValues) {
      var buf = new Uint32Array(1);
      cryptoObj.getRandomValues(buf);
      return buf[0] / 0x100000000;
    }
    return Math.random();
  }
  function shuffle(arr) {                      /* פישר-ייטס */
    for (var i = arr.length - 1; i > 0; i--) {

      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;

    return arr;
  }

    var maxChars = labelMax(n);
    var fontSize = labelSize(n);

      path.setAttribute('class', 'seg');

    stageEl.classList.remove('won');

    spinning = false;
    lastWinner = winner;
    stopTicker();
    stageEl.classList.remove('spinning');
    stageEl.classList.add('won');
    if (wonTimer) clearTimeout(wonTimer);
    wonTimer = setTimeout(function () { stageEl.classList.remove('won'); }, 2600);

    spinBtn.disabled = false;
    spinBtn.removeAttribute('aria-busy');
    spinBtn.textContent = 'שוב!';

    /* הדגשת הפלח הזוכה */
    var segEls = segsG.querySelectorAll('.seg');
    var txtEls = labelsG.querySelectorAll('text');
    for (var i = 0; i < segEls.length; i++) {
      segEls[i].classList.toggle('win', i === winIdx);
      if (txtEls[i]) txtEls[i].classList.toggle('win', i === winIdx);
    }
    if (n > 1) {
      var seg = 360 / n;

    }

    rEmoji.textContent = winner.emoji;
    rText.textContent = winner.text;
    rQuip.textContent = QUIPS[randInt(QUIPS.length)];
    rCat.textContent = catEmoji(winner.cat) + ' ' + catName(winner.cat);
    resultEl.hidden = false;
    announce.textContent = 'יצא לכם: ' + winner.text + '. קטגוריה: ' + catName(winner.cat) + '.';

    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }

      o.stop(c.currentTime + at + dur + 0.02);
    } catch (e) {}

  function fanfareSound() {
    blip(523.25, 0,    0.28, 0.09);
    blip(659.25, 0.09, 0.28, 0.09);
    blip(783.99, 0.18, 0.34, 0.09);
    blip(1046.5, 0.30, 0.50, 0.11);

   * קוראים את הזווית האמיתית מתוך המטריצה של האנימציה, פריים-פריים,
   * כך שהנקישות מסונכרנות לפלחים באמת ולא מזויפות בטיימר.

  var stageEl = document.querySelector('.stage');

    var box = rotor.getBoundingClientRect();
    var ox = box.left + box.width / 2;
    var oy = box.top + box.height / 2;

    var parts = [];
    var count = 130;
    for (var i = 0; i < count; i++) {
      var ang = rand() * Math.PI * 2;
      var speed = 4 + rand() * 11;
      parts.push({
        x: ox, y: oy,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed - 5,
        size: 5 + rand() * 7,
        rot: rand() * Math.PI * 2,
        vr: (rand() - 0.5) * 0.35,
        color: PALETTE[randInt(PALETTE.length)],
        round: rand() < 0.35

    var start = null;

    function frame(ts) {
      if (start === null) start = ts;
      var t = ts - start;

        fx.style.display = 'none';
        fxRaf = null;

      ctx.clearRect(0, 0, w, h);

        p.x += p.vx;
        p.y += p.vy;

        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;

  function cardWrap(x, text, maxW) {

      if (x.measureText(probe).width > maxW && line) { lines.push(line); line = words[i]; }

    x.arcTo(rx + w, ry + h, rx, ry + h, r);
    x.arcTo(rx, ry + h, rx, ry, r);
    x.arcTo(rx, ry, rx + w, ry, r);
    x.closePath();
  }

    g.addColorStop(0, '#1a0f36'); g.addColorStop(.55, '#2d1560'); g.addColorStop(1, '#3d1c66');

      x.globalAlpha = 0.18 + rand() * 0.3;
      x.fillStyle = PALETTE[randInt(PALETTE.length)];
      x.beginPath();
      x.arc(rand() * 1080, rand() * 1080, 5 + rand() * 9, 0, Math.PI * 2);
      x.fill();

    x.textAlign = 'center';
    x.textBaseline = 'middle';

    x.fillStyle = '#FFC63C';
    x.font = "900 64px Rubik, Arial, sans-serif";
    x.fillText('מה לעשות היום?', 540, 130);

    x.save();
    x.shadowColor = 'rgba(9,3,28,.55)';
    x.shadowBlur = 60; x.shadowOffsetY = 22;
    x.fillStyle = '#ffffff';
    roundRectPath(x, 110, 220, 860, 640, 48);
    x.fill();
    x.restore();

    x.fillText(w.emoji, 540, 400);

    x.fillStyle = '#241536';
    x.font = "900 72px Rubik, Arial, sans-serif";
    var lines = cardWrap(x, w.text, 780);
    var y0 = 590 - (lines.length - 1) * 44;
    for (var l = 0; l < lines.length; l++) x.fillText(lines[l], 540, y0 + l * 88);

    x.font = "500 40px Rubik, Arial, sans-serif";
    x.fillText(catEmoji(w.cat) + ' ' + catName(w.cat), 540, 790);

    x.font = "500 36px Rubik, Arial, sans-serif";
    x.fillText('גלגל שמחליט בשבילכם ✨', 540, 960);

    return c;
  }

  function plainShare(text) {
    if (navigator.share) {
      var p;
      try { p = navigator.share({ title: 'מה לעשות היום', text: text }); } catch (e) { p = null; }
      if (p && typeof p.then === 'function') {
        p.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          copyFallback(text);
        });
        return;
      }
    }
    copyFallback(text);
  }

  function doShare() {
    if (!lastWinner) return;
    var text = shareText();

    /* עם תמונה איפה שאפשר, בלעדיה בכל מקום אחר */
    if (navigator.share && navigator.canShare && typeof File === 'function') {
      try {
        buildCardCanvas(lastWinner).toBlob(function (blob) {
          var sent = false;
          if (blob) {
            try {
              var f = new File([blob], 'מה-לעשות-היום.png', { type: 'image/png' });
              if (navigator.canShare({ files: [f] })) {
                sent = true;
                navigator.share({ files: [f], title: 'מה לעשות היום', text: text })
                  .catch(function (err) {
                    if (err && err.name === 'AbortError') return;
                    plainShare(text);
                  });
              }
            } catch (e) { sent = false; }
          }
          if (!sent) plainShare(text);
        }, 'image/png');
        return;
      } catch (e) { /* ממשיכים לנתיב הטקסט */ }
    }
    plainShare(text);
  }

  function copyFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast('הועתק! אפשר להדביק ולשלוח 📋'); },
        function () { toast(legacyCopy(text) ? 'הועתק! אפשר להדביק ולשלוח 📋' : 'לא הצלחנו להעתיק'); }
      );
      return;
    }
    toast(legacyCopy(text) ? 'הועתק! אפשר להדביק ולשלוח 📋' : 'לא הצלחנו להעתיק');
  }

  /* ================================================================
   * 9ב. הרשימה כקישור — base64url של המצב, בתוך ה-hash
   * ================================================================ */

  function toB64Url(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64Url(str) {
    var b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function listLink() {
    var payload = snapshot();
    delete payload.soundOff;                 /* העדפת הצליל היא של המכשיר, לא של הרשימה */
    var base = location.href.split('#')[0];
    return base + '#l=' + toB64Url(JSON.stringify(payload));
  }

  function shareList() {
    var link;
    try { link = listLink(); } catch (e) { toast('לא הצלחנו לבנות קישור'); return; }
    if (link.length > 6000) toast('הקישור ארוך — יש אפליקציות שיקצצו אותו');
    var text = 'הנה רשימת הפעילויות שלי ל"מה לעשות היום":\n' + link;
    if (navigator.share) {
      var pr;
      try { pr = navigator.share({ title: 'מה לעשות היום', text: text }); } catch (e) { pr = null; }
      if (pr && typeof pr.then === 'function') {
        pr.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          copyFallback(link);
        });
        return;
      }
    }
    copyFallback(link);
  }

  /* קישור שהגיע מבחוץ מוצע, לא נכפה — מי שכבר בנה רשימה נשאל קודם */
  function readSharedLink() {
    var m = /(?:^|[#&])l=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
    if (!m) return false;

    var stripHash = function () {
      try { history.replaceState(null, '', location.href.split('#')[0]); }
      catch (e) { location.hash = ''; }
    };

    var data;
    try { data = JSON.parse(fromB64Url(m[1])); } catch (e) { data = null; }
    if (!data || typeof data !== 'object') { stripHash(); return false; }

    var mine = storageGet();
    if (mine && !window.confirm('מישהו שיתף איתכם רשימת פעילויות. להחליף את הרשימה שלכם?')) {
      stripHash();
      return false;
    }

    var before = mine;
    adopt(data);
    save();
    stripHash();
    setTimeout(function () {
      toast('נטענה רשימה משותפת ✨', before ? function () {
        var old;
        try { old = JSON.parse(before); } catch (e) { old = null; }
        if (!old) return;
        adopt(old);
        save();
        renderChips();
        refreshPool();
        if (editorOpen()) renderEditor();
        toast('חזרנו לרשימה שלכם');
      } : null);
    }, 60);
    return true;
  }

  /* ================================================================
   * 10. שבבי קטגוריות + שורת המצב
   * ================================================================ */

  var catsEl = document.getElementById('cats');
  var poolNote = document.getElementById('poolNote');

  var chipEls = [];

  function renderChips() {
    catsEl.textContent = '';
    chipEls = CATS.map(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';

      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = c.emoji;
      b.appendChild(dot);
      b.appendChild(document.createTextNode(c.name));

      b.addEventListener('click', function () {
        toggleCat(c.id);
      });
      catsEl.appendChild(b);
      return b;
    });
    syncChips();
  }

  /* מעדכנים במקום ולא בונים מחדש — בנייה מחדש מאבדת את הפוקוס
     של מי שמנווט במקלדת, והשבב שנלחץ נעלם מתחת לאצבע. */
  function syncChips() {
    CATS.forEach(function (c, i) {
      var b = chipEls[i];
      if (!b) return;
      var on = !state.catsOff[c.id];
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', c.name + (on ? ' — פעילה, לחצו לכיבוי' : ' — כבויה, לחצו להפעלה'));
    });
  }

  function toggleCat(id) {
    if (state.catsOff[id]) delete state.catsOff[id];
    else state.catsOff[id] = true;
    save();
    syncChips();
    syncEditorCat(id);
    refreshPool();
  }

  var timebarEl = document.getElementById('timebar');
  var timeEls = [];

  function renderTimes() {
    timeEls = LENS.map(function (L) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'time';
      b.textContent = L.emoji + ' ' + L.name;
      b.addEventListener('click', function () {
        if (timeBudget === L.id) return;
        timeBudget = L.id;
        syncTimes();
        refreshPool();
        if (editorOpen()) renderEditor();
      });
      timebarEl.appendChild(b);
      return b;
    });
    syncTimes();
  }

  function syncTimes() {
    LENS.forEach(function (L, i) {
      var on = timeBudget === L.id;
      timeEls[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      timeEls[i].setAttribute('aria-label',
        L.name + (on ? ' — נבחר' : ', לחצו כדי לסנן לפעילויות שנכנסות בזמן הזה'));
    });
  }

  function refreshPool() {
    var pool = activePool();
    poolNote.classList.toggle('warn', pool.length === 0);

    if (!pool.length) {
      /* להאשים את הגורם הנכון: מסנן הזמן או הקטגוריות */
      poolNote.textContent = (timeBudget !== 'l' && poolIgnoringTime().length)
        ? 'אף פעילות פעילה לא נכנסת בזמן שבחרתם. נסו טווח זמן גדול יותר.'
        : 'אין פעילויות פעילות. הפעילו קטגוריה או הוסיפו פעילות משלכם.';
      spinBtn.disabled = true;
      spinBtn.classList.remove('idle');
      renderWheel([]);
      return;
    }

    spinBtn.disabled = false;
    if (resultEl.hidden) spinBtn.classList.add('idle');

    poolNote.textContent = '';
    var b = document.createElement('b');
    b.textContent = pool.length;
    poolNote.appendChild(document.createTextNode('מגרילים מתוך '));
    poolNote.appendChild(b);
    poolNote.appendChild(document.createTextNode(
      ' פעילויות' + (timeBudget === 'l' ? '' : ' שנכנסות ב' + lenById(timeBudget).name)));
    if (pool.length > MAX_SEG) {
      poolNote.appendChild(document.createElement('br'));
      poolNote.appendChild(document.createTextNode(
        'הגלגל מציג ' + MAX_SEG + ' מועמדות אקראיות בכל סיבוב — לכולן סיכוי שווה'));
    }

    if (!spinning) renderWheel(pickCandidates(pool, null));
  }

  /* ================================================================
   * 11. עורך הרשימה

  var dlg       = document.getElementById('editor');
  var edGroups  = document.getElementById('edGroups');
  var addForm   = document.getElementById('addForm');
  var newText   = document.getElementById('newText');
  var newEmoji  = document.getElementById('newEmoji');
  var newCat    = document.getElementById('newCat');
  var picksEl   = document.getElementById('emojiPicks');
  var edSearch  = document.getElementById('edSearch');
  var newLen    = document.getElementById('newLen');
  var addBtn    = document.getElementById('addBtn');
  var editNote  = document.getElementById('editNote');
  var query     = '';
  var editingId = null;

  function editorOpen() { return dlg.hasAttribute('open'); }

  /* דיאלוג מודאלי יושב ב-top layer, מעל כל z-index שהוא. הטוסט צויר מתחתיו,
     כלומר כפתור "בטל" של מחיקה — שקורית דווקא בתוך העורך — לא היה לחיץ.
     מעבירים את הטוסט פנימה כל עוד העורך פתוח, וחזרה החוצה בסגירה. */
  function moveToast(intoDialog) {
    var host = intoDialog ? dlg : document.body;
    if (toastEl.parentNode !== host) host.appendChild(toastEl);
  }

  function openEditor() {
    query = '';
    edSearch.value = '';
    stopEdit();
    renderEditor();
    if (typeof dlg.showModal === 'function') {
      if (!dlg.open) dlg.showModal();
    } else {
      dlg.setAttribute('open', '');      /* דפדפנים ישנים בלי <dialog> */
    }
    moveToast(true);
    newText.focus();
  }
  function closeEditor() {
    if (typeof dlg.close === 'function' && dlg.open) dlg.close();
    else dlg.removeAttribute('open');
    moveToast(false);
  }

  /* Esc סוגר את הדיאלוג בלי לעבור דרך closeEditor */
  dlg.addEventListener('close', function () { moveToast(false); });

  function fillCatSelect() {
    newCat.textContent = '';
    CATS.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.emoji + ' ' + c.name;
      newCat.appendChild(o);
    });
    newLen.textContent = '';
    LENS.forEach(function (L) {
      var o = document.createElement('option');
      o.value = L.id;
      o.textContent = L.emoji + ' ' + L.short;
      newLen.appendChild(o);
    });
    newLen.value = 'm';
  }

  /* עריכה משתמשת באותו טופס כמו ההוספה — אותו בורר אימוג'י, אותן קטגוריות */
  function startEdit(it) {
    editingId = it.id;
    newText.value = it.text;
    newEmoji.value = it.emoji;
    newCat.value = it.cat;
    newLen.value = it.len || 'm';
    addBtn.textContent = 'שמור';
    editNote.hidden = false;
    newText.focus();
    newText.select();
    if (editNote.scrollIntoView) editNote.scrollIntoView({ block: 'nearest' });
  }

  function stopEdit() {
    editingId = null;
    newText.value = '';
    newEmoji.value = '✨';
    newLen.value = 'm';
    addBtn.textContent = 'הוסף';
    editNote.hidden = true;
  }

  function fillEmojiPicks() {
    picksEl.textContent = '';
    QUICK_EMOJI.forEach(function (e) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = e;
      b.setAttribute('aria-label', 'בחירת האימוג\'י ' + e);
      b.addEventListener('click', function () { newEmoji.value = e; newText.focus(); });
      picksEl.appendChild(b);
    });
  }

  var catSwitches = {};

  function liveCount(catId) {
    return itemsOfCat(catId).filter(function (it) { return !state.disabled[it.id]; }).length;
  }

  function paintRow(li, tog, it, on) {
    li.classList.toggle('off', !on);
    tog.setAttribute('aria-checked', on ? 'true' : 'false');
    tog.setAttribute('aria-label', (on ? 'כיבוי' : 'הפעלת') + ' הפעילות ' + it.text);
    tog.textContent = on ? '✓' : '';
  }

  /* השבב והמתג בעורך מתארים את אותו מצב — מי שמשנה אחד מהם מסנכרן את השני */
  function syncEditorCat(catId) {
    var ref = catSwitches[catId];
    if (!ref || !ref.sw.isConnected) return;
    var on = !state.catsOff[catId];
    ref.sw.setAttribute('aria-checked', on ? 'true' : 'false');
    ref.grp.classList.toggle('off', !on);
  }

  function renderEditor() {
    edGroups.textContent = '';
    catSwitches = {};
    var q = query.trim().toLowerCase();
    var shown = 0;

    CATS.forEach(function (c) {
      var all = itemsOfCat(c.id);
      var items = q
        ? all.filter(function (it) { return it.text.toLowerCase().indexOf(q) >= 0; })
        : all;
      if (q && !items.length) return;
      shown += items.length;
      var catOn = !state.catsOff[c.id];
      var activeCount = items.filter(function (it) { return !state.disabled[it.id]; }).length;

      var grp = document.createElement('section');
      grp.className = 'grp' + (catOn ? '' : ' off');

      var head = document.createElement('div');
      head.className = 'grp-head';

      var sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'switch';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', catOn ? 'true' : 'false');
      sw.setAttribute('aria-label', 'הפעלת הקטגוריה ' + c.name);
      sw.addEventListener('click', function () { toggleCat(c.id); });
      catSwitches[c.id] = { sw: sw, grp: grp };

      var h3 = document.createElement('h3');
      h3.textContent = c.emoji + ' ' + c.name;

      var cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = liveCount(c.id) + '/' + all.length;

      /* עשר לחיצות כדי לכבות קטגוריה שלמה זה יותר מדי */
      var bulk = document.createElement('button');
      bulk.type = 'button';
      bulk.className = 'bulk';
      var allOn = all.every(function (it) { return !state.disabled[it.id]; });
      bulk.textContent = allOn ? 'נקה' : 'הכול';
      bulk.setAttribute('aria-label',
        (allOn ? 'כיבוי כל הפעילויות בקטגוריית ' : 'הפעלת כל הפעילויות בקטגוריית ') + c.name);
      bulk.addEventListener('click', function () {
        all.forEach(function (it) {
          if (allOn) state.disabled[it.id] = true;
          else delete state.disabled[it.id];
        });
        save();
        renderEditor();
        refreshPool();
      });

      head.appendChild(sw);
      head.appendChild(h3);
      head.appendChild(cnt);
      head.appendChild(bulk);
      grp.appendChild(head);

      var ul = document.createElement('ul');
      ul.className = 'items';

      items.forEach(function (it) {
        var on = !state.disabled[it.id];
        var li = document.createElement('li');
        if (!on) li.className = 'off';

        var tog = document.createElement('button');
        tog.type = 'button';
        tog.className = 'tog';
        tog.setAttribute('role', 'checkbox');
        tog.setAttribute('aria-checked', on ? 'true' : 'false');
        tog.setAttribute('aria-label', (on ? 'כיבוי' : 'הפעלת') + ' הפעילות ' + it.text);
        tog.textContent = on ? '✓' : '';
        tog.addEventListener('click', function () {
          var nowOff = !state.disabled[it.id];
          if (nowOff) state.disabled[it.id] = true;
          else delete state.disabled[it.id];
          save();
          paintRow(li, tog, it, !nowOff);
          cnt.textContent = liveCount(c.id) + '/' + itemsOfCat(c.id).length;
          refreshPool();
        });

        var em = document.createElement('span');
        em.className = 'em';
        em.textContent = it.emoji;

        var tx = document.createElement('span');
        tx.className = 'tx';
        tx.textContent = it.text;

        var lenTag = document.createElement('span');
        lenTag.className = 'len';
        lenTag.textContent = lenById(it.len || 'm').short;

        li.appendChild(tog);
        li.appendChild(em);
        li.appendChild(tx);
        li.appendChild(lenTag);

        if (it.custom) {
          var tag = document.createElement('span');
          tag.className = 'tag-new';
          tag.textContent = 'שלי';
          li.appendChild(tag);

          var edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'edit';
          edit.textContent = '✏️';
          edit.setAttribute('aria-label', 'עריכת הפעילות ' + it.text);
          edit.addEventListener('click', function () { startEdit(it); });
          li.appendChild(edit);

          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'del';
          del.textContent = '🗑';
          del.setAttribute('aria-label', 'מחיקת הפעילות ' + it.text);
          del.addEventListener('click', function () {
            var at = state.custom.findIndex
              ? state.custom.findIndex(function (x) { return x.id === it.id; })
              : -1;
            var wasOff = !!state.disabled[it.id];
            state.custom = state.custom.filter(function (x) { return x.id !== it.id; });
            delete state.disabled[it.id];
            if (editingId === it.id) stopEdit();
            save();
            var next = li.nextElementSibling || li.previousElementSibling;
            li.parentNode.removeChild(li);
            cnt.textContent = liveCount(c.id) + '/' + itemsOfCat(c.id).length;
            if (next) { var b = next.querySelector('.del') || next.querySelector('.tog'); if (b) b.focus(); }
            else sw.focus();
            refreshPool();
            toast('"' + it.text + '" נמחקה', function () {
              state.custom.splice(at < 0 ? state.custom.length : at, 0, it);
              if (wasOff) state.disabled[it.id] = true;
              save();
              if (editorOpen()) renderEditor();
              syncChips();
              refreshPool();
            });
          });
          li.appendChild(del);
        }

        ul.appendChild(li);
      });

      grp.appendChild(ul);
      edGroups.appendChild(grp);
    });

    if (q && !shown) {
      var none = document.createElement('p');
      none.className = 'no-results';
      none.textContent = 'לא נמצאה פעילות עם "' + query.trim() + '"';
      edGroups.appendChild(none);
    }
  }

  function addCustom(e) {
    e.preventDefault();
    var text = newText.value.trim().replace(/\s+/g, ' ').slice(0, 46);
    if (!text) { newText.focus(); toast('צריך לכתוב מה לעשות 🙂'); return; }

    var clash = allItems().some(function (it) {
      return it.id !== editingId && it.text.toLowerCase() === text.toLowerCase();
    });
    if (clash) { newText.focus(); newText.select(); toast('כבר יש פעילות כזאת ברשימה'); return; }

    var cat = newCat.value;
    var len = newLen.value;
    var emoji = newEmoji.value.trim().slice(0, 4) || catEmoji(cat);

    if (editingId) {
      var target = null;
      state.custom.forEach(function (it) { if (it.id === editingId) target = it; });
      if (target) {
        target.text = text; target.cat = cat; target.len = len; target.emoji = emoji;
        save();
        stopEdit();
        renderEditor();
        syncChips();
        refreshPool();
        toast('נשמר ✏️');
        return;
      }
      stopEdit();                       /* נמחק בינתיים — נופלים חזרה להוספה */
    }

    if (state.custom.length >= MAX_CUSTOM) { toast('הרשימה מלאה — מחקו משהו קודם'); return; }

    state.custom.push({ id: newId(), cat: cat, len: len, emoji: emoji, text: text, custom: true });
    save();
    stopEdit();
    newText.focus();

    renderEditor();
    syncChips();
    refreshPool();
    toast('נוסף לרשימה ✨');
  }

  function resetAll() {
    if (!window.confirm('לאפס את הרשימה לברירת המחדל? כל הפעילויות שהוספתם יימחקו.')) return;
    var before = snapshot();
    storageDel();
    state = { disabled: {}, catsOff: {}, custom: [], soundOff: false };
    syncMute();
    resultEl.hidden = true;
    lastWinner = null;
    spinBtn.textContent = 'סובב!';
    renderChips();
    refreshPool();
    if (editorOpen()) renderEditor();
    toast('הרשימה אופסה ↺', function () {
      adopt(before);
      save();
      syncMute();
      renderChips();
      refreshPool();
      if (editorOpen()) renderEditor();
      toast('הרשימה שוחזרה');
    });
  }

  /* ================================================================
   * 12. חיווט
   * ================================================================ */

  spinBtn.addEventListener('click', function () { spin(null); });
  document.getElementById('againBtn').addEventListener('click', function () { spin(null); });
  document.getElementById('rerollBtn').addEventListener('click', function () {
    spin(lastWinner ? lastWinner.id : null);
  });
  document.getElementById('shareBtn').addEventListener('click', doShare);

  var muteBtn = document.getElementById('muteBtn');
  function syncMute() {
    muteBtn.textContent = soundOn() ? '🔊' : '🔇';
    muteBtn.setAttribute('aria-pressed', soundOn() ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', soundOn() ? 'השתקת צלילים' : 'הפעלת צלילים');
  }
  muteBtn.addEventListener('click', function () {
    state.soundOff = !state.soundOff;
    if (!state.soundOff) ac();
    save();
    syncMute();
  });

  /* הקשה על הגלגל עצמו מסובבת — הציר נשאר הכפתור הנגיש */
  rotor.addEventListener('click', function () {
    if (!spinning && !spinBtn.disabled) spin(null);
  });

  document.getElementById('editBtn').addEventListener('click', openEditor);
  document.getElementById('closeEd').addEventListener('click', closeEditor);
  document.getElementById('doneBtn').addEventListener('click', closeEditor);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  document.getElementById('resetBtn2').addEventListener('click', resetAll);
  document.getElementById('shareListBtn').addEventListener('click', shareList);

  document.getElementById('cancelEdit').addEventListener('click', stopEdit);

  edSearch.addEventListener('input', function () {
    query = edSearch.value;
    renderEditor();
  });
  addForm.addEventListener('submit', addCustom);

  /* רווח או Enter על הגלגל עצמו — נוח במקלדת */
  document.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Spacebar') return;
    if (editorOpen()) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON')) return;
    e.preventDefault();
    spin(null);
  });

  window.addEventListener('resize', function () {
    if (fx.style.display === 'block' && fxRaf) {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      fx.width = Math.round(window.innerWidth * dpr);
      fx.height = Math.round(window.innerHeight * dpr);
      fx.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  });

  /* ================================================================
   * 13. הפעלה
   * ================================================================ */

  load();
  readSharedLink();

  (function initLeds() {
    var box = document.getElementById('leds');
    for (var i = 0; i < 24; i++) {
      var d = document.createElement('span');
      d.className = 'led';
      d.style.setProperty('--a', (i * 15) + 'deg');
      d.style.setProperty('--i', i);
      box.appendChild(d);
    }
  })();

  syncMute();
  fillCatSelect();
  renderTimes();
  fillEmojiPicks();
  renderChips();
  refreshPool();

  /* עוזר קטן לבדיקות אוטומטיות — לא משנה כלום בהתנהגות */
  window.__wheel = {
    pool: activePool,
    items: function () { return wheelItems; },
    rotation: function () { return rotation; },
    winner: function () { return lastWinner; },
    spinning: function () { return spinning; },
    card: function () {
      return buildCardCanvas(lastWinner || DEFAULTS[0]).toDataURL('image/png');
    },
    link: listLink,
    custom: function () { return state.custom.slice(); },
    time: function () { return timeBudget; }
  };

})();
</script>

</body>
</html>
