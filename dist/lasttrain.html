<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="description" content="THE LAST TRAIN — a first-person psychological horror game about the 00:47 service, and whether to get off.">
<title>THE LAST TRAIN</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2305070a'/><rect x='9' y='6' width='14' height='17' rx='3' fill='none' stroke='%23ffb03a' stroke-width='2'/><rect x='12' y='10' width='8' height='5' fill='%23ffb03a'/><path d='M11 27l3-4M21 27l-3-4' stroke='%23ffb03a' stroke-width='2' stroke-linecap='round'/></svg>">
<style>
/*
 * styles.css — everything outside the canvas.
 *
 * The whole interface is built to look like it belongs to the train rather
 * than to the game: enamel signage, dot-matrix amber, the condensed sans that
 * transit authorities have used since the sixties. There is no health bar,
 * no objective marker and no inventory, because the game has none of those
 * things and the interface should not imply otherwise.
 */

:root {
  --ink: #e8ecef;
  --ink-dim: #9aa4ae;
  --ink-faint: #5c666f;
  --amber: #ffb03a;
  --amber-dim: #a8712a;
  --red: #c8402c;
  --bg: #05070a;
  --panel: rgba(8, 10, 13, 0.90);
  --line: rgba(160, 176, 190, 0.16);
  --sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
  --cond: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --hud-scale: 1;
}

* { box-sizing: border-box; }

/*
 * The `hidden` attribute, restored.
 *
 * The user agent hides [hidden] with a `display: none` that any author rule
 * setting `display` outranks — and .overlay sets `display: grid`, .prompt sets
 * `display: flex`. The document overlay is `position: absolute; inset: 0` with
 * `background: rgba(2,3,5,0.72)` and `backdrop-filter: blur(2px)`, so for the
 * whole life of the game it has been sitting over the carriage: every frame
 * darkened by nearly three quarters and blurred by two pixels, with the HUD,
 * the passengers and the entire train underneath it. Everything about the
 * picture that looked like a rendering fault was this one line.
 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  overscroll-behavior: none;
}

body { cursor: default; }
body.playing { cursor: none; }

#app {
  position: fixed;
  inset: 0;
  isolation: isolate;
}

#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

/* A fine static overlay over the DOM layers too, so menus sit in the same
   air as the game rather than floating in front of it. */
.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  z-index: 90;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}

/* ---------- HUD ---------- */

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  font-size: calc(16px * var(--hud-scale));
}

.crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 26px;
  height: 26px;
  margin: -13px 0 0 -13px;
  display: grid;
  place-items: center;
}

.crosshair span {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(232, 236, 239, 0.55);
  box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  transition: width 140ms ease, height 140ms ease, background 140ms ease, opacity 140ms ease;
}

.crosshair.hot span {
  width: 9px;
  height: 9px;
  background: transparent;
  border: 1px solid rgba(255, 176, 58, 0.85);
  border-radius: 50%;
}

.crosshair.hidden span { opacity: 0; }

/*
 * The interaction prompt. It used to be thin uppercase text with a shadow,
 * floating on whatever happened to be behind it — which in a carriage is a
 * white wall about half the time, and it vanished. It has a plate now, and it
 * is a third larger.
 */
.prompt {
  position: absolute;
  left: 50%;
  top: calc(50% + 42px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 0.6em;
  padding: 0.42em 0.9em 0.42em 0.55em;
  background: rgba(6, 8, 11, 0.72);
  border: 1px solid rgba(255, 176, 58, 0.28);
  border-radius: 4px;
  backdrop-filter: blur(3px);
  font-family: var(--cond);
  font-size: 1.22em;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 120ms ease;
}
.prompt.show { opacity: 1; }
.prompt .key {
  display: inline-block;
  min-width: 1.9em;
  padding: 0.14em 0.4em;
  border: 1px solid rgba(255, 176, 58, 0.75);
  border-radius: 4px;
  background: rgba(255, 176, 58, 0.14);
  color: var(--amber);
  font-size: 0.82em;
  font-weight: 700;
  text-align: center;
}
.prompt .label { color: rgba(255, 255, 255, 0.72); }

/*
 * Hints. Bottom-left, out of the way of the subtitles, and written in the same
 * voice as everything else. They appear once, on a first run, and can be
 * turned off — but the game does have to say what its one rule is, because
 * nothing else in it ever will.
 */
.hints {
  position: absolute;
  left: 3.2vw;
  bottom: 4vh;
  display: flex;
  flex-direction: column;
  gap: 0.5em;
  max-width: min(46ch, 42vw);
}
/* Scoped to .hints on purpose — the menu buttons already have a `.hint`
   subtitle span of their own and must not pick up the plate. */
.hints .hint {
  padding: 0.7em 1.05em;
  background: rgba(6, 8, 11, 0.82);
  border-left: 2px solid var(--amber);
  color: var(--ink);
  font-size: 1.02rem;
  line-height: 1.5;
  text-shadow: 0 1px 3px #000;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55);
  animation: hintIn 420ms ease both;
}
.hints .hint .keys {
  display: block;
  font-family: var(--cond);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-size: 0.8em;
  color: var(--amber);
  margin-bottom: 0.3em;
}
.hints .hint.leaving { animation: fadeOut 500ms ease both; }
@keyframes hintIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

/*
 * The instructions page. Two columns on anything wide enough, because a player
 * who has to scroll to find the key that opens a door is a player who does not
 * find it.
 */
.howto { display: grid; gap: 2.2em 4vw; align-items: start; }
@media (min-width: 900px) { .howto { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
.howto h3 {
  font-family: var(--cond);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  font-size: 0.74rem;
  color: var(--amber-dim);
  margin: 1.5em 0 0.9em;
}
.howto > div > h3:first-child { margin-top: 0; }
.howto .rule { margin-top: 0; }

/* The controls list: a plain two-column list. */
.controls { display: grid; grid-template-columns: max-content 1fr; gap: 0.5em 1.4em; max-width: 66ch; align-items: baseline; }
.controls dt {
  font-family: var(--cond);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-size: 0.86rem;
  color: var(--amber);
  white-space: nowrap;
}
.controls dd { margin: 0; color: var(--ink-dim); font-size: 0.95rem; line-height: 1.5; }
.rule {
  max-width: 62ch;
  margin: 2.6em 0 0;
  padding: 1.0em 1.2em;
  border: 1px solid var(--line);
  border-left: 2px solid var(--amber);
  background: rgba(255, 176, 58, 0.04);
  line-height: 1.7;
  color: var(--ink);
}
.rule strong { color: var(--amber); font-weight: 400; }
.rule p { margin: 0 0 0.7em; }
.rule p:last-child { margin-bottom: 0; }
.fineprint { max-width: 62ch; margin: 1.8em 0 0; color: var(--ink-faint); font-size: 0.88rem; line-height: 1.6; }

.captions {
  position: absolute;
  left: 50%;
  bottom: 7vh;
  transform: translateX(-50%);
  width: min(74ch, 84vw);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.35em;
  align-items: center;
}

.caption {
  display: inline-block;
  padding: 0.22em 0.7em;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 2px;
  font-size: calc(1.02em * var(--sub-scale, 1));
  line-height: 1.35;
  color: var(--ink);
  text-shadow: 0 1px 3px #000;
  animation: fadeUp 240ms ease both;
}
.caption.sound { color: var(--ink-dim); font-style: italic; }
.caption.whisper { color: #cdbfd6; font-style: italic; letter-spacing: 0.04em; }
.caption.announcement { color: var(--amber); }
.caption.announcement::before { content: "◄ "; opacity: 0.7; }
.caption.speech { color: #dfe6ec; }
.caption.leaving { animation: fadeOut 320ms ease both; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; } }

.toasts {
  position: absolute;
  right: 3vw;
  bottom: 4vh;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.5em;
}

.toast {
  border-left: 2px solid var(--amber);
  background: rgba(6, 8, 11, 0.82);
  padding: 0.5em 0.9em;
  min-width: 15ch;
  animation: slideIn 300ms ease both;
}
.toast .kind {
  font-family: var(--cond);
  font-size: 0.68em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber-dim);
}
.toast .name { font-size: 0.92em; color: var(--ink); }
.toast.leaving { animation: slideOut 380ms ease both; }

@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { to { opacity: 0; transform: translateX(18px); } }

/* The station name, when the train stops. Enamel sign, not a UI element. */
.stationcard {
  position: absolute;
  left: 50%;
  top: 16vh;
  transform: translateX(-50%);
  text-align: center;
  animation: signIn 900ms ease both;
}
.stationcard .name {
  font-family: var(--cond);
  font-size: 3.1em;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(240, 244, 248, 0.92);
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.9);
}
.stationcard .sub {
  font-family: var(--cond);
  font-size: 0.85em;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 0.4em;
}
.stationcard.leaving { animation: fadeOut 700ms ease both; }
@keyframes signIn { from { opacity: 0; letter-spacing: 0.34em; } to { opacity: 1; } }

/* ---------- document overlay ---------- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  background: rgba(2, 3, 5, 0.72);
  backdrop-filter: blur(2px);
  animation: fadeIn 180ms ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay.leaving { animation: fadeOut 180ms ease both; }

.document {
  width: min(58ch, 88vw);
  max-height: 82vh;
  overflow-y: auto;
  padding: 2.4em 2.6em;
  background: #ddd8c9;
  color: #191919;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
  transform: rotate(-0.25deg);
  line-height: 1.55;
  font-size: 1.02em;
}
.document.dark { background: #0d1014; color: #d8dee4; }
.document h2 {
  margin: 0 0 1.1em;
  font-family: var(--cond);
  font-size: 0.78em;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #6b6a60;
  font-weight: 700;
}
.document p { margin: 0 0 0.9em; }
.document .card-head { font-family: var(--cond); letter-spacing: 0.3em; font-size: 0.8em; color: #4a4a44; }
.document .card-name { font-family: var(--cond); font-size: 1.6em; letter-spacing: 0.08em; margin: 0.2em 0 0.6em; }
.document .card-row { font-family: var(--mono); font-size: 0.9em; letter-spacing: 0.03em; }
.document .card-foot { font-size: 0.8em; color: #6b6a60; margin-top: 1em; }
.document .paper-masthead { font-family: var(--cond); font-size: 2em; font-weight: 700; letter-spacing: 0.02em; border-bottom: 2px solid #191919; padding-bottom: 0.15em; }
.document .paper-date { font-size: 0.8em; color: #6b6a60; margin: 0.4em 0 1.2em; }
.document .paper-head { font-family: var(--cond); font-size: 1.5em; font-weight: 700; line-height: 1.15; margin-bottom: 0.7em; }
.document .paper-body { text-align: justify; }
.document .form-head { font-family: var(--cond); letter-spacing: 0.24em; font-size: 0.85em; border-bottom: 1px solid #191919; padding-bottom: 0.3em; margin-bottom: 0.9em; }
.document .form-row { font-family: var(--mono); font-size: 0.86em; white-space: pre-wrap; }
.document .form-row.strike { text-decoration: line-through; opacity: 0.65; }
.document .form-note, .document .form-foot { font-size: 0.82em; color: #6b6a60; margin-top: 0.9em; }
.document .hand {
  font-family: "Bradley Hand", "Segoe Script", "Comic Sans MS", cursive;
  font-size: 1.15em;
  color: #1b2b57;
  transform: rotate(-0.5deg);
}
.document .hand.strike { text-decoration: line-through; }
.document .hand.big { font-size: 1.5em; letter-spacing: 0.04em; margin: 0.6em 0; }
.document .phone-head { font-family: var(--cond); letter-spacing: 0.2em; font-size: 0.8em; color: #6b6a60; margin-bottom: 1em; }
.document .phone-msg { border-radius: 14px; padding: 0.5em 0.9em; margin-bottom: 0.4em; max-width: 76%; font-size: 0.95em; }
.document .phone-msg.them { background: #e4e2da; }
.document .phone-msg.me { background: #2f6fd0; color: #fff; margin-left: auto; }
.document .poster-head { font-family: var(--cond); font-size: 2.2em; font-weight: 700; color: #b3121b; letter-spacing: 0.04em; }
.document .poster-body { margin: 0.3em 0; }
.document .poster-foot { font-family: var(--cond); letter-spacing: 0.2em; font-size: 0.85em; color: #b3121b; margin-top: 1em; }
.document .object-body { }
.document .note {
  margin-top: 1.6em;
  padding-top: 0.9em;
  border-top: 1px solid rgba(25, 25, 25, 0.22);
  font-size: 0.94em;
  font-style: italic;
  color: #4c4c46;
}
.document img { width: 100%; height: auto; display: block; image-rendering: auto; }
.document .caption { display: block; margin-top: 0.8em; font-style: italic; color: #4c4c46; background: none; }
.document .dismiss {
  margin-top: 1.8em;
  font-family: var(--cond);
  letter-spacing: 0.22em;
  font-size: 0.72em;
  text-transform: uppercase;
  color: #6b6a60;
}

/* Flavour line and speech: no panel, just words in the dark. */
.flavour {
  width: min(56ch, 82vw);
  text-align: center;
  font-size: 1.12em;
  line-height: 1.6;
  color: var(--ink);
  text-shadow: 0 2px 12px #000;
  animation: fadeUp 260ms ease both;
}
.flavour .speaker {
  display: block;
  font-family: var(--cond);
  font-size: 0.66em;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--amber-dim);
  margin-bottom: 0.9em;
}

/* ---------- menus ---------- */

.menu {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  color: var(--ink);
}
.menu.open { display: block; }

.menu::before {
  content: "";
  position: absolute;
  inset: 0;
  /* Dark enough behind the title to read it, thin enough on the right that
     the platform, the tunnel mouth and the train going through are all still
     there. The menu is a place, not a wallpaper. */
  background:
    radial-gradient(120% 90% at 18% 42%, rgba(0,0,0,0.62), rgba(0,0,0,0.10) 72%),
    linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0.12) 45%, rgba(0,0,0,0.62));
  pointer-events: none;
}
.menu.pause::before { backdrop-filter: blur(6px); }

.menu-inner {
  position: relative;
  height: 100%;
  padding: 8vh 8vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 1400px;
}

.title {
  font-family: var(--cond);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.30em;
  line-height: 0.95;
  font-size: clamp(2.6rem, 7vw, 5.6rem);
  margin: 0 0 0.12em;
  text-shadow: 0 6px 40px rgba(0, 0, 0, 0.9);
}
.title .the { display: block; font-size: 0.34em; letter-spacing: 0.6em; color: var(--ink-dim); margin-bottom: 0.5em; }
.tagline {
  font-family: var(--cond);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  font-size: 0.78rem;
  color: var(--ink-faint);
  margin: 0 0 3.2em;
}

.buttons { display: flex; flex-direction: column; align-items: flex-start; gap: 0.15em; }

.btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 0.45em 0 0.45em 0;
  color: var(--ink-dim);
  font-family: var(--cond);
  font-size: clamp(1.05rem, 2.1vw, 1.5rem);
  letter-spacing: 0.26em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  transition: color 120ms ease, letter-spacing 200ms ease, padding-left 200ms ease;
  text-align: left;
}
.btn::before {
  content: "";
  position: absolute;
  left: -1.1em;
  top: 50%;
  width: 0.6em;
  height: 1px;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 180ms ease;
}
.btn:hover, .btn:focus-visible { color: var(--ink); outline: none; padding-left: 0.5em; }
.btn:hover::before, .btn:focus-visible::before { transform: scaleX(1); transform-origin: left; }
.btn[disabled] { color: rgba(120, 130, 140, 0.35); cursor: not-allowed; }
.btn[disabled]:hover { padding-left: 0; color: rgba(120, 130, 140, 0.35); }
.btn[disabled]:hover::before { transform: scaleX(0); }
.btn .hint { display: block; font-family: var(--sans); font-size: 0.5em; letter-spacing: 0.14em; color: var(--ink-faint); margin-top: 0.25em; text-transform: none; }

.corner {
  position: absolute;
  font-family: var(--cond);
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.corner.bl { left: 8vw; bottom: 5vh; }
.corner.br { right: 8vw; bottom: 5vh; text-align: right; }

/* Sub-pages: settings, journal, credits, endings */

.page {
  position: absolute;
  inset: 0;
  padding: 5.5vh 7vw;
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(4,5,7,0.94), rgba(4,5,7,0.98));
}
/* A sub-page covers the menu rather than replacing it, and the plate under it
   is deliberately not quite opaque so the platform still moves behind. Six per
   cent of a five-inch title is still legible, so the screen it came from is
   taken out of the document flow while a page is up. */
.menu:has(.page) .menu-inner,
.menu:has(.page) > .corner { display: none; }
.page h2 {
  font-family: var(--cond);
  font-size: clamp(1.5rem, 3.4vw, 2.4rem);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin: 0 0 0.2em;
}
.page .sub {
  font-family: var(--cond);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  font-size: 0.7rem;
  color: var(--ink-faint);
  margin-bottom: 2.6em;
}
/* The instructions have to fit the screen they are read on, or the two
   buttons at the bottom are below the fold on a 1280x720 laptop and the page
   looks like it ends at "Controls". */
.page:has(.howto) .sub { margin-bottom: 1.5em; }
.page:has(.howto) .back { margin-top: 1.6em; }
.page .back { margin-top: 3em; }

.settings-grid { display: grid; gap: 1.9em; max-width: 62ch; }
.settings-group h3 {
  font-family: var(--cond);
  font-size: 0.74rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--amber-dim);
  margin: 0 0 1em;
  padding-bottom: 0.5em;
  border-bottom: 1px solid var(--line);
}
.setting { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1em 1.4em; margin-bottom: 0.95em; }
.setting label { font-size: 0.92rem; color: var(--ink-dim); }
.setting .desc { grid-column: 1 / -1; font-size: 0.76rem; color: var(--ink-faint); margin-top: -0.6em; }
.setting .control { display: flex; align-items: center; gap: 0.8em; min-width: 17ch; justify-content: flex-end; }
.setting input[type="range"] { width: 12ch; accent-color: var(--amber); }
.setting .value { font-family: var(--mono); font-size: 0.8rem; color: var(--amber); min-width: 4ch; text-align: right; }
.setting select {
  background: #0d1014;
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 0.35em 0.6em;
  font-family: var(--cond);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.82rem;
}
.toggle {
  appearance: none;
  width: 3.1em;
  height: 1.45em;
  border: 1px solid var(--line);
  background: #0d1014;
  position: relative;
  cursor: pointer;
}
.toggle::after {
  content: "";
  position: absolute;

  shade(cx, eyeY + H * 0.30, W * 0.075, H * 0.10, 0.20);                        // under the jaw
  light(cx, eyeY - H * 0.13, W * 0.070, H * 0.09, 0.22);                        // forehead
  light(cx, eyeY + H * 0.055, W * 0.014, H * 0.055, 0.20);                      // bridge

  for (const side of [-1, 1]) {
    const ex = cx + side * eyeDx;

    /* Orbit: a soft socket, deeper above than below. */
    shade(ex, eyeY - H * 0.006, W * 0.040, H * 0.052, 0.30 + stare * 0.16);
    shade(ex, eyeY + H * 0.030, W * 0.030, H * 0.022, 0.13);                    // eye bag

    if (open > 0.05) {
      /* Sclera, clipped by the lids rather than drawn as a bare almond. */
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#e6e2dc';
      ctx.fillRect(ex - eyeW, eyeY - eyeH, eyeW * 2, eyeH * 2);

      const gaze = (opts.gaze || 0) * W * 0.010;
      ctx.fillStyle = opts.irisColor || '#4a3a2c';
      ctx.beginPath();
      ctx.arc(ex + gaze, eyeY + H * 0.001, eyeW * 0.52, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,14,10,0.55)';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.fillStyle = '#0b0a09';
      ctx.beginPath();
      ctx.arc(ex + gaze, eyeY + H * 0.001, eyeW * 0.24, 0, Math.PI * 2);
      ctx.fill();
      /* One catchlight, up and to the left, from the tube overhead. */
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(ex + gaze - eyeW * 0.20, eyeY - eyeH * 0.32, eyeW * 0.12, 0, Math.PI * 2);
      ctx.fill();
      /* Upper lid shadow across the top of the eye. */
      ctx.fillStyle = 'rgba(60,44,36,0.34)';
      ctx.fillRect(ex - eyeW, eyeY - eyeH, eyeW * 2, eyeH * 0.72);
      ctx.restore();

      /* Lash line and lower lid. */
      ctx.strokeStyle = 'rgba(30,22,18,0.70)';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, eyeW, eyeH, 0, Math.PI * 1.02, Math.PI * 1.98);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120,90,76,0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, eyeW * 0.96, eyeH * 0.96, 0, Math.PI * 0.06, Math.PI * 0.94);
      ctx.stroke();
    } else {
      /* Shut: a lid with a crease, not an absence. */
      ctx.strokeStyle = 'rgba(40,30,24,0.62)';
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(ex - eyeW, eyeY);
      ctx.quadraticCurveTo(ex, eyeY + H * 0.012, ex + eyeW, eyeY);
      ctx.stroke();
    }

    /* Brow: strokes, not a bar. Angled down toward the nose when staring. */
    const browY = eyeY - H * 0.062 + stare * H * 0.014;
    ctx.strokeStyle = opts.browColor || 'rgba(48,36,28,0.62)';
    ctx.lineCap = 'round';
    for (let i = 0; i < 14; i++) {
      const t = i / 13;
      const bx = ex + (t - 0.5) * eyeW * 2.5;
      const lift = Math.sin(t * Math.PI) * H * 0.012;
      ctx.lineWidth = 2.2 + Math.sin(t * Math.PI) * 1.6;
      ctx.beginPath();
      ctx.moveTo(bx, browY - lift + side * (t - 0.5) * stare * H * 0.02);
      ctx.lineTo(bx + side * 3, browY - lift - H * 0.014);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  /* Nose: a shadow down one side, a tip highlight, two nostrils. */
  const noseY = eyeY + H * 0.135;
  shade(cx - W * 0.016, eyeY + H * 0.085, W * 0.013, H * 0.075, 0.26);
  light(cx + W * 0.004, noseY - H * 0.012, W * 0.012, H * 0.024, 0.26);
  shade(cx, noseY + H * 0.026, W * 0.026, H * 0.014, 0.22);
  ctx.fillStyle = 'rgba(40,28,22,0.55)';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + side * W * 0.013, noseY + H * 0.014, W * 0.006, H * 0.007, side * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Mouth: a shadowed seam with a lower lip that catches light. */
  const mouthY = eyeY + H * 0.225;
  const mouthW = W * 0.038;
  ctx.strokeStyle = `rgba(78,48,44,${opts.mouthOpen ? 0.62 : 0.42})`;
  ctx.lineWidth = opts.mouthOpen ? 9 : 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - mouthW, mouthY);
  ctx.quadraticCurveTo(cx, mouthY + (opts.smile || 0) * 10, cx + mouthW, mouthY);
  ctx.stroke();
  ctx.lineCap = 'butt';
  light(cx, mouthY + H * 0.026, W * 0.030, H * 0.014, 0.20);
  shade(cx, mouthY + H * 0.058, W * 0.024, H * 0.016, 0.16);
  for (const side of [-1, 1]) {
    shade(cx + side * (mouthW + W * 0.006), mouthY + H * 0.004, W * 0.010, H * 0.012, 0.24);
  }

  if (opts.stubble) {
    const r = rng || new Rng(3);
    ctx.fillStyle = 'rgba(40,34,30,0.5)';
    for (let i = 0; i < 1400; i++) {
      const a = r.float(-1, 1);
      const x = cx + a * W * 0.085;
      const y = mouthY + r.float(-H * 0.06, H * 0.10) - Math.abs(a) * H * 0.05;
      ctx.globalAlpha = r.float(0.05, 0.22);
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }

  if (rng) {
    blotches(ctx, W, H, 14, rng, { color: 'rgba(120,80,64,0.05)', min: 14, max: 60 });
    grain(ctx, W, H, 7, rng);
  }
  return canvas;
}

/*
 * Woven fabric. Kept white so the per-passenger colour multiplies through it;
 * all the information is in the weave and in the soft vertical drape, which is
 * what stops a coat from reading as a solid-colour box.
 */
function fabricTexture(rng, opts = {}) {
  const S = 512;
  const { canvas, ctx } = makeCanvas(S, S);
  fill(ctx, S, S, '#ffffff');

  const pitch = opts.pitch || 5;
  for (let y = 0; y < S; y += pitch) {
    ctx.fillStyle = `rgba(0,0,0,${opts.weave ?? 0.06})`;
    ctx.fillRect(0, y, S, Math.max(1, pitch * 0.34));
  }
  for (let x = 0; x < S; x += pitch) {
    ctx.fillStyle = `rgba(0,0,0,${(opts.weave ?? 0.06) * 0.7})`;
    ctx.fillRect(x, 0, Math.max(1, pitch * 0.28), S);
  }

  /* Drape. Broad soft bands running down the cloth, with a highlight on one
     side of each so they read as folds rather than as stripes. */
  const folds = opts.folds ?? 7;
  for (let i = 0; i < folds; i++) {
    const x = rng.float(0, S);
    const w = rng.float(S * 0.05, S * 0.16);
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.42, `rgba(0,0,0,${rng.float(0.05, 0.13)})`);
    g.addColorStop(0.58, `rgba(255,255,255,${rng.float(0.05, 0.12)})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - w, 0, w * 2, S);
  }
  for (let i = 0; i < (opts.creases ?? 5); i++) {
    const y = rng.float(0, S);
    const h = rng.float(S * 0.02, S * 0.07);
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.5, `rgba(0,0,0,${rng.float(0.04, 0.09)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - h, S, h * 2);
  }

  blotches(ctx, S, S, 10, rng, { color: 'rgba(0,0,0,0.05)', min: 30, max: 120 });
  grain(ctx, S, S, opts.noise ?? 9, rng);
  return canvas;
}

function clothTexture(rng) {
  return fabricTexture(rng, { pitch: 4, weave: 0.05, folds: 5, creases: 4, noise: 8 });
}

function adTexture(spec, rng) {
  const W = 512, H = 256;
  const { canvas, ctx } = makeCanvas(W, H);
  fill(ctx, W, H, spec.bg || '#101418');

  const ink = spec.dark ? '#14161a' : '#f2f4f6';
  const accent = spec.accent || '#e8552f';

  ctx.fillStyle = accent;
  ctx.fillRect(0, 0, 10, H);

  if (spec.photo) {
    /* A photograph reduced to a silhouette. It should never resolve. */
    ctx.fillStyle = '#d8d8d6';
    ctx.fillRect(W - 150, 30, 120, 150);
    const g = ctx.createLinearGradient(0, 30, 0, 180);
    g.addColorStop(0, '#8f9296');
    g.addColorStop(1, '#4c4f54');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(W - 90, 92, 30, 36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W - 138, 180);
    ctx.quadraticCurveTo(W - 90, 118, W - 42, 180);
    ctx.fill();
  }

  const rightEdge = spec.photo ? W - 170 : W - 34;
  ctx.fillStyle = ink;
  ctx.font = `700 ${spec.headlineSize || 44}px ${CONDENSED}`;
  ctx.textBaseline = 'top';
  const headLines = wrapText(ctx, spec.headline, rightEdge - 34);
  let y = 34;
  for (const line of headLines) {
    ctx.fillText(line, 34, y);
    y += (spec.headlineSize || 44) * 1.02;
  }

  ctx.fillStyle = spec.dark ? 'rgba(20,22,26,0.78)' : 'rgba(240,244,248,0.78)';
  ctx.font = `400 22px ${SANS}`;
  y += 12;
  for (const line of wrapText(ctx, spec.body, rightEdge - 34)) {
    ctx.fillText(line, 34, y);
    y += 28;
  }

  ctx.fillStyle = accent;
  ctx.font = `700 17px ${SANS}`;
  ctx.fillText(String(spec.foot || '').toUpperCase(), 34, H - 42);

  if (spec.overprint) {
    ctx.save();
    ctx.translate(W * 0.5, H * 0.55);
    ctx.rotate(-0.14);
    ctx.font = `700 46px ${CONDENSED}`;
    ctx.fillStyle = 'rgba(160,20,20,0.72)';
    ctx.textAlign = 'center';
    ctx.fillText(spec.overprint, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  /* Paper behind glass: reflections and age. */
  const shine = ctx.createLinearGradient(0, 0, W, H);
  shine.addColorStop(0, 'rgba(255,255,255,0.06)');
  shine.addColorStop(0.4, 'rgba(255,255,255,0.0)');
  shine.addColorStop(1, 'rgba(255,255,255,0.04)');
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, W, H);
  if (rng) {
    blotches(ctx, W, H, 8, rng, { color: 'rgba(0,0,0,0.10)', min: 20, max: 90 });
    grain(ctx, W, H, 10, rng);
  }
  return canvas;
}

/*
 * The route map above the doors. Rebuilt whenever the line changes — and the
 * line does change. `highlight` is the station the train is heading for;
 * `ghost` renders an entry in the faded ink used for stations that are on the
 * map tonight and were not on it an hour ago.
 */
function routeMapTexture(stations, opts = {}) {
  const W = 1024, H = 256;
  const { canvas, ctx } = makeCanvas(W, H);
  fill(ctx, W, H, '#f4f1e9');

  ctx.fillStyle = '#12161c';
  ctx.font = `700 26px ${CONDENSED}`;
  ctx.textBaseline = 'top';
  ctx.fillText(opts.title || 'LINE 4 — NORTHBOUND', 34, 22);
  ctx.font = `400 16px ${SANS}`;
  ctx.fillStyle = 'rgba(20,24,30,0.55)';
  ctx.fillText(opts.subtitle || 'LAST SERVICE 00:47', 34, 56);

  const y = 150;
  const left = 60;
  const right = W - 60;
  const step = stations.length > 1 ? (right - left) / (stations.length - 1) : 0;

  ctx.strokeStyle = opts.lineColor || '#1f6bb5';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(left, y);
  ctx.lineTo(right, y);
  ctx.stroke();

  stations.forEach((st, i) => {
    const x = left + step * i;
    const ghost = st.ghost;
    ctx.beginPath();
    ctx.arc(x, y, ghost ? 9 : 11, 0, Math.PI * 2);
    ctx.fillStyle = ghost ? '#d9d4c8' : '#ffffff';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = ghost ? 'rgba(60,64,70,0.35)' : (opts.lineColor || '#1f6bb5');
    ctx.stroke();

    if (opts.highlight === st.id) {
      ctx.beginPath();
      ctx.arc(x, y, 17, 0, Math.PI * 2);
      ctx.strokeStyle = '#c8402c';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(x, y - 24);
    ctx.rotate(-Math.PI / 4);
    ctx.textAlign = 'left';
    ctx.font = `${ghost ? '400' : '700'} 20px ${CONDENSED}`;
    ctx.fillStyle = ghost ? 'rgba(40,44,50,0.38)' : '#12161c';
    ctx.fillText(String(st.name).toUpperCase(), 0, 0);
    ctx.restore();
  });
  ctx.textAlign = 'left';

  if (opts.scrawl) {
    ctx.save();
    ctx.translate(opts.scrawl.x ?? W * 0.62, opts.scrawl.y ?? H * 0.78);
    ctx.rotate(opts.scrawl.rotate ?? -0.05);
    ctx.font = `400 ${opts.scrawl.size || 26}px ${CONDENSED}`;
    ctx.fillStyle = opts.scrawl.color || 'rgba(24,32,90,0.72)';
    ctx.fillText(opts.scrawl.text, 0, 0);
    ctx.restore();
  }

  /* Perspex cover: a hard specular streak and the scuffs of ten thousand
     shoulders. */
  const shine = ctx.createLinearGradient(0, 0, W * 0.6, H);
  shine.addColorStop(0, 'rgba(255,255,255,0.16)');
  shine.addColorStop(0.35, 'rgba(255,255,255,0.02)');
  shine.addColorStop(1, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, W, H);

  if (opts.rng) {
    blotches(ctx, W, H, 10, opts.rng, { color: 'rgba(0,0,0,0.06)', min: 20, max: 80 });
    grain(ctx, W, H, 8, opts.rng);
  }
  return canvas;
}

/*
 * The dot-matrix strip over the doors. Amber LEDs on black, with the grid
 * drawn back over the top so the letters are made of dots rather than merely
 * looking like they might be.
 */
function displayTexture(lines, opts = {}) {
  const W = 1024, H = 128;
  const { canvas, ctx } = makeCanvas(W, H);
  fill(ctx, W, H, '#050506');

  const color = opts.color || '#ffb03a';
  const rows = Array.isArray(lines) ? lines : [lines];
  ctx.textBaseline = 'middle';
  ctx.textAlign = opts.align === 'left' ? 'left' : 'center';
  const x = opts.align === 'left' ? 24 : W / 2;

  if (rows.length === 1) {
    ctx.font = `700 ${opts.size || 62}px ${MONO}`;
    ctx.fillStyle = color;
    ctx.fillText(String(rows[0]).toUpperCase(), x, H / 2 + 2);
  } else {
    ctx.font = `700 ${opts.size || 40}px ${MONO}`;
    ctx.fillStyle = color;
    rows.slice(0, 2).forEach((line, i) => {
      ctx.fillText(String(line).toUpperCase(), x, H * (i === 0 ? 0.30 : 0.72));
    });
  }

  /* Dot grid mask */
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  const pitch = 4;
  for (let yy = 0; yy < H; yy += pitch) ctx.fillRect(0, yy + pitch - 1.4, W, 1.4);
  for (let xx = 0; xx < W; xx += pitch) ctx.fillRect(xx + pitch - 1.4, 0, 1.4, H);
  ctx.globalCompositeOperation = 'source-over';

  /* Glow bleed */
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(6px)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';
  ctx.globalCompositeOperation = 'source-over';

  if (opts.corrupt) {
    ctx.fillStyle = '#050506';
    for (let i = 0; i < 18; i++) {
      const yy = Math.random() * H;
      ctx.fillRect(0, yy, W, Math.random() * 4);
    }
  }
  return canvas;
}

/* The big enamel station name on the platform wall. */
function stationSignTexture(name, opts = {}) {
  const W = 1024, H = 256;
  const { canvas, ctx } = makeCanvas(W, H);
  fill(ctx, W, H, opts.bg || '#f3f2ee');
  ctx.fillStyle = opts.bar || '#0f3d73';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillRect(0, H - 30, W, 30);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = opts.ink || '#14181d';
  const text = String(name).toUpperCase();
  let size = 118;
  ctx.font = `700 ${size}px ${CONDENSED}`;
  while (ctx.measureText(text).width > W - 90 && size > 30) {
    size -= 4;
    ctx.font = `700 ${size}px ${CONDENSED}`;
  }
  ctx.fillText(text, W / 2, H / 2 + 4);

  if (opts.sub) {
    ctx.font = `400 26px ${SANS}`;
    ctx.fillStyle = 'rgba(20,24,30,0.55)';
    ctx.fillText(opts.sub, W / 2, H - 58);
  }
  ctx.textAlign = 'left';

  if (opts.decay) {
    const rng = opts.rng || new Rng(7);
    blotches(ctx, W, H, Math.round(30 * opts.decay), rng, { color: 'rgba(30,26,20,0.30)', min: 20, max: 120 });
    scratches(ctx, W, H, Math.round(60 * opts.decay), rng, 'rgba(20,18,16,0.20)');
    grain(ctx, W, H, 18 * opts.decay, rng);
  }
  return canvas;
}

/* Small enamel/vinyl notices: emergency instructions, no-smoking, the little
   sticker by the door that nobody has ever read. */
function noticeTexture(spec, rng) {
  const W = 256, H = 256;

  ctx.strokeStyle = spec.border || '#b8271f';
  ctx.lineWidth = 8;
  ctx.strokeRect(8, 8, W - 16, H - 16);

  ctx.textAlign = 'center';
  ctx.fillStyle = spec.border || '#b8271f';
  ctx.font = `700 30px ${CONDENSED}`;

  ctx.fillStyle = '#1b1e22';

  for (const line of wrapText(ctx, spec.body || '', W - 52)) {

    y += 24;
  }
  if (spec.foot) {
    ctx.font = `700 15px ${SANS}`;
    ctx.fillStyle = 'rgba(20,24,30,0.6)';
    ctx.fillText(spec.foot, W / 2, H - 40);
  }
  ctx.textAlign = 'left';
  if (rng) grain(ctx, W, H, 10, rng);

}

function newspaperTexture(rng, opts = {}) {
  const W = 512, H = 512;
  const { canvas, ctx } = makeCanvas(W, H);
  fill(ctx, W, H, '#ddd8c9');
  ctx.fillStyle = '#1a1a1a';
  ctx.font = `700 44px ${CONDENSED}`;
  ctx.fillText(opts.masthead || 'THE EVENING LINE', 24, 56);
  ctx.fillRect(24, 72, W - 48, 3);

  ctx.font = `700 27px ${CONDENSED}`;
  const head = wrapText(ctx, opts.headline || 'SERVICE RESTORED AFTER OVERNIGHT WORKS', W - 48);
  let y = 96;
  for (const line of head) { ctx.fillText(line, 24, y); y += 30; }

  /* Body copy as ruled grey lines — legible as "text" and never as words. */
  y += 12;
  ctx.fillStyle = 'rgba(30,30,30,0.55)';
  for (let col = 0; col < 2; col++) {
    const cx = 24 + col * (W / 2 - 12);
    let yy = y;
    while (yy < H - 40) {
      const w = (W / 2 - 40) * rng.float(0.72, 1);
      ctx.fillRect(cx, yy, w, 3.2);
      yy += 11;
      if (rng.bool(0.06)) yy += 10;
    }
  }
  if (opts.photo) {
    ctx.fillStyle = '#9a978d';
    ctx.fillRect(W / 2 + 12, y + 20, W / 2 - 36, 120);
  }
  blotches(ctx, W, H, 14, rng, { color: 'rgba(90,70,40,0.10)', min: 20, max: 90 });
  grain(ctx, W, H, 12, rng);
  return canvas;
}

function graffitiTexture(rng, text) {
  const W = 512, H = 256;
  const { canvas, ctx } = makeCanvas(W, H);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(rng.float(-0.12, 0.12));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 96px ${CONDENSED}`;

    buildSideWall(b, side);
    buildSeatBanks(b, side);
    buildDoorSurrounds(b, side);
  }
  buildEndWalls(b);
  buildPoles(b);
  buildFittings(b);

  const mesh = b.build(gl, materials);
  return {
    mesh,
    lights: ceilingLights(),
    seatSlots: SEAT_SLOTS,
    interactables: interactionVolumes(),
    poles: poleColliders(),
    doorways: doorwayList(),
  };
}

/* ---- shell ---------------------------------------------------------- */

function buildFloor(b) {
  b.material('floor');
  b.push();
  b.translate(0, 0, 0);
  b.box(CAR.halfWidth * 2, 0.08, CAR.length, { tiles: 1.35, faces: '+y' });
  b.pop();

  /* The yellow line along the door thresholds, and the darker rubber the
     doors close onto. */
  b.material('doorLine');
  for (const dz of CAR.doorZ) {
    for (const side of [-1, 1]) {
      b.push();
      b.translate(side * (CAR.halfWidth - 0.22), 0.005, dz);
      b.box(0.30, 0.004, CAR.doorHalfWidth * 2 + 0.1, { tiles: 1, faces: '+y' });
      b.pop();
    }
  }
}

function buildCeiling(b) {
  b.material('ceiling');
  b.push();
  b.translate(0, CAR.height, 0);
  b.box(CAR.halfWidth * 2, 0.08, CAR.length, { tiles: 1.1, faces: '-y' });
  b.pop();

  /* The two coves the light strips sit in. */
  b.material('metal');
  for (const side of [-1, 1]) {
    b.push();
    b.translate(side * CAR.lightX, CAR.height - 0.055, 0);
    b.box(0.30, 0.11, CAR.length - 0.4, { tiles: 1.5, faces: ['-y', side > 0 ? '-x' : '+x'] });
    b.pop();
  }

  /* The tubes hang a clear three centimetres below the lip of the cove. They
     used to sit exactly flush with it, which is to say in the same plane, and
     the two surfaces spent the entire game deciding which of them was in
     front — so the brightest object in the carriage was invisible. */
  b.material('lightStrip');
  for (const side of [-1, 1]) {
    for (const [z0, z1] of LIGHT_RUNS) {
      b.push();
      b.translate(side * CAR.lightX, CAR.height - 0.145, (z0 + z1) / 2);
      b.box(0.26, 0.035, z1 - z0, { tiles: 1, faces: ['-y', '+x', '-x'] });
      b.pop();
    }
  }
}

const LIGHT_RUNS = [
  [-8.2, -5.4], [-5.0, -1.6], [-1.2, 1.2], [1.6, 5.0], [5.4, 8.2],
];

function buildSideWall(b, side) {
  const x = side * CAR.halfWidth;
  const inward = side > 0 ? '-x' : '+x';

  for (const [z0, z1] of WALL_SEGMENTS) {
    /* Below the glass — the panel the seats are bolted to. */
    b.material('wall');
    b.push();
    b.translate(x, CAR.windowY0 / 2, (z0 + z1) / 2);
    b.box(0.06, CAR.windowY0, z1 - z0, { tiles: 1.0, faces: inward });
    b.pop();

    /* Above the glass — where the advertising lives. */
    b.push();
    b.translate(x, (CAR.windowY1 + CAR.height) / 2, (z0 + z1) / 2);
    b.box(0.06, CAR.height - CAR.windowY1, z1 - z0, { tiles: 1.0, faces: inward });
    b.pop();

    const list = panes(z0, z1);
    /* Mullions, including the two at the ends of the run. */
    b.material('metal');
    const edges = [z0];
    for (const [pz0, pz1] of list) { edges.push(pz0, pz1); }
    edges.push(z1);
    for (let i = 0; i < edges.length; i += 2) {
      const m0 = edges[i], m1 = edges[i + 1];
      if (m1 - m0 < 0.001) continue;
      b.push();
      b.translate(x, (CAR.windowY0 + CAR.windowY1) / 2, (m0 + m1) / 2);
      b.box(0.07, CAR.windowY1 - CAR.windowY0, m1 - m0, { tiles: 2, faces: inward });
      b.pop();
    }

    /* Glass, and the rubber gasket around each pane. */
    for (const [pz0, pz1] of list) {
      b.material('metal');
      b.push();
      b.translate(x, CAR.windowY0 + 0.02, (pz0 + pz1) / 2);
      b.box(0.08, 0.04, pz1 - pz0, { tiles: 2, faces: [inward, '+y'] });
      b.translate(0, CAR.windowY1 - CAR.windowY0 - 0.04, 0);
      b.box(0.08, 0.04, pz1 - pz0, { tiles: 2, faces: [inward, '-y'] });
      b.pop();

      b.material(side > 0 ? 'glass.right' : 'glass.left');
      b.push();
      b.translate(x - side * 0.012, (CAR.windowY0 + CAR.windowY1) / 2, (pz0 + pz1) / 2);
      b.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
      b.panel(pz1 - pz0, CAR.windowY1 - CAR.windowY0 - 0.06, {
        uv: [0, 0, (pz1 - pz0) * 0.5, 1],
      });
      b.pop();
    }
  }
}

function buildDoorSurrounds(b, side) {
  const x = side * CAR.halfWidth;
  const inward = side > 0 ? '-x' : '+x';

  for (const dz of CAR.doorZ) {
    /* The header above the opening carries the route map. */
    b.material('wall');
    b.push();
    b.translate(x, (CAR.doorHeight + CAR.height) / 2, dz);
    b.box(0.06, CAR.height - CAR.doorHeight, CAR.doorHalfWidth * 2, { tiles: 1, faces: inward });
    b.pop();

    /* Door pocket reveals — the dark slot the leaves disappear into. */
    b.material('metal');
    for (const s of [-1, 1]) {
      b.push();
      b.translate(x - side * 0.05, CAR.doorHeight / 2, dz + s * (CAR.doorHalfWidth + 0.03));
      b.box(0.10, CAR.doorHeight, 0.06, { tiles: 3, faces: [inward, s > 0 ? '-z' : '+z'] });
      b.pop();
    }

    /* Behind the leaves: the outer skin, so an open door shows a jamb rather
       than the void. */
    b.material('darkMetal');
    b.push();
    b.translate(x + side * 0.09, CAR.doorHeight / 2, dz);
    b.box(0.02, CAR.doorHeight, CAR.doorHalfWidth * 2, { tiles: 2, faces: inward });
    b.pop();

    /* Route map over the doorway. */
    b.material(side > 0 ? 'map.right' : 'map.left');
    b.push();
    b.translate(x - side * 0.035, 2.11, dz);
    b.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.panel(1.16, 0.29);
    b.pop();

    /* Emergency panel, on the aft side of each doorway. */
    b.material('notice');
    b.push();
    b.translate(x - side * 0.035, 1.38, dz + CAR.doorHalfWidth + 0.22);
    b.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.panel(0.26, 0.32);
    b.pop();

    b.material('metal');
    b.push();
    b.translate(x - side * 0.055, 1.30, dz + CAR.doorHalfWidth + 0.22);
    b.rotateZ(Math.PI / 2);
    b.rotateX(side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.cylinder(0.045, 0.045, 0.04, 12, { caps: true });
    b.pop();

    b.material('emergency');
    b.push();
    b.translate(x - side * 0.078, 1.30, dz + CAR.doorHalfWidth + 0.22);
    b.rotateZ(Math.PI / 2);
    b.rotateX(side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.cylinder(0.033, 0.033, 0.02, 12, { caps: true });
    b.pop();

    /* Draught screens flanking the doorway. */
    b.material(side > 0 ? 'glass.right' : 'glass.left');
    for (const s of [-1, 1]) {
      b.push();
      b.translate(side * (CAR.halfWidth - 0.30), 1.05, dz + s * (CAR.doorHalfWidth + 0.16));
      b.panel(0.56, 0.94, { doubleSided: true });
      b.pop();
      b.material('metal');
      b.push();
      b.translate(side * (CAR.halfWidth - 0.585), 1.05, dz + s * (CAR.doorHalfWidth + 0.16));
      b.box(0.05, 0.98, 0.05, { tiles: 3 });
      b.pop();
      b.material(side > 0 ? 'glass.right' : 'glass.left');
    }
  }
}

function buildEndWalls(b) {
  for (const end of [-1, 1]) {
    const z = end * HALF_LEN;
    const facing = end > 0 ? '-z' : '+z';
    const doorHalf = 0.45;
    const doorH = 1.95;

    b.material('wall');
    /* Left and right of the connecting door. */
    for (const s of [-1, 1]) {
      const x0 = s > 0 ? doorHalf : -CAR.halfWidth;
      const x1 = s > 0 ? CAR.halfWidth : -doorHalf;
      b.push();
      b.translate((x0 + x1) / 2, CAR.height / 2, z);
      b.box(x1 - x0, CAR.height, 0.06, { tiles: 1, faces: facing });
      b.pop();
    }
    /* Over the doorway. */
    b.push();
    b.translate(0, (doorH + CAR.height) / 2, z);
    b.box(doorHalf * 2, CAR.height - doorH, 0.06, { tiles: 1, faces: facing });
    b.pop();

    /* The dot-matrix strip above the connecting door. */
    b.material(end > 0 ? 'display.front' : 'display.back');
    b.push();
    b.translate(0, 2.11, z - end * 0.04);
    if (end > 0) b.rotateY(Math.PI);
    b.panel(1.30, 0.17);
    b.pop();

    /* Doorway frame. */
    b.material('metal');
    for (const s of [-1, 1]) {
      b.push();
      b.translate(s * doorHalf, doorH / 2, z - end * 0.03);
      b.box(0.06, doorH, 0.09, { tiles: 3 });
      b.pop();
    }
    b.push();
    b.translate(0, doorH, z - end * 0.03);
    b.box(doorHalf * 2 + 0.06, 0.07, 0.09, { tiles: 3 });
    b.pop();

    /* Grab rail beside the connecting door, and the small notice nobody
       reads. */
    b.push();
    b.translate(-CAR.halfWidth + 0.14, 1.15, z - end * 0.10);
    b.box(0.05, 1.5, 0.05, { tiles: 3 });
    b.pop();

    b.material('notice');
    b.push();
    b.translate(CAR.halfWidth - 0.42, 1.52, z - end * 0.035);
    if (end > 0) b.rotateY(Math.PI);
    b.panel(0.30, 0.30);
    b.pop();

    /* The bracket the security camera hangs off. The camera itself is a
       separate node, because it has to be able to turn. */
    b.material('darkMetal');
    b.push();
    b.translate(end > 0 ? CAR.halfWidth - 0.30 : -CAR.halfWidth + 0.30, CAR.height - 0.045, z - end * 0.22);
    b.box(0.07, 0.09, 0.07, { tiles: 4 });
    b.pop();

    /* Speaker grille. */
    b.material('metal');
    b.push();
    b.translate(end * 0.0, CAR.height - 0.045, z - end * 1.4);
    b.box(0.16, 0.02, 0.16, { tiles: 6, faces: '-y' });
    b.pop();
  }
}

function buildPoles(b) {
  b.material('pole');
  for (const side of [-1, 1]) {
    for (const z of POLE_Z) {
      b.push();
      b.translate(side * CAR.poleX, CAR.height / 2, z);
      b.cylinder(0.023, 0.023, CAR.height, 10);
      b.pop();
    }
    /* Overhead rails the handles hang from. */
    for (const bank of SEAT_BANKS) {
      b.push();
      b.translate(side * CAR.railX, CAR.railY, (bank.z0 + bank.z1) / 2);
      b.rotateX(Math.PI / 2);
      b.cylinder(0.017, 0.017, bank.z1 - bank.z0, 8);
      b.pop();
    }
  }
}

function buildSeatBanks(b, side) {
  const wallX = side * CAR.halfWidth;
  for (const bank of SEAT_BANKS) {
    const zc = (bank.z0 + bank.z1) / 2;
    const len = bank.z1 - bank.z0;

    /* Plinth under the bench. */
    b.material('darkMetal');
    b.push();
    b.translate(wallX - side * (CAR.seatDepth / 2 + 0.06), 0.16, zc);
    b.box(CAR.seatDepth - 0.06, 0.32, len - 0.04, { tiles: 2, faces: [side > 0 ? '-x' : '+x', '-z', '+z'] });
    b.pop();

    /* Cushion. */
    b.material('seat');
    b.push();
    b.translate(wallX - side * (CAR.seatDepth / 2 + 0.05), CAR.seatY - 0.05, zc);
    b.box(CAR.seatDepth, 0.11, len, { tiles: 2.2 });
    b.pop();

    /* Back, leaned into the wall. */
    b.push();
    b.translate(wallX - side * 0.10, (CAR.seatY + CAR.seatBackY) / 2 + 0.02, zc);
    b.rotateZ(side * 0.10);
    b.box(0.11, CAR.seatBackY - CAR.seatY + 0.12, len, { tiles: 2.2 });
    b.pop();

    /* Chrome dividers every few places, and a hard end cap. */
    b.material('pole');
    const divisions = Math.max(2, Math.round(len / 1.4));
    for (let i = 0; i <= divisions; i++) {
      const z = bank.z0 + (len * i) / divisions;
      b.push();
      b.translate(wallX - side * (CAR.seatDepth / 2 + 0.05), CAR.seatY + 0.03, z);
      b.rotateX(Math.PI / 2);
      b.cylinder(0.012, 0.012, CAR.seatDepth * 0.92, 6);
      b.pop();
    }
  }
}

function buildFittings(b) {
  /* Advertising panels along the upper wall band. Four per car, two a side. */
  AD_SLOTS.forEach((slot, i) => {
    b.material(`ad${i}`);
    b.push();
    b.translate(slot.side * (CAR.halfWidth - 0.035), 2.02, slot.z);
    b.rotateY(slot.side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.panel(1.02, 0.40);
    b.pop();
    b.material('metal');
    b.push();
    b.translate(slot.side * (CAR.halfWidth - 0.03), 2.02, slot.z);
    b.rotateY(slot.side > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.box(1.08, 0.46, 0.012, { tiles: 2 });
    b.pop();
  });

  /* A decal that is only ever shown in one car, and not from the beginning. */
  b.material('graffiti');
  b.push();
  b.translate(-CAR.halfWidth + 0.04, 0.72, -1.2);
  b.rotateY(Math.PI / 2);
  b.panel(0.9, 0.45);
  b.pop();

  /* Hanging handles are built into their own mesh — see buildHandles. */
}

const AD_SLOTS = [
  { side: -1, z: -6.6 },
  { side: 1, z: -1.9 },
  { side: -1, z: 1.9 },
  { side: 1, z: 6.6 },
];

/*
 * The grab handles, as a separate mesh so the vertex shader can swing the
 * whole set from the rail without touching the rest of the carriage.
 */
function buildHandles(gl, materials) {
  const b = new Builder();
  b.aoFn = null;
  b.ao = 0.9;
  for (const side of [-1, 1]) {
    for (const bank of SEAT_BANKS) {
      const len = bank.z1 - bank.z0;
      const count = Math.max(1, Math.floor(len / 0.72));
      const pad = (len - (count - 1) * 0.72) / 2;
      for (let i = 0; i < count; i++) {
        const z = bank.z0 + pad + i * 0.72;
        b.push();
        b.translate(side * CAR.railX, 0, z);

        b.material('strap');
        b.push();
        b.translate(0, 1.86, 0);
        b.box(0.014, 0.30, 0.030, { tiles: 4 });
        b.pop();

        /* The moulded loop. Four bars, corners left square — at this size and
           this light level nobody has ever noticed. */
        b.material('handle');
        const w = 0.052, h = 0.085, cy = 1.645;
        b.push();
        b.translate(0, cy + h, 0);
        b.box(0.013, 0.016, w * 2, { tiles: 4 });
        b.pop();
        b.push();
        b.translate(0, cy - h, 0);
        b.box(0.013, 0.020, w * 2, { tiles: 4 });
        b.pop();
        for (const s of [-1, 1]) {
          b.push();
          b.translate(0, cy, s * w);
          b.box(0.013, h * 2, 0.016, { tiles: 4 });
          b.pop();
        }
        b.pop();
      }
    }
  }
  return b.build(gl, materials);
}

/* One sliding door leaf, hinged at the origin so the node matrix only has to
   slide it along Z. Built per side because the glass belongs to that side's
   reflection plane. */
function buildDoorLeaf(gl, materials, side) {
  const b = new Builder();
  b.ao = 0.86;
  const w = CAR.doorHalfWidth;
  const h = CAR.doorHeight;

  b.material('doorPanel');
  b.push();
  b.translate(0, h / 2, w / 2);
  b.box(0.05, h, w, { tiles: 1.4, faces: ['-x', '+x', '+z'] });
  b.pop();

  /* Glazed upper half. */
  b.material('metal');
  b.push();
  b.translate(0, 1.02, w / 2);
  b.box(0.06, 0.06, w, { tiles: 3 });
  b.pop();

  b.material(side > 0 ? 'glass.right' : 'glass.left');
  b.push();
  b.translate(-side * 0.012, 1.52, w / 2);
  b.rotateY(side > 0 ? -Math.PI / 2 : Math.PI / 2);
  b.panel(w - 0.1, 0.86, { uv: [0, 0, 0.6, 1] });
  b.pop();

  b.material('doorRubber');
  b.push();
  b.translate(0, h / 2, 0.012);
  b.box(0.07, h, 0.024, { tiles: 6 });
  b.pop();

  return b.build(gl, materials);
}

/* The connecting door between two cars. One leaf, plain glass — it is not on
   either reflection plane. */
function buildConnectingDoor(gl, materials) {
  const b = new Builder();
  b.ao = 0.8;
  const w = 0.9, h = 1.95;
  b.material('doorPanel');
  b.push();
  b.translate(w / 2, h / 2, 0);
  b.box(w, h, 0.05, { tiles: 1.4, faces: ['+z', '-z', '+x', '-x'] });
  b.pop();
  b.material('glass.plain');
  b.push();
  b.translate(w / 2, 1.34, 0.031);
  b.panel(w - 0.20, 0.86, { doubleSided: true });
  b.pop();
  b.material('metal');
  b.push();
  b.translate(w / 2, 1.05, 0);
  b.box(w, 0.05, 0.06, { tiles: 3 });
  b.pop();
  b.push();
  b.translate(w - 0.10, 1.02, 0.05);
  b.box(0.03, 0.24, 0.03, { tiles: 4 });
  b.pop();
  return b.build(gl, materials);
}

/*
 * The security camera. Its own mesh, built looking down its own -Z, so a node
 * matrix can point it wherever it feels like pointing.
 */
function buildSecurityCamera(gl, materials) {
  const b = new Builder();
  b.ao = 0.9;
  b.material('darkMetal');
  b.push();
  b.box(0.15, 0.12, 0.23, { tiles: 4 });
  b.pop();
  b.push();
  b.translate(0, 0.075, 0.04);
  b.box(0.05, 0.06, 0.05, { tiles: 4 });
  b.pop();
  b.material('lens');
  b.push();
  b.translate(0, 0, -0.125);
  b.rotateX(Math.PI / 2);
  b.cylinder(0.043, 0.048, 0.05, 12, { caps: true });
  b.pop();
  /* The little red light that is either recording or is not. */
  b.material('camLed');
  b.push();
  b.translate(0.045, 0.045, -0.115);
  b.box(0.014, 0.014, 0.008, { tiles: 1 });
  b.pop();
  return b.build(gl, materials);
}

const CAMERA_MOUNTS = [
  { end: 1, x: CAR.halfWidth - 0.30, y: CAR.height - 0.19, z: HALF_LEN - 0.22, yaw: -0.55, pitch: -0.40 },
  { end: -1, x: -CAR.halfWidth + 0.30, y: CAR.height - 0.19, z: -HALF_LEN + 0.22, yaw: Math.PI + 0.55, pitch: -0.40 },
];

/* The bellows between two cars. */
function buildGangway(gl, materials) {
  const b = new Builder();
  b.ao = 0.55;
  const len = CAR.gangway;
  const segs = 7;
  b.material('bellows');
  for (let i = 0; i < segs; i++) {
    const z = -len / 2 + (len / segs) * (i + 0.5);
    const bulge = i % 2 === 0 ? 0.03 : 0;
    b.push();
    b.translate(0, 1.05, z);
    b.box(1.30 + bulge * 2, 2.05 + bulge * 2, len / segs - 0.01, { tiles: 2, inward: true, faces: ['+x', '-x', '+y'] });
    b.pop();
  }
  b.material('floor');
  b.push();
  b.translate(0, 0.01, 0);
  b.box(1.16, 0.02, len, { tiles: 2, faces: '+y' });
  b.pop();
  b.material('darkMetal');
  for (const s of [-1, 1]) {
    b.push();
    b.translate(s * 0.60, 0.6, 0);
    b.box(0.04, 1.2, len, { tiles: 2, faces: s > 0 ? '-x' : '+x' });
    b.pop();
  }
  return b.build(gl, materials);
}

/* ---- non-geometry outputs ------------------------------------------- */

function ceilingLights() {
  const lights = [];
  for (const [z0, z1] of LIGHT_RUNS) {
    lights.push({
      position: [0, CAR.lightY - 0.34, (z0 + z1) / 2],
      radius: 8.2,
      color: [0.86, 0.92, 1.0],
      /* Calibrated against the floor, which is the darkest large surface in
         the carriage: at this intensity a 0.17-albedo rubber floor lands
         around 0.25 on screen, which reads as "lit, at night" rather than
         "unlit". Everything else was set from there. */
      intensity: 2.45,
      flicker: 1,
      enabled: true,
    });
  }
  return lights;
}

function poleColliders() {
  const out = [];
  for (const side of [-1, 1]) {
    for (const z of POLE_Z) out.push({ x: side * CAR.poleX, z, radius: 0.12 });
  }
  return out;
}

function doorwayList() {
  const out = [];
  for (const side of [-1, 1]) {
    for (const z of CAR.doorZ) out.push({ side, z });
  }
  return out;
}

/*
 * Interaction volumes, in car-local space. Everything the player can look at
 * and get a prompt for, except the seats (generated from the slot list) and
 * anything the game places at runtime.
 */
function interactionVolumes() {
  const vol = [];
  const box = (id, type, cx, cy, cz, w, h, d, extra = {}) => vol.push({
    id, type,
    min: [cx - w / 2, cy - h / 2, cz - d / 2],
    max: [cx + w / 2, cy + h / 2, cz + d / 2],
    ...extra,
  });

  for (const side of [-1, 1]) {
    const sx = side > 0 ? 'right' : 'left';
    for (let d = 0; d < CAR.doorZ.length; d++) {
      const dz = CAR.doorZ[d];
      box(`map.${sx}.${d}`, 'routemap', side * (CAR.halfWidth - 0.10), 2.11, dz, 0.18, 0.34, 1.2,
        { side, label: 'Route map', verb: 'Read' });
      box(`emergency.${sx}.${d}`, 'emergency',

  if (len < 1e-5) return;
  const yaw = Math.atan2(dx, dz);
  const pitch = Math.acos(Math.max(-1, Math.min(1, dy / len)));
  b.push();
  b.translate((from[0] + to[0]) / 2, (from[1] + to[1]) / 2, (from[2] + to[2]) / 2);
  b.rotateY(yaw);
  b.rotateX(pitch);
  b.cylinder(r1, r0, len, segments, { caps: true, tiles: 1, tilesV: 1 });
  b.pop();
}

function joint(b, at, r, segs = 14) {
  b.push();
  b.translate(at[0], at[1], at[2]);
  b.sphere(r, segs, Math.max(6, Math.round(segs * 0.7)));
  b.pop();
}

/*
 * Baked occlusion for a body, in the same spirit as the carriage's: entirely
 * faked, and the single cheapest thing that stops a figure reading as a set of
 * pale shapes stuck together. Under the chin, inside the arms, under the lap
 * and along anything facing the floor.
 */
function bodyAO(sitting, hipY, chestY) {
  return (x, y, z, nx, ny, nz) => {
    let ao = 1;
    /* Down-facing surfaces see the floor and not much else. */
    if (ny < -0.15) ao *= 0.68 + 0.32 * (1 + ny);
    /* The trough between the arms and the ribs. */
    const inner = Math.max(0, 0.20 - Math.abs(x));
    if (y > hipY && y < chestY) ao *= 1 - inner * 0.9;
    /* Under the chin, where a collar is. */
    const throat = 1 - Math.min(1, Math.abs(y - chestY) / 0.16);
    if (throat > 0 && Math.abs(x) < 0.09 && z > -0.02) ao *= 1 - throat * 0.34;
    /* The lap, and the shadow a seated body casts into its own knees. */
    if (sitting && y < hipY + 0.10 && z > 0.05) ao *= 0.78;
    if (sitting && Math.abs(x) < 0.09 && y < hipY + 0.06) ao *= 0.74;
    /* Backs sit against a seat back. */
    if (z < -0.06) ao *= 0.86;
    /* Everything below the knee is in the well under the bench. */
    ao *= 0.74 + 0.26 * Math.min(1, y / 0.55);
    return Math.max(0.30, Math.min(1, ao));
  };
}

/*
 * A shoe. Four pieces: a sole that runs the whole length, an upper over the
 * middle of it, a lower toe box and a heel counter behind. A single box in
 * dark leather reads as a brick, and a seated passenger puts both of them
 * squarely in the aisle at eye level for anyone standing up.
 */
function shoe(b, x, y, z, W, S) {
  b.push();
  b.translate(x, y, z);
  /* Sole, proud of the upper on every side. */
  b.push();
  b.translate(0, -0.024 * S, 0);
  b.roundedBox(0.106 * W, 0.020 * S, 0.250 * S, 0.010, { tiles: 3 });
  b.pop();
  /* The upper over the instep, tallest at the back. */
  b.push();
  b.translate(0, 0.006 * S, -0.020 * S);
  b.roundedBox(0.098 * W, 0.052 * S, 0.150 * S, 0.022, { tiles: 3 });
  b.pop();
  /* Toe: lower and narrower, so the shoe tapers to a front instead of ending
     in a wall. */
  b.push();
  b.translate(0, -0.006 * S, 0.088 * S);
  b.roundedBox(0.084 * W, 0.034 * S, 0.090 * S, 0.016, { tiles: 3 });
  b.pop();
  /* Heel counter and the block under it. */
  b.push();
  b.translate(0, 0.020 * S, -0.088 * S);
  b.roundedBox(0.092 * W, 0.058 * S, 0.078 * S, 0.020, { tiles: 3 });
  b.pop();
  b.push();
  b.translate(0, -0.036 * S, -0.082 * S);
  b.box(0.090 * W, 0.020 * S, 0.070 * S, { tiles: 3 });
  b.pop();
  b.pop();
}

/*
 * Builds one body in one pose. Origin is on the floor between the feet, +Z is
 * the direction the passenger faces.
 *
 * The numbers are a seated adult on a 0.44m cushion: knees a shade higher than
 * the hips, feet slightly forward, shoulders 0.50m above the seat. Everything
 * else hangs off those.
 */
function buildBody(gl, materials, typeKey, pose, opts = {}) {
  const type = BODY_TYPES[typeKey] || BODY_TYPES.average;
  const b = new Builder();
  b.ao = 1;
  const S = type.scale;
  const W = type.width;

  const sitting = SITTING_POSES.has(pose);
  const seatY = 0.44 * S;
  const hipY = sitting ? seatY + 0.06 * S : 0.92 * S;
  const shoulderY = sitting ? seatY + 0.50 * S : 1.42 * S;
  b.aoFn = bodyAO(sitting, hipY, shoulderY);
  const shoulderX = 0.185 * W * type.shoulder;
  const hipX = 0.10 * W;

  /* --- legs --- */
  b.material('legs');
  if (sitting) {
    const kneeZ = 0.40 * S;
    const kneeY = hipY + 0.015 * S;
    const ankleZ = kneeZ + (pose === 'sitSlump' ? 0.24 : 0.10) * S;
    for (const s of [-1, 1]) {
      const hip = [s * hipX, hipY, 0.02];
      const knee = [s * (hipX + 0.02), kneeY, kneeZ];
      const ankle = [s * (hipX + 0.03), 0.075 * S, ankleZ];
      limb(b, hip, knee, 0.108 * W, 0.080 * W);
      limb(b, knee, ankle, 0.074 * W, 0.056 * W);
      joint(b, knee, 0.076 * W);
      joint(b, hip, 0.098 * W);
      b.material('shoes');
      shoe(b, s * (hipX + 0.03), 0.040 * S, ankleZ + 0.055 * S, W, S);
      b.material('legs');
    }
  } else {
    for (const s of [-1, 1]) {
      const hip = [s * hipX, hipY, 0];
      const knee = [s * (hipX + 0.005), 0.48 * S, 0.015 * S];
      const ankle = [s * (hipX + 0.01), 0.085 * S, 0];
      limb(b, hip, knee, 0.110 * W, 0.077 * W);
      limb(b, knee, ankle, 0.072 * W, 0.054 * W);
      joint(b, knee, 0.074 * W);
      b.material('shoes');
      shoe(b, s * (hipX + 0.01), 0.040 * S, 0.048 * S, W, S);
      b.material('legs');
    }
  }

  /* --- torso --- */
  b.material('coat');
  const lean = pose === 'sitSlump' ? 0.30 : pose === 'sitRead' ? 0.12 : sitting ? 0.10 : 0.02;
  const chestZ = Math.sin(lean) * (shoulderY - hipY);
  const chest = [0, shoulderY - Math.abs(chestZ) * 0.1, chestZ * (sitting ? -0.6 : -0.4)];

  b.push();
  b.translate(0, (hipY + chest[1]) / 2, (chest[2]) / 2);
  b.rotateX(-lean * 0.9);
  b.roundedBox(0.335 * W * type.shoulder, (chest[1] - hipY) * 1.10, 0.225 * W * type.belly, 0.045, { tiles: 2 });
  b.pop();
  /* Shoulders. Two caps and a bar rather than a slab: the silhouette of a
     shoulder is the one part of a seated figure the eye checks. */
  b.push();
  b.translate(0, chest[1] - 0.048 * S, chest[2]);
  b.roundedBox(shoulderX * 2 - 0.01 * W, 0.115 * S, 0.200 * W, 0.055, { tiles: 2 });
  b.pop();
  for (const s of [-1, 1]) {
    b.push();
    b.translate(s * shoulderX, chest[1] - 0.052 * S, chest[2]);
    b.scale(1, 0.86, 0.92);
    b.sphere(0.086 * W, 14, 10);
    b.pop();
  }
  /* Hips */
  b.push();
  b.translate(0, hipY + 0.015 * S, sitting ? -0.04 : 0);
  b.roundedBox(0.30 * W, 0.165 * S, 0.24 * W * type.belly, 0.04, { tiles: 2 });
  b.pop();

  /*
   * The front of the coat.
   *
   * There used to be a great deal more of this: a seam, two lapels rotated on
   * two axes, pocket flaps, three buttons. Every one of them was a separate
   * solid pushed through the front of the torso, and from a seat opposite —
   * which is where the player spends the game — they read as a stack of
   * intersecting slabs with a person somewhere behind them. What is left is a
   * placket that barely stands off the chest and a lapel each side lying flat
   * against it, both following the torso's own lean, and nothing at all in the
   * middle of the chest where the eye goes first.
   */
  /*
   * The torso's own front face is at half its depth. Anything laid on the coat
   * has to straddle that plane rather than sit level with it: a face at the
   * same depth as the face underneath it is a coin flip per pixel, and the
   * chest came back covered in a stepped, crawling pattern that looked like a
   * broken texture. These are centred on the surface and thick enough that
   * neither of their faces can land on it.
   */
  const torsoFrontZ = chest[2] + 0.1125 * W * type.belly;
  const torsoH = chest[1] - hipY;
  b.push();
  b.translate(0, hipY + torsoH * 0.52, torsoFrontZ);
  b.rotateX(-lean * 0.9);
  b.box(0.022 * W, torsoH * 0.94, 0.016, { tiles: 4 });
  b.pop();
  for (const s of [-1, 1]) {
    b.push();
    b.translate(s * 0.052 * W, chest[1] - 0.135 * S, torsoFrontZ - 0.002);
    b.rotateX(-lean * 0.9);
    b.rotateZ(s * 0.24);
    b.box(0.060 * W, 0.175 * S, 0.016, { tiles: 3 });
    b.pop();
  }

  /*
   * The cut of the coat, which is the cheapest silhouette difference there is
   * and the reason six passengers used to look like one passenger six times.
   */
  const cut = opts.cut || 'long';
  if (cut === 'long') {
    /* Skirts of an overcoat, over the hips and down. On a seated figure it
       spreads across the cushion; standing, it falls to mid-thigh. */
    const dropY = sitting ? hipY - 0.04 * S : hipY - 0.24 * S;
    b.push();
    b.translate(0, (hipY + dropY) / 2, (sitting ? -0.02 : 0));
    b.roundedBox(0.34 * W, hipY - dropY + 0.10 * S, 0.28 * W * type.belly, 0.04, { tiles: 2 });
    b.pop();
  } else if (cut === 'puffer') {
    /* Quilting: bands round the torso, each a shade proud of the one below. */
    const bands = 4;
    for (let i = 0; i < bands; i++) {
      const t = i / (bands - 1);
      const y = hipY + (chest[1] - hipY) * (0.12 + t * 0.74);
      const bulge = 1 + 0.045 * Math.sin(t * Math.PI);
      b.push();
      b.translate(0, y, chest[2] * 0.4);
      b.rotateX(-lean * 0.6);
      b.roundedBox(0.352 * W * type.shoulder * bulge, 0.115 * S,
        0.245 * W * type.belly * bulge, 0.045, { tiles: 2 });
      b.pop();
    }
  }

  /*
   * Collar and neck.
   *
   * cylinder() is built along Y. This one was rotated a quarter turn about X,
   * which laid it on its side and drove a five-centimetre tube straight
   * through the middle of the chest, pointing at whoever was sitting
   * opposite. Upright and flared — narrow at the throat, wide where it meets
   * the shoulders — it is a coat collar.
   */
  b.push();
  b.translate(0, chest[1] + 0.030 * S, chest[2] + 0.004);
  b.cylinder(0.070 * W, 0.098 * W, 0.100 * S, 16, { caps: false });
  b.pop();

  /* The neck runs well up into the head. It used to stop 18mm short of the
     underside of the skull, and a head that does not touch its own body reads
     as floating however good everything else is. */
  b.material('skinPlain');
  limb(b, [0, chest[1] - 0.03 * S, chest[2] - 0.005],
    [0, chest[1] + 0.21 * S, chest[2] + 0.012], 0.060 * W, 0.046 * W, 12);

  /* --- arms --- */
  const arms = ARM_POSES[pose] || ARM_POSES.sit;
  for (const s of [-1, 1]) {
    const shoulder = [s * shoulderX, chest[1] - 0.045 * S, chest[2]];
    const elbow = [
      s * (shoulderX + arms.elbow[0]),
      chest[1] + arms.elbow[1] * S,
      chest[2] + arms.elbow[2] * S,
    ];
    const wrist = [
      s * (shoulderX + arms.wrist[0]),
      chest[1] + arms.wrist[1] * S,
      chest[2] + arms.wrist[2] * S,
    ];
    b.material('coat');
    limb(b, shoulder, elbow, 0.078 * W, 0.064 * W);
    limb(b, elbow, wrist, 0.062 * W, 0.050 * W);
    joint(b, elbow, 0.060 * W);
    /* A cuff, so the sleeve ends somewhere instead of dissolving. */
    joint(b, [
      wrist[0] + (elbow[0] - wrist[0]) * 0.13,
      wrist[1] + (elbow[1] - wrist[1]) * 0.13,
      wrist[2] + (elbow[2] - wrist[2]) * 0.13,
    ], 0.053 * W);
    b.material('skinPlain');
    /* Hand: a flattened block with a thumb, which at two metres is the
       difference between an arm and a tube. */
    const hand = [
      wrist[0] + (wrist[0] - elbow[0]) * 0.30,
      wrist[1] + (wrist[1] - elbow[1]) * 0.30,
      wrist[2] + (wrist[2] - elbow[2]) * 0.30,
    ];
    joint(b, wrist, 0.032 * W);
    b.push();
    b.translate(hand[0], hand[1], hand[2]);
    b.rotateY(s * 0.22);
    b.rotateX(0.18);
    /*
     * Palm, fingers, thumb. A hand is about ten centimetres long, eight
     * across and under three thick; this was a nine-centimetre cube of three
     * smaller cubes, which is why it read as a fistful of dice rather than a
     * hand resting in a lap. Flat and forward now, with the bevel doing the
     * knuckles.
     */
    b.roundedBox(0.072 * W, 0.028 * S, 0.070 * S, 0.012, { tiles: 3 });
    b.push();
    b.translate(0, -0.004 * S, 0.062 * S);
    b.rotateX(0.26);
    b.roundedBox(0.064 * W, 0.024 * S, 0.058 * S, 0.011, { tiles: 3 });
    b.pop();
    b.push();
    b.translate(s * 0.040 * W, 0.002 * S, 0.016 * S);
    b.rotateY(-s * 0.42);
    b.roundedBox(0.024 * W, 0.023 * S, 0.052 * S, 0.009, { tiles: 3 });
    b.pop();
    b.pop();
  }

  /* --- what they are holding --- */
  if (pose === 'sitRead') {
    /* Held, not brandished. At 0.44 x 0.40 and dead white this was a
       billboard bolted to the passenger's chest, and it hid the whole
       performance behind it. */
    b.material('prop');
    b.push();
    b.translate(0, chest[1] - 0.115 * S, chest[2] + 0.235 * S);
    b.rotateX(-0.62);
    b.rotateZ(0.05);
    b.box(0.285, 0.235, 0.004, { tiles: 1 });
    b.pop();
    b.push();
    b.translate(0, chest[1] - 0.112 * S, chest[2] + 0.228 * S);
    b.rotateX(-0.62);
    b.rotateZ(-0.04);
    b.box(0.265, 0.215, 0.004, { tiles: 1 });
    b.pop();
  } else if (pose === 'sitPhone') {
    b.material('screen');
    b.push();
    b.translate(0, chest[1] - 0.20 * S, chest[2] + 0.26 * S);
    b.rotateX(-1.15);
    b.box(0.075, 0.15, 0.008, { tiles: 1 });
    b.pop();
  }

  const mesh = b.build(gl, materials);
  mesh.pose = pose;
  mesh.bodyType = typeKey;
  return mesh;
}

/* Elbow and wrist offsets from the shoulder, per pose. Signs on X are applied
   by the caller so the two arms mirror. */
const ARM_POSES = {
  sit: { elbow: [0.035, -0.24, 0.02], wrist: [-0.02, -0.40, 0.20] },
  sitHandsFolded: { elbow: [0.035, -0.24, 0.03], wrist: [-0.10, -0.38, 0.16] },
  sitSlump: { elbow: [0.04, -0.26, -0.02], wrist: [0.02, -0.44, 0.10] },
  sitRead: { elbow: [0.06, -0.20, 0.14], wrist: [-0.02, -0.06, 0.30] },
  sitPhone: { elbow: [0.045, -0.22, 0.06], wrist: [-0.05, -0.22, 0.26] },
  sitStare: { elbow: [0.03, -0.25, 0.02], wrist: [0.00, -0.42, 0.26] },
  stand: { elbow: [0.025, -0.27, 0.01], wrist: [0.00, -0.52, 0.05] },
  standHold: { elbow: [0.03, -0.10, 0.03], wrist: [-0.02, 0.20, 0.02] },
  standStill: { elbow: [0.02, -0.28, 0.0], wrist: [0.0, -0.54, 0.0] },
};

/*
 * A head. Two groups — skin (which carries the face texture) and hair — so a
 * passenger's expression can be swapped by pointing the skin group's map at a
 * different face without rebuilding anything.
 */
/*
 * The profile of a skull, by latitude. v = 0 is the crown and v = 1 the chin.
 *
 * A head is not a ball, and a ball is what every passenger had. The cranium is
 * the widest part and sits high; below the cheekbones it narrows fast to a
 * chin about half the width, and the chin comes forward as it goes. The face
 * texture is unaffected — the eyes stay at v = 0.40, in the full-width part,
 * and the mouth at v = 0.62, on the taper, which is where a mouth is.
 */
function skullProfile(v) {
  let r;
  if (v < 0.26) r = 0.80 + 0.20 * (v / 0.26);                       // crown
  else if (v < 0.52) r = 1;                                          // cranium
  else r = 1 - 0.46 * Math.pow((v - 0.52) / 0.48, 1.35);             // jaw to chin
  const z = v > 0.52 ? Math.pow((v - 0.52) / 0.48, 1.6) * 0.020 : 0; // chin forward
  return { r, z };
}

function buildHead(gl, materials, style, opts = {}) {
  const b = new Builder();
  b.ao = 1;
  /* Occlusion for a head: the underside of the jaw, the back of the neck and
     the sockets around the eyes, all of which a bare sphere lacks entirely. */
  b.aoFn = (x, y, z) => {
    let ao = 1;
    if (y < -0.03) ao *= 0.74 + 0.26 * Math.min(1, (y + 0.13) / 0.10);   // under the jaw
    if (z < -0.02) ao *= 0.90;                                            // back of the skull
    return Math.max(0.45, Math.min(1, ao));
  };

  /* The one sphere that wears the face. */
  b.material('skin');
  b.push();
  b.sphere(0.098, 30, 24, { scaleZ: 1.06, scaleY: 1.14, profile: skullProfile });
  b.pop();

  b.material('skinPlain');
  /*
   * Jaw and nose, and nothing else.
   *
   * These have to stay *inside* the head sphere everywhere except at the
   * silhouette, because the head sphere is the only part of a passenger that
   * wears the face. A brow ridge lived here briefly and stuck two centimetres
   * out in front at eye height, across the full width of the skull — so every
   * passenger in the game had a blank white head, and it looked for all the
   * world like a texture that had failed to load.
   */
  /* The jaw is in the profile now; only the nose is left. */
  b.push();
  b.translate(0, -0.012, 0.092);
  b.scale(0.30, 0.52, 0.50);
  b.sphere(0.040, 10, 8);
  b.pop();
  /* Ears, which matter only because their absence is noticeable in profile. */
  for (const s of [-1, 1]) {
    b.push();
    b.translate(s * 0.094, -0.004, -0.006);
    b.scale(0.38, 1, 0.72);
    b.sphere(0.032, 9, 7);
    b.pop();
  }

  /*
   * Hair, hats and hoods, all built to one rule: nothing may sit closer to the
   * camera than the head sphere anywhere in the face region, because the head
   * sphere is the only part of a passenger wearing a face. A cap dome that
   * reaches down past the eyes, or a peak at eye height rather than brow
   * height, does not shade a face — it deletes it.
   *
   * The head sphere is radius 0.098 with 1.14 on Y and 1.06 on Z, so its front
   * is at z = 0.104 at eye level (y = 0.035) and its widest is x = 0.098.
   * Every number below is checked against those two.
   */
  b.material('hair');
  switch (style) {
    case 'bald':
      break;
    case 'long':
      /* A mass at the back and a crown, rather than a dome over everything. */
      b.push();
      b.translate(0, 0.010, -0.040);
      b.sphere(0.105, 18, 13, { scaleY: 1.06, scaleZ: 0.85 });
      b.pop();
      b.push();
      b.translate(0, 0.055, -0.010);
      b.sphere(0.100, 18, 12, { scaleY: 0.70 });
      b.pop();
      /* Fall of hair down the back and past the jaw on both sides. */
      b.push();
      b.translate(0, -0.095, -0.052);
      b.scale(1, 1, 0.62);
      b.sphere(0.098, 14, 11, { scaleY: 1.5 });
      b.pop();
      for (const s of [-1, 1]) {
        b.push();
        b.translate(s * 0.082, -0.055, -0.012);
        b.scale(0.55, 1.5, 0.85);
        b.sphere(0.052, 10, 8);
        b.pop();
      }
      /* A fringe, so the hairline is not a bald curve. */
      b.push();
      b.translate(0, 0.052, 0.058);
      b.scale(1, 0.42, 0.55);
      b.sphere(0.095, 14, 10);
      b.pop();
      break;
    case 'cap':
      /* Crown sat high with a fast taper, so its edge is at the hairline. */
      b.push();
      b.translate(0, 0.070, -0.004);
      b.sphere(0.103, 22, 12, { scaleY: 0.52 });
      b.pop();
      /* Peak at brow height. Anything lower is a blindfold. */
      b.push();
      b.translate(0, 0.052, 0.094);
      b.rotateX(0.20);
      b.box(0.150, 0.010, 0.068, { tiles: 3 });
      b.pop();
      /*
       * The band round the base. It was a quarter turn out about X, which
       * stood it up as a ten-centimetre black disc through the middle of the
       * head — from under the chin to above the crown, edge-on to anyone
       * sitting opposite. That disc, not the cap, is what was covering every
       * face in the carriage.
       */
      b.push();
      b.translate(0, 0.048, -0.004);
      b.cylinder(0.102, 0.104, 0.022, 22, { caps: false });
      b.pop();
      break;
    case 'hood':
      /* Pulled back off the face, so there is a face in there to not quite
         see. A hood centred on the head simply replaces it with a larger
         head. */
      b.push();
      b.translate(0, 0.014, -0.052);
      b.sphere(0.134, 20, 14, { scaleY: 1.06, scaleZ: 0.95 });
      b.pop();
      /* The rim of the opening: a ring whose axis points forward, so the hole
         in it is the hole the face looks out of. About Z it was a ring across
         the head instead, which is a visor. */
      b.push();
      b.translate(0, 0.014, 0.040);
      b.rotateX(Math.PI / 2 - 0.14);
      b.cylinder(0.104, 0.110, 0.030, 22, { caps: false });
      b.pop();
      break;
    case 'headphones':
      b.push();
      b.translate(0, 0.050, -0.010);
      b.sphere(0.101, 18, 12, { scaleY: 0.78 });
      b.pop();
      b.material('gear');
      for (const s of [-1, 1]) {
        b.push();
        b.translate(s * 0.104, 0.0, -0.006);
        b.rotateZ(Math.PI / 2);
        b.cylinder(0.040, 0.040, 0.030, 12, { caps: true });
        b.pop();
      }
      b.push();
      b.translate(0, 0.096, -0.010);
      b.rotateZ(Math.PI / 2);
      b.cylinder(0.012, 0.012, 0.20, 8, { caps: true });
      b.pop();
      break;
    case 'scarf':
      b.push();
      b.translate(0, 0.046, -0.010);
      b.sphere(0.100, 18, 12, { scaleY: 0.86 });

    this.rng = rng;

     stopping the ones already running. */

     * running through the arrival, the whole dwell and the doors, so by the
     * time the train pulled out it was always past due and something fired on
     * the first frame of every departure — seven stations, seven anomalies,
     * all on the same beat. A player does not need to know why that felt
     * mechanical to feel it.

    const gap = clamp(34 - intensity * 3.4, this.nightmare ? 6 : 11, 40);

      return false;

    this.fired.push(def.id);
    this.active.push({ handle, elapsed: 0, id: def.id });
    ctx.emit('anomaly', { id: def.id });
    return true;
  }

  clear(ctx) {
    for (const h of this.active) if (h.handle.end) h.handle.end(ctx);
    this.active.length = 0;
  }
