<style>

  * { box-sizing: border-box; }
  html, body {

    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  /* The whole game is one canvas. Everything around it is chrome that gets
     out of the way — the point of the page is the 256x240 picture. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    touch-action: none;
  }
  canvas#screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    /* Sized in JS: as large as the window allows, snapped to a whole multiple
       of 256x240 when that is close, so the picture fills the screen without
       the art turning to mush. See fit() in src/main.js. */
  }
  #hint {
    position: fixed; inset-inline: 0; bottom: 6px;
    text-align: center; font-size: 11px; line-height: 1.7;
    color: #55606f; pointer-events: none; user-select: none;
  }
  #hint b { color: #7d8899; font-weight: 600; }
  #hint .pad { color: #6f9a72; }
  /* Hidden in fullscreen and on short windows: the picture is the point. */
  @media (max-height: 560px) { #hint { display: none; } }
  :fullscreen #hint, :fullscreen #fullscreen { display: none; }

  /* Fullscreen button. Sits out of the way and stays reachable. */
  #fullscreen {
    position: fixed; inset-inline-end: 10px; top: 10px;
    width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #ffffff26; border-radius: 8px;
    background: #ffffff10; color: #8b95a5; cursor: pointer;
    font: inherit; font-size: 15px; line-height: 1;
  }
  #fullscreen:hover { background: #ffffff1f; color: #d8dee9; }

  /* Touch pad. Only shown on devices that actually have touch — a mouse user
     gets nothing over the picture. */
  #pad { display: none; }
  body.touch #pad {
    display: block; position: fixed; inset: 0; pointer-events: none;
  }
  #pad button {
    position: absolute; pointer-events: auto;
    border: 2px solid #ffffff30; background: #ffffff14; color: #fff;
    border-radius: 999px; font: inherit; font-size: 20px; font-weight: 700;
    width: 62px; height: 62px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
    user-select: none; touch-action: none;

  #pad button:active, #pad button.on { background: #ffffff3d; border-color: #ffffff70; }
  #pad .left  { inset-inline-start: 16px; bottom: 90px; }
  #pad .right { inset-inline-start: 92px; bottom: 90px; }
  #pad .down  { inset-inline-start: 54px; bottom: 22px; }
  #pad .up    { inset-inline-start: 54px; bottom: 158px; }
  #pad .b     { inset-inline-end: 100px; bottom: 40px; background: #ff5a4a24; border-color: #ff8a7a55; }
  #pad .a     { inset-inline-end: 20px;  bottom: 96px; background: #4aff7a24; border-color: #7aff9a55; }
  #pad .start { inset-inline-end: 20px;  top: 16px; width: auto; height: 34px; padding: 0 14px; font-size: 13px; }

  /* Shown only if the browser cannot run the game at all. */
  #fallback { position: fixed; inset: 0; display: none; padding: 32px;
    align-items: center; justify-content: center; text-align: center; line-height: 1.8; }
</style>

 * loop.js — a fixed 60Hz step with a rendered frame on top.
 *
 * The physics in game/constants.js are per-frame values lifted from a machine
 * that ran at exactly 60.098Hz and never missed. Feeding them a variable dt
 * would quietly change every jump arc with the refresh rate: on a 144Hz laptop
 * the same held jump would clear a different gap than on a 60Hz one. So the
 * simulation always advances in whole 1/60 steps and the display just draws
 * whatever the last step produced.
 *
 * Two guards matter. A backgrounded tab hands back a multi-second delta on
 * return, so the accumulator is clamped — better to drop time than to run two
 * hundred steps at once and teleport the player through a wall. And a slow
 * frame is allowed to run at most five steps, so a machine that cannot keep up
 * runs the game slightly slow instead of spiralling.
 */

const MAX_STEPS = 5;
const MAX_ACC = 0.25;

function createLoop(step, draw) {
  const dt = 1 / 60;
  let acc = 0;
  let last = 0;
  let raf = 0;
  let running = false;
  let frames = 0;

  function tick(now) {
    if (!running) return;
    raf = requestAnimationFrame(tick);

    const elapsed = last ? (now - last) / 1000 : dt;
    last = now;
    acc = Math.min(acc + elapsed, MAX_ACC);

    let n = 0;
    while (acc >= dt && n < MAX_STEPS) {
      acc -= dt;
      n++;
      frames++;
      step(frames);
    }
    /* Whatever is left over stays in the accumulator rather than being drawn
       as an interpolated in-between frame: at 16px tiles and integer art,
       interpolation reads as jitter, not smoothness. */
    if (n > 0) draw();
  }

  return {
    start() {
      if (running) return;
      running = true;
      last = 0;
      acc = 0;
      raf = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      cancelAnimationFrame(raf);
    },
    get running() { return running; },
    get frames() { return frames; },
  };
}

  return {
    "createLoop": createLoop,
  };

    return true;
  }

  sprite() {
    return {
      name: (this.anim >> 3) & 1 ? 'koopa1' : 'koopa0',
      pal: this.pal,
      wings: this.winged ? ((this.anim >> 2) & 1 ? 'wing1' : 'wing0') : null,
      ox: -1,
    };
  }
}

class Shell extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.variant = (opts && opts.variant) || 'green';
    this.pal = KOOPA_PAL[this.variant] || 'koopa';
    this.w = 14;
    this.h = 15;
    this.x += 1;
    this.moving = false;
    this.wakeTimer = K.SHELL_WAKE;
    this.fireproof = this.variant === 'buzzy';
    this.harmful = false;
    this.kills = 0;
  }

  update(level) {
    if (this.flipped) return this.updateFlipped();
    if (!this.moving) {
      /* A still shell wakes back up into a Koopa if left alone long enough,
         which is what stops a level being cleared by parking shells. */
      if (--this.wakeTimer <= 0) {
        const k = new Koopa(this.world, this.x - 1, this.y - 8, { variant: this.variant });
        k.active = true;
        this.world.spawn(k);
        this.remove = true;
        return;
      }
      this.vx = 0;
    }
    this.walkStep(level);
    if (this.moving) this.anim++;
  }

  kick(dir) {
    this.moving = true;
    this.harmful = true;
    this.vx = K.SHELL_SPEED * dir;
    this.dir = dir;
    this.kills = 0;
    this.world.sfx('kick');
  }

  stop() {
    this.moving = false;
    this.harmful = false;
    this.vx = 0;
    this.wakeTimer = K.SHELL_WAKE;
  }

  onStomp() {
    if (this.moving) { this.stop(); return true; }
    return false;      // world decides: kick it, left or right
  }

  sprite() {
    const wobble = !this.moving && this.wakeTimer < 120 && ((this.wakeTimer >> 2) & 1);
    return { name: wobble ? 'shell_wake' : 'shell', pal: this.pal, ox: -1, oy: -1 };
  }
}

/* ------------------------------------------------------------------ *
 * Spiny — the answer to "can I just stomp everything"
 * ------------------------------------------------------------------ */

class Spiny extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 14;
    this.h = 16;
    this.x += 1;
    this.vx = -K.ENEMY_WALK * 1.2;
    this.stompable = false;
  }

  update(level) {
    if (this.flipped) return this.updateFlipped();
    this.walkStep(level);
    this.anim++;
  }

  sprite() { return { name: 'spiny', pal: 'spiny' }; }
}

/* A Spiny before it lands: Lakitu throws the egg, the egg becomes the Spiny. */
class SpinyEgg extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 14;
    this.h = 16;
    this.vx = (opts && opts.vx) || 0;
    this.vy = -1;
    this.active = true;
  }

  update(level) {
    if (this.flipped) return this.updateFlipped();
    this.walkStep(level);
    this.anim++;
    if (this.onGround) {
      const s = new Spiny(this.world, this.x - 1, this.y, {});
      s.active = true;
      this.world.spawn(s);
      this.remove = true;
    }
  }

  sprite() { return { name: 'spiny_egg', pal: 'spiny' }; }
}

/* ------------------------------------------------------------------ *
 * Piranha Plant — the only enemy that reacts to where you are standing
 * ------------------------------------------------------------------ */

class Piranha extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 24;
    this.pipeTop = this.opts.top !== undefined ? this.opts.top : y;
    this.x = x + 8;                    // centred on the two-tile pipe
    this.pal = this.opts.variant === 'red' ? 'piranhaRed' : 'piranha';
    this.up = false;
    this.timer = 40;
    this.offset = 24;                  // fully retracted
    this.stompable = false;
    this.h = 24;
  }

  update() {
    this.anim++;
    /* Refuses to come out while the player is standing on the pipe. Without
       this rule the plant is a coin flip; with it, standing on the pipe is a
       real option and the level can be built around it. */
    const p = this.world.player;
    const near = Math.abs((p.x + p.w / 2) - (this.x + 8)) < 28;

    if (this.up) {
      this.offset = Math.max(0, this.offset - 0.75);
      if (this.offset === 0 && --this.timer <= 0) { this.up = false; this.timer = 60; }
    } else {
      this.offset = Math.min(24, this.offset + 0.75);
      if (this.offset === 24 && --this.timer <= 0 && !near) { this.up = true; this.timer = 50; }
    }
    this.y = this.pipeTop - 24 + this.offset;
    this.harmful = this.offset < 20;
  }

  /* It lives in a pipe: it never falls, and it is never off screen for being
     behind the camera by less than a screen. */
  cull(camera) {
    if (this.x + this.w < camera.x - 160) this.remove = true;
  }

  onStomp() { return false; }

  sprite() {
    if (this.offset >= 23) return null;
    return {
      name: (this.anim >> 3) & 1 ? 'piranha1' : 'piranha0',
      pal: this.pal,
      clipTop: this.offset,
    };
  }
}

/* ------------------------------------------------------------------ *
 * Water
 * ------------------------------------------------------------------ */

class Cheep extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 12;
    this.y += 2;
    this.pal = this.opts.variant === 'gray' ? 'cheepGray' : 'cheep';
    this.speed = this.opts.speed || 0.5;
    this.vx = -this.speed;
    this.baseY = this.y;
    this.wave = !!this.opts.wave;
    this.phase = (x % 64) / 64 * Math.PI * 2;
    this.stompable = false;            // you cannot stomp underwater
  }

  update() {
    this.x += this.vx;
    this.phase += 0.04;
    if (this.wave) this.y = this.baseY + Math.sin(this.phase) * 20;
    this.anim++;
  }

  cull(camera) {
    if (this.x + this.w < camera.x - 64) this.remove = true;
    if (this.y > K.SCREEN_H + 64) this.remove = true;
  }

  sprite() {
    return { name: (this.anim >> 3) & 1 ? 'cheep1' : 'cheep0', pal: this.pal, flip: this.vx > 0 };
  }
}

class Blooper extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 14;
    this.h = 22;
    this.stompable = false;
    this.timer = 0;
    this.chasing = true;
  }

  update() {
    /* Pulse towards the player, then drift down. The rhythm is the whole
       enemy: you get past a Blooper by moving during its glide, not by
       out-running it. */
    this.timer++;
    const p = this.world.player;
    if (this.chasing) {
      this.vy = -1.1;
      this.vx = Math.sign((p.x + p.w / 2) - (this.x + this.w / 2)) * 0.8;
      if (this.timer > 40) { this.chasing = false; this.timer = 0; }
    } else {
      this.vy = 0.7;
      this.vx *= 0.9;
      if (this.timer > 44) { this.chasing = true; this.timer = 0; }
    }
    this.x += this.vx;
    this.y += this.vy;
    this.y = Math.max(16, Math.min(K.SCREEN_H - 40, this.y));
    this.anim++;
  }

  cull(camera) {
    if (this.x + this.w < camera.x - 96) this.remove = true;
  }

  sprite() { return { name: 'blooper', pal: 'blooper' }; }
}

/* ------------------------------------------------------------------ *
 * Hammer Brother
 * ------------------------------------------------------------------ */

class HammerBro extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 14;
    this.h = 24;
    this.x += 1;
    this.vx = -0.4;
    this.throwTimer = 60;
    this.walkTimer = 60;
  }

  update(level) {
    if (this.flipped) return this.updateFlipped();
    this.walkStep(level, { ledgeAware: true });
    this.anim++;

    /* Paces a short beat either side of where it started, so it stays on the
       block it was placed on instead of wandering into the level. */
    if (--this.walkTimer <= 0) {
      this.vx = -this.vx;
      this.dir = -this.dir;
      this.walkTimer = 50 + (this.anim % 30);
    }
    if (Math.abs(this.x - this.spawnX) > 24) {
      this.vx = Math.sign(this.spawnX - this.x) * 0.4;
      this.dir = Math.sign(this.vx);
    }

    if (--this.throwTimer <= 0) {
      const p = this.world.player;
      const towards = Math.sign((p.x + p.w / 2) - (this.x + this.w / 2)) || -1;
      this.world.spawn(new Hammer(this.world, this.x, this.y - 8, { vx: towards * 1.6 }));
      this.throwTimer = 90 - Math.floor(this.world.difficulty * 35);
    }
  }

  sprite() {
    const winding = this.throwTimer < 18;
    return {
      name: winding ? 'hammerbro1' : 'hammerbro0',
      pal: 'hammerbro',
      flip: this.world.player.x < this.x,
      ox: -1,
    };
  }
}

class Hammer extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 10;
    this.h = 12;
    this.vx = (opts && opts.vx) || -1.6;
    this.vy = -4.2;
    this.active = true;
    this.stompable = false;
  }

  update() {
    this.vy += 0.22;
    this.x += this.vx;
    this.y += this.vy;
    this.anim++;
  }

  sprite() { return { name: 'hammer', pal: 'hammer', spin: this.anim }; }
}

/* ------------------------------------------------------------------ *
 * Lakitu — the pressure enemy
 * ------------------------------------------------------------------ */

class Lakitu extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 24;
    this.throwTimer = 120;
    this.stompable = true;
  }

  update() {
    /* Hovers a little ahead of the player and keeps up, which is the point:
       it is not an obstacle in a place, it is a clock. */
    const p = this.world.player;
    const target = p.x + 24;
    this.x += (target - this.x) * 0.035;
    this.y = Math.max(16, this.world.camera.y + 24);
    this.anim++;

    if (--this.throwTimer <= 0) {
      this.world.spawn(new SpinyEgg(this.world, this.x, this.y + 16, {
        vx: Math.sign(p.x - this.x) * 0.8,
      }));
      this.throwTimer = 150 - Math.floor(this.world.difficulty * 60);
    }
  }

  cull() { /* stays until the level ends */ }

  onStomp() { this.kill(); return true; }

  sprite() { return { name: 'lakitu', pal: 'lakitu', flip: this.world.player.x > this.x }; }
}

/* ------------------------------------------------------------------ *
 * Artillery
 * ------------------------------------------------------------------ */

class Cannon extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 16;
    this.period = this.opts.period || 130;
    this.timer = this.period;
    this.harmful = false;
    this.stompable = false;
  }

  update() {
    const p = this.world.player;
    /* Does not fire into the player's face at point blank, and does not fire
       at all once they are past it. */
    const dx = (p.x + p.w / 2) - (this.x + 8);
    if (--this.timer <= 0) {
      this.timer = this.period;
      if (dx < -24 && dx > -SCREEN_W) {
        this.world.spawn(new Bullet(this.world, this.x - 8, this.y, { vx: -2.2 }));
        this.world.sfx('bullet');
      }
    }
  }

  cull(camera) { if (this.x + this.w < camera.x - 96) this.remove = true; }

  sprite() { return { name: 'cannon_top', pal: 'bullet' }; }
}

class Bullet extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 14;
    this.y += 1;
    this.vx = (opts && opts.vx) || -2.2;
    this.active = true;
    this.fireproof = true;             // fire goes straight through it
  }

  update() {
    this.x += this.vx;
    this.anim++;
  }

  onStomp() { this.kill(false); this.world.addScore(200, this.x, this.y); return true; }
  onFireball() { return false; }

  sprite() { return { name: 'bullet', pal: 'bullet', flip: this.vx > 0 }; }
}

/* ------------------------------------------------------------------ *
 * Castle furniture
 * ------------------------------------------------------------------ */

class Podoboo extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 12;
    this.h = 14;
    this.homeY = y;
    this.rise = this.opts.rise || 96;
    this.period = this.opts.period || 140;
    this.timer = (x % this.period) | 0;
    this.stompable = false;
    this.fireproof = true;
    this.launched = false;
  }

  update() {
    this.timer++;
    if (!this.launched) {
      this.y = this.homeY + 8;
      if (this.timer >= this.period) {
        this.timer = 0;
        this.launched = true;
        /* Chosen so the apex lands exactly `rise` above the lava, which is
           what lets a level place one under a ledge and mean it. */
        this.vy = -Math.sqrt(2 * 0.22 * this.rise);
      }
    } else {
      this.vy += 0.22;
      this.y += this.vy;
      if (this.y >= this.homeY + 8) {
        this.y = this.homeY + 8;
        this.launched = false;
        this.timer = 0;
      }
    }
    this.anim++;
  }

  cull(camera) { if (this.x + this.w < camera.x - 96) this.remove = true; }

  sprite() { return { name: 'podoboo', pal: 'podoboo', flipY: this.vy > 0, ox: -2 }; }
}

/*
 * A firebar is a pivot and a list of fireballs on a radius. It has no body of
 * its own — the world tests the player against each ball — which is why it
 * can be six tiles long without being a six-tile rectangle of death.
 */
class Firebar extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 0;
    this.h = 0;
    this.len = this.opts.len || 5;
    this.speed = this.opts.speed || 0.03;
    this.angle = 0;
    this.stompable = false;
    this.harmful = false;              // the balls are, not the pivot
    this.balls = [];
  }

  update() {
    this.angle += this.speed;
    this.balls.length = 0;
    for (let i = 1; i <= this.len; i++) {
      this.balls.push({
        x: this.x + Math.cos(this.angle) * i * 8 - 4,
        y: this.y + Math.sin(this.angle) * i * 8 - 4,
        w: 8, h: 8,
      });
    }
    this.anim++;
  }

  cull(camera) { if (this.x < camera.x - 96) this.remove = true; }

  sprite() { return { name: 'firebar', pal: 'fireball' }; }
}

/* ------------------------------------------------------------------ *
 * Lifts
 * ------------------------------------------------------------------ */

class Platform extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.tiles = this.opts.tiles || 3;
    this.w = this.tiles * 16;
    this.h = 8;
    this.mode = this.opts.mode || 'h';
    this.span = this.opts.span || 64;
    this.speed = this.opts.speed || 0.8;
    this.originX = x;
    this.originY = y;
    this.dir = 1;
    this.harmful = false;
    this.stompable = false;
    this.rider = false;
    this.falling = false;
    this.fallTimer = 0;
    this.isPlatform = true;
  }

  onWake() {
    /* Vertical lifts start mid-track so they are not all in phase. */
    if (this.mode === 'v') this.y = this.originY - this.span / 2;
  }

  update() {
    this.prevX = this.x;
    this.prevY = this.y;
    if (this.mode === 'h') {
      this.x += this.speed * this.dir;
      if (this.x > this.originX + this.span) { this.x = this.originX + this.span; this.dir = -1; }
      if (this.x < this.originX) { this.x = this.originX; this.dir = 1; }
    } else if (this.mode === 'v') {
      this.y += this.speed * this.dir;
      if (this.y > this.originY + this.span / 2) this.dir = -1;
      if (this.y < this.originY - this.span / 2) this.dir = 1;
    } else if (this.mode === 'fall') {
      if (this.falling) {
        this.vy = Math.min(4, this.vy + 0.2);
        this.y += this.vy;
      } else if (this.rider) {
        /* A beat of warning before it goes, so standing on one is a decision
           rather than an ambush. */
        if (++this.fallTimer > 20) this.falling = true;
      } else {
        this.fallTimer = 0;
      }
    }
    this.rider = false;
  }

  cull(camera) {
    if (this.y > K.SCREEN_H + 96) this.remove = true;
    if (this.x + this.w < camera.x - 128) this.remove = true;
  }

  sprite() { return { name: 'platform_lift', pal: 'platform' }; }
}

class Spring extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 32;
    this.harmful = false;
    this.stompable = false;
    this.compress = 0;
    this.isSpring = true;
  }

  update() {
    if (this.compress > 0) this.compress--;
  }

  /* Where the top of the springboard is right now. The world stands the
     player on this and the renderer draws to it, so a squashed spring cannot
     look one height and behave another. */
  compressOffset() {
    return this.compress > 12 ? 22 : this.compress > 0 ? 15 : 8;
  }

  cull(camera) { if (this.x + this.w < camera.x - 96) this.remove = true; }

  sprite() {
    const stage = this.compress > 12 ? 'spring2' : this.compress > 0 ? 'spring1' : 'spring0';
    return { name: stage, pal: 'spring' };
  }
}

class Axe extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    /*
     * Drawn as a 16x16 axe on the floor, but collided with as a column the
     * full height of the screen.
     *
     * The axe is not an object you may pick up, it is the end of the level.
     * Given a hitbox its own size it can be jumped clean over — and since the
     * castle floor runs on past it to the right wall, a player who does that
     * ends up standing at the end of a level that has no way to finish. The
     * original never had this problem because there was nowhere further to
     * go; here the fix is to make the axe unmissable rather than to shorten
     * the floor, so a running leap over the bridge still ends the castle.
     */
    this.drawY = y;
    this.y = 0;
    this.w = 16;
    this.h = K.SCREEN_H;
    this.harmful = false;
    this.stompable = false;
    this.active = true;
  }

  update() { this.anim++; }
  cull() {}

  sprite() { return { name: 'axe', pal: 'axe', oy: this.drawY }; }
}

/* ------------------------------------------------------------------ *
 * The one at the end of the castle
 * ------------------------------------------------------------------ */

class Boss extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 30;
    this.h = 30;
    this.hp = this.opts.hp || 3;
    this.floor = this.opts.floor !== undefined ? this.opts.floor : y + 32;
    this.homeX = x;
    this.range = this.opts.range || 80;
    this.vx = -0.4;
    this.stompable = false;
    this.fireTimer = 90;
    this.hopTimer = 120;
    this.hurtFlash = 0;
    this.active = false;
  }

  onWake() { this.world.onBossSeen(); }

  /* The axe took the bridge out from under him. Not a flip — he goes down
     the way he was standing, which is the only dignified death in the game. */
  plunge() {
    this.plunging = true;
    this.dead = true;
    this.harmful = false;
    this.stompable = false;
    this.vx = 0;
    this.vy = 0;
  }

  update(level) {
    if (this.plunging) {
      this.vy += 0.3;
      this.y += this.vy;
      return;
    }
    if (this.flipped) return this.updateFlipped();
    this.anim++;
    if (this.hurtFlash > 0) this.hurtFlash--;

    /* Paces its bridge, turning at the ends of a fixed range so it never
       walks off into the level or backs the player into a corner. */
    this.x += this.vx;
    if (this.x < this.homeX - this.range) { this.x = this.homeX - this.range; this.vx = Math.abs(this.vx); }
    if (this.x > this.homeX + this.range * 0.4) { this.x = this.homeX + this.range * 0.4; this.vx = -Math.abs(this.vx); }

    this.vy = Math.min(K.ENEMY_MAX_FALL, this.vy + 0.3);
    const hit = moveY(this, level, this.vy);
    if (hit.ground) this.vy = 0;
    this.onGround = hit.ground;

    if (--this.hopTimer <= 0 && this.onGround) {
      this.vy = -3.6;
      this.hopTimer = 130 - Math.floor(this.world.difficulty * 50);
    }

    if (--this.fireTimer <= 0) {
      const p = this.world.player;
      this.world.spawn(new BossFire(this.world, this.x - 8, this.y + 12, {
        vx: -2.4,
        vy: Math.sign((p.y - this.y)) * 0.35,
      }));
      this.world.sfx('bossFire');
      this.fireTimer = 100 - Math.floor(this.world.difficulty * 40);
    }
  }

  cull() {}

  onFireball() {
    this.hurtFlash = 8;
    this.world.sfx('bump');
    if (--this.hp <= 0) {
      this.kill(false);
      this.world.addScore(K.SCORE.boss, this.x, this.y);
      this.world.onBossDefeated();
      return true;
    }
    return false;                      // hit, but not killed: no fireball pop
  }

  onShell() { return this.onFireball(); }
  onStomp() { return false; }

  sprite() {
    return {
      name: (this.anim >> 4) & 1 ? 'boss1' : 'boss0',
      pal: this.hurtFlash > 0 && (this.hurtFlash & 1) ? 'bossAngry' : 'boss',
      flip: false,
      ox: -1,
    };
  }
}

class BossFire extends Entity {
  constructor(world, x, y, opts) {
    super(world, x, y, opts);
    this.w = 16;
    this.h = 8;
    this.vx = (opts && opts.vx) || -2.4;
    this.vy = (opts && opts.vy) || 0;
    this.active = true;
    this.stompable = false;
    this.fireproof = true;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.anim++;
  }

  onFireball() { return false; }
  onShell() { return false; }

  sprite() { return { name: 'boss_fire', pal: 'podoboo', flip: this.vx > 0 }; }
}

/* Names the level format uses, resolved when a level is loaded. */
const ENTITY_TYPES = {
  goomba: Goomba,
  koopa: Koopa,
  shell: Shell,
  spiny: Spiny,
  piranha: Piranha,
  cheep: Cheep,
  blooper: Blooper,
  hammerbro: HammerBro,
  lakitu: Lakitu,
  cannon: Cannon,
  bullet: Bullet,
  podoboo: Podoboo,
  firebar: Firebar,

    }

    case 'select': {
      const next = select.update(input);
      if (next === 'title') toTitle();
      else if (next && next.go === 'play') {
        run = newRun(next.id);
        startLevel(next.id, false);
      }
      break;
    }

    case 'card': {
      modeTimer++;
      if (modeTimer > 110 || input.pressed('start') || input.pressed('a')) {
        mode = 'play';
        modeTimer = 0;
        audio.playMusic(world.level.music);
      }
      break;
    }

    case 'play': {
      if (input.pressed('start')) {
        paused = !paused;
        audio.sfx('pause');
        quitArmed = paused ? 40 : 0;
        if (paused) audio.stopMusic();
        else audio.playMusic(world.level.music);
      }
      if (paused) {
        /* A second press of start while already paused leaves the level.
           Armed for a moment first so the press that paused cannot also
           quit. */
        if (quitArmed > 0) quitArmed--;
        else if (input.pressed('b')) { paused = false; toSelect(); }
        break;
      }
      const state = world.update();
      if (state === 'dead' && world.stateTimer > 160) onDeath();
      else if (state === 'finished') onCleared();
      break;
    }

    case 'dead': {
      modeTimer++;
      if (modeTimer > 40) {
        if (run.lives > 0) startLevel(run.levelId, false);
        else { mode = 'over'; modeTimer = 0; audio.playJingle('gameOver'); }
      }
      break;
    }

    case 'clear': {
      modeTimer++;
      /* The clock is cashed in at fifty points a unit, counted down rather
         than added at once, with a tick for each — the sound is most of the
         reward. */
      if (world.timeLeft > 0 && modeTimer % 2 === 0) {
        const chunk = Math.min(world.timeLeft, 5);
        world.timeLeft -= chunk;
        run.score += chunk * TIME_BONUS;
        audio.sfx('coin');
      }
      if (world.timeLeft <= 0 && modeTimer > 150) {
        const next = run.levelId + 1;
        if (next > 100) { mode = 'ending'; ending.enter(); }
        else startLevel(next, true);
      }
      break;
    }

    case 'over': {
      modeTimer++;
      if (modeTimer > 200 || input.pressed('start')) toTitle();
      break;
    }

    case 'ending': {
      const next = ending.update(input);
      if (next === 'title') toTitle();
      break;
    }

    default: break;
  }

  if (input.pressed('mute')) {
    audio.setMuted(!audio.muted);
    save.setMuted(audio.muted);
  }
  if (input.pressed('fullscreen')) toggleFullscreen();
  input.flush();
}

function onDeath() {
  run.lives--;
  run.power = 0;
  mode = 'dead';
  modeTimer = 0;
  save.recordScore(run.score);
}

function onCleared() {
  mode = 'clear';
  modeTimer = 0;
  run.power = world.player.power;
  save.clear(run.levelId, {
    timeLeft: world.timeLeft,
    coins: run.coins,
    score: run.score,
  });
  save.recordScore(run.score);
  save.setCurrent(Math.min(100, run.levelId + 1));
  audio.playJingle('clear');
}

/* ------------------------------------------------------------------ *
 * The frame
 * ------------------------------------------------------------------ */

let frame = 0;

function draw() {
  frame++;
  switch (mode) {
    case 'title': title.draw(frame); break;
    case 'select': select.draw(frame); break;

    case 'card':
      drawLevelCard(ctx, levelDef, run, worldName(levelDef.world));
      /* The player sprite next to the life count. */
      drawSprite('small_idle', 'mario', SCREEN_W / 2 - 34, 128);
      break;

    case 'play':
    case 'dead':
      renderer.draw(world, frame);
      drawHud(ctx, world, run, frame);
      if (paused) drawPause(ctx);
      break;

    case 'clear':
      renderer.draw(world, frame);
      drawHud(ctx, world, run, frame);
      if (modeTimer > 150) drawClearCard(ctx, world, run, levelDef);
      break;

    case 'over': drawGameOver(ctx, run); break;
    case 'ending': ending.draw(frame); break;
    default: break;
  }
}

/* ------------------------------------------------------------------ *
 * Go
 * ------------------------------------------------------------------ */

const loop = createLoop(step, draw);

/* The audio context can only be created inside a user gesture, so the first
   real input unlocks it and every later one is a no-op. */
const unlock = () => audio.unlock();
window.addEventListener('keydown', unlock);
window.addEventListener('pointerdown', unlock);
window.addEventListener('touchstart', unlock, { passive: true });

/* The corner button, for people who would rather not learn a key. It is a
   real click, so the fullscreen request is inside a gesture. */
const fsButton = document.getElementById('fullscreen');
if (fsButton) {
  fsButton.addEventListener('click', () => { audio.unlock(); toggleFullscreen(); });
}

fit();
toTitle();
loop.start();

/* A backgrounded tab should not keep playing music into a room nobody is
   looking at, and coming back should not fast-forward the level. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { audio.stopMusic(); loop.stop(); }
  else loop.start();
});

/* Exposed for tools/mario-smoke.mjs, which drives a real browser through a
   real level and asserts what happened. Nothing in the game reads it — it is
   here so the test can read the map the way a player reads it (where is the
   floor, where is the wall) instead of guessing from pixels. */
window.__mario = {
  tiles: { isSolid, isSemiSolid },
  get mode() { return mode; },
  get world() { return world; },
  get run() { return run; },
  get frame() { return frame; },
  input,
  toggleFullscreen,
  startLevel,
  /* Drops the WORLD x-y card, which the harness has no reason to sit through. */
  skipCard() { if (mode === 'card') { mode = 'play'; modeTimer = 0; } },
  /* A clean run, so one test level cannot start the next one holding a fire
     flower it earned in a different test. */
  resetRun(id) { run = newRun(id || 1); },
  goSelect: toSelect,
  goTitle: toTitle,
  catalog: CATALOG,
};

  return {

  };
})();

})();
</script>
</body>
</html>
