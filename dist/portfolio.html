/* tokens.css — design tokens, carried over from the reference program document. */

:root {
  /* surfaces */
  --night: #0E1520;
  --steel: #182435;
  --steel-2: #212F44;
  --steel-3: #28374F;
  --line: #2C3D57;
  --line-soft: #223047;

  /* ink */
  --chalk: #EAF0F8;
  --dim: #8298B4;
  /* Lightened to clear WCAG AA (4.5:1) for body text on the card surface;
     the old #5A6E8A measured 3.0:1 there and 3.5:1 on the page. */
  --dimmer: #788CA8;

  /* accents */
  --amber: #FFB13C;
  --amber-deep: #8A5F1E;
  --amber-wash: rgba(255, 177, 60, .11);
  --cyan: #56D9CE;
  --cyan-deep: #1E5A56;
  --cyan-wash: rgba(86, 217, 206, .10);
  --rose: #FF7A85;
  --rose-deep: #7A2B33;

  /* type */
  --display: "Secular One", system-ui, sans-serif;
  --body: "Assistant", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;

  /* accents, continued */
  /* The second amber. A single flat accent reads as a fill; a pair reads as a
     surface with light on it, which is what makes a primary button look
     pressable rather than painted. */
  --amber-2: #FF8A2B;
  --amber-grad: linear-gradient(135deg, var(--amber), var(--amber-2));

  /* geometry */
  /* Larger than they were. At 14px a card corner reads as a rounded rectangle;
     at 18 it reads as a card, which is the difference between the interface
     looking assembled and looking designed. */
  --r: 18px;
  --r-sm: 12px;
  --r-pill: 999px;
  --wrap: 760px;
  --gap: 9px;

  /* motion */
  --ease: cubic-bezier(.2, .8, .3, 1);
  --fast: .18s;
  --mid: .28s;
}

/* The rig renders into these. Kept next to the tokens so the figure and the
   chrome never drift apart. */
:root {
  --rig-bone: var(--chalk);
  --rig-far: #4A5F7E;
  --rig-prop: #3A4F6E;
  --rig-ground: #2C3D57;
  --rig-load: var(--amber);
}


/* base.css — reset, typography, layout primitives. */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--night);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding: 0 0 72px;
  background-image: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255, 177, 60, .10), transparent 70%);
  background-attachment: fixed;
  overflow-x: hidden;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 18px; }

h1 {
  font-family: var(--display);
  font-size: clamp(30px, 7.5vw, 46px);
  line-height: 1.12;
  font-weight: 400;
  letter-spacing: -.01em;
}
h1 em { font-style: normal; color: var(--amber); }

h2 { font-family: var(--display); font-weight: 400; font-size: clamp(23px, 5.4vw, 31px); line-height: 1.2; }
h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin-bottom: 6px; }
h4 { font-size: 15px; font-weight: 700; margin-bottom: 5px; }

.eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
  color: var(--amber); text-transform: uppercase; margin-bottom: 10px;
}
.sub { color: var(--dim); font-size: 15px; margin-top: 10px; max-width: 52ch; }
.lead { color: var(--dim); font-size: 14.5px; margin-bottom: 14px; }
.rule { border-top: 1px solid var(--line); margin: 36px 0 26px; }

a { color: var(--amber); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Tables — RTL-aware, same look as the reference document. */
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em;
  color: var(--dim); font-weight: 400; text-transform: uppercase;
}
td:first-child { font-weight: 600; }
td.n { font-family: var(--mono); color: var(--amber); white-space: nowrap; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

footer {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
  color: var(--dim); font-size: 12.5px; line-height: 1.7;
}
.fbrand { display: block; font-family: var(--display); font-size: 15px; color: var(--amber); margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}


/* components.css — every UI component in the app. */

/* ---------------- buttons ---------------- */
.btn {
  font-family: var(--body); font-size: 13px; font-weight: 600;
  background: var(--steel-2); color: var(--chalk);
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 7px 15px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: border-color var(--fast), background var(--fast), transform .1s;
}
.btn:hover { border-color: var(--amber); background: var(--steel-3); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[disabled]:hover { border-color: var(--line); background: var(--steel-2); }
.btn .ico { font-family: var(--mono); font-size: 14px; color: var(--amber); line-height: 1; }
.btn.on { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }
/* The gradient is the difference between a painted rectangle and something that
   looks like it can be pressed. */
.btn.primary {
  background: var(--amber-grad); color: #1A1206; border-color: transparent; font-weight: 700;
  box-shadow: 0 6px 18px rgba(255, 138, 43, .22);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary .ico { color: #1A1206; }
.btn.ghost { background: transparent; }
.btn.lg { padding: 11px 22px; font-size: 15px; }
.btn.danger:hover { border-color: var(--rose); color: var(--rose); }

.iconbtn {
  width: 34px; height: 34px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--steel-2);
  color: var(--chalk); cursor: pointer; font-size: 15px;
  display: grid; place-items: center;
  transition: border-color var(--fast), background var(--fast), transform .12s;
  font-family: var(--mono); line-height: 1; flex: none;
}
.iconbtn:hover { border-color: var(--amber); color: var(--amber); }
.iconbtn:active { transform: scale(.9); }
.iconbtn.check.on { background: var(--cyan-wash); border-color: var(--cyan); color: var(--cyan); }
.iconbtn.play.on { border-color: var(--amber); color: var(--amber); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 30px; }

/* ---------------- chips & facts ---------------- */
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.fact {
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 5px 13px; font-size: 13px; color: var(--dim);
  background: rgba(24, 36, 53, .6);
}
.fact b { color: var(--chalk); font-family: var(--mono); font-weight: 600; }

.chip {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  background: var(--amber-wash); color: var(--amber);
  border: 1px solid rgba(255, 177, 60, .22);
}
.chip.time { background: var(--cyan-wash); color: var(--cyan); border-color: rgba(86, 217, 206, .22); }
.chip.rest { background: transparent; color: var(--dim); border-color: var(--line); }
.chip.warn { background: rgba(255, 122, 133, .1); color: var(--rose); border-color: rgba(255, 122, 133, .28); }
/* Same treatment for the welcome fact chip that reports storage is unavailable. */
.fact.warn { color: var(--rose); border-color: rgba(255, 122, 133, .28); }
.fact.warn b { color: var(--rose); }

/* ---------------- cards ---------------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--gap); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--steel); padding: 14px 15px; }
.card p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.card .k {
  font-family: var(--mono); font-size: 10.5px; color: var(--amber);
  letter-spacing: .09em; display: block; margin-bottom: 7px;
}

.warnbox {
  border: 1px solid var(--amber-deep); border-radius: var(--r);
  background: rgba(255, 177, 60, .055); padding: 15px 16px; margin-top: 12px;
}
.warnbox h4 { font-size: 15px; margin-bottom: 7px; color: var(--amber); }
.warnbox ul { padding-inline-start: 18px; color: var(--dim); font-size: 13.5px; }
.warnbox li { margin: 4px 0; }
.warnbox li b { color: var(--chalk); }
.warnbox.hot { border-color: var(--rose-deep); background: rgba(255, 122, 133, .05); }
.warnbox.hot h4 { color: var(--rose); }

.chain {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 15px; margin-top: 10px;
}
.chain i {
  font-style: normal; font-family: var(--mono); font-size: 12.5px;
  background: var(--steel-2); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 7px; color: var(--chalk);
}
.chain s { text-decoration: none; color: var(--amber); font-family: var(--mono); font-size: 13px; }

.phase {
  display: flex; gap: 13px; padding: 13px 0;
  border-bottom: 1px solid var(--line); align-items: baseline;
}
.phase .w { font-family: var(--mono); font-size: 11.5px; color: var(--amber); white-space: nowrap; min-width: 82px; }
.phase .t { font-size: 14.5px; }
.phase .t b { display: block; font-weight: 700; margin-bottom: 2px; }
.phase .t span { color: var(--dim); font-size: 13.5px; }
.phase.now { background: linear-gradient(90deg, var(--amber-wash), transparent); }

/* ---------------- week strip ---------------- */
.week { margin: 30px 0 8px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.daycell {
  border: 0; background: none; padding: 0; cursor: default;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: inherit; color: inherit;
}
.daycell .bar {
  width: 100%; border-radius: 8px 8px 4px 4px;
  background: var(--steel); border: 1px solid var(--line);
  height: 26px; transition: all var(--mid) var(--ease);
  position: relative; overflow: hidden;
}
.daycell.train { cursor: pointer; }
.daycell.train .bar { height: 64px; background: var(--steel-2); border-color: #3A4F6E; }
.daycell.train .bar::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--amber-deep); }
.daycell.train:hover .bar { border-color: var(--amber-deep); }
.daycell.on .bar {
  background: linear-gradient(180deg, rgba(255, 177, 60, .20), rgba(255, 177, 60, .04));
  border-color: var(--amber); height: 78px;
}
.daycell.on .bar::after { background: var(--amber); height: 4px; }
.daycell .fill {
  position: absolute; inset: auto 0 0 0; background: var(--cyan-wash);
  border-top: 1px solid var(--cyan-deep); transition: height var(--mid) var(--ease);
}
.daycell .letter { font-family: var(--display); font-size: 17px; color: var(--dim); transition: color .2s; }
.daycell.train .letter { color: var(--chalk); }
.daycell.on .letter { color: var(--amber); }
.daycell .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--dim); height: 12px; }
.daycell.on .tag { color: var(--amber); }
.weekfoot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim);
  border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 26px;
}

/* ---------------- workout head ---------------- */
.whead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.whead .meta { font-family: var(--mono); font-size: 11.5px; color: var(--dim); letter-spacing: .05em; }
.focus {
  color: var(--dim); font-size: 14.5px; margin: 6px 0 20px;
  border-inline-start: 2px solid var(--amber-deep); padding-inline-start: 12px;
}

/* ---------------- accordion ---------------- */
details.warm {
  border: 1px solid var(--line); border-radius: var(--r);
  background: rgba(24, 36, 53, .5); margin-bottom: 22px; overflow: hidden;
}
details.warm summary {
  cursor: pointer; list-style: none; padding: 13px 16px;
  font-weight: 700; font-size: 14.5px; display: flex;
  justify-content: space-between; align-items: center; gap: 10px;
}
details.warm summary::-webkit-details-marker { display: none; }
details.warm summary span { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: .08em; }
details.warm .inner { padding: 0 16px 15px; color: var(--dim); font-size: 14px; }
details.warm ol { padding-inline-start: 18px; }
details.warm li { margin: 5px 0; }
details.warm li b { color: var(--chalk); font-weight: 600; }

/* ---------------- exercise card ---------------- */
.list { display: flex; flex-direction: column; gap: var(--gap); }
.ex {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 13px 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0 12px; align-items: start;
  transition: border-color .2s, background .2s;
}
.ex:hover { border-color: #3A4F6E; }
.ex.done { opacity: .45; }
.ex.done .name { text-decoration: line-through; text-decoration-color: var(--dim); }
.ex.flash { border-color: var(--amber); background: #1D2B3F; }
.num { font-family: var(--mono); font-size: 12px; color: var(--dim); padding-top: 3px; min-width: 20px; }
.body-col { min-width: 0; }
.name { font-family: var(--display); font-size: 17.5px; font-weight: 400; line-height: 1.3; }
.name-en { font-family: var(--mono); font-size: 10.5px; color: var(--dimmer); letter-spacing: .04em; margin-top: 1px; }
.prescr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.note { font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
.note.caution { color: var(--amber); }
.cues { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
.cue {
  font-size: 11.5px; color: var(--dim); background: var(--steel-2);
  border: 1px solid var(--line-soft); border-radius: 6px; padding: 2px 8px;
}
.lev { display: flex; align-items: center; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.lev .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--dim); }
.lev .rungs { display: flex; gap: 3px; }
.rung { width: 15px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
.rung.f { background: var(--amber); }
.lev .of { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.acts { display: flex; flex-direction: column; gap: 6px; align-items: center; padding-top: 2px; }

/* ---------------- the animation figure ---------------- */
.anim {
  width: 84px; height: 84px; flex: none; border-radius: var(--r-sm);
  background: linear-gradient(180deg, #16212F, #131C29);
  border: 1px solid var(--line-soft); overflow: hidden;
  grid-row: span 2; align-self: start; cursor: pointer;
  transition: border-color var(--fast);
}
.anim:hover { border-color: var(--amber-deep); }
.rig-svg { display: block; width: 100%; height: 100%; }
/* The figure is filled shapes, not strokes — a thin darker outline keeps it
   legible against the card background at 66px without muddying the silhouette. */
.rig-body {
  fill: var(--rig-bone);
  stroke: #0B121C;
  stroke-width: .55;
  stroke-linejoin: round;
}
.rig-torso { fill: #DCE6F2; }
.rig-head { fill: #F2F6FC; }
.rig-far .rig-body { fill: var(--rig-far); stroke: #0A1017; stroke-width: .4; }
.rig-far .rig-torso, .rig-far .rig-head { fill: var(--rig-far); }
/* kept so any older clip or prop referencing the stroke classes still draws */
.rig-bone { stroke: var(--rig-bone); stroke-linecap: round; fill: none; }
.rig-joint { fill: var(--rig-bone); }
.rig-ground { stroke: var(--rig-ground); stroke-linecap: round; }
.rig-prop { stroke: var(--rig-prop); stroke-linecap: round; fill: none; }
.rig-prop-thin { stroke: var(--rig-prop); opacity: .55; fill: none; }
.rig-prop-fill { fill: #22314733; stroke: var(--rig-prop); stroke-width: 1; }
.rig-prop-outline { fill: none; stroke: var(--rig-prop); stroke-width: 1.2; }
.rig-prop-ring { fill: none; stroke: var(--rig-prop); stroke-width: 1.4; }
.rig-prop-band { fill: none; stroke: var(--rig-prop); stroke-width: 1.3; stroke-dasharray: 2 1.6; }
.rig-load-bar { stroke: var(--rig-load); stroke-linecap: round; fill: none; }
.rig-load-fill { fill: var(--rig-load); }
.rig-load-outline { fill: none; stroke: var(--rig-load); stroke-width: 1.4; }

.anim.big { width: 100%; height: auto; aspect-ratio: 1; max-width: 340px; margin: 0 auto; grid-row: auto; }

/* ---------------- wizard ---------------- */
.wizard { padding-top: 26px; }
.progress { display: flex; gap: 4px; margin-bottom: 26px; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background var(--mid); }
.progress i.done { background: var(--amber-deep); }
.progress i.now { background: var(--amber); }
.stepmeta { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--amber); text-transform: uppercase; margin-bottom: 8px; }

.field { margin-bottom: 22px; }
.field > label, .field .flabel {
  display: block; font-size: 15px; font-weight: 700; margin-bottom: 4px;
}
.field .help { font-size: 13px; color: var(--dim); margin-bottom: 9px; line-height: 1.5; }
.field .err { font-size: 12.5px; color: var(--rose); margin-top: 6px; display: block; }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--rose); }

input[type="text"], input[type="number"], input[type="date"], textarea, select {
  width: 100%; font-family: var(--body); font-size: 16px; color: var(--chalk);
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 13px;
  transition: border-color var(--fast);
}
input:focus, textarea:focus, select:focus { border-color: var(--amber); outline: none; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
input[type="number"] { font-family: var(--mono); }
input::placeholder, textarea::placeholder { color: var(--dimmer); }

.with-unit { position: relative; }
.with-unit .unit {
  position: absolute; inset-inline-end: 13px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 12px; color: var(--dim); pointer-events: none;
}
.with-unit input { padding-inline-end: 46px; }

.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt {
  text-align: start; width: 100%; cursor: pointer; font-family: var(--body);
  background: var(--steel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; color: var(--chalk);
  transition: border-color var(--fast), background var(--fast);
  display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover { border-color: #3A4F6E; }
.opt.on { border-color: var(--amber); background: var(--amber-wash); }
.opt .tick {
  width: 17px; height: 17px; border-radius: 5px; border: 1px solid var(--line);
  flex: none; margin-top: 3px; display: grid; place-items: center;
  font-size: 11px; color: var(--night); font-family: var(--mono);
}
.opt.on .tick { background: var(--amber); border-color: var(--amber); }
.opt .otext { min-width: 0; }
/* Both are spans, so without an explicit block they run onto one line and the
   description reads as a continuation of the title. */
.opt .otitle { display: block; font-size: 15px; font-weight: 600; }
.opt .odesc { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.45; }

.chipset { display: flex; flex-wrap: wrap; gap: 7px; }
.chipset .btn { font-weight: 500; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.daybtn {
  font-family: var(--display); font-size: 16px; padding: 12px 0; cursor: pointer;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--dim);
  transition: border-color var(--fast), background var(--fast), color var(--fast);
}
.daybtn:hover { border-color: #3A4F6E; }
.daybtn.on { border-color: var(--amber); background: var(--amber-wash); color: var(--amber); }

.scale { display: flex; gap: 5px; }
.scale button {
  flex: 1; font-family: var(--mono); font-size: 15px; padding: 11px 0; cursor: pointer;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--dim); transition: all var(--fast);
}
.scale button.on { border-color: var(--amber); background: var(--amber-wash); color: var(--amber); }
.scale-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dimmer); margin-top: 6px; }

.wiznav {
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
  margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line);
}
.wiznav .spacer { flex: 1; }

.review { display: flex; flex-direction: column; gap: 0; }
.review .row {
  display: flex; justify-content: space-between; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px;
}
.review .row span:first-child { color: var(--dim); }
.review .row span:last-child { text-align: end; font-weight: 600; }

/* ---------------- tabs ---------------- */
/*
 * The tab bar is one object, not a row of loose buttons.
 *
 * It used to be ghost buttons sitting directly on the page, which made the
 * selected view a slightly brighter button among equals. A rail with the active
 * tab filled solid says where you are before you read anything — and it is the
 * one control on screen that is always present, so it is worth the pixels.
 */
.tabs {
  display: flex; gap: 4px; position: sticky; top: 0; z-index: 20;
  padding: 7px; margin: 12px 0 18px;
  background: var(--steel); border: 1px solid var(--line-soft);
  border-radius: var(--r-pill);
  overflow-x: auto; scrollbar-width: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs .btn {
  white-space: nowrap; border: 0; background: none;
  border-radius: var(--r-pill); padding: 9px 16px; color: var(--dim);
}
/*
 * On a narrow phone the five tabs are wider than the strip, and the strip
 * scrolls — which is fine, so long as you can tell. A tab cut in half is the
 * affordance; a tab that is entirely absent reads as a missing feature, and
 * nobody swipes a bar they have no reason to think continues.
 *
 * At 320px the last tab (מעקב) was 0% visible. Trimming the padding here brings
 * it back into view far enough to invite the swipe, without touching the
 * spacing at 390px and up, where all five already fit.
 */
@media (max-width: 384px) {
  .tabs { gap: 3px; padding: 6px; }
  .tabs .btn { padding: 9px 10px; }
}

.tabs .btn:hover { background: var(--steel-2); color: var(--chalk); }
.tabs .btn.on {
  background: var(--amber-grad); color: #1A1206; font-weight: 600;
  box-shadow: 0 4px 14px rgba(255, 177, 60, .22);
}
.tabs .btn.on:hover { color: #1A1206; }

/*
 * Stat cards: one number, one label. The inline .fact chips are right for a
 * long list of profile facts, and wrong for the three or four figures that are
 * the point of a screen — those need to be readable across a room.
 */
.statgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 9px; margin-top: 20px;
}
.statcard {
  background: var(--steel); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 15px 14px; text-align: center;
}
.statcard b {
  display: block; font-family: var(--display); font-size: 25px;
  color: var(--chalk); line-height: 1.1; letter-spacing: -.01em;
}
.statcard span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 5px; }

/* ---------------- meals ---------------- */
.daytoggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ex.meal .num.mtime { font-size: 12.5px; color: var(--amber); min-width: 44px; padding-top: 2px; letter-spacing: -.02em; }
.slotlbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .11em; color: var(--dim); display: block; margin-bottom: 3px; }
.ex.meal .items { font-size: 14px; color: var(--chalk); margin-top: 7px; line-height: 1.55; }
.ex.meal .note { font-size: 12.5px; margin-top: 6px; }
.of.big { font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.macros { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }

/* ---------------- progress tab ---------------- */
.logrow { display: flex; gap: 7px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
.logrow input { width: 74px; padding: 7px 9px; font-size: 14px; }
.setpill {
  font-family: var(--mono); font-size: 11.5px; color: var(--cyan);
  background: var(--cyan-wash); border: 1px solid rgba(86, 217, 206, .22);
  border-radius: 6px; padding: 2px 8px;
}
.spark { width: 100%; height: 64px; display: block; margin: 10px 0; }
.spark path { fill: none; stroke: var(--amber); stroke-width: 1.6; }
.spark .grid { stroke: var(--line); stroke-width: .6; }
.spark circle { fill: var(--amber); }

/* ---------------- modal ---------------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(6, 11, 18, .8);
  backdrop-filter: blur(3px); z-index: 100;
  display: grid; place-items: center; padding: 18px;
  animation: fade .18s var(--ease);
}
.modal-box {
  background: var(--steel); border: 1px solid var(--line); border-radius: var(--r);
  max-width: 460px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 20px;
  animation: pop .22s var(--ease);
}
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }

.modal-box h3 { margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* ---------------- misc ---------------- */
.empty { color: var(--dim); font-size: 14px; padding: 26px 0; text-align: center; }
.hero-in { animation: heroIn .55s var(--ease) both; }
@keyframes heroIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------------- responsive ---------------- */
@media (max-width: 560px) {
  .ex { padding: 11px 11px; gap: 0 9px; }
  .name { font-size: 16px; }
  .anim { width: 66px; height: 66px; }
  .daycell .tag { font-size: 8.5px; }
  .acts { gap: 5px; }
  .iconbtn { width: 31px; height: 31px; }
  .ex.meal .num.mtime { min-width: 40px; font-size: 11.5px; }
  .opts.two { grid-template-columns: 1fr; }
}

@media print {
  body { background: #fff; color: #000; }
  .tabs, .toolbar, .acts, .wiznav, .btn { display: none !important; }
  .ex, .card { break-inside: avoid; border-color: #ccc; }
}

/* ---------------- partner training ---------------- */
.pbadge {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  color: var(--cyan); background: var(--cyan-wash);
  border: 1px solid rgba(86, 217, 206, .28); border-radius: 5px;
  padding: 2px 7px; margin-inline-end: 7px; white-space: nowrap;
}
.note.partner { color: var(--dim); display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px; }
.partnerbar {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px;
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05);
  padding: 12px 14px; margin: 0 0 20px;
  font-size: 13.5px; color: var(--dim); line-height: 1.55;
}

/* ---------------- autoregulation ---------------- */
/*
 * "קל לי" and "קשה לי" — the two controls that change the training.
 *
 * They were 58×23px with 6px between them. WCAG 2.2 asks for 24×24, and the
 * spacing exception that would have excused it does not apply because the gap
 * puts the neighbour inside the same circle. So the two buttons that move a
 * trainee up or down a rung were the smallest targets on the card, pressed
 * one-handed, mid-set, sometimes by somebody in their seventies — and the two
 * of them sit side by side, where the miss lands on the opposite instruction.
 *
 * 44px on a touch screen. It is more than the standard asks because the
 * standard is a floor and this is the wrong control to be brave with; on a
 * mouse they stay compact, where a miss costs a click rather than a set.
 */
.feedback { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
.fbtn {
  font-family: var(--body); font-size: 12.5px; font-weight: 600;
  background: transparent; color: var(--dim);
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
  min-height: 30px;
  transition: border-color var(--fast), color var(--fast), background var(--fast);
}
@media (pointer: coarse) {
  .feedback { gap: 10px; }
  .fbtn { min-height: 44px; padding: 10px 16px; font-size: 13px; }
}
.fbtn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-wash); }
.fbtn:active { transform: scale(.96); }
.fbtn.reset:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }

/* ---------------- photos ---------------- */
.photoslot {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  min-height: 92px;
}
.photoslot img {
  width: 78px; height: 92px; object-fit: cover; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--steel);
}
.photohint {
  width: 78px; height: 92px; border-radius: var(--r-sm);
  border: 1px dashed var(--line); display: grid; place-items: center;
  color: var(--dimmer); font-size: 11.5px; text-align: center;
}
.visionpair { display: flex; gap: 12px; align-items: stretch; margin: 12px 0 4px; }
/* min-width:0 matters: with the default auto minimum the longer caption makes
   its column wider, and two photos meant to be compared come out different sizes. */
.visionpair figure { flex: 1 1 0; min-width: 0; margin: 0; }
.visionpair img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover;
  border-radius: var(--r); border: 1px solid var(--line); display: block;
}
.visionpair figcaption {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
  color: var(--dim); margin-top: 6px; text-align: center;
}
.visionpair .arrow { align-self: center; color: var(--amber); font-family: var(--mono); }

/* ---------------- video link ---------------- */
.btn.videolink { text-decoration: none; color: var(--chalk); }
.btn.videolink:hover { border-color: var(--rose); color: var(--rose); }
.btn.videolink:hover .ico { color: var(--rose); }
.btn.videolink .ico { color: var(--rose); }

/* ---------------- photo scan ---------------- */
.scanpanel { margin-top: 4px; }
.scanintro {
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05);
  padding: 14px 16px; margin-bottom: 20px;
}
.scanintro h4 { font-size: 14.5px; color: var(--cyan); margin-bottom: 8px; }
.scanintro ul { padding-inline-start: 18px; color: var(--dim); font-size: 13px; line-height: 1.6; }
.scanintro li { margin: 4px 0; }

.keyrow { display: flex; gap: 8px; align-items: stretch; }
.keyrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
.keyrow .fbtn { flex: 0 0 auto; padding-inline: 12px; }

.scanbusy {
  display: flex; align-items: center; gap: 10px;
  color: var(--dim); font-size: 13.5px; margin-top: 12px;
}
.spin {
  width: 15px; height: 15px; flex: 0 0 auto; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--amber);
  animation: scanspin .9s linear infinite;
}
@keyframes scanspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; border-top-color: var(--amber); }
}

.scanresult { margin-top: 22px; }
.scanhead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.scanheadtext { flex: 1 1 220px; min-width: 0; }
.scanheadtext h3 { font-family: var(--display); font-size: 20px; margin: 2px 0 4px; }
.scanheadtext .sub { font-size: 13.5px; color: var(--dim); margin: 0; }

.dial {
  flex: 0 0 auto; width: 128px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--steel);
}
.dialnum { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; color: var(--chalk); }
.dialnum span { font-size: 14px; color: var(--dimmer); }
.dialbar { height: 5px; border-radius: var(--r-pill); background: var(--line-soft); margin: 9px 0 7px; overflow: hidden; }
.dialbar i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--amber); }
.diallabel { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); }
.dial.good { border-color: var(--cyan-deep); }
.dial.good .dialbar i { background: var(--cyan); }
.dial.bad { border-color: var(--rose-deep); }
.dial.bad .dialbar i { background: var(--rose); }

.verdict {
  border-inline-start: 3px solid var(--amber); border-radius: var(--r-sm);
  background: var(--steel); padding: 14px 16px; margin-bottom: 14px;
  font-size: 14.5px; line-height: 1.7; color: var(--chalk);
}
.verdict p + p { margin-top: 9px; }
.verdict.good { border-inline-start-color: var(--cyan); }
.verdict.bad { border-inline-start-color: var(--rose); }

.callout {
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 12px; background: var(--steel);
}
.callout h4 { font-size: 14px; color: var(--chalk); margin-bottom: 5px; }
.callout p { font-size: 13.5px; color: var(--dim); line-height: 1.6; }
.callout p + p { margin-top: 7px; }
.callout.good { border-color: var(--cyan-deep); background: rgba(86, 217, 206, .05); }
.callout.good h4 { color: var(--cyan); }
.callout.warn { border-color: var(--amber-deep); background: var(--amber-wash); }
.callout.warn h4 { color: var(--amber); }

.scangrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 12px; }
.scancard {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 13px 15px; margin-bottom: 12px;
}
.scangrid .scancard { margin-bottom: 0; }
.scancard p { font-size: 13.5px; color: var(--dim); line-height: 1.65; margin-top: 8px; }
.scancard ul { padding-inline-start: 18px; color: var(--dim); font-size: 13.5px; line-height: 1.6; margin-top: 8px; }
.scancard li { margin: 4px 0; }
.scantags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.disclaimer {
  font-size: 12.5px; color: var(--dimmer); line-height: 1.6;
  border-top: 1px solid var(--line-soft); padding-top: 12px; margin-top: 6px;
}

@media (max-width: 420px) {
  .scanhead { gap: 12px; }
  .dial { width: 100%; }
}
.photodrop {
  width: 100%; aspect-ratio: 3/4; border-radius: var(--r);
  border: 1px dashed var(--line); display: grid; place-items: center;
  color: var(--dimmer); font-size: 12.5px; cursor: pointer;
  background: var(--steel); transition: border-color var(--fast), color var(--fast);
}
.photodrop:hover { border-color: var(--amber); color: var(--amber); }

/* ---------------- free-text intake ---------------- */
.quickstart { margin-bottom: 26px; }
.qsteaser {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05); padding: 14px 16px;
}
.qsteaser .qstext { flex: 1 1 220px; min-width: 0; }
.qsteaser h4 { font-size: 15px; color: var(--cyan); margin-bottom: 4px; }
.qsteaser p { font-size: 13px; color: var(--dim); line-height: 1.55; }
.qspanel {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 14px 16px; margin-bottom: 18px;
}
.qshead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.qshead h4 { font-size: 15px; color: var(--chalk); }
.qspanel .help { margin: 6px 0 10px; }
.qspanel textarea { min-height: 108px; }
.dialsub { font-family: var(--mono); font-size: 10px; color: var(--dimmer); margin-top: 3px; }

/* ---------------- rest timer ---------------- */

/* The rest chip is a button wherever the interval could be read back. It keeps
   the chip's exact metrics so a row of prescriptions stays one row. */
.resttrigger {
  display: inline-flex; align-items: center; gap: 5px;

}
.resttrigger:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }
.resttrigger:active { transform: scale(.96); }
.resttrigger .ico { font-size: 11px; line-height: 1; opacity: .8; }

/* Pinned to the viewport and above the detail sheet: a running rest interval
   outranks whatever is behind it, and the bar is useless if you have to
   remember which card you started it from. */
.restbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 120;
  background: rgba(14, 21, 32, .94);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--amber-deep);

  animation: restrise .22s var(--ease);
}
@keyframes restrise { from { transform: translateY(100%); } }

.restinner {
  max-width: var(--wrap); margin: 0 auto; padding: 0 18px;
  display: flex; align-items: center; gap: 12px;
}
.restring { width: 44px; height: 44px; flex: none; display: block; }
.restring .track { fill: none; stroke: var(--line); stroke-width: 4; }
.restring .arc {
  fill: none; stroke: var(--amber); stroke-width: 4; stroke-linecap: round;
  transition: stroke-dashoffset .25s linear, stroke var(--fast);
}
.resttext { flex: 1 1 auto; min-width: 0; }
.restlabel {
  font-size: 12px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Tabular figures: without them the minute digit shifts the whole readout every
   time it changes width, and this is a number read from arm's length. The
   element carries dir="ltr" so the digits keep their order; right-aligned to
   land on the RTL page's inline start, under its own label. */

  font-family: var(--mono); font-size: 27px; font-weight: 600; line-height: 1.15;

.restacts { display: flex; gap: 6px; flex: none; }
.restacts .wide { width: auto; padding: 0 9px; font-size: 12px; }

.restbar.done { border-top-color: var(--cyan); }

.restbar.done .resttime { color: var(--cyan); }

.restbar.late { border-top-color: var(--rose-deep); }
.restbar.late .arc { stroke: var(--rose); }
.restbar.late .restlabel { color: var(--rose); }

/* Keep the last card, and the sheet's own buttons, clear of the bar. */
body.resting { padding-bottom: 104px; }
body.resting .modal-back { padding-bottom: 96px; }

@media (max-width: 420px) {
  .restinner { gap: 9px; padding: 0 12px; }
  .resttime { font-size: 24px; }
  .restacts { gap: 4px; }
  .restacts .iconbtn { width: 30px; height: 30px; }
  .restacts .wide { width: auto; padding: 0 7px; }
}

@media print {
  .restbar { display: none !important; }
  body.resting { padding-bottom: 0; }
}

/* YouTube demo link — occupies the box the drawn figure used to.
   Sized and positioned by the existing .anim rule, so the card layout is
   unchanged whether or not this is present. */
.anim.ytlink {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; text-decoration: none; color: var(--dim);
  transition: border-color var(--fast), color var(--fast), background var(--fast);
}
.anim.ytlink:hover, .anim.ytlink:focus-visible {
  border-color: var(--amber); color: var(--ink);
  background: linear-gradient(180deg, #1B2836, #16202D);
}
.anim.ytlink .ytmark {
  font-size: 19px; line-height: 1; color: #E5484D;
  transition: transform var(--fast);
}
.anim.ytlink:hover .ytmark { transform: scale(1.14); }
.anim.ytlink .ytcap { font-size: 10.5px; letter-spacing: .02em; text-align: center; }
.anim.big.ytlink { aspect-ratio: auto; min-height: 96px; padding: 18px 12px; }
.anim.big.ytlink .ytmark { font-size: 34px; }
.anim.big.ytlink .ytcap { font-size: 13px; }

/* The exercise name doubles as the way into the detail sheet, now that the
   figure links out to YouTube instead. Styled as the heading it already was —
   the affordance is the underline on hover, not a button chrome. */
.ex .namebtn {
  display: block; width: 100%; text-align: start;
  background: none; border: 0; padding: 0; margin: 0;
  font: inherit; color: inherit; cursor: pointer;
}
.ex .namebtn:hover, .ex .namebtn:focus-visible { text-decoration: underline; color: var(--amber); }

/* Rest-day rows. Deliberately quieter than an exercise card — these are not
   sessions, and they should not compete with one for attention. */
.restrow { opacity: .96; }
.restrow .num { color: var(--dim); font-size: 13px; }
.restrow.free { opacity: .6; }
.restrow.free .cues { display: none; }
.restrow .cues { margin-top: 6px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.restrow.done { opacity: .55; }
.restrow.done .name { text-decoration: line-through; }

/* Rest cells in the week strip. Selectable like a training day, but quieter —
   the amber belongs to the sessions. */
.daycell.restcell { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.daycell.restcell .tag { color: var(--dimmer); font-size: 10px; }
.daycell.restcell .bar { opacity: .55; transition: opacity var(--fast); }
.daycell.restcell:hover .bar, .daycell.restcell:focus-visible .bar { opacity: .9; }
.daycell.restcell.on .bar { opacity: 1; box-shadow: inset 0 0 0 1px var(--cyan); }
.daycell.restcell.on .letter { color: var(--cyan); }

/* The natural-development note under a scan verdict. Informational, not a
   warning — it qualifies the verdict rather than contradicting it. */
.growthnote {
  display: flex; gap: 9px; align-items: flex-start;
  margin-top: 12px; padding: 12px 14px;
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  background: linear-gradient(180deg, #16212F, #131C29);
}
.growthnote .gicon { color: var(--cyan); font-size: 15px; line-height: 1.4; flex: none; }

.brandmark.sm { opacity: .92; }
.statcard.hot { border-color: var(--amber); background: var(--amber-wash); }
.statcard.hot b { color: var(--amber); font-size: 20px; }

  border-radius: var(--r);

.daterow input { width: 96px; flex: 0 0 auto; }
.rowlabel { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 26px; }

  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--dim);

  min-height: 44px;

  height: 28px;
  background: rgba(14, 21, 32, .82);

  margin-top: 16px;
  background: var(--steel);
  border: 1px solid var(--line-soft);

  border-radius: var(--r);
  padding: 16px 18px;

.explain .opening { margin-top: 8px; font-size: 16px; line-height: 1.7; }
.explain p + p { margin-top: 8px; }
.explain .facts { margin-top: 10px; }

  border-top: 1px solid var(--line-soft);
  padding-top: 10px;
  font-size: 14px;
  color: var(--dim);

.workrow {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
  background: var(--steel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px;
}
.workmain { min-width: 0; }
.workrow .namebtn {
  background: none;
  border: 0;
  padding: 0;
  color: var(--chalk);
  font-family: var(--display);
  font-size: 18px;
  text-align: start;
  cursor: pointer;
}
.workrow .namebtn:hover { text-decoration: underline; }
.workrow .facts { margin-top: 4px; font-size: 12.5px; color: var(--dim); }
.gapline { margin-top: 6px; font-size: 12.5px; color: var(--amber); }
.gapline.ok { color: var(--cyan); }
.workacts { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }

@media (max-width: 560px) {
  .workrow { flex-direction: column; }
  .workacts { width: 100%; justify-content: flex-end; }
}

/* ---- the file ---- */

.filecard {
  background: var(--steel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-top: 14px;
}
.filecard h3 { margin-bottom: 6px; }
.filecard .help { margin-top: 10px; }
.filemeta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.filemeta b { font-family: var(--mono); font-size: 13px; color: var(--amber); word-break: break-all; }

/* A label that is a button, wrapping the file input it drives. The input has to
 * exist and be reachable by a click on the label, so it is moved out of sight
 * rather than hidden — `display: none` takes it out of the accessibility tree
 * and the label stops working with a keyboard. */
.filebtn { position: relative; overflow: hidden; cursor: pointer; }
.filebtn input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.preview {
  width: 100%;
  height: 68vh;
  min-height: 380px;
  margin-top: 14px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r);
  display: block;
}
