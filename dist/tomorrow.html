<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout reach under the notch and the home
     indicator; base.css pays for it back with env(safe-area-inset-*) padding
     on everything that touches an edge. user-scalable=no is deliberately not
     here — Contracts §16.8 asks for WCAG AA, and blocking pinch zoom fails
     1.4.4 for exactly the people who need to read a small time label. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The dark surface colour. app.js rewrites this when the profile's theme
     switch flips, otherwise a light-theme user keeps a black status bar. -->
<meta name="theme-color" content="#080B12">
<meta name="description" content="TomorrowAI לומד איך היום שלך באמת עובד, מנתח את מחר לפני שהוא מתחיל, וממליץ על שינוי אחד שיכול לשפר אותו. הכול נשאר במכשיר.">
<!-- On iOS these give a real fullscreen shell when the app is added to the
     home screen, which is where an app opened every evening ends up.
     black-translucent is what makes viewport-fit=cover mean anything. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TomorrowAI">
<title>TomorrowAI · מחר, לפני שהוא מתחיל</title>

<!--
  connect-src is 'none' because this app talks to nobody. Every forecast,
  score and recommendation is computed in src/engine/ from data that never
  leaves the device, and the chat answers from the same local engine rather
  than a model API (Contracts §15). So there is no request for the policy to
  allow, and saying so out loud is worth more than it costs: this page shares
  an origin with the other apps in this repository, which means their stored
  data is only as safe as the weakest page here. If something ever did manage
  to run inside this document, 'none' is the difference between a bug and a
  year of somebody's sleep, mood and calendar leaving the machine.

  script-src and style-src are 'self' and nothing beside it: no inline
  <script>, no inline style attribute, anywhere on the page. That is why
  src/core/dom.js writes styles through the CSSOM rather than through
  setAttribute('style', …) — a style attribute set that way is dropped by this
  policy, silently, with nothing in the console pointing at the line.

  font-src and img-src allow data: because ../src/styles/fonts.css carries the
  three faces as embedded woff2 and the favicon below is an inline SVG.

  frame-ancestors is not here. It is ignored in a meta tag — it only counts as
  a real HTTP header, and GitHub Pages does not let this repository set one.
  Leaving it in would read as clickjacking protection that does not exist.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-EfbfakndUznppKpG2Zbgs4DRKOrXSBlKwRuySpCYPDA='; style-src 'sha256-9XvGG9FiqR5B6vyDwjkEOxZldTD0MKmfdHvENLMJVtk='; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<!-- fonts.css is the repository's shared, generated set of embedded faces and
     is linked first so the families exist before tokens.css names them. The
     order of what follows is load-bearing: tokens.css is the only file that
     defines a variable, and every stylesheet under it only reads them. -->
<!-- Layouts that belong to one screen each — the home hero, the ritual steps,
     the what-if comparison, the week grid. Kept out of components.css so that
     file stays the shared vocabulary rather than a place things accumulate. -->

/*
 * tokens.css — every colour, size, radius and duration TomorrowAI uses.
 *
 * Dark is the default and lives on bare :root, because this is an app people
 * open at night: the evening ritual is the one screen it is guaranteed to see
 * every day, and a white page at 23:00 is a worse product before a single
 * pixel of layout is decided. Light is an override under [data-theme="light"],
 * set by the profile switch — deliberately not by prefers-color-scheme. The
 * profile owns a real setting; following the OS as well would mean the switch
 * appears to do nothing for anyone whose system disagrees with their choice.
 *
 * Two attributes on <html> drive everything conditional here:
 *   data-theme="light"     the profile's theme switch
 *   data-motion="reduced"  the profile's motion override, ORed by app.js with
 *                          the prefers-reduced-motion media query
 *
 * Fonts are not declared here. ../src/styles/fonts.css carries Assistant,
 * Secular One and IBM Plex Mono as embedded woff2 for the whole repository and
 * is linked before this file; re-embedding them would add a megabyte of
 * base64 for a second copy of the same faces.
 */

:root {
  /* Tells the browser which way round its own furniture goes: the scrollbars,
     the native form controls, the spinner inside a number field. Without it a
     dark page gets a white scrollbar track on the side of it. */
  color-scheme: dark;

  /* ---------------------------------------------------------------- *
   * Surfaces — four steps, and no more.
   *
   * bg is the page, surface is a card on it, surface-2 is something inside a
   * card, surface-3 is a pressed or hovered state. A fifth step stops reading
   * as depth and starts reading as noise, and every extra step is another
   * background a text colour has to be checked against.
   * ---------------------------------------------------------------- */
  --bg: #080B12;
  --surface: #10151F;
  --surface-2: #151C29;
  --surface-3: #1B2434;

  /* Borders do almost all the separating work in this design, so they are
     quiet on purpose: a 1px line at this weight defines an edge without the
     interface looking drawn on graph paper. */
  --line: #232E42;
  --line-soft: #1A2231;

  /* Ink. Three weights: what you read, what supports it, what only labels it. */
  --text: #EEF2F9;
  --text-dim: #A6B6CE;
  --text-mute: #8B9CB6;

  /* ---------------------------------------------------------------- *
   * Accent.
   *
   * --primary is the accent as ink: links, active icons, the numbers the eye
   * should land on. --primary-strong is the accent as a fill, and it is a
   * different, darker colour for one reason — white text has to sit on it and
   * clear AA, which #7D93FF does not allow. Keeping both means nobody has to
   * choose between a legible button and a legible label.
   * ---------------------------------------------------------------- */
  --primary: #7D93FF;
  --primary-strong: #5046E5;
  --primary-ink: #FFFFFF;
  --primary-wash: rgba(125, 147, 255, .12);
  --primary-line: rgba(125, 147, 255, .32);

  /* Indigo into blue into a faint violet. Three stops rather than two because
     a two-stop ramp across this much hue passes through a flat middle; the
     blue at 52% is what keeps it electric instead of muddy. White clears 5.0:1
     against every point along it, checked below. */
  --grad: linear-gradient(135deg, #5046E5 0%, #2A66E8 52%, #7B4FE4 100%);
  /* The same three stops as raw colours. An SVG <linearGradient> cannot read a
     CSS gradient, and the score ring and the curve fills are SVG, so the stops
     exist twice by necessity. They are next to each other so the day one of
     them moves, the other is on the following line. */
  --grad-1: #5046E5;
  --grad-2: #2A66E8;
  --grad-3: #7B4FE4;
  --grad-soft: linear-gradient(135deg, rgba(80, 70, 229, .18) 0%, rgba(42, 102, 232, .14) 52%, rgba(123, 79, 228, .18) 100%);

  /* Status. Muted on purpose: this app tells someone their evening may be
     tight, not that their house is on fire. A saturated red for a schedule
     risk trains people to ignore the colour by the third day. */
  --good: #5FCF9B;
  --good-wash: rgba(95, 207, 155, .12);
  --warn: #F0B95C;
  --warn-wash: rgba(240, 185, 92, .12);
  --risk: #FF8B7E;
  --risk-wash: rgba(255, 139, 126, .12);

  /* The two curves share one chart and must stay apart for someone who cannot
     separate blue from violet, so focus is teal rather than the violet end of
     the brand ramp — a hue and a lightness apart from energy, not a shade of
     it. Legends still label both; colour is never the only carrier. */
  --energy: #7D93FF;
  --focus: #58D3C4;
  --violet: #B08CF8;

  /* Chart furniture. Grid lines sit under data and must never compete with
     it, so they are a hair above the surface they sit on. */
  --grid: rgba(166, 182, 206, .14);
  --grid-strong: rgba(166, 182, 206, .26);

  /* The focus-visible outline. Named for the CSS property it feeds, not "ring",
     which in this app means the score dial. */
  --outline: #8FA2FF;
  --scrim: rgba(4, 6, 11, .66); /* behind a modal or a sheet */

  /* ---------------------------------------------------------------- *
   * Type — one scale, seven steps, and every size in the app is one of them.
   * ---------------------------------------------------------------- */
  --font-body: 'Assistant', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Secular One', 'Assistant', system-ui, sans-serif;
  /* IBM Plex Mono has no Hebrew in the embedded subset, which is exactly
     right: it is here for digits — scores, clock times, durations — so a
     column of numbers lines up and a counting score does not jitter as the
     glyph widths change. Hebrew inside it falls back to Assistant. */
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

  --fs-display: clamp(56px, 16vw, 76px);   /* the score, and nothing else */
  --fs-title: clamp(24px, 6vw, 30px);      /* screen headings */
  --fs-lg: 19px;                           /* card titles */
  --fs-md: 17px;                           /* lead lines, list row titles */
  --fs-base: 16px;                         /* body */
  --fs-sm: 14px;                           /* supporting copy */
  --fs-xs: 12.5px;                         /* meta, eyebrows, axis labels */

  --lh-tight: 1.15;
  --lh-snug: 1.35;
  --lh-body: 1.6;
  --track-eyebrow: .12em;

  /* ---------------------------------------------------------------- *
   * Space — a 4px grid. Generous by default; this app is calm or it is
   * nothing, and the fastest way to make it feel like an admin panel is to
   * tighten the padding.
   * ---------------------------------------------------------------- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 28px;
  --s-7: 40px;
  --s-8: 56px;

  /* Radius. Cards and sheets live in the 18–24 band the design calls for;
     the smaller steps are for things inside a card, which have to read as
     nested rather than as another card. */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r: 20px;
  --r-lg: 24px;
  --r-pill: 999px;

  /* Elevation is mostly a border and a very soft drop. Heavy shadows on a
     near-black page read as smudges rather than lift. */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .30);
  --shadow: 0 8px 24px rgba(0, 0, 0, .34);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .48);
  --glow: 0 6px 24px rgba(80, 70, 229, .30);

  /* Motion. One easing curve for the whole app: things start quickly and
     settle, which is what makes a score counting up look like a measurement
     rather than an animation. */
  --ease: cubic-bezier(.2, .8, .3, 1);
  --t-fast: .16s;
  --t-mid: .26s;
  --t-slow: .44s;

  /* Layout */
  --nav-h: 62px;
  --side-w: 248px;
  --wrap: 720px;      /* reading width of a column of cards */
  --gutter: 16px;
  --tap: 44px;        /* smallest thing worth aiming a thumb at */
}

/*
 * Contrast, measured rather than assumed (WCAG 2.1 relative luminance, the
 * darkest surface each colour is allowed to sit on):
 *
 *   dark theme            bg #080B12   surface #10151F   surface-3 #1B2434
 *   --text     #EEF2F9      17.5:1        16.3:1            13.9:1
 *   --text-dim #A6B6CE       9.6:1         8.9:1             7.6:1
 *   --text-mute #8B9CB6      7.1:1         6.6:1             5.6:1
 *   --primary  #7D93FF       7.0:1         6.5:1             5.6:1
 *   --good     #5FCF9B      10.2:1         9.5:1             8.1:1
 *   --warn     #F0B95C      11.1:1        10.3:1             8.8:1
 *   --risk     #FF8B7E       8.7:1         8.1:1             6.9:1
 *   --focus    #58D3C4      10.8:1        10.0:1             8.6:1
 *
 *   light theme           bg #F4F7FC   surface #FFFFFF   surface-3 #E3EAF4
 *   --text     #0E1521      17.0:1        18.3:1            15.1:1
 *   --text-dim #48586F       6.7:1         7.2:1             6.0:1
 *   --text-mute #55647B      5.6:1         6.0:1             5.0:1
 *   --primary  #3A4CD4       6.2:1         6.6:1             5.5:1
 *   --good     #0D6A49       6.2:1         6.6:1             5.5:1
 *   --warn     #7F5304       6.2:1         6.7:1             5.5:1
 *   --risk     #B3312A       5.8:1         6.2:1             5.1:1
 *
 *   --primary-ink #FFFFFF on --grad: 6.3:1 at the indigo end, 5.0:1 at the
 *   worst point of the ramp, 5.2:1 at the violet end. On the light theme's
 *   deeper ramp the same white never drops below 5.7:1.
 *
 * Every one of these clears 4.5:1, the small-text threshold, so nothing in the
 * app depends on a size or a weight to be readable — including --text-mute,
 * which is only ever used at 12.5px and would fail the moment somebody trusted
 * the large-text allowance for it. The warm status colours are the ones that
 * needed the most moving: an amber and a coral bright enough to read as amber
 * and coral on a near-black page are far above the line, and the same two hues
 * in the light theme have to go almost brown to get there. That asymmetry is
 * why the light block below overrides the status colours instead of reusing
 * them.
 */

:root[data-theme="light"] {
  color-scheme: light;

  --bg: #F4F7FC;
  --surface: #FFFFFF;
  --surface-2: #EAF0F8;
  --surface-3: #E3EAF4;

  --line: #D5DFEE;
  --line-soft: #E5ECF6;

  --text: #0E1521;
  --text-dim: #48586F;
  --text-mute: #55647B;

  --primary: #3A4CD4;
  --primary-strong: #4338CA;
  --primary-ink: #FFFFFF;
  --primary-wash: rgba(58, 76, 212, .09);
  --primary-line: rgba(58, 76, 212, .26);

  /* Deeper stops for the light theme. The dark ramp is tuned to glow against
     a near-black page; on white the same three colours read as a highlighter,
     and white text on them loses a point of contrast it cannot spare. */
  --grad: linear-gradient(135deg, #4338CA 0%, #1D5FD8 52%, #6D45D6 100%);
  --grad-1: #4338CA;
  --grad-2: #1D5FD8;
  --grad-3: #6D45D6;
  --grad-soft: linear-gradient(135deg, rgba(67, 56, 202, .10) 0%, rgba(29, 95, 216, .08) 52%, rgba(109, 69, 214, .10) 100%);

  --good: #0D6A49;
  --good-wash: rgba(13, 106, 73, .10);
  --warn: #7F5304;
  --warn-wash: rgba(127, 83, 4, .10);
  --risk: #B3312A;
  --risk-wash: rgba(179, 49, 42, .09);

  --energy: #3A4CD4;
  --focus: #0B6B62;
  --violet: #6D45D6;

  --grid: rgba(14, 21, 33, .10);
  --grid-strong: rgba(14, 21, 33, .20);

  --outline: #3A4CD4;
  --scrim: rgba(16, 24, 40, .40);

  /* On white, the same drop shadow reads as dirt. Lighter, tighter, and
     leaning on the border instead. */
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow: 0 8px 24px rgba(16, 24, 40, .08);
  --shadow-lg: 0 24px 60px rgba(16, 24, 40, .14);
  --glow: 0 6px 20px rgba(67, 56, 202, .22);
}

/*
 * Reduced motion is handled at the token level as well as in base.css.
 *
 * The blanket rule in base.css kills transitions and animations, but plenty of
 * timing in this app is read out of these variables by JavaScript — the score
 * counting up, the what-if curve morphing between two shapes. Zeroing the
 * durations here means those land on their end state immediately instead of
 * needing every animation call site to remember to ask.
 *
 * Not 0s: a zero-length transition never fires transitionend, and code waiting
 * for one to clean up would wait forever. 1ms fires on the next frame.
 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --t-fast: 1ms;
    --t-mid: 1ms;
    --t-slow: 1ms;
  }
}

:root[data-motion="reduced"] {
  --t-fast: 1ms;
  --t-mid: 1ms;
  --t-slow: 1ms;
}


/*
 * base.css — reset, type, the app shell, and the rules that hold the page
 * together at every width.
 *
 * The shell it expects, which index.html sets up and app.js fills in:
 *
 *   <div id="app" class="shell">
 *     <nav class="shell-nav">      five <button class="nav-btn" data-t="nav-*">
 *     <main class="shell-main">
 *       <section class="view" data-t="view-tomorrow"> … cards …
 *
 * The class is already on the mount point in the HTML, so app.js can render
 * into #app without knowing this file exists. Below 1024px the nav is fixed to
 * the bottom edge and <main> reserves room for it; from 1024px the same two
 * elements become a grid, sidebar in the inline-start column — the right-hand
 * side, since the document is RTL.
 *
 * The page itself scrolls. Making <main> the scroll container instead costs
 * the mobile URL-bar collapse and gives nothing back.
 */

/* ------------------------------------------------------------------ *
 * Reset
 * ------------------------------------------------------------------ */

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  /* iOS paints this behind the elastic overscroll at the top and bottom of
     the page. Without it a dark app flashes white when someone drags past
     the end of a list. */
  background: var(--bg);
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  /* A tap on a card should not flash a grey box behind it; the components
     draw their own pressed states. */
  -webkit-tap-highlight-color: transparent;
}

img, video { max-width: 100%; height: auto; }
svg { max-width: 100%; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  font-family: inherit;
}

button {
  background: none;
  border: 0;
  cursor: pointer;
  /* Safari refuses to centre text in a button any other way. */
  text-align: inherit;
}

button:disabled { cursor: default; }

a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 3px; }

ul, ol { list-style: none; }

::selection { background: var(--primary-wash); color: var(--text); }

/* ------------------------------------------------------------------ *
 * No horizontal scroll. Anywhere. Ever.
 *
 * Contracts §17 lists six widths that have to be clean, and at five of them
 * the thing that breaks is never the layout — it is one child that refuses to
 * shrink. A grid and a flex item both default to min-width:auto, which means
 * "no narrower than my content", so a single long word, a 60-character Hebrew
 * title, a chart with a fixed viewBox or a row of chips pushes its track wider
 * than the column and the whole page gains a scrollbar. minmax(0, 1fr) on the
 * track and min-width:0 on the children is the actual fix; overflow-x on the
 * root is the seatbelt, not the brake.
 *
 * clip rather than hidden: overflow:hidden turns the element into a scroll
 * container, which silently kills position:sticky inside it, and the desktop
 * sidebar is sticky.
 * ------------------------------------------------------------------ */

html, body {
  max-width: 100%;
  overflow-x: hidden;
  overflow-x: clip;
}

body { overflow-wrap: break-word; }

:where(.shell, .shell-main, .view, .stack, .row, .cluster, .grid-2) > * { min-width: 0; }

/* Anything that genuinely cannot shrink — a wide table, a long chip row —
   scrolls inside its own box instead of widening the page. */
.scroll-x {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

/* ------------------------------------------------------------------ *
 * Typography
 *
 * The display face is Secular One, which ships in one weight only. Asking it
 * for 700 gets a synthesised bold — smeared, heavier on the Hebrew than the
 * Latin, and visibly not the same font. So display headings stay at 400 and
 * every bold in the app is Assistant, which has real 600 and 700 cuts.
 * ------------------------------------------------------------------ */

h1, .h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--fs-title);
  line-height: var(--lh-tight);
  letter-spacing: -.01em;
}

h2, .h2 { font-size: var(--fs-lg); font-weight: 700; line-height: var(--lh-snug); }
h3, .h3 { font-size: var(--fs-md); font-weight: 700; line-height: var(--lh-snug); }

.lead { font-size: var(--fs-md); color: var(--text-dim); line-height: var(--lh-snug); }
.sub { font-size: var(--fs-sm); color: var(--text-dim); max-width: 56ch; }
.meta { font-size: var(--fs-xs); color: var(--text-mute); }

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: var(--track-eyebrow);
  text-transform: uppercase;
  color: var(--text-mute);
}

/* Digits that have to line up or hold still: the score as it counts, a column
   of times, a duration next to a duration. */
.num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

.strong { font-weight: 700; }
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.bad { color: var(--risk); }
.accent { color: var(--primary); }

/* ------------------------------------------------------------------ *
 * Accessibility
 * ------------------------------------------------------------------ */

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* The ring follows the corner it sits on, so a pill button gets a pill ring
   and a card gets a card one. outline-offset keeps it off the border it is
   announcing. */
:focus-visible {
  outline: 2px solid var(--outline);
  outline-offset: 2px;
  border-radius: inherit;
}

:focus:not(:focus-visible) { outline: none; }

/* ------------------------------------------------------------------ *
 * Shell
 * ------------------------------------------------------------------ */

.shell {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
}

.shell-main {
  /* Room for the fixed bottom bar plus whatever the phone's home indicator
     takes, plus a little air so the last card never touches the nav. */
  padding-block-end: calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--s-6));
}

/*
 * Safe-area padding is the one place this file uses physical left/right
 * instead of logical properties, and on purpose: the notch and the rounded
 * corners are on a physical side of a physical device, and they do not swap
 * when the document direction does. Taking the larger of the gutter and the
 * inset on each side keeps the layout identical in portrait and correct in
 * landscape.
 */
.view {
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-block: var(--s-5) 0;
  padding-left: max(var(--gutter), env(safe-area-inset-left));
  padding-right: max(var(--gutter), env(safe-area-inset-right));
}

.shell-nav {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  justify-content: space-around;
  align-items: stretch;
  gap: var(--s-1);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-block-start: var(--s-1);
  padding-block-end: env(safe-area-inset-bottom);
  padding-inline: var(--s-2);
  background: var(--surface);
  border-block-start: 1px solid var(--line);
}

.nav-btn {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: var(--s-1) 2px;
  border-radius: var(--r-md);
  color: var(--text-mute);
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 1;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}

.nav-btn svg { width: 22px; height: 22px; flex: none; }
.nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nav-btn:hover { color: var(--text-dim); }

.nav-btn[aria-current="page"],
.nav-btn.is-active {
  color: var(--primary);
  background: var(--primary-wash);
}

/*
 * From 1024px the nav becomes a sidebar. Grid areas rather than column order,
 * because the nav is first in the DOM for keyboard and screen-reader users and
 * the layout should not depend on that staying true.
 */
@media (min-width: 1024px) {
  .shell {
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
    grid-template-areas: 'nav main';
    align-items: start;
  }

  .shell-nav {
    grid-area: nav;
    position: sticky;
    top: 0;
    inset-inline: auto;
    bottom: auto;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: var(--s-1);
    height: 100vh;
    height: 100dvh;
    padding: var(--s-5) var(--s-3);
    border-block-start: 0;
    border-inline-end: 1px solid var(--line);
    background: var(--bg);
  }

  .nav-btn {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: var(--s-3);
    min-height: var(--tap);
    padding: var(--s-3) var(--s-4);
    font-size: var(--fs-sm);
    line-height: var(--lh-snug);
  }

  .shell-main {
    grid-area: main;
    padding-block-end: var(--s-8);
  }

  .view { padding-block-start: var(--s-6); gap: var(--s-5); }
}

/* Wide desktop: the column stops growing long before the window does. A
   720px measure is a comfortable read; 1400px of card is not. */
@media (min-width: 1440px) {
  .view { max-width: 860px; }
}

/* ------------------------------------------------------------------ *
 * Layout primitives. Every one of them is RTL-correct because none of them
 * names a physical side.
 * ------------------------------------------------------------------ */

.stack { display: flex; flex-direction: column; gap: var(--s-3); }
.stack.tight { gap: var(--s-2); }
.stack.loose { gap: var(--s-5); }

.row { display: flex; align-items: center; gap: var(--s-3); }
.row.top { align-items: flex-start; }
.row.spread { justify-content: space-between; }

/* A row that wraps instead of overflowing — chips, filters, tags. */
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-3); }
@media (min-width: 560px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grow { flex: 1 1 auto; min-width: 0; }
.center { text-align: center; }
.hidden { display: none !important; }

/* ------------------------------------------------------------------ *
 * Motion
 *
 * The token file already zeroes the durations, which covers everything that
 * reads a variable. This catches the rest: a keyframe animation with its
 * timing written into the shorthand, a transition on a third-party default.
 * Reduced motion means the end state arrives immediately, not that nothing
 * happens — so animations run once and stop rather than being removed.
 * ------------------------------------------------------------------ */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
  html { scroll-behavior: auto; }
}

:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after {
  animation-duration: 1ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 1ms !important;
}

:root[data-motion="reduced"] { scroll-behavior: auto; }

/* The <noscript> line. It has no style attribute of its own because the page
   ships a CSP with no 'unsafe-inline' — an inline style would be dropped and
   the message would land unstyled at the top-left of a black page. */
.noscript-note {
  margin: var(--s-7) auto;
  max-width: 42ch;
  padding: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--text-dim);
  text-align: center;
}


/*
 * components.css — everything the views assemble screens out of.
 *
 * The rule this file follows: a component is a class, a variant is a second
 * class on the same element, and state comes from the attribute that already
 * carries it — aria-pressed, aria-current, disabled, [hidden]. Nothing here
 * styles a data-t hook. Those are handles for the browser test (Contracts §20)
 * and hanging appearance on them would mean a redesign silently breaks the
 * test, or the test's names dictate the design. The two exceptions are the
 * overlay classes: .modal-* and .sheet-* are emitted by src/core/dom.js, so
 * their names are a real interface between that file and this one.
 */

/* ================================================================== *
 * Buttons
 * ================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: var(--tap);
  padding: var(--s-3) var(--s-5);
  border: 1px solid transparent;
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--text);
  font-size: var(--fs-base);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}

.btn svg { width: 20px; height: 20px; flex: none; }

.btn:hover { background: var(--surface-3); }

/* One pixel, not a scale. A button that shrinks under the thumb reflows the
   text inside it, and on a card full of numbers that reads as a glitch. */
.btn:active { transform: translateY(1px); }

.btn.primary {
  background: var(--grad);
  border-color: transparent;
  color: var(--primary-ink);
  box-shadow: var(--glow);
}

/* The gradient cannot be lightened by changing a background-color, so hover
   goes through a filter. Kept small: this is a calm app and a button that
   flares under the cursor is not. */
.btn.primary:hover { filter: brightness(1.07); }

.btn.ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}

.btn.ghost:hover { background: var(--surface-2); border-color: var(--primary-line); }

.btn.quiet {
  background: transparent;
  border-color: transparent;
  color: var(--text-dim);
  font-weight: 600;
}

.btn.quiet:hover { background: var(--surface-2); color: var(--text); }

.btn.danger { background: var(--risk-wash); color: var(--risk); border-color: transparent; }
.btn.danger:hover { background: var(--risk-wash); border-color: var(--risk); }

.btn.icon {
  min-height: var(--tap);
  min-width: var(--tap);
  padding: var(--s-2);
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-dim);
}

.btn.icon:hover { background: var(--surface-2); color: var(--text); }

.btn.small { min-height: 36px; padding: var(--s-2) var(--s-4); font-size: var(--fs-sm); }
.btn.block { display: flex; width: 100%; }

/*
 * A disabled control has to look unavailable and be unavailable. Contracts
 * §16.6 bans the third state — a live-looking button that does nothing — so
 * anything not built yet carries [disabled] and a .badge.soon saying so, and
 * pointer-events stays on: a cursor of not-allowed is information, and
 * removing pointer events also removes the tooltip that explains it.
 */
.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: .45;
  cursor: not-allowed;
  filter: none;
  box-shadow: none;
  transform: none;
}

/* The floating add button. Sits above the bottom bar on a phone and inside
   the content column once there is a sidebar. */
.fab {
  position: fixed;
  inset-block-end: calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--s-4));
  inset-inline-end: max(var(--gutter), env(safe-area-inset-right));
  z-index: 45;
  width: 56px;
  height: 56px;
  min-height: 56px;
  padding: 0;
  border-radius: var(--r-pill);
  background: var(--grad);
  color: var(--primary-ink);
  box-shadow: var(--shadow), var(--glow);
}

.fab svg { width: 26px; height: 26px; }

@media (min-width: 1024px) {
  .fab { inset-block-end: var(--s-6); inset-inline-end: var(--s-6); }
}

/* ================================================================== *
 * Cards
 * ================================================================== */

.card {
  padding: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.card.flat { box-shadow: none; background: transparent; }
.card.tight { padding: var(--s-4); }

/* The hero card behind the score. The wash is the only place in the app that
   uses the accent as a surface, which is what makes the score read as the
   subject of the screen without a single extra pixel of chrome. */
.card.hero {
  position: relative;
  overflow: hidden;
  border-color: var(--primary-line);
  background: var(--surface);
  background-image: var(--grad-soft);
  padding-block: var(--s-6);
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  margin-block-end: var(--s-4);
}

.card-title { font-size: var(--fs-lg); font-weight: 700; line-height: var(--lh-snug); }
.card-note { margin-block-start: var(--s-3); font-size: var(--fs-sm); color: var(--text-dim); }

/* Tone variants, used by risk cards and by the what-if diff. The border does
   the talking; a fully tinted card at this size reads as an alert banner. */
.card.tone-good { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); background-color: var(--good-wash); }
.card.tone-warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); background-color: var(--warn-wash); }
.card.tone-risk { border-color: color-mix(in srgb, var(--risk) 40%, var(--line)); background-color: var(--risk-wash); }

/* ================================================================== *
 * Score ring and factor bars
 * ================================================================== */

/*
 * The score dial: an SVG behind, the number and its band label stacked in
 * front of it. align-content is the load-bearing line — a grid with two auto
 * rows and spare height stretches those rows by default, which pushed the
 * band label most of the way down to the ring stroke and moved it again every
 * time the number changed width. Packed at the centre, the pair reads as one
 * label in the middle of a dial.
 */
.ring-wrap {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  width: clamp(168px, 46vw, 216px);
  aspect-ratio: 1;
  margin-inline: auto;
}

.ring-wrap > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.ring-value {
  position: relative;
  font-family: var(--font-display);
  font-size: var(--fs-display);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

.ring-caption {
  position: relative;
  margin-block-start: var(--s-1);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--text-dim);
}

/* One factor of the score. The label column is fixed so six bars line up as a
   column of bars rather than six separate rows that happen to be stacked. */
.bar-row {
  display: grid;
  grid-template-columns: 7.5em minmax(0, 1fr) 3em;
  align-items: center;
  gap: var(--s-3);
  padding-block: var(--s-2);
}

.bar-row + .bar-row { border-block-start: 1px solid var(--line-soft); }
.bar-label { font-size: var(--fs-sm); font-weight: 600; }

.bar-track {
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.bar-fill {
  /* The fill is an <i>, and an inline box ignores both width and height — every
     bar rendered as an empty track until this was here. */
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--grad);
  transition: width var(--t-slow) var(--ease);
}

.bar-fill.good { background: var(--good); }
.bar-fill.warn { background: var(--warn); }
.bar-fill.risk { background: var(--risk); }

.bar-value {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-sm);
  color: var(--text-dim);
  text-align: end;
}

/* ================================================================== *
 * Charts
 * ================================================================== */

.chart {
  position: relative;
  width: 100%;
  min-width: 0;
}

/*
 * The SVG sizes itself from the box, never the other way round. A chart with a
 * width attribute is the single most reliable way to give a 375px phone a
 * horizontal scrollbar, so the element is told to be exactly as wide as its
 * container and to take its height from the viewBox aspect.
 */
.chart > svg { display: block; width: 100%; height: auto; overflow: visible; }

.chart-axis { font-family: var(--font-mono); font-size: 10px; fill: var(--text-mute); }
.chart-grid { stroke: var(--grid); stroke-width: 1; }
.chart-grid.strong { stroke: var(--grid-strong); }
.chart-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart-line.energy { stroke: var(--energy); }
.chart-line.focus { stroke: var(--focus); }
.chart-band { fill: var(--primary-wash); }
.chart-marker { fill: var(--surface); stroke-width: 2; }

.legend { display: flex; flex-wrap: wrap; gap: var(--s-4); font-size: var(--fs-xs); color: var(--text-dim); }
.legend-item { display: inline-flex; align-items: center; gap: var(--s-2); }
.legend-dot { width: 10px; height: 10px; border-radius: var(--r-pill); flex: none; }
.legend-dot.energy { background: var(--energy); }
.legend-dot.focus { background: var(--focus); }

.sparkline { display: block; width: 100%; height: 28px; }

/* ================================================================== *
 * Chips, segmented control, badges
 * ================================================================== */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 36px;
  padding: var(--s-2) var(--s-4);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  font-weight: 600;
  white-space: nowrap;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease);
}

.chip:hover { color: var(--text); border-color: var(--primary-line); }

.chip[aria-pressed="true"],
.chip.is-on {
  background: var(--primary-wash);
  border-color: var(--primary-line);
  color: var(--primary);
}

/*
 * The segmented control — day/week, 7/30/90/365, the three energy levels.
 * A track with the buttons inside it, and the selected one lifted onto its own
 * surface. No sliding indicator: it would need JavaScript to follow a resize,
 * and a control that is wrong for one frame after a rotation is worse than one
 * that never moves.
 */
.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface-2);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}

.seg::-webkit-scrollbar { display: none; }

.seg > button {
  flex: 1 1 auto;
  min-height: 36px;
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  font-weight: 700;
  white-space: nowrap;
  text-align: center;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}

.seg > button:hover { color: var(--text); }

.seg > button[aria-pressed="true"],
.seg > button[aria-selected="true"],
.seg > button.is-on {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px var(--s-3);
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--text-dim);
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}

.badge.good { background: var(--good-wash); color: var(--good); }
.badge.warn { background: var(--warn-wash); color: var(--warn); }
.badge.risk { background: var(--risk-wash); color: var(--risk); }
.badge.accent { background: var(--primary-wash); color: var(--primary); }

/* The honest label for a control that is not built yet. */
.badge.soon { background: var(--surface-3); color: var(--text-mute); }

/* ================================================================== *
 * Fields — inputs, selects, textareas, time
 * ================================================================== */

.field { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; }

.field > label,
.label {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-dim);
}

.input,
.select,
.textarea,
input[type="text"],
input[type="search"],
input[type="number"],
input[type="time"],
input[type="date"],
select,
textarea {
  width: 100%;
  min-height: var(--tap);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text);
  /* 16px exactly. Anything smaller and iOS Safari zooms the page on focus,
     which on a bottom sheet scrolls the field it just zoomed to off-screen. */
  font-size: var(--fs-base);
  line-height: 1.4;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}

textarea, .textarea { min-height: 96px; resize: vertical; line-height: var(--lh-body); }

.input:focus,
.select:focus,
.textarea:focus,
input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary-line);
  box-shadow: 0 0 0 3px var(--primary-wash);
}

/* Keyboard users still get the ring; the box-shadow above is the resting
   focus style for a pointer and the two together are too much. */
.input:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible { outline: 2px solid var(--outline); outline-offset: 1px; }

::placeholder { color: var(--text-mute); opacity: 1; }

input[aria-invalid="true"],
.input.is-error { border-color: var(--risk); }

.field-error { font-size: var(--fs-xs); color: var(--risk); }
.field-hint { font-size: var(--fs-xs); color: var(--text-mute); }

/*
 * A select needs its own arrow once the native one is turned off, and it is
 * drawn with a border rather than an image so it inherits the text colour and
 * follows the theme switch for free. The wrapper positions it at the inline
 * end, which in this RTL document is the left — the same side the native
 * control puts it on.
 */
.select-wrap { position: relative; display: block; min-width: 0; }

.select-wrap > select {
  appearance: none;
  -webkit-appearance: none;
  padding-inline-end: var(--s-7);
}

.select-wrap::after {
  content: '';
  position: absolute;
  inset-inline-end: var(--s-4);
  top: 50%;
  width: 8px;
  height: 8px;
  margin-top: -6px;
  border-inline-end: 2px solid var(--text-dim);
  border-block-end: 2px solid var(--text-dim);
  transform: rotate(45deg);
  pointer-events: none;
}

/*
 * Times are read left to right in Hebrew as everywhere else — 07:30 is not
 * 30:70 — so the field holding one is forced to LTR. Left to itself the
 * browser puts the caret and the segment order of a native time input on the
 * wrong side of an RTL form and people type the minutes into the hours.
 */
input[type="time"],
input[type="date"],
.time-input {
  direction: ltr;
  text-align: center;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}

/*
 * The stepper used for bedtime and wake. Two large targets and a number
 * between them, because the thing being adjusted is usually ±15 minutes from
 * where it already is, and a native time field makes that a four-tap
 * operation.
 */
.timepick {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  padding: var(--s-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
}

.timepick > button {
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  color: var(--text);
  font-size: var(--fs-lg);
  font-weight: 700;
}

.timepick > button:hover { background: var(--primary-wash); color: var(--primary); }

.timepick-value {
  flex: 1 1 auto;
  text-align: center;
  direction: ltr;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-title);
  font-weight: 600;
  line-height: 1.1;
}

.timepick-note { font-size: var(--fs-xs); color: var(--text-mute); text-align: center; }

/* Checkboxes, radios and switches keep the native control and only borrow the
   accent colour. A hand-built checkbox loses the platform's own focus, its
   keyboard behaviour and its high-contrast rendering, and gains nothing here. */
input[type="checkbox"],
input[type="radio"] {
  width: 20px;
  height: 20px;
  min-height: 0;
  flex: none;
  accent-color: var(--primary-strong);
}

.check-row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: var(--tap);
  cursor: pointer;
}

.check-row > span { flex: 1 1 auto; min-width: 0; }

/* ================================================================== *
 * Sliders
 *
 * The vendor pseudo-elements have to be written as separate rules. One
 * selector list containing both, and every browser that does not recognise
 * the other one throws the whole block away.
 * ================================================================== */

.slider {
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}

.slider::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
}

.slider::-moz-range-track {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
}

.slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  margin-top: -9px;
  border: 2px solid var(--surface);
  border-radius: var(--r-pill);
  background: var(--primary);
  box-shadow: var(--shadow-sm);
}

.slider::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border: 2px solid var(--surface);
  border-radius: var(--r-pill);
  background: var(--primary);
  box-shadow: var(--shadow-sm);
}

.slider:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--outline); outline-offset: 2px; }
.slider:focus-visible::-moz-range-thumb { outline: 2px solid var(--outline); outline-offset: 2px; }

.slider-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s-4); }

.slider-value {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-md);
  font-weight: 600;
  min-width: 3.5em;
  text-align: end;
}

/* The 1–5 scales in the evening ritual and the morning check-in. Five real
   buttons, because a slider cannot be read out as "3 of 5" and cannot be
   reached with one tap. */
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s-2); }

.scale > button {
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-md);
  font-weight: 600;
  text-align: center;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease);
}

.scale > button[aria-pressed="true"] {
  background: var(--primary-wash);
  border-color: var(--primary-line);
  color: var(--primary);
}

/* ================================================================== *
 * List rows and the timeline
 * ================================================================== */

.list { display: flex; flex-direction: column; gap: var(--s-2); }

.list-row {
  display: grid;
  grid-template-columns: 4.5em minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-3);
  width: 100%;
  min-height: 56px;
  padding: var(--s-3);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  background: var(--surface-2);
  text-align: start;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}

.list-row:hover { border-color: var(--line); background: var(--surface-3); }

.list-row.is-done { opacity: .6; }
.list-row.is-done .list-title { text-decoration: line-through; }

.list-time {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-sm);
  color: var(--text-dim);
  direction: ltr;
  text-align: start;
}

/* A column, not an inline run. Both children are spans, so without this the
   title and its meta line sit side by side and touch: "ללמוד למבחןשעתיים". */
.list-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.list-title { font-size: var(--fs-md); font-weight: 600; line-height: var(--lh-snug); }
.list-meta { font-size: var(--fs-xs); color: var(--text-mute); }
.list-actions { display: flex; align-items: center; gap: var(--s-1); }

/* A coloured edge is how an item says which category it belongs to without
   spending a chip on it. inline-start, so it is on the right in this document
   and moves by itself if that ever changes. */
.list-row.accent-work { border-inline-start: 3px solid var(--primary); }
.list-row.accent-fitness { border-inline-start: 3px solid var(--good); }
.list-row.accent-study { border-inline-start: 3px solid var(--violet); }
.list-row.accent-health { border-inline-start: 3px solid var(--focus); }
.list-row.accent-personal { border-inline-start: 3px solid var(--warn); }

/*
 * The timeline. One vertical rail with a dot per entry, drawn with a border on
 * the container rather than a pseudo-element per row so it stays unbroken
 * between rows of different heights.
 */
.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  padding-inline-start: var(--s-5);
  border-inline-start: 2px solid var(--line);
  margin-inline-start: var(--s-2);
}

.timeline-entry {
  position: relative;
  display: grid;
  grid-template-columns: 4.5em minmax(0, 1fr);
  align-items: baseline;
  gap: var(--s-3);
  padding-block: var(--s-2);
}

.timeline-entry::before {
  content: '';
  position: absolute;
  inset-inline-start: calc(var(--s-5) * -1 - 5px);
  top: 12px;
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--text-mute);
  box-shadow: 0 0 0 3px var(--bg);
}

.timeline-entry.tone-good::before { background: var(--good); }
.timeline-entry.tone-warn::before { background: var(--warn); }
.timeline-entry.is-now::before { background: var(--primary); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--primary-wash); }

.timeline-time {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-sm);
  color: var(--text-dim);
  direction: ltr;
  text-align: start;
}

.timeline-title { font-size: var(--fs-base); font-weight: 600; }
.timeline-detail { font-size: var(--fs-sm); color: var(--text-dim); }

/* ================================================================== *
 * Overlays — modal and sheet
 *
 * The class names here are fixed by src/core/dom.js. Both backdrops are a
 * plain scrim: a blur behind every dialog in the app costs a repaint of the
 * whole page on every scroll underneath it, and on the phones this is for it
 * is the difference between a sheet that rises and one that stutters.
 * ================================================================== */

.modal-back,
.sheet-back {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--scrim);
  animation: fade var(--t-mid) var(--ease);
}

.modal-back { display: grid; place-items: center; padding: var(--s-4); }

.modal-box {
  width: 100%;
  max-width: 460px;
  max-height: 86dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: rise var(--t-mid) var(--ease);
}

.sheet-back { display: flex; align-items: flex-end; justify-content: center; }

.sheet-box {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 640px;
  /* Not 100dvh: leaving the top of the page visible is what tells somebody
     this is a layer over the day and not a new screen. */
  max-height: 88dvh;
  border: 1px solid var(--line);
  border-block-end: 0;
  border-start-start-radius: var(--r-lg);
  border-start-end-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: slide-up var(--t-mid) var(--ease);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  flex: none;
  padding: var(--s-4) var(--s-5);
  border-block-end: 1px solid var(--line-soft);
}

.sheet-title { font-size: var(--fs-lg); font-weight: 700; min-width: 0; }

.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--s-5);
  /* The home indicator sits over the last row of a sheet that ends at the
     bottom edge of the screen. */
  padding-block-end: calc(var(--s-5) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
}

/* A row of actions pinned under the sheet's content. */
.sheet-actions { display: flex; gap: var(--s-3); }
.sheet-actions > .btn { flex: 1 1 0; }

@media (min-width: 768px) {
  .sheet-back { align-items: center; padding: var(--s-5); }

  .sheet-box {
    max-height: 82dvh;
    border-radius: var(--r-lg);
    border-block-end: 1px solid var(--line);
    animation: rise var(--t-mid) var(--ease);
  }

  .sheet-body { padding-block-end: var(--s-5); }
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes slide-up { from { transform: translateY(12%); } to { transform: none; } }

/* ================================================================== *
 * Empty states, skeletons, toasts
 * ================================================================== */

/*
 * Every empty state names the next action (Contracts §16.7). The shape is
 * fixed — a mark, a line saying what is not here, a line saying what to do,
 * and the button that does it — so that "nothing scheduled tomorrow" and "no
 * history yet" cannot drift into two different-looking screens.
 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-7) var(--s-5);
  border: 1px dashed var(--line);
  border-radius: var(--r);
  background: var(--surface);
  text-align: center;
}

.empty-mark {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: var(--r-pill);
  background: var(--primary-wash);
  color: var(--primary);
}

.empty-mark svg { width: 24px; height: 24px; }
.empty-title { font-size: var(--fs-md); font-weight: 700; }
.empty-text { font-size: var(--fs-sm); color: var(--text-dim); max-width: 40ch; }

.skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  /* A skeleton with no height collapses and the layout jumps twice — once
     when it appears, once when it is replaced. */
  min-height: 14px;
}

.skeleton.line { height: 14px; }
.skeleton.title { height: 22px; width: 60%; }
.skeleton.block { height: 120px; border-radius: var(--r-md); }
.skeleton.ring { width: 168px; height: 168px; border-radius: var(--r-pill); margin-inline: auto; }

.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--surface-3), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.4s var(--ease) infinite;
}

@keyframes shimmer { to { transform: translateX(100%); } }

/* The blanket reduced-motion rule stops the sweep mid-travel, which leaves a
   bright band frozen across the placeholder. Removing the sweep entirely is
   the honest version of "no animation". */
@media (prefers-reduced-motion: reduce) {
  .skeleton::after { display: none; }
}

:root[data-motion="reduced"] .skeleton::after { display: none; }

/*
 * The toast. Above the bottom bar, never over it: on a phone this appears
 * right after a tap, and covering the thing that was just tapped is how a
 * confirmation turns into a mis-tap.
 */
.toast {
  position: fixed;
  inset-block-end: calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--s-4));
  inset-inline: var(--s-4);
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-3);
  margin-inline: auto;
  max-width: 420px;
  padding: var(--s-3) var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--text);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: center;
  box-shadow: var(--shadow);
  animation: rise var(--t-mid) var(--ease);
}

.toast.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.toast.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }

.toast > .btn { min-height: 32px; padding: 0 var(--s-3); font-size: var(--fs-sm); }

@media (min-width: 1024px) {
  .toast { inset-block-end: var(--s-6); }
}

/* ================================================================== *
 * Small shared pieces
 * ================================================================== */

/* The confidence and evidence line that has to appear under anything the app
   predicted. Contracts §11 and §6.4: never a number without what it rests on. */
.evidence {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-size: var(--fs-xs);
  color: var(--text-mute);
}

.divider { height: 1px; background: var(--line-soft); border: 0; }

/* A number the eye is meant to land on: the score delta, a duration, a count. */
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-value {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-lg);
  font-weight: 600;
}
.stat-label { font-size: var(--fs-xs); color: var(--text-mute); }


/*
 * views.css — layouts that belong to one screen each.
 *
 * components.css is the shared vocabulary: a button is a button everywhere. This
 * file is the other half — the home hero, the ritual's five steps, the what-if
 * comparison, the week grid, the chat thread. Keeping them apart is what stops
 * components.css from slowly becoming the place things end up.
 *
 * Everything here obeys the same three rules as the rest of the stylesheet:
 * colours come from tokens so both themes work, logical properties so RTL works,
 * and nothing may be wider than its container at 375px.
 */

/* ================================================================== *
 * Small shared shapes the components file does not own
 * ================================================================== */

.row.wrap { flex-wrap: wrap; }
.stack.tight { gap: var(--s-2); }
.center { text-align: center; }
.grow { flex: 1 1 auto; min-width: 0; }

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.why-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  padding-inline-start: var(--s-5);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.why-list li { list-style: disc; }
.why-list li::marker { color: var(--primary); }

.bars { display: flex; flex-direction: column; }

.stats {
  display: flex;
  gap: var(--s-5);
  flex-wrap: wrap;
}

.empty-icon { width: 28px; height: 28px; color: var(--text-mute); }

/*
 * A checkbox drawn as a switch, built from the real input so it stays
 * keyboard-operable and announces its own state; only the paint is borrowed.
 *
 * The geometry is written against the document direction rather than with
 * logical properties, because a form control does not reliably inherit the
 * page's direction for the purposes of positioning its own pseudo-element —
 * the knob was ending up on the left in an RTL page, which is where an unset
 * switch is *not*. iOS mirrors switches in RTL and so does this: off is the
 * side the reader starts from, which in Hebrew is the right.
 */
.switch {
  appearance: none;
  inline-size: 46px;
  block-size: 28px;
  flex: none;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--line);
  position: relative;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}

.switch::after {
  content: '';
  position: absolute;
  inset-block-start: 3px;
  inline-size: 20px;
  block-size: 20px;
  border-radius: var(--r-pill);
  background: var(--text-dim);
  transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}

[dir='rtl'] .switch::after { right: 3px; }
[dir='ltr'] .switch::after { left: 3px; }

.switch:checked { background: var(--primary-wash); border-color: var(--primary-line); }
.switch:checked::after { background: var(--primary); }

[dir='rtl'] .switch:checked::after { transform: translateX(-18px); }
[dir='ltr'] .switch:checked::after { transform: translateX(18px); }

.flip { transform: scaleX(-1); }

/* ================================================================== *
 * Toasts
 * ================================================================== */

.toasts {
  position: fixed;
  inset-block-end: calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--s-3));
  inset-inline: var(--gutter);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  align-items: center;
  pointer-events: none;
}

@media (min-width: 1024px) {
  .toasts { inset-block-end: var(--s-5); inset-inline-start: calc(var(--side-w) + var(--s-5)); inset-inline-end: auto; align-items: flex-start; }
}

/* ================================================================== *
 * Full-screen flows: onboarding, ritual, check-in, review, what-if
 * ================================================================== */

.flow {
  position: fixed;
  inset: 0;
  z-index: 70;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--bg);
  padding-block: max(var(--s-5), env(safe-area-inset-top)) calc(var(--s-6) + env(safe-area-inset-bottom));
  padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right));
}

body.flow-open { overflow: hidden; }

.flow-inner {
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
  max-width: 640px;
  margin-inline: auto;
  min-height: 100%;
}

.flow-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-4); }
.flow-title { font-family: var(--font-display); font-size: var(--fs-title); line-height: var(--lh-tight); }
.flow-body { display: flex; flex-direction: column; gap: var(--s-5); flex: 1 1 auto; }

/* The actions sit at the end of the flow, and on a phone they are the last
   thing above the thumb rather than the last thing after a long scroll. */
.flow-actions {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  margin-block-start: auto;
  padding-block-start: var(--s-4);
}

.flow-actions .btn { width: 100%; justify-content: center; }

@media (min-width: 600px) {
  .flow-actions { flex-direction: row-reverse; justify-content: flex-end; }
  .flow-actions .btn { width: auto; }
}

.ritual-progress { display: flex; gap: 5px; margin-block-end: var(--s-2); }
.ritual-progress i {
  block-size: 4px;
  inline-size: 26px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  transition: background var(--t-mid) var(--ease);
}
.ritual-progress i.on { background: var(--primary); }

.welcome { display: flex; flex-direction: column; gap: var(--s-4); }

/* ================================================================== *
 * Home
 * ================================================================== */

.home-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
}

.home-head h1 {
  font-family: var(--font-display);
  font-size: var(--fs-title);
  line-height: var(--lh-tight);
}

.home-greet { min-width: 0; flex: 1 1 14ch; }

/* On a phone the two wrappers are just blocks, and the gap between them has to
   match the gap between the cards inside them or the seam shows. */
.view-tomorrow { gap: var(--s-4); }

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  flex-wrap: wrap;
  margin-block-end: var(--s-3);
}

.hero-actions {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  margin-block-start: var(--s-5);
}

.hero-actions .btn { width: 100%; justify-content: center; }

@media (min-width: 520px) {
  .hero-actions { flex-direction: row; justify-content: center; }
  .hero-actions .btn { width: auto; }
}

/*
 * The score dial's two circles. Drawn here rather than in chart.js so the same
 * SVG works in both themes without being re-rendered.
 */
.ring-track { fill: none; stroke: var(--surface-3); stroke-width: 10; }
.ring-fill {
  fill: none;
  stroke: url(#ring-grad);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dasharray var(--t-slow) var(--ease);
}

.rec-move { align-items: baseline; gap: var(--s-2); margin-block: var(--s-3); }
.rec-move .num { font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: 600; }
.rec-arrow { width: 18px; height: 18px; color: var(--text-mute); transform: scaleX(-1); }

.focus-window {
  margin-block-start: var(--s-3);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  line-height: var(--lh-snug);
}
.focus-window b { color: var(--text); font-family: var(--font-mono); }

.factor-explain {
  margin-block-start: var(--s-3);
  padding: var(--s-3);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.timeline-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.timeline-glyph { width: 15px; height: 15px; flex: none; color: var(--text-mute); }
.timeline-title { display: inline-flex; align-items: center; gap: var(--s-2); }
.timeline-entry.tone-good .timeline-glyph { color: var(--good); }
.timeline-entry.tone-warn .timeline-glyph { color: var(--warn); }

/* ================================================================== *
 * Comparisons: improve, what-if, review
 * ================================================================== */

.compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--s-3);
  padding-block: var(--s-4);
}

.compare-box { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.compare-label { font-size: var(--fs-xs); color: var(--text-mute); text-align: center; }
.compare-score {
  font-family: var(--font-display);
  font-size: clamp(34px, 11vw, 48px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.compare-score.good { color: var(--good); }
.compare-score.bad { color: var(--risk); }
.compare-arrow { width: 22px; height: 22px; color: var(--text-mute); transform: scaleX(-1); }
.compare-delta { font-size: var(--fs-sm); }

.change-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  counter-reset: change;
}

.change-list li {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
  padding: var(--s-3);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.change-list li > span:last-child { flex: 1 1 auto; min-width: 0; }

.change-kind {
  flex: none;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--primary);
  padding: 2px var(--s-2);
  border-radius: var(--r-xs);
  background: var(--primary-wash);
}

.applied-mark {
  display: grid;
  place-items: center;
  inline-size: 56px;
  block-size: 56px;
  margin-inline: auto;
  border-radius: var(--r-pill);
  background: var(--good-wash);
  color: var(--good);
}
.applied-mark svg { width: 28px; height: 28px; }

.diff-list {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  font-size: var(--fs-sm);
  color: var(--text-dim);
}

.diff-stats { gap: var(--s-5); margin-block-start: var(--s-3); }

.whatif-compare { display: flex; flex-direction: column; gap: var(--s-3); }
.whatif-item { gap: var(--s-2); }
.whatif-item.is-removed { opacity: .45; }
.whatif-item.is-removed .grow { text-decoration: line-through; }

.time-input.small { inline-size: 8.5em; flex: none; }
.time-input.big { font-size: var(--fs-title); text-align: center; inline-size: 100%; }
.input.small { inline-size: 6.5em; flex: none; }

/* ================================================================== *
 * Ritual analysis
 * ================================================================== */

.stages {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  margin-inline: auto;
  max-width: 22em;
}

.stages li {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  color: var(--text-mute);
  font-size: var(--fs-md);
  opacity: .45;
  transition: opacity var(--t-mid) var(--ease), color var(--t-mid) var(--ease);
}

.stages li.active { opacity: 1; color: var(--text); }
.stages li.done { opacity: 1; color: var(--text-dim); }

.stage-dot {
  inline-size: 9px;
  block-size: 9px;
  flex: none;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  transition: background var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease);
}

.stages li.active .stage-dot { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-wash); }
.stages li.done .stage-dot { background: var(--good); }

.check-mark { width: 18px; height: 18px; flex: none; opacity: 0; color: var(--primary); }
.check-row.is-on .check-mark { opacity: 1; }

/* ================================================================== *
 * Schedule
 * ================================================================== */

.day-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
}

.day-nav-label { font-weight: 700; font-size: var(--fs-md); }
.day-stats { justify-content: space-between; }

.dur-row { align-items: center; }

.more > summary {
  cursor: pointer;
  padding-block: var(--s-2);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--primary);
}

.nl .parsed {
  margin-block-start: var(--s-2);
  padding: var(--s-3);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  align-items: baseline;
}

/* ================================================================== *
 * Week grid
 * ================================================================== */

/*
 * Seven columns that shrink rather than scroll. A horizontally scrolling week
 * is a week nobody compares, which is the only reason to show one.
 */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--s-1);
}

.week-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-1);
  padding: var(--s-2) 2px;
  min-width: 0;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}

.week-day:hover { border-color: var(--line); background: var(--surface-3); }
.week-day.is-today { border-color: var(--primary-line); }
.week-day.is-best { background: var(--good-wash); }

.week-dow { font-size: var(--fs-xs); color: var(--text-mute); }
.week-score { font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 600; font-variant-numeric: tabular-nums; }

.week-bar {
  display: flex;
  align-items: flex-end;
  block-size: 40px;
  inline-size: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.week-bar i { inline-size: 100%; background: var(--grad); border-radius: var(--r-pill); }
.week-day.band-low .week-bar i { background: var(--risk); }
.week-day.band-fair .week-bar i { background: var(--warn); }
.week-day.band-great .week-bar i { background: var(--good); }

.week-meta { font-size: 10px; color: var(--text-mute); font-family: var(--font-mono); }

.week-risk {
  font-size: 9.5px;
  line-height: 1.2;
  text-align: center;
  color: var(--text-mute);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.week-risk.sev-high { color: var(--risk); }
.week-risk.sev-medium { color: var(--warn); }

/* Below 380px seven columns of text stop being readable; the risk line is the
   first thing to go, because the colour of the bar already carries it. */
@media (max-width: 379px) {
  .week-risk, .week-meta { display: none; }
}

/* ================================================================== *
 * Chat
 * ================================================================== */

.chat-note { display: flex; gap: var(--s-3); align-items: flex-start; }
.chat-note-icon { width: 20px; height: 20px; flex: none; color: var(--primary); margin-block-start: 2px; }

.chat-thread {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  padding-block: var(--s-2);
}

.chat-msg { max-width: 88%; }
.chat-msg p {
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r);
  font-size: var(--fs-sm);
  line-height: var(--lh-body);
}

.chat-msg.from-ai { align-self: flex-start; }
.chat-msg.from-ai p {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-start-start-radius: var(--r-xs);
}

.chat-msg.from-user { align-self: flex-end; }
.chat-msg.from-user p {
  background: var(--primary-wash);
  border: 1px solid var(--primary-line);
  border-start-end-radius: var(--r-xs);
}

.chat-suggest { margin-block-start: var(--s-2); }

.chat-bar {
  position: sticky;
  inset-block-end: 0;
  display: flex;
  gap: var(--s-2);
  padding-block: var(--s-3);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

.chat-bar .input { flex: 1 1 auto; min-width: 0; }
.chat-bar .btn { flex: none; }

/* ================================================================== *
 * History
 * ================================================================== */

.history-rows { display: flex; flex-direction: column; }

.history-row {
  display: grid;
  grid-template-columns: 2em minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--s-2);
  padding-block: var(--s-2);
  font-size: var(--fs-sm);
}

.history-row + .history-row { border-block-start: 1px solid var(--line-soft); }
.history-day { color: var(--text-mute); font-size: var(--fs-xs); }
.history-date { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-pair { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; }
.history-acc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-dim); }
.history-acc.good { color: var(--good); }
.history-acc.warn { color: var(--warn); }
.history-sleep { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-mute); }

/* The sleep column is the first thing to drop on a narrow phone — it is the
   least load-bearing number in the row. */
@media (max-width: 399px) {
  .history-row { grid-template-columns: 2em minmax(0, 1fr) auto auto; }
  .history-sleep { display: none; }
}

.about { margin-block-start: var(--s-6); }

/* ================================================================== *
 * Desktop: use the room rather than stretching the phone
 * ================================================================== */

/*
 * From 1024px the home screen becomes three columns: the score and what to do
 * about it on one side, the day in the middle, the supporting detail on the
 * other. The order in the DOM stays the phone's order, which is the one that
 * reads correctly to a screen reader and on a narrow window.
 */
@media (min-width: 1024px) {
  /*
   * The reading cap in base.css is right for a column of prose and wrong for
   * this screen. Two columns inside 860px gives a 380px aside and a 440px main,
   * which is narrower than the phone layout's own cards — the timeline and both
   * charts end up cramped on the widest screen the app runs on. A dashboard is
   * not a paragraph, so this view takes the room it needs and no more.
   */
  .view-tomorrow {
    max-width: 1180px;
    display: grid;
    grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
    grid-template-areas:
      'head head'
      'aside main';
    align-items: start;
    gap: var(--s-5);
  }

  .view-tomorrow > .home-head { grid-area: head; }
  .home-aside { grid-area: aside; }
  .home-main { grid-area: main; }

  /*
   * The score follows you down the page. It is the one number the whole screen
   * is about, and losing it behind a scroll while reading the timeline is
   * losing the thing the timeline is being read against.
