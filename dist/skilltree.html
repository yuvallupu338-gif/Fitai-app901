<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1012">
<meta name="description" content="A skill tree for real abilities. Skills unlock when you meet their requirements — a quiz passed, a challenge whose tests went green, a standard you can hit.">
<title>SkillTree</title>

<!-- Dark before first paint. Applied here rather than in main.js because a
     module script runs after the document renders, and the gap is a white
     flash on every load for a dark-by-default app. -->
<script>
  try {
    var raw = localStorage.getItem('skilltree.v1');
    var theme = 'dark';
    if (raw) {
      var data = JSON.parse(raw);
      var active = data && data.activeProfileId;
      var profile = active && data.profiles && data.profiles[active];
      if (profile && profile.settings && profile.settings.theme === 'light') theme = 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') {
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F3EF');
    }
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>


<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230E1012'/><path d='M12 20v-6M12 14 6 9M12 14l6-5' stroke='%23A8AFB6' stroke-width='1.7' stroke-linecap='round' fill='none'/><circle cx='6' cy='7.5' r='2.6' fill='%23C9F24D'/><circle cx='18' cy='7.5' r='2.2' fill='%237C858D'/></svg>">
<style>
/*
 * tokens.css — SkillTree's design language.
 *
 * The position, stated once so the rest of the CSS can be judged against it:
 *
 * MONOCHROME PLUS ONE. The interface chrome is greyscale — ink, graphite,
 * bone. Exactly one chromatic colour appears in it, an acid lime, and it means
 * one thing: progress you have earned. XP, filled rings, unlocked nodes, level
 * bars. Nothing else may use it. The result is that on any screen, the green
 * *is* the progress, and a glance finds it without reading a word.
 *
 * This is a deliberate rejection of the house style of generated dashboards:
 * a different gradient per card, glow on everything, six accent hues competing
 * for the same attention. Restraint is the identity here.
 *
 * The categorical palette below breaks the rule on purpose, and only inside
 * data visualisation and category chips, where distinguishing six series is
 * the entire job. It never appears in interface chrome, so it cannot compete
 * with the accent for the "this is your progress" signal.
 *
 * Node state is carried by FORM first — ring style, glyph, weight — and colour
 * second, because a learner with colour vision deficiency has to be able to
 * tell a locked node from an available one (§53), and because on the tree
 * screen these are 44px circles seen at a glance.
 */

:root {
  /* ---- surfaces: near-black, faintly cool, never #000 ---- */
  --ground: #0E1012;
  --surface: #16191C;
  --surface-2: #1C2024;
  --surface-3: #23282D;
  --line: #2A3036;
  --line-soft: #1F242A;

  /* ---- ink ---- */
  --bone: #E8EAEC;
  --bone-dim: #A8AFB6;
  /*
   * Measured on every surface it is actually used on, not just one.
   *
   * The previous value was chosen against --surface (4.70:1) and used on three
   * other surfaces where it fell to 3.96:1 — across roughly 220 elements:
   * every card note, list subtitle, chip and stat label. Now 4.76:1 at worst.
   */
  --bone-dimmer: #8A939B;

  /* ---- the one accent ---- */
  --lime: #C9F24D;
  --lime-ink: #0E1012;        /* text ON lime — always the dark ground */
  --lime-soft: rgba(201, 242, 77, .14);
  --lime-line: rgba(201, 242, 77, .34);
  /*
   * Two roles, deliberately two tokens.
   *
   * --lime-hover is a *fill* the dark ink sits on, so it must stay light
   * enough to keep that text readable. --lime-deep is the accent used as
   * text or a hairline on a light surface, so it must be dark. One token
   * cannot be both: the first version used --lime-deep for the primary
   * button's hover fill, and in light mode that put #17200A on #5F7A0F —
   * 3.4:1, under the 4.5 threshold, and only visible when hovering.
   */
  --lime-hover: #B4DE2E;
  --lime-deep: #8FAF2A;
  /*
   * The accent when it IS the mark — text, a ring, a bar fill, a chart line.
   *
   * Distinct from --lime, which is a *fill* that dark ink sits on. The two
   * were the same token, and in light mode that put #B4DE2E text on white at
   * 1.56:1: every level badge, every "on" chip, the whole XP chart and every
   * progress bar were a pale wash on near-white. The rule was already written
   * in this file — "--lime-deep is for ink, never for a fill" — and the
   * stylesheet broke it in nine places, which is what happens when a rule has
   * no token to enforce it.
   */
  --accent-ink: #C9F24D;

  /* ---- semantic, used sparingly and never decoratively ---- */
  --warn: #E8B34A;
  --warn-soft: rgba(232, 179, 74, .13);
  --fail: #E8756B;
  --fail-soft: rgba(232, 117, 107, .13);

  /* ---- categorical: data visualisation and category chips only ----
   * Hues chosen for identity, then snapped into the dark-mode OKLCH lightness
   * band (L 0.48–0.67) at the highest chroma sRGB allows for each hue, and
   * checked with a validator rather than by eye: lightness band, chroma floor,
   * colour-vision-deficiency separation of every adjacent pair, normal-vision
   * separation, and contrast against the card surface. The earlier, prettier
   * pastels failed the band and read as grey under protanopia. */
  --cat-1: #4484F5;
  --cat-2: #E15620;
  --cat-3: #9F60F6;
  --cat-4: #129F86;
  --cat-5: #AC8123;
  --cat-6: #EB2895;

  /* ---- type ----
   * A system stack for prose, and a monospace for every number that means a
   * quantity. Levels, XP, scores and timers are instrument readings; setting
   * them in tabular figures stops them jittering as they count up, and gives
   * the app the precision-tool feel that the RPG framing needs without a
   * single pixel of chrome or bevel. */
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;

  /* ---- spacing: the brief's scale, used exclusively ---- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;

  /* ---- geometry ---- */
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --r-pill: 999px;

  /* ---- motion: 150–300ms, and nothing that loops ---- */
  --fast: .15s;
  --mid: .22s;
  --slow: .3s;
  --ease: cubic-bezier(.2, .8, .3, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  /* ---- depth ----
   * Elevation is a hairline plus a soft shadow, not a glow. A glow on a card
   * reads as an alert; these are just surfaces sitting above other surfaces. */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 4px 16px rgba(0, 0, 0, .38);
  --shadow-3: 0 12px 40px rgba(0, 0, 0, .5);

  --nav-w: 232px;
  --wrap: 1180px;
}

/*
 * Light mode.
 *
 * Not an inversion — an inverted dark theme always looks like one. The ground
 * is a warm off-white with a hint of paper rather than #FFF, surfaces are
 * white so cards lift instead of sinking, and the accent darkens substantially
 * because acid lime on white is illegible. The accent's *role* is identical;
 * only its value changes.
 */
:root[data-theme="light"] {
  --ground: #F4F3EF;
  --surface: #FFFFFF;
  --surface-2: #FAF9F6;
  --surface-3: #F0EEE8;
  --line: #E0DDD5;
  --line-soft: #EBE8E1;

  --bone: #1A1D20;
  --bone-dim: #565C63;
  /* Likewise re-measured: 4.59:1 at worst, on --surface-3. */
  --bone-dimmer: #656C73;

  /* Lime is kept for fills, where dark text sits on it; the darker variant is
   * used wherever the accent has to work as text or a thin line. */
  --lime: #B4DE2E;
  --lime-ink: #17200A;
  --lime-soft: rgba(122, 156, 20, .15);
  --lime-line: rgba(122, 156, 20, .42);
  /* 8.8:1 under the dark ink it carries. */
  --lime-hover: #A2C921;
  /* 4.9:1 as text on white — this one is for ink, never for a fill. */
  --lime-deep: #5F7A0F;
  /* 4.9:1 on card, 4.4:1 on the page ground, 4.2:1 as a bar against its
   * track. The dark theme can use the bright lime for all of these; light
   * cannot, and this is the token that lets one rule serve both. */
  --accent-ink: #5F7A0F;

  --warn: #9A6A0C;
  --warn-soft: rgba(154, 106, 12, .12);
  --fail: #B03A2E;
  --fail-soft: rgba(176, 58, 46, .1);

  /* Re-stepped for the white card surface and validated independently — a
   * flipped dark palette is not a light palette. */
  --cat-1: #2570F5;
  --cat-2: #C94C1C;
  --cat-3: #9441F4;
  --cat-4: #009077;
  --cat-5: #9C7310;
  --cat-6: #D22485;

  --shadow-1: 0 1px 2px rgba(28, 25, 20, .07);
  --shadow-2: 0 4px 14px rgba(28, 25, 20, .09);
  --shadow-3: 0 12px 34px rgba(28, 25, 20, .13);
}

/*
 * Node state colours, defined once and referenced by the tree, the panel, the
 * search results and the goal path — so a "mastered" node cannot be one colour
 * in the tree and another in the list beside it.
 */
:root {
  --st-locked-ink: var(--bone-dimmer);
  --st-locked-face: var(--surface);
  --st-locked-line: var(--line);

  --st-available-ink: var(--bone);
  --st-available-face: var(--surface-2);
  --st-available-line: var(--bone-dimmer);

  --st-progress-ink: var(--bone);
  --st-progress-face: var(--surface-2);
  --st-progress-line: var(--accent-ink);

  --st-complete-ink: var(--bone);
  --st-complete-face: var(--surface-3);
  --st-complete-line: var(--accent-ink);

  --st-mastered-ink: var(--lime-ink);
  --st-mastered-face: var(--lime);
  --st-mastered-line: var(--lime);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --fast: .01ms;
    --mid: .01ms;
    --slow: .01ms;
  }
}


/*
 * base.css — reset, page frame, navigation, typography.
 */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--ground);
  color: var(--bone);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}

body.sheet-open { overflow: hidden; }

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 620;
  /* Negative tracking at display sizes only. Large text set at default
   * tracking is the single most common giveaway of an untouched default
   * stylesheet. */
  letter-spacing: -.022em;
  line-height: 1.18;
}

h1 { font-size: clamp(24px, 3.4vw, 31px); }
h2 { font-size: clamp(18px, 2.2vw, 21px); letter-spacing: -.016em; }
h3 { font-size: 15px; letter-spacing: -.008em; }

p { margin: 0 0 var(--s3); }
p:last-child { margin-bottom: 0; }

a { color: inherit; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* Every number that means a quantity. See the note in tokens.css. */
.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/*
 * Focus. One ring, everywhere, and only for keyboard users — :focus-visible is
 * what people are reaching for when they delete outlines because the mouse
 * click ring annoyed them.
 */
:focus { outline: none; }
:focus-visible {
  /* --accent-ink, not --lime: in light mode the bright lime ring measured
   * 1.41:1 against the page and was effectively invisible. */
  outline: 2px solid var(--accent-ink);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ *
 * App frame
 * ------------------------------------------------------------------ */

.app {
  display: grid;
  grid-template-columns: var(--nav-w) 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}

/*
 * Onboarding has no navigation.
 *
 * Not "disabled navigation" — removed. Every screen behind these links is
 * guarded on having finished onboarding, so they could only ever bounce back
 * here and discard the answers on the way. A single column also lets the
 * onboarding card sit where it belongs, in the middle of the page.
 */
body.onboarding .nav,
body.onboarding .tabbar { display: none; }
body.onboarding .app { grid-template-columns: 1fr; }

.main {
  min-width: 0; /* without this, a wide child stretches the grid column and
                 * the whole page scrolls sideways */
  padding: var(--s6) var(--s5) var(--s8);
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
}

/* ---- sidebar ---- */

.nav {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  padding: var(--s5) var(--s3) var(--s4);
  border-right: 1px solid var(--line-soft);
  background: var(--surface);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s3) var(--s5);
  font-weight: 640;
  letter-spacing: -.02em;
  font-size: 16px;
}

.nav-mark {
  width: 26px; height: 26px;
  flex: none;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 9px var(--s3);
  border-radius: var(--r-sm);
  border: 0;
  background: none;
  color: var(--bone-dim);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}

.nav-link:hover { background: var(--surface-2); color: var(--bone); }

.nav-link[aria-current="page"] {
  background: var(--surface-3);
  color: var(--bone);
  font-weight: 580;
}

/* The active marker is a bar, not a colour change, so it survives being
 * printed, being viewed in greyscale, and colour vision deficiency. */
.nav-link[aria-current="page"] .nav-icon { color: var(--accent-ink); }

.nav-icon { width: 17px; height: 17px; flex: none; opacity: .9; }

.nav-spacer { flex: 1; }

.nav-foot {
  padding: var(--s3);
  border-top: 1px solid var(--line-soft);
  margin-top: var(--s3);
}

/* ---- mobile bottom bar ---- */

.tabbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .nav { display: none; }

  .main {
    padding: var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom, 0px));
  }

  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 40;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: var(--s1);
    padding: 6px var(--s2) calc(6px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line-soft);
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 7px 2px;
    /* 44px minimum target. Anything smaller is a game of accuracy for
     * thumbs — the same rule the responsive-design skill teaches. */
    min-height: 46px;
    border: 0;
    border-radius: var(--r-sm);
    background: none;
    color: var(--bone-dimmer);
    font-size: 10.5px;
    font-weight: 560;
    letter-spacing: .01em;
    cursor: pointer;
  }

  /* Weight and a bar as well as colour — the active tab was distinguished by
   * colour alone, and in light mode that colour measured 1.56:1, making the
   * active tab *less* legible than the inactive ones. */
  .tab[aria-current="page"] {
    color: var(--accent-ink);
    font-weight: 680;
  }
  .tab[aria-current="page"]::before {
    content: "";
    position: absolute;
    top: 0;
    width: 22px;
    height: 2px;
    border-radius: 0 0 2px 2px;
    background: var(--accent-ink);
  }
  .tab { position: relative; }
  .tab svg { width: 19px; height: 19px; }
}

/* ------------------------------------------------------------------ *
 * Page header
 * ------------------------------------------------------------------ */

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s4);
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}

.page-head p {
  margin: var(--s1) 0 0;
  color: var(--bone-dim);
  font-size: 14px;
  max-width: 62ch;
}

.eyebrow {
  font-size: 11px;
  font-weight: 620;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--bone-dimmer);
  margin-bottom: var(--s2);
}


/*
 * components.css — cards, buttons, bars, chips, sheets, forms, states.
 *
 * Cards deliberately are not all the same. A dashboard where every panel is an
 * identical rounded rectangle is the visual signature of a generated layout,
 * and it also flattens the hierarchy: the thing you should look at first looks
 * exactly like the thing you can ignore. So there are three card weights here
 * — .card, .card.quiet and .card.feature — and screens pick deliberately.
 */

.skip-link {
  position: fixed;
  top: var(--s2);
  left: var(--s2);
  z-index: 100;
  padding: 10px var(--s4);
  border-radius: var(--r-sm);
  border: 1px solid var(--accent-ink);
  background: var(--surface);
  color: var(--bone);
  font-size: 14px;
  font-weight: 580;
  text-decoration: none;
  /* Off-screen rather than display:none, so it stays focusable. */
  transform: translateY(-200%);
  transition: transform var(--fast) var(--ease);
}
.skip-link:focus { transform: none; }

/* ------------------------------------------------------------------ *
 * Cards
 * ------------------------------------------------------------------ */

.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  padding: var(--s4);
  box-shadow: var(--shadow-1);
}

/* Recedes: supporting information, lists of things you already know. */
.card.quiet {
  background: transparent;
  box-shadow: none;
  border-color: var(--line-soft);
}

/* Advances: the one thing on the screen worth acting on. */
.card.feature {
  background: var(--surface-2);
  border-color: var(--line);
  padding: var(--s5);
  box-shadow: var(--shadow-2);
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s3);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--bone);
}

.card-note { font-size: 12px; color: var(--bone-dimmer); }

.grid { display: grid; gap: var(--s4); }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

/*
 * Stat tiles are not content cards, and on a phone the difference matters.
 *
 * A tree card or an achievement wants the full width — it has a title, a
 * description and an action. A stat tile holds a label and a short number, and
 * stacking nine of them one per row turns a summary you should take in at a
 * glance into a thousand pixels of scrolling. So they get their own grid that
 * stays multi-column all the way down.
 */
.grid.stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.row {
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }

.stack { display: flex; flex-direction: column; gap: var(--s3); }
.stack.tight { gap: var(--s2); }
.stack.loose { gap: var(--s5); }

/* ------------------------------------------------------------------ *
 * Buttons
 * ------------------------------------------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  padding: 9px var(--s4);
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--bone);
  font-size: 14px;
  font-weight: 560;
  cursor: pointer;
  transition: background var(--fast) var(--ease),
              border-color var(--fast) var(--ease),
              transform var(--fast) var(--ease);
}

.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--bone-dimmer); }
.btn:active:not(:disabled) { transform: translateY(1px); }

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* The accent as a fill — the one place lime is a background, reserved for the
 * single primary action on a screen. Two lime buttons in one view means the
 * hierarchy is wrong. */
.btn.primary {
  background: var(--lime);
  border-color: var(--lime);
  color: var(--lime-ink);
  font-weight: 620;
}
.btn.primary:hover:not(:disabled) { background: var(--lime-hover); border-color: var(--lime-hover); }

.btn.ghost { background: transparent; border-color: transparent; color: var(--bone-dim); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--bone); }

.btn.big { min-height: 46px; padding: 12px var(--s5); font-size: 15px; }
.btn.small { min-height: 30px; padding: 5px var(--s3); font-size: 12.5px; }
.btn.wide { width: 100%; }

.btn svg { width: 16px; height: 16px; flex: none; }

/* ------------------------------------------------------------------ *
 * Progress bars
 * ------------------------------------------------------------------ */

.bar {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.bar > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent-ink);
  transition: width var(--slow) var(--ease-out);
}

.bar.tall { height: 9px; }

/* A second, dimmer fill behind the first: used where two ladders gate one
 * thing (XP and mastery), so the panel can show both without two bars. */
.bar > i.shadow { position: absolute; background: var(--lime-line); }
.bar.dual { position: relative; }
.bar.dual > i { position: absolute; top: 0; left: 0; }

/* ------------------------------------------------------------------ *
 * Chips, pills, badges
 * ------------------------------------------------------------------ */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 11.5px;
  font-weight: 560;
  color: var(--bone-dim);
  white-space: nowrap;
}

.chip.on {
  border-color: var(--lime-line);
  background: var(--lime-soft);
  color: var(--accent-ink);
}
.chip.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.chip.fail { border-color: transparent; background: var(--fail-soft); color: var(--fail); }

.chip button { all: unset; cursor: pointer; }

.lvl {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -.02em;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--surface-3);
  color: var(--bone-dim);
}
.lvl.on { background: var(--lime-soft); color: var(--accent-ink); }

/* ------------------------------------------------------------------ *
 * Skill node — the tree's atom
 * ------------------------------------------------------------------ *
 *
 * State is signalled three ways at once, on purpose:
 *   ring style  — dashed (locked), solid thin (available), arc (in progress),
 *                 full (complete), full + filled face (mastered)
 *   glyph       — lock, plus, percentage, check, star
 *   colour      — last, and never the only signal
 *
 * That redundancy is what makes the tree readable at a glance, in greyscale,
 * and with colour vision deficiency.
 */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 128px;
  margin-left: -64px;
  margin-top: -34px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  text-align: center;
  transition: transform var(--fast) var(--ease);
}

.node:hover { transform: scale(1.045); z-index: 3; }
.node:focus-visible { z-index: 4; }

.node-ring {
  position: relative;
  width: 52px; height: 52px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--st-locked-face);
  border: 1.5px dashed var(--st-locked-line);
  color: var(--st-locked-ink);
  transition: border-color var(--mid) var(--ease), background var(--mid) var(--ease);
}

.node-label {
  font-size: 11.5px;
  font-weight: 560;
  line-height: 1.25;
  color: var(--bone-dim);
  letter-spacing: -.005em;
  /* Two lines maximum, then ellipsis: a four-line label in a tree turns the
   * layout into a wall of text and pushes neighbouring nodes apart. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-clamp: 2;
  overflow: hidden;
}

.node-glyph { width: 17px; height: 17px; }
.node-pct {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 620;
  letter-spacing: -.04em;
}

.node[data-state="available"] .node-ring {
  border-style: solid;
  border-color: var(--st-available-line);
  background: var(--st-available-face);
  color: var(--st-available-ink);
}
.node[data-state="available"] .node-label { color: var(--bone); }

.node[data-state="in_progress"] .node-ring {
  border-style: solid;
  border-color: var(--line);
  background: var(--st-progress-face);
  color: var(--st-progress-ink);
}
.node[data-state="in_progress"] .node-label { color: var(--bone); font-weight: 600; }

.node[data-state="completed"] .node-ring {
  border-style: solid;
  border-color: var(--st-complete-line);
  background: var(--st-complete-face);
  color: var(--accent-ink);
}
.node[data-state="completed"] .node-label { color: var(--bone); }

.node[data-state="mastered"] .node-ring {
  border-style: solid;
  border-color: var(--st-mastered-line);
  background: var(--st-mastered-face);
  color: var(--st-mastered-ink);
}
.node[data-state="mastered"] .node-label { color: var(--bone); font-weight: 620; }

/* The progress arc for an in-progress node, drawn as a conic gradient ring
 * rather than an SVG circle — one element, no extra nodes in a tree that may
 * already hold three hundred. */
.node-arc {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: conic-gradient(var(--accent-ink) calc(var(--p) * 1%), transparent 0);
  -webkit-mask: radial-gradient(circle, transparent 0 61%, #000 62%);
  mask: radial-gradient(circle, transparent 0 61%, #000 62%);
}

/* Dimming when something else is highlighted. Applied to the container so one
 * class toggle repaints the whole tree rather than 300 inline styles. */
.tree-canvas.focusing .node { opacity: .26; }
.tree-canvas.focusing .node.lit { opacity: 1; }
.tree-canvas.focusing .node.lit .node-ring { border-color: var(--accent-ink); }

/* Goal-path membership is a persistent mark, not a hover state: a small filled
 * dot under the label, so it survives alongside every other state. */
.node.on-path .node-label::after {
  content: "";
  display: block;
  width: 4px; height: 4px;
  margin: 4px auto 0;
  border-radius: 50%;
  background: var(--accent-ink);
}

/* ------------------------------------------------------------------ *
 * Tree canvas
 * ------------------------------------------------------------------ */

.tree-shell {
  position: relative;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background:
    radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0) 0 0 / 26px 26px,
    var(--surface);
  overflow: hidden;
  height: min(72vh, 720px);
  touch-action: none; /* we handle pan and pinch ourselves */
}

.tree-viewport {
  position: absolute;
  inset: 0;
  cursor: grab;
}
.tree-viewport.dragging { cursor: grabbing; }

.tree-canvas {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

.tree-edges {
  position: absolute;
  top: 0; left: 0;
  overflow: visible;
  pointer-events: none;
}

.tree-edge {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.5;
  transition: stroke var(--mid) var(--ease);
}
.tree-edge.met { stroke: var(--lime-line); }
.tree-canvas.focusing .tree-edge { stroke: var(--line-soft); }
.tree-canvas.focusing .tree-edge.lit { stroke: var(--accent-ink); stroke-width: 2; }

.tree-controls {
  position: absolute;
  right: var(--s3);
  bottom: var(--s3);
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  padding: var(--s1);
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line-soft);
}

.tree-controls button {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 0; border-radius: 7px;
  background: none; color: var(--bone-dim);
  cursor: pointer;
}
.tree-controls button:hover { background: var(--surface-3); color: var(--bone); }

.tree-legend {
  position: absolute;
  left: var(--s3);
  bottom: var(--s3);
  z-index: 5;
  display: flex;
  gap: var(--s3);
  flex-wrap: wrap;
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line-soft);
  font-size: 11px;
  color: var(--bone-dimmer);
}
.tree-legend b { font-weight: 560; color: var(--bone-dim); }

@media (max-width: 720px) {
  .tree-shell { height: min(66vh, 560px); }
  .tree-legend { display: none; }
}

/* ------------------------------------------------------------------ *
 * Sheet / modal
 * ------------------------------------------------------------------ */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: var(--s5);
  background: rgba(6, 8, 10, .58);
  backdrop-filter: blur(3px);
  animation: fade var(--mid) var(--ease);
}

.sheet {
  position: relative;
  width: min(560px, 100%);
  max-height: min(86vh, 780px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--s5);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-3);
  animation: rise var(--slow) var(--ease-out);
}

.sheet.wide { width: min(840px, 100%); }

.sheet-close {
  position: absolute;
  top: var(--s3); right: var(--s3);
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: none;
  color: var(--bone-dim);
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}
.sheet-close:hover { background: var(--surface-3); color: var(--bone); }

.sheet-backdrop.closing { animation: fade var(--fast) var(--ease) reverse; }

@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99) } to { opacity: 1; transform: none } }

/* On a phone this becomes a bottom sheet — anchored to the thumb, full width,
 * and swipe-dismissable via the drag handle. §68: the mobile experience is
 * designed, not scaled down. */
@media (max-width: 640px) {
  .sheet-backdrop { padding: 0; place-items: end stretch; }

  .sheet {
    width: 100%;
    max-height: 88dvh;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    border-bottom: 0;
    padding: var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
    animation: slide-up var(--slow) var(--ease-out);
  }

  .sheet::before {
    content: "";
    display: block;
    width: 36px; height: 4px;
    margin: -6px auto var(--s4);
    border-radius: var(--r-pill);
    background: var(--line);
  }

  @keyframes slide-up { from { transform: translateY(100%) } to { transform: none } }
}

/* ------------------------------------------------------------------ *
 * Forms
 * ------------------------------------------------------------------ */

.field { display: flex; flex-direction: column; gap: 6px; }

.field label {
  font-size: 12.5px;
  font-weight: 560;
  color: var(--bone-dim);
}

.input, .textarea, select.input {
  width: 100%;
  padding: 10px var(--s3);
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--bone);
  transition: border-color var(--fast) var(--ease);
}

.input:focus, .textarea:focus { border-color: var(--lime-line); }

.textarea {
  min-height: 120px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  tab-size: 2;
}

/* A selectable card — used for quiz options, onboarding choices, intensity.
 * One component, because they are the same interaction and having three
 * near-identical ones is how they drift apart. */
.pick {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3) var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--bone);
  text-align: left;
  font-size: 14px;
  cursor: pointer;
  transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease);
}

.pick:hover { border-color: var(--bone-dimmer); }
.pick[aria-pressed="true"], .pick.on {
  border-color: var(--accent-ink);
  background: var(--lime-soft);
}

.pick-mark {
  flex: none;
  width: 18px; height: 18px;
  margin-top: 2px;
  border: 1.5px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
}
.pick[aria-pressed="true"] .pick-mark,
.pick.on .pick-mark {
  border-color: var(--accent-ink);
  background: var(--accent-ink);
  color: var(--lime-ink);
}
.pick.box .pick-mark { border-radius: 5px; }

.pick.right { border-color: var(--accent-ink); background: var(--lime-soft); }
/* The word, not just the colour. */
.pick-verdict {
  flex: none;
  align-self: center;
  font-size: 11px;
  font-weight: 620;
  letter-spacing: .04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.pick.right .pick-verdict { color: var(--accent-ink); }
.pick.wrong .pick-verdict { color: var(--fail); }
/* A graded option is no longer a live control, so its selection dot must stop
 * reading as "chosen". */
.pick.wrong .pick-mark { background: transparent; border-color: var(--fail); }
.pick.wrong { border-color: var(--fail); background: var(--fail-soft); }

.pick-body { flex: 1; min-width: 0; }
.pick-body small { display: block; color: var(--bone-dimmer); font-size: 12.5px; margin-top: 2px; }

/* ------------------------------------------------------------------ *
 * States: empty, loading, error
 * ------------------------------------------------------------------ */

.empty {
  display: grid;
  place-items: center;
  gap: var(--s3);
  padding: var(--s7) var(--s4);
  text-align: center;
  color: var(--bone-dim);
}
.empty h3 { color: var(--bone); }
.empty p { max-width: 42ch; font-size: 14px; margin: 0; }
.empty svg { width: 28px; height: 28px; color: var(--bone-dimmer); }

.skeleton {
  border-radius: var(--r-sm);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.3s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: 0 0 } }

@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; }
  .sheet, .sheet-backdrop { animation: none; }
}

.notice {
  display: flex;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 13px;
  color: var(--bone-dim);
}
.notice.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.notice.fail { border-color: transparent; background: var(--fail-soft); color: var(--fail); }
.notice svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }

.notice-toggle {
  width: 100%;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
/* Only interactive where it is actually clamped. */
@media (min-width: 861px) { .notice-toggle { cursor: default; } }

/* ------------------------------------------------------------------ *
 * Toasts and moments
 * ------------------------------------------------------------------ */

.toasts {
  position: fixed;
  z-index: 80;
  right: var(--s4);
  bottom: var(--s4);
  display: flex;
  flex-direction: column-reverse;
  gap: var(--s2);
  pointer-events: none;
}

@media (max-width: 860px) {
  .toasts {
    right: var(--s3);
    left: var(--s3);
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  box-shadow: var(--shadow-2);
  font-size: 13.5px;
  font-weight: 540;
  animation: toast-in var(--slow) var(--ease-out);
}

.toast.leaving { animation: toast-out var(--mid) var(--ease) forwards; }
.toast.xp { border-color: var(--lime-line); }
.toast.xp b { font-family: var(--mono); color: var(--accent-ink); }
.toast svg { width: 17px; height: 17px; flex: none; color: var(--accent-ink); }

@keyframes toast-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px) } }

/*
 * The level-up moment. One short animation, no loop, no confetti — §64 asks
 * for satisfying and not annoying, and anything that repeats becomes the
 * latter by the third time.
 */
.moment {
  text-align: center;
  padding: var(--s4) 0 var(--s2);
}
.moment-kicker {
  font-size: 11px;
  font-weight: 640;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent-ink);
}
.moment-jump {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s4);
  margin: var(--s4) 0;
  font-family: var(--mono);
  font-size: 40px;
  font-weight: 640;
  letter-spacing: -.04em;
}
.moment-jump .to { color: var(--accent-ink); }
.moment-jump .from { color: var(--bone-dimmer); }
.moment-jump svg { width: 22px; height: 22px; color: var(--bone-dimmer); }
.moment ul { margin: 0; padding: 0; list-style: none; color: var(--bone-dim); font-size: 14px; }
.moment li { padding: 3px 0; }

/* ------------------------------------------------------------------ *
 * Lists
 * ------------------------------------------------------------------ */

.list { display: flex; flex-direction: column; }

.list-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3) 0;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background var(--fast) var(--ease);
}
.list-item:last-child { border-bottom: 0; }
.list-item:hover { background: var(--surface-2); }
/* Bleed the hover into the card padding so the row reads as full-width */
.card > .list .list-item { padding-left: var(--s2); padding-right: var(--s2); margin: 0 calc(var(--s2) * -1); }

.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-size: 14px; font-weight: 560; }
.list-item .sub { font-size: 12.5px; color: var(--bone-dimmer); }

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex: none;
  background: var(--line);
}
.dot.on { background: var(--accent-ink); }

/* ------------------------------------------------------------------ *
 * Stat readouts
 * ------------------------------------------------------------------ */

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .k {
  font-size: 11px;
  font-weight: 580;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--bone-dimmer);
}
.stat .v {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 620;
  letter-spacing: -.03em;
}
.stat.big .v { font-size: 30px; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--bone-dimmer); letter-spacing: 0; }

/* ------------------------------------------------------------------ *
 * Activity screen
 * ------------------------------------------------------------------ */

.activity-shell {
  max-width: 720px;
  margin: 0 auto;
}

.activity-bar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-bottom: var(--s5);
}
.activity-bar .bar { flex: 1; }
.activity-bar .count {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--bone-dimmer);
  white-space: nowrap;
}

.prose { font-size: 15px; line-height: 1.68; color: var(--bone-dim); }
.prose p { margin-bottom: var(--s4); }
.prose p:first-child { color: var(--bone); }
.prose code {
  font-family: var(--mono);
  font-size: .88em;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--surface-3);
  color: var(--bone);
}

.qprompt {
  font-size: 16px;
  font-weight: 560;
  line-height: 1.45;
  margin-bottom: var(--s4);
  letter-spacing: -.008em;
}

.explain {
  margin-top: var(--s2);
  padding: var(--s3);
  border-left: 2px solid var(--lime-line);
  background: var(--surface-2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 13px;
  color: var(--bone-dim);
}

.testrow {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}
.testrow .mark { flex: none; font-weight: 700; }
.testrow.pass .mark { color: var(--accent-ink); }
.testrow.fail .mark { color: var(--fail); }
.testrow .detail { color: var(--bone-dimmer); overflow-x: auto; }

/* ------------------------------------------------------------------ *
 * Charts
 * ------------------------------------------------------------------ */

.chart { width: 100%; display: block; overflow: visible; }
/* Never stretch a chart's glyphs. `preserveAspectRatio: none` scaled the XP
 * chart's x-axis to 0.40 while leaving y at 1.0, so the axis labels rendered as
 * illegible slivers on a phone. */
.chart text { vector-effect: non-scaling-stroke; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .gridline { stroke: var(--line-soft); stroke-width: 1; }
.chart .tick { fill: var(--bone-dimmer); font-size: 10px; font-family: var(--mono); }
.chart .area { fill: var(--lime-soft); }
.chart .line { fill: none; stroke: var(--accent-ink); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.chart .barfill { fill: var(--accent-ink); }
.chart .barfill.zero { fill: var(--line); }
.chart .radar-web { fill: none; stroke: var(--line-soft); stroke-width: 1; }
.chart .radar-shape { fill: var(--lime-soft); stroke: var(--accent-ink); stroke-width: 1.75; }
.chart .radar-point { fill: var(--accent-ink); }
.chart .radar-label { fill: var(--bone-dim); font-size: 11px; }

/* ------------------------------------------------------------------ *
 * Onboarding
 * ------------------------------------------------------------------ */

.onboard {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: var(--s5);
}

.onboard-card {
  width: min(520px, 100%);
  display: flex;
  flex-direction: column;
  gap: var(--s5);
}

.steps {
  display: flex;
  gap: 5px;
}
.steps i {
  height: 3px;
  flex: 1;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  transition: background var(--mid) var(--ease);
}
.steps i.on { background: var(--accent-ink); }
.steps i.done { background: var(--lime-deep); }


/*
 * An unearned achievement is dimmed by its icon and a chip, not by fading the
 * whole card. Blanket opacity took the description to 2.2:1 — half the screen,
 * and the half that is meant to motivate, under half the required ratio.
 */
.card.locked .card-note { color: var(--bone-dimmer); }
.card.locked { border-style: dashed; }

/* ================================================================== *
 * Phone
 * ==================================================================
 *
 * Not a scaled-down desktop (§68). These are the places where the small
 * screen wants a different decision rather than the same one at a smaller

    /* Onboarding owns its own multi-step state; rebuilding it from the store
     * would throw the learner back to step one on every keystroke saved. */
    if (!route || route.name === 'onboarding') return;
    resolve();
  });
});

syncTheme();

/* First run goes to onboarding; everyone else resumes where the hash says. */
if (!store.get() || !store.get().onboarded) {
  if (!window.location.hash || window.location.hash === '#/') {
    window.location.replace('#/onboarding');
  }
}

start();

/*
 * A small surface for the smoke test to drive the app deterministically —
 * resetting between runs, installing the demo without clicking through six
 * onboarding steps, and reading activity data to answer a quiz correctly.
 *
 * The catalogue accessors are here for a specific reason: the test previously
 * reached for them with a dynamic module load, which resolves against the page
 * URL and therefore breaks in the single-file build. It failed silently and
 * the test fell back to guessing, which is exactly how 101 questions with the
 * answer at index 0 went unnoticed. Exposing them makes the test read real
 * data in both builds, or fail loudly.
 *
 * Namespaced, read-only in practice, and inert for anyone not looking for it.
 */
window.SkillTree = {
  store, session, go, buildDemoProfile, applyTheme,
  catalog: { findActivity, findSkill, allTrees },
};

  return {

  };
})();

})();
</script>
