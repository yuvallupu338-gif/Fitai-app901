/* tokens.css — design tokens, carried over from the reference program document. */

:root {
  /* surfaces */
  --night: #0E1520;
  --steel: #182435;
  --steel-2: #212F44;
  --steel-3: #28374F;
  --line: #2C3D57;
  --line-soft: #223047;

  /* ink */
  --chalk: #EAF0F8;
  --dim: #8298B4;
  /* Lightened to clear WCAG AA (4.5:1) for body text on the card surface;
     the old #5A6E8A measured 3.0:1 there and 3.5:1 on the page. */
  --dimmer: #788CA8;

  /* accents */
  --amber: #FFB13C;
  --amber-deep: #8A5F1E;
  --amber-wash: rgba(255, 177, 60, .11);
  --cyan: #56D9CE;
  --cyan-deep: #1E5A56;
  --cyan-wash: rgba(86, 217, 206, .10);
  --rose: #FF7A85;
  --rose-deep: #7A2B33;

  /* type */
  --display: "Secular One", system-ui, sans-serif;
  --body: "Assistant", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;

  /* accents, continued */
  /* The second amber. A single flat accent reads as a fill; a pair reads as a
     surface with light on it, which is what makes a primary button look
     pressable rather than painted. */
  --amber-2: #FF8A2B;
  --amber-grad: linear-gradient(135deg, var(--amber), var(--amber-2));

  /* geometry */
  /* Larger than they were. At 14px a card corner reads as a rounded rectangle;
     at 18 it reads as a card, which is the difference between the interface
     looking assembled and looking designed. */
  --r: 18px;
  --r-sm: 12px;
  --r-pill: 999px;
  --wrap: 760px;
  --gap: 9px;

  /* motion */
  --ease: cubic-bezier(.2, .8, .3, 1);
  --fast: .18s;
  --mid: .28s;
}

/* The rig renders into these. Kept next to the tokens so the figure and the
   chrome never drift apart. */
:root {
  --rig-bone: var(--chalk);
  --rig-far: #4A5F7E;
  --rig-prop: #3A4F6E;
  --rig-ground: #2C3D57;
  --rig-load: var(--amber);
}


/* base.css — reset, typography, layout primitives. */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--night);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding: 0 0 72px;
  background-image: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255, 177, 60, .10), transparent 70%);
  background-attachment: fixed;
  overflow-x: hidden;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 18px; }

h1 {
  font-family: var(--display);
  font-size: clamp(30px, 7.5vw, 46px);
  line-height: 1.12;
  font-weight: 400;
  letter-spacing: -.01em;
}
h1 em { font-style: normal; color: var(--amber); }

h2 { font-family: var(--display); font-weight: 400; font-size: clamp(23px, 5.4vw, 31px); line-height: 1.2; }
h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin-bottom: 6px; }
h4 { font-size: 15px; font-weight: 700; margin-bottom: 5px; }

.eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
  color: var(--amber); text-transform: uppercase; margin-bottom: 10px;
}
.sub { color: var(--dim); font-size: 15px; margin-top: 10px; max-width: 52ch; }
.lead { color: var(--dim); font-size: 14.5px; margin-bottom: 14px; }
.rule { border-top: 1px solid var(--line); margin: 36px 0 26px; }

a { color: var(--amber); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Tables — RTL-aware, same look as the reference document. */
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em;
  color: var(--dim); font-weight: 400; text-transform: uppercase;
}
td:first-child { font-weight: 600; }
td.n { font-family: var(--mono); color: var(--amber); white-space: nowrap; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

footer {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
  color: var(--dim); font-size: 12.5px; line-height: 1.7;
}
.fbrand { display: block; font-family: var(--display); font-size: 15px; color: var(--amber); margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}


/* components.css — every UI component in the app. */

/* ---------------- buttons ---------------- */
.btn {
  font-family: var(--body); font-size: 13px; font-weight: 600;
  background: var(--steel-2); color: var(--chalk);
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 7px 15px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: border-color var(--fast), background var(--fast), transform .1s;
}
.btn:hover { border-color: var(--amber); background: var(--steel-3); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[disabled]:hover { border-color: var(--line); background: var(--steel-2); }
.btn .ico { font-family: var(--mono); font-size: 14px; color: var(--amber); line-height: 1; }
.btn.on { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }
/* The gradient is the difference between a painted rectangle and something that
   looks like it can be pressed. */
.btn.primary {
  background: var(--amber-grad); color: #1A1206; border-color: transparent; font-weight: 700;
  box-shadow: 0 6px 18px rgba(255, 138, 43, .22);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary .ico { color: #1A1206; }
.btn.ghost { background: transparent; }
.btn.lg { padding: 11px 22px; font-size: 15px; }
.btn.danger:hover { border-color: var(--rose); color: var(--rose); }

.iconbtn {
  width: 34px; height: 34px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--steel-2);
  color: var(--chalk); cursor: pointer; font-size: 15px;
  display: grid; place-items: center;
  transition: border-color var(--fast), background var(--fast), transform .12s;
  font-family: var(--mono); line-height: 1; flex: none;
}
.iconbtn:hover { border-color: var(--amber); color: var(--amber); }
.iconbtn:active { transform: scale(.9); }
.iconbtn.check.on { background: var(--cyan-wash); border-color: var(--cyan); color: var(--cyan); }
.iconbtn.play.on { border-color: var(--amber); color: var(--amber); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 30px; }

/* ---------------- chips & facts ---------------- */
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.fact {
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 5px 13px; font-size: 13px; color: var(--dim);
  background: rgba(24, 36, 53, .6);
}
.fact b { color: var(--chalk); font-family: var(--mono); font-weight: 600; }

.chip {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  background: var(--amber-wash); color: var(--amber);
  border: 1px solid rgba(255, 177, 60, .22);
}
.chip.time { background: var(--cyan-wash); color: var(--cyan); border-color: rgba(86, 217, 206, .22); }
.chip.rest { background: transparent; color: var(--dim); border-color: var(--line); }
.chip.warn { background: rgba(255, 122, 133, .1); color: var(--rose); border-color: rgba(255, 122, 133, .28); }

/* ---------------- cards ---------------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--gap); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--steel); padding: 14px 15px; }
.card p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.card .k {
  font-family: var(--mono); font-size: 10.5px; color: var(--amber);
  letter-spacing: .09em; display: block; margin-bottom: 7px;
}

.warnbox {
  border: 1px solid var(--amber-deep); border-radius: var(--r);
  background: rgba(255, 177, 60, .055); padding: 15px 16px; margin-top: 12px;
}
.warnbox h4 { font-size: 15px; margin-bottom: 7px; color: var(--amber); }
.warnbox ul { padding-inline-start: 18px; color: var(--dim); font-size: 13.5px; }
.warnbox li { margin: 4px 0; }
.warnbox li b { color: var(--chalk); }
.warnbox.hot { border-color: var(--rose-deep); background: rgba(255, 122, 133, .05); }
.warnbox.hot h4 { color: var(--rose); }

.chain {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 15px; margin-top: 10px;
}
.chain i {
  font-style: normal; font-family: var(--mono); font-size: 12.5px;
  background: var(--steel-2); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 7px; color: var(--chalk);
}
.chain s { text-decoration: none; color: var(--amber); font-family: var(--mono); font-size: 13px; }

.phase {
  display: flex; gap: 13px; padding: 13px 0;
  border-bottom: 1px solid var(--line); align-items: baseline;
}
.phase .w { font-family: var(--mono); font-size: 11.5px; color: var(--amber); white-space: nowrap; min-width: 82px; }
.phase .t { font-size: 14.5px; }
.phase .t b { display: block; font-weight: 700; margin-bottom: 2px; }
.phase .t span { color: var(--dim); font-size: 13.5px; }
.phase.now { background: linear-gradient(90deg, var(--amber-wash), transparent); }

/* ---------------- week strip ---------------- */
.week { margin: 30px 0 8px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.daycell {
  border: 0; background: none; padding: 0; cursor: default;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: inherit; color: inherit;
}
.daycell .bar {
  width: 100%; border-radius: 8px 8px 4px 4px;
  background: var(--steel); border: 1px solid var(--line);
  height: 26px; transition: all var(--mid) var(--ease);
  position: relative; overflow: hidden;
}
.daycell.train { cursor: pointer; }
.daycell.train .bar { height: 64px; background: var(--steel-2); border-color: #3A4F6E; }
.daycell.train .bar::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--amber-deep); }
.daycell.train:hover .bar { border-color: var(--amber-deep); }
.daycell.on .bar {
  background: linear-gradient(180deg, rgba(255, 177, 60, .20), rgba(255, 177, 60, .04));
  border-color: var(--amber); height: 78px;
}
.daycell.on .bar::after { background: var(--amber); height: 4px; }
.daycell .fill {
  position: absolute; inset: auto 0 0 0; background: var(--cyan-wash);
  border-top: 1px solid var(--cyan-deep); transition: height var(--mid) var(--ease);
}
.daycell .letter { font-family: var(--display); font-size: 17px; color: var(--dim); transition: color .2s; }
.daycell.train .letter { color: var(--chalk); }
.daycell.on .letter { color: var(--amber); }
.daycell .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--dim); height: 12px; }
.daycell.on .tag { color: var(--amber); }
.weekfoot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim);
  border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 26px;
}

/* ---------------- workout head ---------------- */
.whead { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.whead .meta { font-family: var(--mono); font-size: 11.5px; color: var(--dim); letter-spacing: .05em; }
.focus {
  color: var(--dim); font-size: 14.5px; margin: 6px 0 20px;
  border-inline-start: 2px solid var(--amber-deep); padding-inline-start: 12px;
}

/* ---------------- accordion ---------------- */
details.warm {
  border: 1px solid var(--line); border-radius: var(--r);
  background: rgba(24, 36, 53, .5); margin-bottom: 22px; overflow: hidden;
}
details.warm summary {
  cursor: pointer; list-style: none; padding: 13px 16px;
  font-weight: 700; font-size: 14.5px; display: flex;
  justify-content: space-between; align-items: center; gap: 10px;
}
details.warm summary::-webkit-details-marker { display: none; }
details.warm summary span { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: .08em; }
details.warm .inner { padding: 0 16px 15px; color: var(--dim); font-size: 14px; }
details.warm ol { padding-inline-start: 18px; }
details.warm li { margin: 5px 0; }
details.warm li b { color: var(--chalk); font-weight: 600; }

/* ---------------- exercise card ---------------- */
.list { display: flex; flex-direction: column; gap: var(--gap); }
.ex {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 13px 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0 12px; align-items: start;
  transition: border-color .2s, background .2s;
}
.ex:hover { border-color: #3A4F6E; }
.ex.done { opacity: .45; }
.ex.done .name { text-decoration: line-through; text-decoration-color: var(--dim); }
.ex.flash { border-color: var(--amber); background: #1D2B3F; }
.num { font-family: var(--mono); font-size: 12px; color: var(--dim); padding-top: 3px; min-width: 20px; }
.body-col { min-width: 0; }
.name { font-family: var(--display); font-size: 17.5px; font-weight: 400; line-height: 1.3; }
.name-en { font-family: var(--mono); font-size: 10.5px; color: var(--dimmer); letter-spacing: .04em; margin-top: 1px; }
.prescr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.note { font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
.note.caution { color: var(--amber); }
.cues { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
.cue {
  font-size: 11.5px; color: var(--dim); background: var(--steel-2);
  border: 1px solid var(--line-soft); border-radius: 6px; padding: 2px 8px;
}
.lev { display: flex; align-items: center; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.lev .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--dim); }
.lev .rungs { display: flex; gap: 3px; }
.rung { width: 15px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
.rung.f { background: var(--amber); }
.lev .of { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.acts { display: flex; flex-direction: column; gap: 6px; align-items: center; padding-top: 2px; }

/* ---------------- the animation figure ---------------- */
.anim {
  width: 84px; height: 84px; flex: none; border-radius: var(--r-sm);
  background: linear-gradient(180deg, #16212F, #131C29);
  border: 1px solid var(--line-soft); overflow: hidden;
  grid-row: span 2; align-self: start; cursor: pointer;
  transition: border-color var(--fast);
}
.anim:hover { border-color: var(--amber-deep); }
.rig-svg { display: block; width: 100%; height: 100%; }
/* The figure is filled shapes, not strokes — a thin darker outline keeps it
   legible against the card background at 66px without muddying the silhouette. */
.rig-body {
  fill: var(--rig-bone);
  stroke: #0B121C;
  stroke-width: .55;
  stroke-linejoin: round;
}
.rig-torso { fill: #DCE6F2; }
.rig-head { fill: #F2F6FC; }
.rig-far .rig-body { fill: var(--rig-far); stroke: #0A1017; stroke-width: .4; }
.rig-far .rig-torso, .rig-far .rig-head { fill: var(--rig-far); }
/* kept so any older clip or prop referencing the stroke classes still draws */
.rig-bone { stroke: var(--rig-bone); stroke-linecap: round; fill: none; }
.rig-joint { fill: var(--rig-bone); }
.rig-ground { stroke: var(--rig-ground); stroke-linecap: round; }
.rig-prop { stroke: var(--rig-prop); stroke-linecap: round; fill: none; }
.rig-prop-thin { stroke: var(--rig-prop); opacity: .55; fill: none; }
.rig-prop-fill { fill: #22314733; stroke: var(--rig-prop); stroke-width: 1; }
.rig-prop-outline { fill: none; stroke: var(--rig-prop); stroke-width: 1.2; }
.rig-prop-ring { fill: none; stroke: var(--rig-prop); stroke-width: 1.4; }
.rig-prop-band { fill: none; stroke: var(--rig-prop); stroke-width: 1.3; stroke-dasharray: 2 1.6; }
.rig-load-bar { stroke: var(--rig-load); stroke-linecap: round; fill: none; }
.rig-load-fill { fill: var(--rig-load); }
.rig-load-outline { fill: none; stroke: var(--rig-load); stroke-width: 1.4; }

.anim.big { width: 100%; height: auto; aspect-ratio: 1; max-width: 340px; margin: 0 auto; grid-row: auto; }

/* ---------------- wizard ---------------- */
.wizard { padding-top: 26px; }
.progress { display: flex; gap: 4px; margin-bottom: 26px; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background var(--mid); }
.progress i.done { background: var(--amber-deep); }
.progress i.now { background: var(--amber); }
.stepmeta { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--amber); text-transform: uppercase; margin-bottom: 8px; }

.field { margin-bottom: 22px; }
.field > label, .field .flabel {
  display: block; font-size: 15px; font-weight: 700; margin-bottom: 4px;
}
.field .help { font-size: 13px; color: var(--dim); margin-bottom: 9px; line-height: 1.5; }
.field .err { font-size: 12.5px; color: var(--rose); margin-top: 6px; display: block; }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--rose); }

input[type="text"], input[type="number"], input[type="date"], textarea, select {
  width: 100%; font-family: var(--body); font-size: 16px; color: var(--chalk);
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 13px;
  transition: border-color var(--fast);
}
input:focus, textarea:focus, select:focus { border-color: var(--amber); outline: none; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
input[type="number"] { font-family: var(--mono); }
input::placeholder, textarea::placeholder { color: var(--dimmer); }

.with-unit { position: relative; }
.with-unit .unit {
  position: absolute; inset-inline-end: 13px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 12px; color: var(--dim); pointer-events: none;
}
.with-unit input { padding-inline-end: 46px; }

.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt {
  text-align: start; width: 100%; cursor: pointer; font-family: var(--body);
  background: var(--steel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; color: var(--chalk);
  transition: border-color var(--fast), background var(--fast);
  display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover { border-color: #3A4F6E; }
.opt.on { border-color: var(--amber); background: var(--amber-wash); }
.opt .tick {
  width: 17px; height: 17px; border-radius: 5px; border: 1px solid var(--line);
  flex: none; margin-top: 3px; display: grid; place-items: center;
  font-size: 11px; color: var(--night); font-family: var(--mono);
}
.opt.on .tick { background: var(--amber); border-color: var(--amber); }
.opt .otext { min-width: 0; }
/* Both are spans, so without an explicit block they run onto one line and the
   description reads as a continuation of the title. */
.opt .otitle { display: block; font-size: 15px; font-weight: 600; }
.opt .odesc { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.45; }

.chipset { display: flex; flex-wrap: wrap; gap: 7px; }
.chipset .btn { font-weight: 500; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.daybtn {
  font-family: var(--display); font-size: 16px; padding: 12px 0; cursor: pointer;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--dim);
  transition: border-color var(--fast), background var(--fast), color var(--fast);
}
.daybtn:hover { border-color: #3A4F6E; }
.daybtn.on { border-color: var(--amber); background: var(--amber-wash); color: var(--amber); }

.scale { display: flex; gap: 5px; }
.scale button {
  flex: 1; font-family: var(--mono); font-size: 15px; padding: 11px 0; cursor: pointer;
  background: var(--steel); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--dim); transition: all var(--fast);
}
.scale button.on { border-color: var(--amber); background: var(--amber-wash); color: var(--amber); }
.scale-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dimmer); margin-top: 6px; }

.wiznav {
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
  margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line);
}
.wiznav .spacer { flex: 1; }

.review { display: flex; flex-direction: column; gap: 0; }
.review .row {
  display: flex; justify-content: space-between; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px;
}
.review .row span:first-child { color: var(--dim); }
.review .row span:last-child { text-align: end; font-weight: 600; }

/* ---------------- tabs ---------------- */
/*
 * The tab bar is one object, not a row of loose buttons.
 *
 * It used to be ghost buttons sitting directly on the page, which made the
 * selected view a slightly brighter button among equals. A rail with the active
 * tab filled solid says where you are before you read anything — and it is the
 * one control on screen that is always present, so it is worth the pixels.
 */
.tabs {
  display: flex; gap: 4px; position: sticky; top: 0; z-index: 20;
  padding: 7px; margin: 12px 0 18px;
  background: var(--steel); border: 1px solid var(--line-soft);
  border-radius: var(--r-pill);
  overflow-x: auto; scrollbar-width: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs .btn {
  white-space: nowrap; border: 0; background: none;
  border-radius: var(--r-pill); padding: 9px 16px; color: var(--dim);
}
/*
 * On a narrow phone the five tabs are wider than the strip, and the strip
 * scrolls — which is fine, so long as you can tell. A tab cut in half is the
 * affordance; a tab that is entirely absent reads as a missing feature, and
 * nobody swipes a bar they have no reason to think continues.
 *
 * At 320px the last tab (מעקב) was 0% visible. Trimming the padding here brings
 * it back into view far enough to invite the swipe, without touching the
 * spacing at 390px and up, where all five already fit.
 */
@media (max-width: 384px) {
  .tabs { gap: 3px; padding: 6px; }
  .tabs .btn { padding: 9px 10px; }
}

.tabs .btn:hover { background: var(--steel-2); color: var(--chalk); }
.tabs .btn.on {
  background: var(--amber-grad); color: #1A1206; font-weight: 600;
  box-shadow: 0 4px 14px rgba(255, 177, 60, .22);
}
.tabs .btn.on:hover { color: #1A1206; }

/*
 * Stat cards: one number, one label. The inline .fact chips are right for a
 * long list of profile facts, and wrong for the three or four figures that are
 * the point of a screen — those need to be readable across a room.
 */
.statgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 9px; margin-top: 20px;
}
.statcard {
  background: var(--steel); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 15px 14px; text-align: center;
}
.statcard b {
  display: block; font-family: var(--display); font-size: 25px;
  color: var(--chalk); line-height: 1.1; letter-spacing: -.01em;
}
.statcard span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 5px; }

/* ---------------- meals ---------------- */
.daytoggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ex.meal .num.mtime { font-size: 12.5px; color: var(--amber); min-width: 44px; padding-top: 2px; letter-spacing: -.02em; }
.slotlbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .11em; color: var(--dim); display: block; margin-bottom: 3px; }
.ex.meal .items { font-size: 14px; color: var(--chalk); margin-top: 7px; line-height: 1.55; }
.ex.meal .note { font-size: 12.5px; margin-top: 6px; }
.of.big { font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.macros { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }

/* ---------------- progress tab ---------------- */
.logrow { display: flex; gap: 7px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
.logrow input { width: 74px; padding: 7px 9px; font-size: 14px; }
.setpill {
  font-family: var(--mono); font-size: 11.5px; color: var(--cyan);
  background: var(--cyan-wash); border: 1px solid rgba(86, 217, 206, .22);
  border-radius: 6px; padding: 2px 8px;
}
.spark { width: 100%; height: 64px; display: block; margin: 10px 0; }
.spark path { fill: none; stroke: var(--amber); stroke-width: 1.6; }
.spark .grid { stroke: var(--line); stroke-width: .6; }
.spark circle { fill: var(--amber); }

/* ---------------- modal ---------------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(6, 11, 18, .8);
  backdrop-filter: blur(3px); z-index: 100;
  display: grid; place-items: center; padding: 18px;
  animation: fade .18s var(--ease);
}
.modal-box {
  background: var(--steel); border: 1px solid var(--line); border-radius: var(--r);
  max-width: 460px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 20px;
  animation: pop .22s var(--ease);
}
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }

.modal-box h3 { margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* ---------------- misc ---------------- */
.empty { color: var(--dim); font-size: 14px; padding: 26px 0; text-align: center; }
.hero-in { animation: heroIn .55s var(--ease) both; }
@keyframes heroIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------------- responsive ---------------- */
@media (max-width: 560px) {
  .ex { padding: 11px 11px; gap: 0 9px; }
  .name { font-size: 16px; }
  .anim { width: 66px; height: 66px; }
  .daycell .tag { font-size: 8.5px; }
  .acts { gap: 5px; }
  .iconbtn { width: 31px; height: 31px; }
  .ex.meal .num.mtime { min-width: 40px; font-size: 11.5px; }
  .opts.two { grid-template-columns: 1fr; }
}

@media print {
  body { background: #fff; color: #000; }
  .tabs, .toolbar, .acts, .wiznav, .btn { display: none !important; }
  .ex, .card { break-inside: avoid; border-color: #ccc; }
}

/* ---------------- partner training ---------------- */
.pbadge {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  color: var(--cyan); background: var(--cyan-wash);
  border: 1px solid rgba(86, 217, 206, .28); border-radius: 5px;
  padding: 2px 7px; margin-inline-end: 7px; white-space: nowrap;
}
.note.partner { color: var(--dim); display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px; }
.partnerbar {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px;
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05);
  padding: 12px 14px; margin: 0 0 20px;
  font-size: 13.5px; color: var(--dim); line-height: 1.55;
}

/* ---------------- autoregulation ---------------- */
.feedback { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.fbtn {
  font-family: var(--body); font-size: 11.5px; font-weight: 600;
  background: transparent; color: var(--dim);
  border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 3px 10px; cursor: pointer; white-space: nowrap;
  transition: border-color var(--fast), color var(--fast), background var(--fast);
}
.fbtn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-wash); }
.fbtn:active { transform: scale(.96); }
.fbtn.reset:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }

/* ---------------- photos ---------------- */
.photoslot {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  min-height: 92px;
}
.photoslot img {
  width: 78px; height: 92px; object-fit: cover; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--steel);
}
.photohint {
  width: 78px; height: 92px; border-radius: var(--r-sm);
  border: 1px dashed var(--line); display: grid; place-items: center;
  color: var(--dimmer); font-size: 11.5px; text-align: center;
}
.visionpair { display: flex; gap: 12px; align-items: stretch; margin: 12px 0 4px; }
/* min-width:0 matters: with the default auto minimum the longer caption makes
   its column wider, and two photos meant to be compared come out different sizes. */
.visionpair figure { flex: 1 1 0; min-width: 0; margin: 0; }
.visionpair img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover;
  border-radius: var(--r); border: 1px solid var(--line); display: block;
}
.visionpair figcaption {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
  color: var(--dim); margin-top: 6px; text-align: center;
}
.visionpair .arrow { align-self: center; color: var(--amber); font-family: var(--mono); }

/* ---------------- video link ---------------- */
.btn.videolink { text-decoration: none; color: var(--chalk); }
.btn.videolink:hover { border-color: var(--rose); color: var(--rose); }
.btn.videolink:hover .ico { color: var(--rose); }
.btn.videolink .ico { color: var(--rose); }

/* ---------------- photo scan ---------------- */
.scanpanel { margin-top: 4px; }
.scanintro {
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05);
  padding: 14px 16px; margin-bottom: 20px;
}
.scanintro h4 { font-size: 14.5px; color: var(--cyan); margin-bottom: 8px; }
.scanintro ul { padding-inline-start: 18px; color: var(--dim); font-size: 13px; line-height: 1.6; }
.scanintro li { margin: 4px 0; }

.keyrow { display: flex; gap: 8px; align-items: stretch; }
.keyrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
.keyrow .fbtn { flex: 0 0 auto; padding-inline: 12px; }

.scanbusy {
  display: flex; align-items: center; gap: 10px;
  color: var(--dim); font-size: 13.5px; margin-top: 12px;
}
.spin {
  width: 15px; height: 15px; flex: 0 0 auto; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--amber);
  animation: scanspin .9s linear infinite;
}
@keyframes scanspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; border-top-color: var(--amber); }
}

.scanresult { margin-top: 22px; }
.scanhead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.scanheadtext { flex: 1 1 220px; min-width: 0; }
.scanheadtext h3 { font-family: var(--display); font-size: 20px; margin: 2px 0 4px; }
.scanheadtext .sub { font-size: 13.5px; color: var(--dim); margin: 0; }

.dial {
  flex: 0 0 auto; width: 128px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--steel);
}
.dialnum { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; color: var(--chalk); }
.dialnum span { font-size: 14px; color: var(--dimmer); }
.dialbar { height: 5px; border-radius: var(--r-pill); background: var(--line-soft); margin: 9px 0 7px; overflow: hidden; }
.dialbar i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--amber); }
.diallabel { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); }
.dial.good { border-color: var(--cyan-deep); }
.dial.good .dialbar i { background: var(--cyan); }
.dial.bad { border-color: var(--rose-deep); }
.dial.bad .dialbar i { background: var(--rose); }

.verdict {
  border-inline-start: 3px solid var(--amber); border-radius: var(--r-sm);
  background: var(--steel); padding: 14px 16px; margin-bottom: 14px;
  font-size: 14.5px; line-height: 1.7; color: var(--chalk);
}
.verdict p + p { margin-top: 9px; }
.verdict.good { border-inline-start-color: var(--cyan); }
.verdict.bad { border-inline-start-color: var(--rose); }

.callout {
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 12px; background: var(--steel);
}
.callout h4 { font-size: 14px; color: var(--chalk); margin-bottom: 5px; }
.callout p { font-size: 13.5px; color: var(--dim); line-height: 1.6; }
.callout p + p { margin-top: 7px; }
.callout.good { border-color: var(--cyan-deep); background: rgba(86, 217, 206, .05); }
.callout.good h4 { color: var(--cyan); }
.callout.warn { border-color: var(--amber-deep); background: var(--amber-wash); }
.callout.warn h4 { color: var(--amber); }

.scangrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 12px; }
.scancard {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 13px 15px; margin-bottom: 12px;
}
.scangrid .scancard { margin-bottom: 0; }
.scancard p { font-size: 13.5px; color: var(--dim); line-height: 1.65; margin-top: 8px; }
.scancard ul { padding-inline-start: 18px; color: var(--dim); font-size: 13.5px; line-height: 1.6; margin-top: 8px; }
.scancard li { margin: 4px 0; }
.scantags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.disclaimer {
  font-size: 12.5px; color: var(--dimmer); line-height: 1.6;
  border-top: 1px solid var(--line-soft); padding-top: 12px; margin-top: 6px;
}

@media (max-width: 420px) {
  .scanhead { gap: 12px; }
  .dial { width: 100%; }
}
.photodrop {
  width: 100%; aspect-ratio: 3/4; border-radius: var(--r);
  border: 1px dashed var(--line); display: grid; place-items: center;
  color: var(--dimmer); font-size: 12.5px; cursor: pointer;
  background: var(--steel); transition: border-color var(--fast), color var(--fast);
}
.photodrop:hover { border-color: var(--amber); color: var(--amber); }

/* ---------------- free-text intake ---------------- */
.quickstart { margin-bottom: 26px; }
.qsteaser {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--cyan-deep); border-radius: var(--r);
  background: rgba(86, 217, 206, .05); padding: 14px 16px;
}
.qsteaser .qstext { flex: 1 1 220px; min-width: 0; }
.qsteaser h4 { font-size: 15px; color: var(--cyan); margin-bottom: 4px; }
.qsteaser p { font-size: 13px; color: var(--dim); line-height: 1.55; }
.qspanel {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--steel); padding: 14px 16px; margin-bottom: 18px;
}
.qshead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.qshead h4 { font-size: 15px; color: var(--chalk); }
.qspanel .help { margin: 6px 0 10px; }
.qspanel textarea { min-height: 108px; }
.dialsub { font-family: var(--mono); font-size: 10px; color: var(--dimmer); margin-top: 3px; }

/* ---------------- rest timer ---------------- */

/* The rest chip is a button wherever the interval could be read back. It keeps
   the chip's exact metrics so a row of prescriptions stays one row. */
.resttrigger {
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; line-height: 1.45;
  transition: border-color var(--fast), color var(--fast), background var(--fast), transform .1s;
}
.resttrigger:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-wash); }
.resttrigger:active { transform: scale(.96); }
.resttrigger .ico { font-size: 11px; line-height: 1; opacity: .8; }

/* Pinned to the viewport and above the detail sheet: a running rest interval
   outranks whatever is behind it, and the bar is useless if you have to
   remember which card you started it from. */
.restbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 120;
  background: rgba(14, 21, 32, .94);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--amber-deep);
  padding: 9px 0 max(9px, env(safe-area-inset-bottom));
  animation: restrise .22s var(--ease);
}
@keyframes restrise { from { transform: translateY(100%); } }

.restinner {
  max-width: var(--wrap); margin: 0 auto; padding: 0 18px;
  display: flex; align-items: center; gap: 12px;
}
.restring { width: 44px; height: 44px; flex: none; display: block; }
.restring .track { fill: none; stroke: var(--line); stroke-width: 4; }
.restring .arc {
  fill: none; stroke: var(--amber); stroke-width: 4; stroke-linecap: round;
  transition: stroke-dashoffset .25s linear, stroke var(--fast);
}
.resttext { flex: 1 1 auto; min-width: 0; }
.restlabel {
  font-size: 12px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Tabular figures: without them the minute digit shifts the whole readout every
   time it changes width, and this is a number read from arm's length. The
   element carries dir="ltr" so the digits keep their order; right-aligned to
   land on the RTL page's inline start, under its own label. */
.resttime {
  font-family: var(--mono); font-size: 27px; font-weight: 600; line-height: 1.15;
  color: var(--chalk); font-variant-numeric: tabular-nums; text-align: right;
}
.restacts { display: flex; gap: 6px; flex: none; }
.restacts .wide { width: auto; padding: 0 9px; font-size: 12px; }

.restbar.done { border-top-color: var(--cyan); }
.restbar.done .arc { stroke: var(--cyan); }
.restbar.done .resttime { color: var(--cyan); }
.restbar.done .restlabel { color: var(--cyan); }
.restbar.late { border-top-color: var(--rose-deep); }
.restbar.late .arc { stroke: var(--rose); }
.restbar.late .restlabel { color: var(--rose); }

/* Keep the last card, and the sheet's own buttons, clear of the bar. */
body.resting { padding-bottom: 104px; }
body.resting .modal-back { padding-bottom: 96px; }

@media (max-width: 420px) {
  .restinner { gap: 9px; padding: 0 12px; }
  .resttime { font-size: 24px; }
  .restacts { gap: 4px; }
  .restacts .iconbtn { width: 30px; height: 30px; }
  .restacts .wide { width: auto; padding: 0 7px; }
}

@media print {
  .restbar { display: none !important; }
  body.resting { padding-bottom: 0; }
}

/* YouTube demo link — occupies the box the drawn figure used to.
   Sized and positioned by the existing .anim rule, so the card layout is
   unchanged whether or not this is present. */
.anim.ytlink {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; text-decoration: none; color: var(--dim);
  transition: border-color var(--fast), color var(--fast), background var(--fast);
}
.anim.ytlink:hover, .anim.ytlink:focus-visible {
  border-color: var(--amber); color: var(--ink);
  background: linear-gradient(180deg, #1B2836, #16202D);
}
.anim.ytlink .ytmark {
  font-size: 19px; line-height: 1; color: #E5484D;
  transition: transform var(--fast);
}
.anim.ytlink:hover .ytmark { transform: scale(1.14); }
.anim.ytlink .ytcap { font-size: 10.5px; letter-spacing: .02em; text-align: center; }
.anim.big.ytlink { aspect-ratio: auto; min-height: 96px; padding: 18px 12px; }
.anim.big.ytlink .ytmark { font-size: 34px; }
.anim.big.ytlink .ytcap { font-size: 13px; }

/* The exercise name doubles as the way into the detail sheet, now that the
   figure links out to YouTube instead. Styled as the heading it already was —
   the affordance is the underline on hover, not a button chrome. */
.ex .namebtn {
  display: block; width: 100%; text-align: start;
  background: none; border: 0; padding: 0; margin: 0;
  font: inherit; color: inherit; cursor: pointer;
}
.ex .namebtn:hover, .ex .namebtn:focus-visible { text-decoration: underline; color: var(--amber); }

/* Rest-day rows. Deliberately quieter than an exercise card — these are not
   sessions, and they should not compete with one for attention. */
.restrow { opacity: .96; }
.restrow .num { color: var(--dim); font-size: 13px; }
.restrow.free { opacity: .6; }
.restrow.free .cues { display: none; }
.restrow .cues { margin-top: 6px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.restrow.done { opacity: .55; }
.restrow.done .name { text-decoration: line-through; }

/* Rest cells in the week strip. Selectable like a training day, but quieter —
   the amber belongs to the sessions. */
.daycell.restcell { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.daycell.restcell .tag { color: var(--dimmer); font-size: 10px; }
.daycell.restcell .bar { opacity: .55; transition: opacity var(--fast); }
.daycell.restcell:hover .bar, .daycell.restcell:focus-visible .bar { opacity: .9; }
.daycell.restcell.on .bar { opacity: 1; box-shadow: inset 0 0 0 1px var(--cyan); }
.daycell.restcell.on .letter { color: var(--cyan); }

/* The natural-development note under a scan verdict. Informational, not a
   warning — it qualifies the verdict rather than contradicting it. */
.growthnote {
  display: flex; gap: 9px; align-items: flex-start;
  margin-top: 12px; padding: 12px 14px;
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  background: linear-gradient(180deg, #16212F, #131C29);
}
.growthnote .gicon { color: var(--cyan); font-size: 15px; line-height: 1.4; flex: none; }
.growthnote p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--dim); }

/* The logo. Sized by attribute so the layout is correct before the image
   decodes — an inline data URI still costs a frame, and the header must not
   jump when it lands. */
.brandmark { display: block; height: auto; max-width: 100%; }
.brandmark.sm { opacity: .92; }
.statcard.hot { border-color: var(--amber); background: var(--amber-wash); }
.statcard.hot b { color: var(--amber); font-size: 20px; }

</style>
</head>

/*
 * The pulse raiser, gentlest last.
 *
 * It used to run the other way, and march_in_place carries no
 * contraindications — so it was always available, always chosen, and every
 * trainee from 12 to 90 opened with marching on the spot. That is not caution,
 * it is a warm-up that does not warm anybody up: a fifteen-year-old about to
 * train needs their heart rate somewhere, and marching does not take it there.
 *
 * Ordered hardest first now, and easesImpact removes the top of the list for
 * whoever should not be landing, so the same walk down the list produces a real
 * pulse raiser for a trainee who can jump and marching for one who should not.
 */
const WARMUP_LEAD = ['jumping_jack', 'jog', 'high_knees', 'march_in_place'];
/*
 * Ordered by preference, and long enough that filtering can bite.
 *
 * The first three are the ones worth doing and they are also the three that a
 * knee, hip or shoulder rules out — a deep squat is full knee flexion, kneeling
 * puts bodyweight on the front of the knee, and child's pose is both deep knee
 * flexion and end-range shoulder overhead. Until those carried
 * contraindications the filter had nothing to remove and every trainee got the
 * identical four lines; now that they do, the list needs somewhere to fall back
 * to or a guarded knee ends the session with one stretch and a breath.
 */
const COOLDOWN_IDS = [
  'childs_pose_reach', 'hip_flexor_stretch_kneeling', 'deep_squat_hold',
  'cat_cow', 'hip_switch_90_90', 'thoracic_rotation', 'glute_bridge_activation',
  'torso_twist_standing', 'shoulder_circles',
];

/*
 * Standing drills to fall back on when a warm-up came out entirely floor-based.
 * Ordered so the first one moves something general — hips and shoulders — rather
 * than adding a third variation on whatever the day already trains.
 */
const STANDING_FALLBACK = [
  'hip_circles', 'shoulder_circles', 'torso_twist_standing', 'ankle_rocks',
  'arm_circles', 'march_in_place', 'sit_to_stand',
];

const DEFAULT_DAYS = {
  2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5],
};

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */

function numOr(v, d) {
  const n = Number(v);
  return Number.isFinite(n) ? n : d;
}

function clampInt(v, lo, hi, d) {
  return Math.max(lo, Math.min(hi, Math.round(numOr(v, d))));
}

function goalOf(profile) {
  return SCHEME[profile.goal] ? profile.goal : 'fitness';
}

function experienceOf(profile) {
  const e = profile.experience;
  return (e === 'beginner' || e === 'returning' || e === 'intermediate' || e === 'advanced')
    ? e : 'beginner';
}

/** Stable per-slot seed. Same profile + same salt -> same number, always. */
function seedOf(hash, salt) {
  let x = hash >>> 0;
  for (let i = 0; i < salt.length; i++) {
    x ^= salt.charCodeAt(i);
    x = Math.imul(x, 16777619) >>> 0;
  }
  return (x ^ (x >>> 13)) >>> 0;
}

/** n integers in [2,5] summing to total, biggest first (the main lift). */
function distributeSets(total, n) {
  const out = new Array(n).fill(2);
  let left = Math.max(0, Math.round(total) - 2 * n);
  let i = 0;
  let guard = 0;
  while (left > 0 && guard < 200) {
    if (out[i] < 5) { out[i] += 1; left -= 1; }
    i = (i + 1) % n;
    guard += 1;
    if (out.every((v) => v >= 5)) break;
  }
  return out;
}

function restText(sec) {
  return REST_HE[sec] || (sec >= 120 ? `${Math.round(sec / 60)} דק׳` : `${sec} שנ׳`);
}

/** Shift a 'a–b' rep range by delta, never below 3. */
function shiftReps(range, delta) {
  const m = String(range).split('–');
  if (m.length !== 2) return range;
  const lo = Math.max(3, parseInt(m[0], 10) + delta);
  const hi = Math.max(lo + 2, parseInt(m[1], 10) + delta);
  return `${lo}–${hi}`;
}

function todayIso(d) {
  const t = d || new Date();
  const mm = String(t.getMonth() + 1).padStart(2, '0');
  const dd = String(t.getDate()).padStart(2, '0');
  return `${t.getFullYear()}-${mm}-${dd}`;
}

function weeksUntil(targetDate, from) {
  const t = Date.parse(`${targetDate}T00:00:00`);
  if (!Number.isFinite(t)) return 12;
  const diff = (t - from.getTime()) / (7 * 24 * 3600 * 1000);
  return clampInt(Math.ceil(diff), 4, 24, 12);
}

/* ------------------------------------------------------------------ *
 * 1. Slot layout
 * ------------------------------------------------------------------ */

function layout(profile, vol, budget, split) {
  const goal = goalOf(profile);
  const perSlot = SETS_PER_SLOT[goal];
  const days = split.days.map((d) => ({ def: d, picks: [] }));

  const patternsOfGroup = (d, group) => d.def.patterns.filter((pat) => PATTERN_GROUP[pat] === group);

  /*
   * Every pattern the app knows for a group, not just the ones this day's split
   * happened to name. A split lists one pull pattern for a given day, so when
   * the pull group earned two slots there the second one had nowhere to go and
   * took the same pattern again — and a pull day could ship a pull-up, a
   * wide-grip pull-up and a chin-up as three separate exercises. Widening to
   * the group's siblings turns that into a vertical pull AND a horizontal pull,
   * which is what the second slot was for. Still inside the group, so a pull
   * slot can never become a squat.
   */
  const groupVocabulary = {};
  for (const pat of Object.keys(PATTERN_GROUP)) {
    const g = PATTERN_GROUP[pat];
    (groupVocabulary[g] = groupVocabulary[g] || []).push(pat);
  }
  const priority = GROUP_PRIORITY[goal] || GROUP_PRIORITY.fitness;

  for (const group of priority) {
    const target = numOr(vol[group], 0);
    if (target < 2) continue;

    let eligible = days.filter((d) => patternsOfGroup(d, group).length > 0);
    let fallbackPattern = null;
    if (!eligible.length) {
      // The split never asked for this group but the week paid for it — put it
      // on the emptiest day rather than silently losing the sets.
      eligible = days.slice().sort((a, b) => a.picks.length - b.picks.length).slice(0, 1);
      fallbackPattern = GROUP_PATTERN[group];
    }

    const mostSlots = Math.max(1, Math.floor(target / 2));   // >= 2 sets each
    const leastSlots = Math.max(1, Math.ceil(target / 5));   // <= 5 sets each
    let want = clampInt(target / perSlot, leastSlots, mostSlots, 1);
    // A group the split trains on several days should show up on all of them.
    want = Math.max(want, Math.min(eligible.length, mostSlots));
    want = Math.min(want, 8);

    for (let k = 0; k < want; k++) {
      const open = eligible.filter((d) => d.picks.length < budget.maxSlots);
      if (!open.length) break;
      open.sort((a, b) => {
        const ga = a.picks.filter((s) => s.group === group).length;
        const gb = b.picks.filter((s) => s.group === group).length;
        if (ga !== gb) return ga - gb;
        if (a.picks.length !== b.picks.length) return a.picks.length - b.picks.length;
        const ea = a.def.emphasis.indexOf(group) < 0 ? 9 : a.def.emphasis.indexOf(group);
        const eb = b.def.emphasis.indexOf(group) < 0 ? 9 : b.def.emphasis.indexOf(group);
        if (ea !== eb) return ea - eb;
        return days.indexOf(a) - days.indexOf(b);
      });
      const d = open[0];
      const pats = fallbackPattern ? [fallbackPattern] : patternsOfGroup(d, group);
      const taken = d.picks.filter((s) => s.group === group).length;

      // Exhaust the day's own patterns first, then the group's other patterns
      // that this day has not used, and only then repeat. Repeating is still
      // the last resort rather than an error: two sets of pull-ups beats a
      // pull day with one exercise on it.
      let pattern = pats[taken % pats.length];
      if (taken >= pats.length && !fallbackPattern) {
        const unused = (groupVocabulary[group] || [])
          .filter((pat) => !d.picks.some((s) => s.pattern === pat));
        if (unused.length) pattern = unused[0];
      }

      // A widened pattern is not in the day's list, so indexOf gives -1 and it
      // would sort ahead of the warm-up. Sit it next to the sibling it joins.
      let order = d.def.patterns.indexOf(pattern);
      if (order < 0) {
        const sibling = pats.length ? d.def.patterns.indexOf(pats[0]) : -1;
        order = sibling >= 0 ? sibling + 0.5 : 98;
      }

      d.picks.push({
        group,
        pattern,
        occurrence: d.picks.filter((s) => s.pattern === pattern).length,
        order: fallbackPattern ? 99 : order,
        seq: taken,
      });
    }
  }

  // Training order inside the session: the split's pattern order, and repeats of
  // one pattern stay next to each other.
  for (const d of days) {
    d.picks.sort((a, b) => a.order - b.order || a.occurrence - b.occurrence);
  }

  // A session with one or two exercises is not a session. When the week's
  // volume is small — short slots on a busy schedule — spread the same sets
  // over more movements instead of piling them onto two. distributeSets below
  // then thins the sets automatically, so total weekly volume is unchanged.
  const slotFloor = Math.min(4, budget.maxSlots);
  for (const d of days) {
    if (d.picks.length >= slotFloor) continue;
    let pats = d.def.patterns.filter((pat) => numOr(vol[PATTERN_GROUP[pat]], 0) >= 2);
    if (!pats.length) pats = d.def.patterns.slice();
    let guard = 0;
    while (d.picks.length < slotFloor && d.picks.length < budget.maxSlots && pats.length && guard++ < 12) {
      const unused = pats.filter((pat) => !d.picks.some((s) => s.pattern === pat));
      const pattern = unused.length ? unused[0] : pats[d.picks.length % pats.length];
      d.picks.push({
        group: PATTERN_GROUP[pattern] || 'core',
        pattern,
        occurrence: d.picks.filter((s) => s.pattern === pattern).length,
        order: d.def.patterns.indexOf(pattern),
        seq: d.picks.length,
      });
    }
    d.picks.sort((a, b) => a.order - b.order || a.occurrence - b.occurrence);
  }

  // Sets per slot: the group's weekly total, spread over the slots it earned,
  // first occurrences (the heavy ones) getting the bigger share.
  const byGroup = new Map();
  for (const d of days) {
    for (const s of d.picks) {
      if (!byGroup.has(s.group)) byGroup.set(s.group, []);
      byGroup.get(s.group).push({ day: d, slot: s });
    }
  }
  for (const [group, entries] of byGroup) {
    entries.sort((a, b) => a.slot.occurrence - b.slot.occurrence
      || days.indexOf(a.day) - days.indexOf(b.day));
    const sets = distributeSets(numOr(vol[group], entries.length * 3), entries.length);
    entries.forEach((e, i) => { e.slot.sets = sets[i]; });
  }

  return days;
}

/* ------------------------------------------------------------------ *
 * 2. Filling a slot
 * ------------------------------------------------------------------ */

function roleFor(pattern, compoundIndex) {
  if (pattern === 'conditioning') return 'finisher';
  if (pattern === 'plyo') return 'skill';
  if (PATTERN_GROUP[pattern] === 'core') return 'core';
  if (COMPOUND_PATTERNS.indexOf(pattern) < 0) return 'accessory';
  return compoundIndex < 2 ? 'main' : 'secondary';
}

function desiredLevel(profile, role) {
  const base = { beginner: 1.7, returning: 2.4, intermediate: 3.2, advanced: 4.2 }[experienceOf(profile)];
  const byRole = { skill: 0.5, main: 0.3, secondary: 0, accessory: -0.3, core: 0, finisher: -0.3 }[role] || 0;
  const age = clampInt(profile.age, MIN_AGE, MAX_AGE, 30);
  const injuries = (profile.injuries || []).length;
  let out = base + byRole;
  if (age >= 60) out -= 0.7;
  else if (age >= 50) out -= 0.4;
  if (age < 15) out -= 0.4;
  if (injuries >= 3) out -= 0.7;
  else if (injuries >= 1) out -= 0.3;
  return Math.max(1, out);
}

function isIsolation(ex) {
  return (ex.tags || []).indexOf('isolation') >= 0;
}

/** Same job = same pattern, same primary muscle, and same kind of work. */
function sameJob(a, b) {
  if (isIsolation(a) !== isIsolation(b)) return false;
  const pa = a.muscles.primary || [];
  const pb = b.muscles.primary || [];
  return pa.some((m) => pb.indexOf(m) >= 0);
}


/* When a pattern's pool is exhausted because everything in it is already a
   primary in this session, borrow from the nearest related pattern rather than
   dropping the slot. A second pressing movement beats an empty gap. */
const SIBLING_PATTERNS = {
  horizontal_push: ['vertical_push', 'arms_triceps'],
  vertical_push: ['horizontal_push', 'shoulders_lateral', 'arms_triceps'],
  horizontal_pull: ['vertical_pull', 'shoulders_rear', 'arms_biceps'],
  vertical_pull: ['horizontal_pull', 'arms_biceps'],
  squat: ['lunge', 'hinge'],
  hinge: ['squat', 'lunge'],
  lunge: ['squat', 'hinge'],
  calf: ['plyo', 'lunge'],
  plyo: ['conditioning', 'squat'],
  arms_biceps: ['horizontal_pull', 'vertical_pull'],
  arms_triceps: ['horizontal_push', 'vertical_push'],
  shoulders_lateral: ['vertical_push', 'shoulders_rear'],
  shoulders_rear: ['horizontal_pull', 'shoulders_lateral'],
  core_flexion: ['core_antiextension', 'core_rotation'],
  core_antiextension: ['core_flexion', 'core_rotation'],
  core_rotation: ['core_antiextension', 'core_flexion'],
  carry: ['core_antiextension', 'conditioning'],
  conditioning: ['plyo', 'carry'],
  mobility: ['core_antiextension'],
};

const isWarmup = (e) => (e.tags || []).indexOf('warmup') >= 0;

/*
 * A working slot is not a warm-up slot, and a main lift is not an isolation.
 *
 * Both used to be soft penalties on the anchor score, which meant both were
 * routinely overruled: every warm-up drill is level 1, so it sorted to the front
 * of the level-ordered family and got prescribed as a working set with sets,
 * reps and rest beside real exercises. And nothing at all stopped a cable fly
 * being chosen as the opening lift of a strength day, at 3-6 reps and three
 * minutes rest — a near-maximal load at end-range abduction, the most injurious
 * thing this generator could print.
 *
 * They are hard filters now. Each relaxes only if it would otherwise leave the
 * pattern with nothing, because an empty slot is worse than an imperfect one —
 * and the caller re-roles the slot when the compound filter has to give way, so
 * an isolation never inherits a main lift's rep range.
 */
function restrictPool(pool, role) {
  const working = pool.filter((e) => !isWarmup(e));
  // No working movement covers this pattern for this user — a bar-less home
  // trainee has almost no vertical pull. Taking the drill beats an empty slot,
  // but it must be labelled: the user should not read a lat-pull slide as their
  // pulling work without being told that is what happened.
  const onlyWarmups = !working.length;
  let out = working.length ? working : pool;
  if (role === 'main' || role === 'secondary') {
    const compound = out.filter((e) => !isIsolation(e));
    if (compound.length) return { pool: compound, demoted: false, onlyWarmups };
    // Nothing compound covers this pattern for this user. Take the isolation,
    // but tell the caller so the prescription is written for what it is.
    return { pool: out, demoted: true, onlyWarmups };
  }
  return { pool: out, demoted: false, onlyWarmups };
}

function poolFor(profile, pattern, primaryInDay, role) {
  const tried = [pattern].concat(SIBLING_PATTERNS[pattern] || []);
  for (const pat of tried) {
    const res = candidatesOrFallback(profile, { pattern: pat });
    const pool = res.list.filter((e) => !primaryInDay.has(e.id));
    if (!pool.length) continue;
    const restricted = restrictPool(pool, role);
    if (restricted.pool.length) {
      return { pool: restricted.pool, risky: res.risky, demoted: restricted.demoted, thin: restricted.onlyWarmups };
    }
  }
  return { pool: [], risky: false, demoted: false, thin: false };
}

function pickFamily(profile, slot, ctx) {
  // Anything already shown as a slot's primary in this session is excluded
  // outright — two cards with the same exercise is the most visible defect the
  // generator can produce. Exercises merely offered as a swap alternative
  // elsewhere are only penalised below, so the pool does not starve.
  const res = poolFor(profile, slot.pattern, ctx.primaryInDay, slot.role);
  const pool = res.pool;
  if (!pool.length) return { family: [], risky: false, demoted: false, thin: false };

  if (res.risky) {
    // Nothing clean exists for this pattern: take the gentlest options only.
    const gentle = pool.slice().sort((a, b) => a.level - b.level || a.id.localeCompare(b.id));
    return { family: gentle.slice(0, Math.min(3, gentle.length)), risky: true, demoted: res.demoted, thin: res.thin };
  }

  const want = desiredLevel(profile, slot.role);
  const seed = seedOf(ctx.hash, `${ctx.dayId}:${slot.pattern}:${slot.occurrence}`);
  const spun = rotate(pool, seed);

  let anchor = spun[0];
  let best = Infinity;
  for (const e of spun) {
    const score = Math.abs(e.level - want) * 2
      + (ctx.usedInDay.has(e.id) ? 3.0 : 0)
      + (ctx.usedInProgram.has(e.id) ? 1.6 : 0)
      + (isWarmup(e) && slot.role !== 'core' ? 1.2 : 0);
    if (score < best) { best = score; anchor = e; }
  }

  let family = pool.filter((e) => sameJob(e, anchor));
  if (family.length < 2) family = pool.slice();
  family.sort((a, b) => a.level - b.level || a.id.localeCompare(b.id));

  const size = Math.min(family.length, family.length >= 4 && slot.role === 'main' ? 4 : 3);
  const at = Math.max(0, family.findIndex((e) => e.id === anchor.id));
  const start = Math.max(0, Math.min(at - 1, family.length - size));
  const window = family.slice(start, start + size);

  /*
   * THE ANCHOR LEADS.
   *
   * The window is chosen to bracket the anchor, and it was then handed over
   * still sorted easy-to-hard — so generateProgram's family[0], the card the
   * user actually reads, and the default swap index all took the EASIEST
   * movement in the window instead of the one that was selected. Measured over
   * 84,096 slots, the prescribed exercise was harder than the anchor exactly
   * zero times; an advanced lifter with a full gym was handed goblet squats and
   * an assisted pull-up machine as his heavy work. Every input to desiredLevel —
   * experience, age, injury, role — was computed and then discarded.
   *
   * Putting the anchor first fixes it at the source: family[0] is now what the
   * engine chose, and the alternates read as easier and harder versions of the
   * plan rather than as the plan itself.
   */
  const ordered = [anchor].concat(window.filter((e) => e.id !== anchor.id));
  return { family: ordered, risky: false, demoted: res.demoted, thin: res.thin };
}

/* ------------------------------------------------------------------ *
 * 3. Prescription
 * ------------------------------------------------------------------ */

function holdSeconds(ex, role, goal) {
  if (ex.pattern === 'conditioning') return goal === 'fatloss' ? '40 שנ׳' : '30–45 שנ׳';
  if (ex.id === 'wall_sit') return '30–60 שנ׳';
  if (ex.id === 'dead_hang' || ex.id === 'passive_bar_hang') return '20–40 שנ׳';
  if (role === 'core' || PATTERN_GROUP[ex.pattern] === 'core') {
    return ex.level >= 3 ? '20–30 שנ׳' : '30–45 שנ׳';
  }
  return '30 שנ׳';
}

function distanceText(ex) {
  if (ex.pattern === 'plyo') return '4–6 קפיצות';
  if (ex.pattern === 'conditioning') return '20 מ׳ הלוך־חזור';
  return '20–30 מ׳';
}

function tempoFor(profile, ex, role) {
  if (TEMPO_BY_ID[ex.id]) return TEMPO_BY_ID[ex.id];
  // Calisthenics with no way to add weight: slowing the lowering IS the load.
  const owned = profile.equipment || [];
  const loadable = ['dumbbells', 'barbell', 'kettlebell', 'machines', 'cable'];
  const canLoad = loadable.some((q) => owned.indexOf(q) >= 0);
  const goal = goalOf(profile);
  if (!canLoad && role === 'main' && ex.unit === 'reps' && ex.level <= 3
    && (goal === 'muscle' || goal === 'strength')) return '3–1–1';
  return null;
}

function prescribe(profile, ex, slot) {
  const goal = goalOf(profile);
  const table = SCHEME[goal][slot.role] || SCHEME[goal].main;
  let reps = table[0];
  let restSec = table[1];
  let workSec = 40;

  if (ex.pattern === 'plyo') {
    reps = goal === 'fatloss' ? '8–10' : '3–5';
    restSec = goal === 'fatloss' ? 60 : 90;
    workSec = 20;
  } else if (ex.unit === 'time') {
    reps = holdSeconds(ex, slot.role, goal);
    workSec = parseInt(reps, 10) || 30;
    if (ex.pattern === 'conditioning') restSec = goal === 'fatloss' ? 20 : 30;
    else restSec = Math.min(restSec, 60);
  } else if (ex.unit === 'distance') {
    reps = distanceText(ex);
    workSec = 30;
    restSec = Math.min(restSec, 60);
  } else {
    if (ex.level >= 4) reps = shiftReps(reps, -2);
    else if (ex.level <= 1 && goal !== 'strength') reps = shiftReps(reps, 3);
    workSec = 40;
  }

  if (ex.unilateral) reps = `${reps} לכל צד`;

  return {
    reps,
    rest: restText(restSec),
    tempo: tempoFor(profile, ex, slot.role),
    restSec,
    workSec,
  };
}

/* ------------------------------------------------------------------ *
 * 4. The Hebrew line under the exercise
 * ------------------------------------------------------------------ */

function baseNote(profile, ex, slot) {
  if (NOTE_BY_ID[ex.id]) return NOTE_BY_ID[ex.id];
  const byPattern = PATTERN_NOTE[ex.pattern];
  if (byPattern) {
    const hit = byPattern[slot.role] || byPattern.main || byPattern.core
      || byPattern.accessory || byPattern.finisher || byPattern.skill;
    if (hit) return hit;
  }
  const muscle = MUSCLE_HE[(ex.muscles.primary || [])[0]] || 'הקבוצה הזאת';
  return `עבודה ישירה על ${muscle} — משלימה את מה שהתרגילים הגדולים לא סגרו.`;
}

function noteFor(profile, ex, slot, risky) {
  if (slot.thin) {
    return `⚠︎ עם הציוד שיש לך זה הכי קרוב לתנועה הזאת שאפשר — זה תרגיל הכנה, לא עבודה כבדה. `
      + 'מוט מתח או גומייה יפתחו כאן משהו אמיתי.';
  }
  const injuries = profile.injuries || [];
  const hits = (ex.contraindications || []).filter((c) => injuries.indexOf(c) >= 0);
  if (hits.length || (risky && conflictsInjury(profile, ex))) {
    const list = hits.length ? hits : (ex.contraindications || []).filter((c) => injuries.indexOf(c) >= 0);
    const he = (list[0] && INJURY_HE[list[0]]) || 'המגבלה שדיווחת עליה';
    return `⚠︎ אין חלופה נקייה לדפוס הזה עם הציוד שלך, אז זו הגרסה הקלה ביותר: עומס מינימלי, טווח בלי כאב, ועוצרים ברגע ש${he} מגיב.`;
  }

  let note = baseNote(profile, ex, slot);
  const age = clampInt(profile.age, MIN_AGE, MAX_AGE, 30);
  if (slot.role === 'main' && age < 16 && ex.level >= 3) {
    note = `${note} בגיל הזה טכניקה קודמת למשקל.`;
  } else if (ex.unilateral && slot.role !== 'core' && note.indexOf('לכל צד') < 0) {
    note = `${note} מתחילים בצד החלש וקובעים לפיו את החזרות.`;
  }
  return note;
}

/* ------------------------------------------------------------------ *
 * 5. Warm-up and cool-down
 * ------------------------------------------------------------------ */

function drillPrescription(ex) {
  if (ex.unit === 'time') return ex.unilateral ? '30 שנ׳ לכל צד' : '30–40 שנ׳';
  if (ex.unilateral) return '8 לכל צד';
  return ex.pattern === 'conditioning' ? '60–90 שנ׳' : '10 חזרות';
}

/*
 * How many drills the warm-up is worth to this trainee.
 *
 * The budget alone gave everybody the same answer, because it is derived from
 * session length and session length is what age already shortened — so an
 * 80-year-old got a shorter warm-up out of a shorter session, which is exactly
 * backwards. Warming up is the part of the session that gets *more* important
 * as recovery slows, and less important the younger the body is.
 */
function warmupDrillCount(profile, budget) {
  const base = clampInt(budget.warmupMin / 1.6, 4, 7, 5);
  if (warmsFast(profile)) return Math.max(3, base - 1);
  if (needsLongerWarmup(profile)) return Math.min(8, base + 2);
  return base;
}

function buildWarmup(profile, budget, split) {
  const allowed = new Map(candidates(profile, { tag: 'warmup' }).map((e) => [e.id, e]));

  /*
   * Age filters the vocabulary before anything is chosen from it, rather than
   * after — a drill removed at the end leaves a gap, a drill removed here means
   * the next one down the list takes its place.
   *
   * Impact and unsupported single-leg balance go at the same line because they
   * are the same demand: landing from a jumping jack and standing on one leg for
   * a straight-leg kick both ask a body to catch itself. The leg swings survive
   * this — their own cues put a hand on the wall, which is exactly what makes
   * them a different drill from the ones removed here.
   */
  if (easesImpact(profile)) {
    for (const id of Array.from(allowed.keys())) {
      if (asks(id, 'impact', 'balance')) allowed.delete(id);
    }
  }

  /*
   * A hang is full bodyweight through two hands. For a trainee who is not
   * already training it is close to the hardest thing they can do, and a warm-up
   * drill that is the hardest thing in the session is not a warm-up. Held to
   * beginners and returners on purpose: somebody at 68 who does pull-ups keeps
   * their scap pulls, because for them the premise is simply false.
   */
  const exp = experienceOf(profile);
  if (needsStandingOption(profile) && (exp === 'beginner' || exp === 'returning')) {
    for (const id of Array.from(allowed.keys())) if (asks(id, 'hang')) allowed.delete(id);
  }

  const items = [];
  const used = new Set();

  const push = (id) => {
    if (used.has(id)) return false;
    const ex = allowed.get(id);
    if (!ex) return false;
    used.add(id);
    items.push({
      id: ex.id,
      name: ex.name,
      prescription: drillPrescription(ex),
      note: WARMUP_NOTE[ex.id] || (ex.cues && ex.cues[0]) || '',
    });
    return true;
  };

  for (const id of WARMUP_LEAD) if (push(id)) break;

  // Patterns the week actually trains, most frequent first.
  const freq = new Map();
  for (const d of split.days) {
    for (const pat of d.patterns) freq.set(pat, (freq.get(pat) || 0) + 1);
  }
  const ordered = Array.from(freq.entries())
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map((e) => e[0]);

  const target = warmupDrillCount(profile, budget);
  for (let round = 0; round < 4 && items.length < target; round++) {
    for (const pat of ordered) {
      if (items.length >= target) break;
      const list = WARMUP_FOR[pat] || [];
      if (list[round]) push(list[round]);
    }
  }
  // Last resort: any mobility drill the profile can do.
  if (items.length < 3) {
    for (const ex of candidates(profile, { pattern: 'mobility' })) {
      if (items.length >= 4) break;
      push(ex.id);
    }
  }

  /*
   * At least one drill that is not done on the floor.
   *
   * Every drill here can be worth doing and the warm-up still be unusable: the
   * pattern lists lead with floor work for the pulling and core patterns, so a
   * trainee whose week is built on those could be handed five drills that all
   * begin with getting down. This adds a standing one rather than removing the
   * floor ones — the floor drills are the good ones, they just cannot be the
   * whole warm-up for somebody who finds the floor hard.
   */
  if (needsStandingOption(profile) && !items.some((it) => !asks(it.id, 'floor', 'deep_knee'))) {
    for (const id of STANDING_FALLBACK) if (push(id)) break;
  }
  return items;
}

function buildCooldown(profile) {
  const allowed = new Map(candidates(profile, { tag: 'warmup' }).map((e) => [e.id, e]));
  const hold = stretchHoldSeconds(profile);

  /*
   * The preference list opens with three floor stretches — child's pose, a
   * kneeling hip flexor, a deep squat — so the default cool-down asks somebody
   * to get down and up three times at the end of a session, when they are most
   * tired. Above the line, the standing and seated entries move to the front:
   * the same list, read in a different order, which keeps every stretch
   * available instead of shortening the session's ending to a breath.
   */
  const order = needsStandingOption(profile)
    ? COOLDOWN_IDS.slice().sort((a, b) => Number(asks(a, 'floor', 'deep_knee')) - Number(asks(b, 'floor', 'deep_knee')))
    : COOLDOWN_IDS;

  const out = [];
  for (const id of order) {
    if (out.length >= 3) break;
    const ex = allowed.get(id);
    if (!ex) continue;
    out.push({
      id: ex.id,
      name: ex.name,
      prescription: ex.unit === 'time'
        ? (ex.unilateral ? `${Math.round(hold * 0.75)} שנ׳ לכל צד` : `${hold} שנ׳`)
        : '8 חזרות איטיות',
      note: WARMUP_NOTE[ex.id] || (ex.cues && ex.cues[0]) || '',
    });
  }
  out.push({
    id: 'seated_breathing',
    name: 'נשימה עמוקה בישיבה',
    prescription: '2 דק׳',
    note: 'מוריד דופק ומסמן לגוף שהאימון נגמר. שם מתחילה ההתאוששות.',
  });
  return out;
}

/* ------------------------------------------------------------------ *
 * 6. Program-level notes
 * ------------------------------------------------------------------ */

function buildNotes(profile, ctx) {
  const out = [];
  const age = clampInt(profile.age, MIN_AGE, MAX_AGE, 30);
  const sleep = numOr(profile.sleepHours, 7.5);
  const stress = clampInt(profile.stress, 1, 5, 3);
  const injuries = profile.injuries || [];

  out.push('הסטים שרשומים הם סטים עובדים. סטי חימום על התרגיל הראשון לא נספרים בהם.');

  if (ctx.cautioned) {
    out.push('ליד תרגילים שמסומנים ב־⚠︎ לא הייתה חלופה נקייה לדפוס הזה. עבוד קל, בטווח ללא כאב, ואם כואב — דלג עליו לגמרי.');
  } else if (injuries.length) {
    out.push('כל תרגיל בתוכנית נבחר כך שלא יטען ישירות את המגבלות שדיווחת עליהן. כאב חד באימון הוא תמיד סיבה לעצור, לא להמשיך.');
  }
  if (age < 16) {
    out.push('מתחת לגיל 16 הדגש הוא על טכניקה, טווח מלא ומשקל גוף — לא על עומס. שווה שמאמן יראה את התנועות פעם אחת, ושרופא ידע שאתה מתאמן.');
  }
  if (age >= 55) {
    out.push('בגיל הזה החימום הוא לא המלצה. שתי דקות נוספות בהתחלה שוות יותר מכל סט נוסף בסוף.');
  }
  if (sleep < 7) {
    out.push(`${Math.round(sleep)} שעות שינה מגבילות את ההתקדמות יותר מכל משתנה אחר בתוכנית. חצי שעה נוספת שווה יותר מתוספת אימון.`);
  }
  if (stress >= 4) {
    out.push('בשבוע לחוץ במיוחד — הורד סט מכל תרגיל במקום לוותר על האימון. אימון קצר עדיף על ויתור.');
  }
  if (ctx.goal === 'fatloss') {
    out.push('הגירעון הקלורי מוריד את המשקל, האימון שומר על השריר בזמן שזה קורה. אל תנסה לפצות על אוכל בעוד אירובי.');
  }
  if (ctx.daysPerWeek <= 2) {
    out.push('שני אימונים בשבוע זה מינימום עובד. הליכה של 20–30 דק׳ בימי המנוחה משנה את התוצאה יותר מכל תרגיל שנוסיף.');
  }
  if (ctx.bodyweightOnly) {
    out.push('כשמשקל הגוף נהיה קל — עבור לחלופה הקשה יותר בכפתור ⇄, ולא לעוד 30 חזרות מאותו תרגיל.');
  }
  if (ctx.shortfall >= 12) {
    /*
     * These notes are program-level but they render inside whichever day is
     * open, so this one used to print the week's AVERAGE duration under a day
     * whose own header said something else — "planned to fit in about 65
     * minutes" beneath a heading reading 80. Quoting the real spread instead
     * means the sentence is true whichever day the reader is looking at, and it
     * matches the number already on screen above it.
     */
    const span = ctx.shortestDay === ctx.longestDay
      ? `${ctx.longestDay} דק׳`
      : `${ctx.shortestDay}–${ctx.longestDay} דק׳`;
    out.push(`האימונים מתוכננים להיכנס ב־${span} ולא ב־${ctx.minutesPerSession}. `
      + 'את ההפרש כדאי להוציא על סטי חימום בתרגיל הראשון ועל מנוחות מלאות — לא על עוד סטים.');
  }
  out.push('כפתור ⇄ מחליף תרגיל לחלופה שעושה את אותה עבודה. אם תרגיל לא מרגיש נכון — החלף אותו, אל תדחוף דרכו.');
  return out;
}

/* ------------------------------------------------------------------ *
 * 7. generateProgram
 * ------------------------------------------------------------------ */

/**
 * Turns a profile into a full Program. Pure and deterministic: same profile in,
 * byte-identical program out (apart from meta.generatedAt, which is today).
 */

/* ------------------------------------------------------------------ *
 * Partner training
 *
 * Training together at the same time is a structural change, not a label.
 * Both people share a station, so an exercise has to be safe for both and
 * pitched at whoever is less experienced — each then loads it for themselves.
 * ------------------------------------------------------------------ */

const EXPERIENCE_RANK = { beginner: 0, returning: 1, intermediate: 2, advanced: 3 };

function trainsTogether(p) {
  return p.withPartner === true && p.partnerMode === 'together';
}

/** Selection profile for a shared session: both injury lists, the lower ceiling. */
function partnerAdjusted(p) {
  if (!trainsTogether(p)) return p;
  const injuries = Array.from(new Set([].concat(p.injuries || [], p.partnerInjuries || []))).sort();
  const mine = EXPERIENCE_RANK[p.experience] === undefined ? 0 : EXPERIENCE_RANK[p.experience];
  const theirs = EXPERIENCE_RANK[p.partnerExperience] === undefined ? 0 : EXPERIENCE_RANK[p.partnerExperience];
  const lower = mine <= theirs ? p.experience : p.partnerExperience;
  return Object.assign({}, p, { injuries, experience: lower });
}

/* Movements where a second pair of hands genuinely changes what is possible —
   either the exercise is unsafe alone under load, or it simply cannot be done
   without a partner (someone has to hold the ankles for a nordic curl). */
function spotRole(ex) {
  const id = ex.id || '';
  if (/nordic|glute_ham|partner/.test(id)) return 'hold';
  if (/negative|assisted|eccentric/.test(id)) return 'assist';
  const eq = ex.equipment || [];
  const heavy = eq.indexOf('barbell') >= 0 || eq.indexOf('dumbbells') >= 0;
  if (!heavy) return null;
  if (ex.pattern === 'horizontal_push' && eq.indexOf('bench') >= 0) return 'spot';
  if (ex.pattern === 'squat' && eq.indexOf('barbell') >= 0) return 'spot';
  if (ex.pattern === 'vertical_push' && eq.indexOf('barbell') >= 0) return 'spot';
  return null;
}

/* Alternating sets only work when one partner's working time covers a useful
   share of the other's rest. Past roughly two minutes of prescribed rest it
   does not, and pretending otherwise would quietly cut their recovery. */
function alternatingFits(restSec, role) {
  if (role === 'finisher') return false;
  return restSec > 0 && restSec <= 120;
}

function partnerNote(ex, restSec, role, name) {
  const who = name ? name : 'השותף';
  const spot = spotRole(ex);
  if (spot === 'hold') return `${who} מחזיק את הקרסוליים — בלי זה אי אפשר לבצע את התרגיל.`;
  if (spot === 'assist') return `${who} נותן עזרה מינימלית רק כשהחזרה נתקעת.`;
  if (spot === 'spot') return `${who} שומר. יד מתחת למוט, בלי לגעת כל עוד החזרה נקייה.`;
  if (alternatingFits(restSec, role)) return `סט לסירוגין — אחד עובד, השני סופר. המנוחה שלך היא הסט שלו.`;
  return `מנוחה מלאה לשניכם. אל תקצרו אותה רק כי מישהו מחכה.`;
}

function generateProgram(profile) {
  const input = profile || {};
  // Everything downstream selects and prescribes against the shared-session
  // profile, so a joint plan is automatically safe for both people.
  const p = partnerAdjusted(input);
  const goal = goalOf(p);
  const hash = hashProfile(p);
  const vol = weeklyVolume(p);
  const budget = sessionBudget(p);
  const split = splitFor(p);
  const daysPerWeek = split.days.length;
  const minutesPerSession = clampInt(p.minutesPerSession, 20, 120, 60);

  const laid = layout(p, vol, budget, split);
  const usedInProgram = new Set();
  let cautioned = false;
  let totalDuration = 0;

  const days = laid.map((entry, dayNo) => {
    const def = entry.def;
    const usedInDay = new Set();
    const primaryInDay = new Set();
    const slots = [];
    let compoundIndex = 0;
    let minutes = budget.warmupMin;

    for (const raw of entry.picks) {
