/*
 * The terms are matched as substrings against the exercise names, so they have
 * to be the words the library actually uses. Two of these were simply wrong and
 * had never matched anything: the library says ברפי, not בורפי, and
 * עמידת ידיים, not הנדסטנד. Ticking either chip removed nothing at all, which
 * is the worst way for a refusal to fail — the user is asked, answers, and is
 * then prescribed the exact movement they refused.
 */
const AVOID_OPTIONS = [
  { value: 'ריצה', label: 'ריצה' },
  { value: 'קפיצ', label: 'קפיצות' },
  { value: 'סקוואט', label: 'סקוואט' },
  { value: 'דדליפט', label: 'דדליפט' },
  { value: 'מתח|pull-up|pullup', label: 'מתח' },
  { value: 'מקביל|דיפס|dip', label: 'מקבילים / דיפס' },
  { value: 'לחיצת חזה', label: 'לחיצת חזה' },
  { value: 'עמידת ידיים|handstand', label: 'עמידת ידיים' },
  { value: 'ברפי|burpee', label: 'ברפי' },
];

/** The Hebrew label for a stored avoid value, for the review screen. */
function avoidLabel(value) {
  const hit = AVOID_OPTIONS.find((o) => o.value === value);
  return hit ? hit.label : value;
}

/**
 * Could this user ever be prescribed something the term matches?
 *
 * Queried with the avoid list emptied, or a chip would vanish the moment it was
 * ticked — the registry filters avoided movements out of the very pool being
 * asked about. Equipment, track and injuries still apply, which is the point.
 */
function avoidableFor(profile, term) {
  const probe = Object.assign({}, profile, { avoid: [] });
  // Split on "|" exactly as isAvoided does. Testing the whole value as one
  // string matched nothing and silently hid every multi-term chip.
  const needles = String(term).toLowerCase().split('|').map((t) => t.trim()).filter(Boolean);
  let pool;
  try {
    pool = candidates(probe, { ignoreTrack: false });
  } catch (e) {
    return true;   // never hide an option because a lookup failed
  }
  return pool.some((e) => {
    const hay = `${e.name} ${e.nameEn}`.toLowerCase();
    return needles.some((n) => hay.includes(n));
  });
}

/* ------------------------------------------------------------------ *
 * Validation
 * ------------------------------------------------------------------ */

function validateStep(stepIndex, profile) {
  const step = STEPS[stepIndex];
  const errors = {};
  if (!step) return { ok: true, errors };

  for (const f of step.fields) {
    if (f.showIf && !f.showIf(profile)) continue;
    const value = readField(profile, f.key);

    if (f.validate) {
      const msg = f.validate(value, profile);
      if (msg) { errors[f.key] = msg; continue; }
    }

    if (f.required === false) continue;
    if (f.type === 'chips' || f.type === 'multi' || f.type === 'textarea' || f.type === 'text') continue;
    if (value === null || value === undefined || value === '') {
      errors[f.key] = 'שדה חובה';
    }
  }

  return { ok: Object.keys(errors).length === 0, errors };
}

function readField(profile, key) {
  if (key.startsWith('bm_')) return profile.benchmarks ? profile.benchmarks[key.slice(3)] : null;
  return profile[key];
}

/* ------------------------------------------------------------------ *
 * Normalisation
 * ------------------------------------------------------------------ */

function clamp(v, lo, hi, fallback) {
  // null/''/undefined must fall back, not coerce to 0 and clamp up to `lo` —
  // that silently turned an unanswered height into 120cm.
  if (v === null || v === undefined || v === '') return fallback;
  const n = Number(v);
  if (!isFinite(n)) return fallback;
  return Math.min(hi, Math.max(lo, n));
}

/**
 * Coerces types, clamps ranges, folds the flat bm_* wizard fields back into
 * benchmarks, and derives the equipment list from the chosen location.
 * Idempotent: normalizeProfile(normalizeProfile(p)) deep-equals normalizeProfile(p).
 */
function normalizeProfile(input) {
  const d = defaults();
  const p = Object.assign({}, d, input || {});

  p.name = String(p.name || '').trim();
  p.age = clamp(p.age, MIN_AGE, MAX_AGE, 30);
  p.sex = ['male', 'female', 'other'].includes(p.sex) ? p.sex : 'male';
  p.heightCm = clamp(p.heightCm, 120, 220, 175);
  p.weightKg = clamp(p.weightKg, 25, 250, 70);

  p.experience = ['beginner', 'returning', 'intermediate', 'advanced'].includes(p.experience)
    ? p.experience : 'beginner';

  p.goal = ['fatloss', 'muscle', 'strength', 'fitness', 'sport'].includes(p.goal) ? p.goal : 'fitness';
  p.sport = p.goal === 'sport' ? String(p.sport || '').trim() || null : null;
  p.targetDate = /^\d{4}-\d{2}-\d{2}$/.test(String(p.targetDate)) ? p.targetDate : plusMonths(6);
  p.targetWeightKg = p.targetWeightKg === null || p.targetWeightKg === '' || !isFinite(Number(p.targetWeightKg))
    ? null : clamp(p.targetWeightKg, 25, 250, null);

  p.daysPerWeek = clamp(Math.round(p.daysPerWeek), 2, 6, 3);
  p.minutesPerSession = clamp(Math.round(p.minutesPerSession), 20, 120, 60);
  p.timeOfDay = ['morning', 'noon', 'evening'].includes(p.timeOfDay) ? p.timeOfDay : 'evening';

  // Training days: unique, in range, exactly daysPerWeek of them.
  let days = Array.isArray(p.trainingDays)
    ? Array.from(new Set(p.trainingDays.map(Number).filter((n) => n >= 0 && n <= 6))).sort((a, b) => a - b)
    : [];
  if (days.length > p.daysPerWeek) days = spreadPick(days, p.daysPerWeek);
  if (days.length < p.daysPerWeek) days = fillDays(days, p.daysPerWeek);
  p.trainingDays = days;

  p.location = ['full_gym', 'building_gym', 'home_weights', 'home_bodyweight'].includes(p.location)
    ? p.location : 'home_bodyweight';
  /*
   * There is one track. The questionnaire no longer asks, imported profiles
   * from an older build are coerced rather than honoured, and every downstream
   * filter still reads p.track — so this single line is what makes the whole
   * app calisthenics, instead of a rule repeated in each consumer.
   */
  p.track = 'calisthenics';
  // Training on a bare floor IS calisthenics — the question was never asked.
  p.gymMachines = p.gymMachines !== false;

  const known = new Set(EQUIPMENT_OPTIONS.map((o) => o.value));
  const chosen = Array.isArray(p.equipment) ? p.equipment.filter((q) => known.has(q)) : [];
  const base = EQUIPMENT_BY_LOCATION[p.location] || [];
  // The user's explicit picks are additive to the location defaults, never
  // subtractive — otherwise re-normalising a profile would keep shrinking it.
  const merged = new Set(chosen.length ? chosen : base);
  if (!chosen.length && (p.location === 'full_gym' || p.location === 'building_gym') && !p.gymMachines) {
    merged.delete('machines');
    merged.delete('cable');
  }
  p.equipment = Array.from(merged).sort();

  const injuries = new Set(INJURY_OPTIONS.map((o) => o.value));
  p.injuries = Array.isArray(p.injuries) ? Array.from(new Set(p.injuries.filter((i) => injuries.has(i)))).sort() : [];
  p.surgeries = String(p.surgeries || '').trim();
  p.medical = String(p.medical || '').trim();
  p.avoid = Array.isArray(p.avoid)
    ? Array.from(new Set(p.avoid.map((s) => String(s).trim()).filter(Boolean)))
    : String(p.avoid || '').split(',').map((s) => s.trim()).filter(Boolean);

  p.currentActivity = String(p.currentActivity || '').trim();

  const bm = Object.assign({}, d.benchmarks, p.benchmarks || {});
  for (const k of Object.keys(d.benchmarks)) {
    // Fold flat wizard keys (bm_pushups) into the nested shape.
    if (p[`bm_${k}`] !== undefined && p[`bm_${k}`] !== null && p[`bm_${k}`] !== '') bm[k] = Number(p[`bm_${k}`]);
    delete p[`bm_${k}`];
    const v = bm[k];
    bm[k] = v === null || v === '' || !isFinite(Number(v)) ? null : Math.max(0, Number(v));
  }
  p.benchmarks = bm;

  p.sleepHours = clamp(p.sleepHours, 4, 12, 7);
  p.stress = clamp(Math.round(p.stress), 1, 5, 3);

  p.commitment = clamp(Math.round(p.commitment), 1, 5, 3);
  // Photos are data URLs held on the device. Anything else is dropped.
  for (const k of ['photoNow', 'photoTarget']) {
    p[k] = typeof p[k] === 'string' && p[k].startsWith('data:image/') ? p[k] : '';
  }

  // A read without the photos it was taken from is a claim about pictures that
  // are no longer here. Drop it rather than keep steering the plan with it.
  if (!p.photoNow || !p.photoTarget) p.visionRead = null;
  if (p.visionRead && typeof p.visionRead !== 'object') p.visionRead = null;
  // emphasisFrom is total: any read, including a corrupt one, yields a complete
  // and clamped multiplier set, and no read at all yields a neutral one. So this
  // is safe to run unconditionally, and normalising twice gives the same answer.
  p.emphasis = emphasisFrom(p.visionRead);

  p.withPartner = p.withPartner === true;
  p.partnerMode = p.withPartner && p.partnerMode === 'separate' ? 'separate' : 'together';
  p.partnerName = String(p.partnerName || '').trim();
  p.partnerExperience = ['beginner', 'returning', 'intermediate', 'advanced'].includes(p.partnerExperience)
    ? p.partnerExperience : 'beginner';
  p.partnerInjuries = p.withPartner && Array.isArray(p.partnerInjuries)
    ? Array.from(new Set(p.partnerInjuries.filter((i) => injuries.has(i)))).sort() : [];
  if (!p.withPartner) { p.partnerName = ''; p.partnerInjuries = []; }

  p.wantsNutrition = p.wantsNutrition !== false;
  p.mealsPerDay = clamp(Math.round(p.mealsPerDay), 3, 6, 4);
  p.whoCooks = ['self', 'family', 'partner', 'outside'].includes(p.whoCooks) ? p.whoCooks : 'family';
  const diets = new Set(DIET_OPTIONS.map((o) => o.value));
  p.diet = Array.isArray(p.diet) ? Array.from(new Set(p.diet.filter((x) => diets.has(x)))).sort() : [];
  p.allergies = String(p.allergies || '').trim();
  p.supplements = String(p.supplements || '').trim();

  return p;
}

/** Pick n items spread evenly across the list, keeping the first. */
function spreadPick(list, n) {
  if (n >= list.length) return list;
  const out = [];
  const stride = list.length / n;
  for (let i = 0; i < n; i++) out.push(list[Math.floor(i * stride)]);
  return Array.from(new Set(out)).sort((a, b) => a - b);
}

/** Top up to n days, preferring the spacing patterns people actually use. */
function fillDays(days, n) {
  const PREFERRED = {
    2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5],
  };
  const out = new Set(days);
  for (const d of PREFERRED[n] || []) {
    if (out.size >= n) break;
    out.add(d);
  }
  for (let d = 0; d < 7 && out.size < n; d++) out.add(d);
  return Array.from(out).sort((a, b) => a - b).slice(0, n);
}

const GOAL_HE = {

  fitness: 'כושר כללי', sport: 'ספורט ספציפי',

const EXP_HE = {

};

};
const TIME_HE = { morning: 'בוקר', noon: 'צהריים', evening: 'ערב' };
const TRACK_HE = { calisthenics: 'קליסטניקס', weights: 'מכונות ומשקולות', mixed: 'משולב' };
const DAY_HE = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

function summarize(profile) {
  const p = profile;
  const eqLabels = (p.equipment || [])
    .map((q) => (EQUIPMENT_OPTIONS.find((o) => o.value === q) || {}).label)
    .filter(Boolean);
  const injLabels = (p.injuries || [])
    .map((i) => (INJURY_OPTIONS.find((o) => o.value === i) || {}).label)
    .filter(Boolean);
  const dietLabels = (p.diet || [])
    .map((x) => (DIET_OPTIONS.find((o) => o.value === x) || {}).label)
    .filter(Boolean);

  const rows = [
    { label: 'גיל, גובה, משקל', value: `${p.age} · ${p.heightCm} ס״מ · ${p.weightKg} ק״ג` },
    { label: 'ותק', value: EXP_HE[p.experience] },
    { label: 'מטרה', value: p.goal === 'sport' && p.sport ? `${GOAL_HE.sport} — ${p.sport}` : GOAL_HE[p.goal] },
    { label: 'תאריך יעד', value: formatHeDate(p.targetDate) },
  ];
  if (p.targetWeightKg) rows.push({ label: 'משקל יעד', value: `${p.targetWeightKg} ק״ג` });
  rows.push(
    { label: 'תדירות', value: `${p.daysPerWeek} אימונים · ${p.minutesPerSession} דק׳ · ${TIME_HE[p.timeOfDay]}` },
    { label: 'ימים', value: (p.trainingDays || []).map((d) => DAY_HE[d]).join(', ') || '—' },
    { label: 'מקום', value: LOC_HE[p.location] },
    { label: 'מסלול', value: TRACK_HE[p.track] || TRACK_HE.mixed },
    { label: 'ציוד', value: eqLabels.length ? eqLabels.join(', ') : 'משקל גוף בלבד' },
    { label: 'מגבלות', value: injLabels.length ? injLabels.join(', ') : 'אין' },
  );
  if ((p.avoid || []).length) rows.push({ label: 'לא לכלול', value: p.avoid.map(avoidLabel).join(', ') });
  rows.push({ label: 'שינה ועומס', value: `${p.sleepHours} שעות · עומס ${p.stress}/5` });

  const bm = p.benchmarks || {};
  const bmParts = [];
  if (bm.pushups) bmParts.push(`${bm.pushups} שכיבות`);
  if (bm.pullups) bmParts.push(`${bm.pullups} מתח`);
  if (bm.squatKg) bmParts.push(`סקוואט ${bm.squatKg} ק״ג`);
  if (bm.benchKg) bmParts.push(`חזה ${bm.benchKg} ק״ג`);
  if (bm.deadliftKg) bmParts.push(`דדליפט ${bm.deadliftKg} ק״ג`);
  if (bmParts.length) rows.push({ label: 'מספרים היום', value: bmParts.join(' · ') });

  const COMMIT_HE = ['', 'כשמתאים לי', 'כשאני זוכר', 'רוב הזמן', 'מקפיד', 'בלי פשרות'];
  rows.push({ label: 'רמת התמסרות', value: `${p.commitment}/5 · ${COMMIT_HE[p.commitment] || ''}` });
  if (p.photoNow || p.photoTarget) {
    rows.push({
      label: 'תמונות',
      value: [p.photoNow ? 'היום' : null, p.photoTarget ? 'יעד' : null].filter(Boolean).join(' + '),
    });
  }
  if (p.visionRead) {
    rows.push({
      label: 'סריקת תמונות',
      value: p.visionRead.usable && p.visionRead.realism
        ? `רמת היגיון ${p.visionRead.realism.score}/10 · ${confidenceHe(p.visionRead.confidence)}`
        : 'לא ניתן לקריאה',
    });
  }
  rows.push({
    label: 'אימון משותף',

 * declared equipment list if the registry has nothing to say.
 */
function kit(profile) {
  const seen = new Set();
  let any = false;
  for (const pattern of MAIN_PATTERNS) {
    for (const ex of candidates(profile, { pattern })) {
      any = true;
      for (const q of ex.equipment || []) seen.add(q);
    }
  }
  if (!any) for (const q of (profile && profile.equipment) || []) seen.add(q);

  const barbell = seen.has('barbell');
  const freeWeights = seen.has('dumbbells') || seen.has('kettlebell');
  const machines = seen.has('machines') || seen.has('cable');
  return {
    barbell,
    freeWeights,
    machines,
    bands: seen.has('bands'),
    loaded: barbell || freeWeights || machines,
  };
}

/** Can this profile hang from something and pull itself up? */
function canHang(profile) {
  const list = candidates(profile, { pattern: 'vertical_pull' });
  if (list.length) {
    return list.some((e) => (e.equipment || []).some((q) => q === 'pullup_bar' || q === 'rings'));
  }
  const eq = (profile && profile.equipment) || [];
  return eq.indexOf('pullup_bar') >= 0 || eq.indexOf('rings') >= 0;
}

/** Beginners need a longer runway; advanced lifters spend more of it sharp. */
function tilt(shares, exp) {
  const out = shares.slice();
  if (out.length < 2) return out;
  if (exp === 'beginner') out[0] *= 1.30;
  if (exp === 'returning') out[0] *= 1.15;
  if (exp === 'advanced') {
    out[0] *= 0.80;
    out[out.length - 1] *= 1.15;
  }
  return out;
}

/** Split `total` weeks by share, never handing any phase fewer than one week. */
function splitWeeks(total, shares) {
  const sum = shares.reduce((a, b) => a + b, 0) || 1;
  const raw = shares.map((s) => (total * s) / sum);
  const out = raw.map((r) => Math.max(1, Math.floor(r)));
  let left = total - out.reduce((a, b) => a + b, 0);

  const order = raw
    .map((r, i) => [r - Math.floor(r), i])
    .sort((a, b) => b[0] - a[0] || a[1] - b[1])
    .map((x) => x[1]);

  let k = 0;
  while (left > 0) {
    out[order[k % order.length]] += 1;
    left -= 1;
    k += 1;
  }
  // The one-week floor can overspend on very short programs: take it back from
  // the longest phase, never below one week.
  while (left < 0) {
    let big = 0;
    for (let i = 1; i < out.length; i++) if (out[i] > out[big]) big = i;
    if (out[big] <= 1) break;
    out[big] -= 1;
    left += 1;
  }
  return out;
}

function phaseCount(weeks) {
  if (weeks < 8) return 2;
  if (weeks <= 12) return 3;
  if (weeks <= 18) return 4;
  return 5;
}

/**
 * The phase map: 2–5 named blocks covering every week of the program.
 * Returns [{ weeks: [start, end], title, desc }].
 */
function buildPhases(profile) {
  const p = profile || {};
  const weeks = programWeeks(p);
  const plans = PHASE_PLANS[goalOf(p)] || PHASE_PLANS.fitness;
  const n = Math.min(phaseCount(weeks), weeks);
  const plan = plans[n] || plans[2];
  const lens = splitWeeks(weeks, tilt(plan.map((x) => x.s), expOf(p)));

  const out = [];
  let cursor = 1;
  for (let i = 0; i < plan.length && cursor <= weeks; i++) {
    const len = Math.max(1, lens[i] || 1);
    const start = cursor;
    const end = Math.min(weeks, start + len - 1);
    out.push({
      weeks: [start, end],
      title: plan[i].title,
      desc: String(plan[i].desc).replace('{w}', String(weeks)),
    });
    cursor = end + 1;
  }
  if (out.length) out[out.length - 1].weeks[1] = weeks;
  return out;
}

 * 2. progressionModel
 * ------------------------------------------------------------------ */

/**
 * How much weight to add when the top of the rep range is reached.
 * 5 kg where a barbell loads the legs, 2.5 kg on everything the arms move,
 * halved for small or young lifters, for whom 5 kg is a 10% jump.
 */
function loadJump(profile, k) {
  if (!k.loaded) return 0;
  const bw = num(profile.weightKg, 70);
  const age = num(profile.age, 30);
  let jump = k.barbell ? 5 : 2.5;
  if (bw < 60 || age < 16 || age >= 68) jump = jump / 2;
  if (!k.barbell && !k.freeWeights && k.machines) jump = Math.max(jump, 2.5);
  return jump;
}

/** How often the week gets pulled back so the body can catch up. */
function deloadEvery(profile) {
  const exp = expOf(profile);
  const goal = goalOf(profile);
  let n = { beginner: 6, returning: 5, intermediate: 5, advanced: 4 }[exp];
  if (goal === 'strength' && (exp === 'intermediate' || exp === 'advanced')) n = 4;
  if (goal === 'fatloss') n = Math.min(n, 4);
  if (num(profile.sleepHours, 7.5) < 6.5) n -= 1;
  if (clampInt(profile.stress, 1, 5, 3) >= 4) n -= 1;
  if (num(profile.age, 30) >= 55) n -= 1;
  return clampInt(n, 3, 8, 5);
}

function chainFor(profile, k) {
  const goal = goalOf(profile);
  if (!k.loaded) {
    // No kilos to add, so the ladder runs through reps, sets, tempo and leverage.
    return ['עוד חזרות', 'עוד סט', 'ירידה איטית יותר', 'מנוף קשה יותר', 'משקל חיצוני'];
  }
  if (goal === 'fatloss' || goal === 'fitness') {
    return ['עוד חזרות', 'עוד משקל', 'עוד סט', 'מנוחה קצרה יותר', 'ואריאציה קשה יותר'];
  }
  if (goal === 'strength') {
    return ['עוד חזרות', 'עוד משקל', 'עוד סט כבד', 'פחות עבודת עזר', 'ואריאציה קשה יותר'];
  }
  return ['עוד חזרות', 'עוד משקל', 'עוד סט', 'ירידה איטית יותר', 'ואריאציה קשה יותר'];
}

function ruleFor(profile, k, jump) {
  if (!k.loaded) {
    return 'התקדמות כפולה: נשארים באותה ואריאציה עד שכל הסטים מגיעים לקצה העליון של טווח החזרות '
      + 'בטכניקה נקייה — ואז עוברים לוואריאציה הקשה יותר ומתחילים שוב מהקצה התחתון.';
  }
  return `התקדמות כפולה: נשארים באותו משקל עד שכל הסטים מגיעים לקצה העליון של טווח החזרות `
    + `בטכניקה נקייה — ואז מוסיפים ${fmtKg(jump)} ק״ג ומתחילים שוב מהקצה התחתון.`;
}

function fmtKg(n) {
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
}

function cardsFor(profile, k, jump, deload) {
  const exp = expOf(profile);
  const goal = goalOf(profile);
  const cards = [];

  if (k.loaded) {

        + 'בסקוואט ובדדליפט הקפיצה גדולה יותר מאשר בלחיצות, כי המנוע גדול יותר. '
        + 'משקולת יד עולה בקפיצות של 2 ק״ג — על 10 ק״ג זו קפיצה של 20%, אז שם מוסיפים חזרות לפני שמוסיפים ברזל.',

      + 'ביותר חזרות או ביותר משקל — התוכנית עובדת, גם אם המראה במראה עוד לא השתנה.',

    });

        + 'והמספר שיצא ממנו לא יספר לך כלום.',

  return cards;
}

/**
 * The progression rule, the escalation ladder, deload frequency and load jump.
 * Returns { chain, rule, deloadEveryWeeks, loadJumpKg, cards }.
 */
function progressionModel(profile) {
  const p = profile || {};
  const k = kit(p);
  const jump = loadJump(p, k);
  const deload = deloadEvery(p);
  return {
    chain: chainFor(p, k),
    rule: ruleFor(p, k, jump),
    deloadEveryWeeks: deload,
    loadJumpKg: jump,
    cards: cardsFor(p, k, jump, deload),
  };
}

/* ------------------------------------------------------------------ *
 * 3. projectTargets
 * ------------------------------------------------------------------ */

/*
 * Rates of change that hold up in a gym, not on a forum.
 *
 * rel  — relative growth per week of a rep count, capped by relCap
 * abs  — extra reps per week on top, capped by absCap
 * A beginner roughly doubles a push-up count in a quarter and triples a
 * pull-up count over a year. An advanced trainee adds a few percent.
 */
const REP_RATE = {
  beginner: { rel: 0.050, relCap: 0.90, abs: 0.25, absCap: 10 },
  returning: { rel: 0.045, relCap: 0.75, abs: 0.20, absCap: 8 },
  intermediate: { rel: 0.026, relCap: 0.42, abs: 0.10, absCap: 5 },
  advanced: { rel: 0.014, relCap: 0.22, abs: 0.05, absCap: 3 },
};

/* Percent of the current load per week, and the total ceiling for the block.
   Lower body moves faster than upper, and everyone slows down with training age. */
const KG_RATE = {
  beginner: { lower: 0.012, upper: 0.009, cap: 0.30 },
  returning: { lower: 0.010, upper: 0.008, cap: 0.25 },
  intermediate: { lower: 0.005, upper: 0.0035, cap: 0.14 },
  advanced: { lower: 0.0025, upper: 0.0018, cap: 0.07 },
};

function growReps(today, weeks, exp, low) {
  const g = REP_RATE[exp] || REP_RATE.beginner;
  const rel = Math.min(g.rel * weeks, g.relCap);
  const absCap = low ? Math.max(2, Math.round(g.absCap * 0.5)) : g.absCap;
  const abs = Math.min(g.abs * weeks * (low ? 0.6 : 1), absCap);
  return Math.max(today + 1, Math.round(today * (1 + rel) + abs));
}

function growSeconds(today, weeks, exp) {
  const g = REP_RATE[exp] || REP_RATE.beginner;
  const rel = Math.min(g.rel * weeks, g.relCap);
  return Math.min(120, Math.max(today + 5, roundTo(today * (1 + rel) + 5, 5)));
}

function growKg(today, weeks, exp, upper, age) {
  const g = KG_RATE[exp] || KG_RATE.beginner;
  let pct = Math.min((upper ? g.upper : g.lower) * weeks, g.cap);
  if (age < 18) pct = Math.min(pct, 0.18);
  return Math.max(today + 2.5, roundTo(today * (1 + pct), 2.5));
}

function benchOf(profile, key) {
  const b = profile && profile.benchmarks;
  const v = b && typeof b === 'object' ? Number(b[key]) : NaN;
  return Number.isFinite(v) && v > 0 ? v : null;
}

/**
 * The honest target table: 5–8 Hebrew rows, today from the declared benchmarks
 * and a defensible number (or a qualitative milestone) for the end of the block.
 */
function projectTargets(profile) {
  const p = profile || {};
  const weeks = programWeeks(p);
  const exp = expOf(p);
  const goal = goalOf(p);
  const age = num(p.age, 30);
  const k = kit(p);
  const hang = canHang(p);
  const teen = age < 18;
  const rows = [];

  /* ---- horizontal push, in reps ---- */
  const pushups = benchOf(p, 'pushups');
  rows.push({
    label: 'שכיבות שמיכה',
    today: pushups === null ? '—' : `${Math.round(pushups)}`,
    target: pushups === null
      ? '3×12 מלאות, חזה לרצפה'
      : `${growReps(Math.round(pushups), weeks, exp, false)}`,
  });

  /* ---- vertical pull, if there is anything to hang from ---- */
  const pullups = benchOf(p, 'pullups');
  if (hang) {
    rows.push({
      label: 'מתח',
      today: pullups === null ? '—' : `${Math.round(pullups)}`,
      target: pullups === null || pullups < 1
        ? (weeks >= 8 ? 'מתח ראשון נקי' : 'ירידה בשליטה, 5 שניות')
        : `${growReps(Math.round(pullups), weeks, exp, true)}`,
    });
  } else {
    const row = candidates(p, { pattern: 'horizontal_pull' });
    rows.push({
      label: row.length ? 'חתירה' : 'משיכה',
      today: pullups === null ? '—' : `${Math.round(pullups)} מתח`,
      target: '3×10 בגוף אופקי, שכמות נסגרות',
    });
  }

  /* ---- core, in seconds ---- */
  const plank = benchOf(p, 'plankSec');
  rows.push({
    label: 'פלאנק',
    today: plank === null ? '—' : `${Math.round(plank)} שנ׳`,
    target: plank === null
      ? '60 שנ׳ בלי צניחת אגן'
      : (plank >= 110 ? 'להוסיף קושי, לא זמן' : `${growSeconds(Math.round(plank), weeks, exp)} שנ׳`),
  });

  /* ---- squat ---- */
  const squatKg = benchOf(p, 'squatKg');
  const squatLoaded = candidates(p, { pattern: 'squat' })
    .some((e) => (e.equipment || []).some((q) => q === 'barbell' || q === 'machines' || q === 'dumbbells' || q === 'kettlebell'));
  if (squatKg !== null && (k.barbell || k.machines || k.freeWeights)) {
    rows.push({
      label: 'סקוואט',
      today: `${round1(squatKg)} ק״ג`,
      target: `${round1(growKg(squatKg, weeks, exp, false, age))} ק״ג`,
    });
  } else if (squatLoaded && !teen) {
    rows.push({
      label: 'סקוואט',
      today: squatKg === null ? '—' : `${round1(squatKg)} ק״ג`,
      target: '3×8 עם עומס יציב, ירך מתחת למקבילים',
    });
  } else {
    rows.push({
      label: 'סקוואט משקל גוף',
      today: '—',
      target: teen ? '3×15 עמוק ובשליטה' : '3×20 עמוק, עקבים על הרצפה',
    });
  }

  /* ---- hinge ---- */
  const dlKg = benchOf(p, 'deadliftKg');
  if (dlKg !== null && (k.barbell || k.freeWeights || k.machines)) {
    rows.push({
      label: 'דדליפט',
      today: `${round1(dlKg)} ק״ג`,
      target: `${round1(growKg(dlKg, weeks, exp, false, age))} ק״ג`,
    });
  } else if (candidates(p, { pattern: 'hinge' }).length) {
    rows.push({
      label: 'ציר ירכיים',
      today: dlKg === null ? '—' : `${round1(dlKg)} ק״ג`,
      target: teen ? '3×10 בגב ניטרלי, בלי עומס' : '3×10 בשליטה, גב ניטרלי לאורך כל הטווח',
    });
  }

  /* ---- press ---- */
  const benchKg = benchOf(p, 'benchKg');
  if (benchKg !== null && (k.barbell || k.freeWeights || k.machines)) {
    rows.push({
      label: 'לחיצת חזה',
      today: `${round1(benchKg)} ק״ג`,
      target: `${round1(growKg(benchKg, weeks, exp, true, age))} ק״ג`,
    });
  } else if (k.freeWeights || k.barbell || k.machines) {
    rows.push({
      label: 'לחיצת חזה',
      today: benchKg === null ? '—' : `${round1(benchKg)} ק״ג`,
      target: '3×10 בשליטה, ירידה של 2 שניות',
    });
  } else if (candidates(p, { pattern: 'vertical_push' }).length) {
    rows.push({
      label: 'לחיצה מעל הראש',
      today: '—',
      target: '3×8 פייק־פושאפ בטווח מלא',
    });
  }

  /* ---- the goal-shaped last row ---- */
  if (goal === 'fatloss' || goal === 'fitness' || goal === 'sport') {
    if (candidates(p, { pattern: 'conditioning' }).length) {
      rows.push({
        label: 'אירובי רצוף',
        today: '—',
        target: goal === 'sport' ? '6×200 מ׳ בלי נפילה בקצב' : '30 דק׳ רצוף בקצב שיחה',
      });
    }
  } else if (candidates(p, { pattern: 'mobility' }).length) {
    rows.push({
      label: 'ישיבה בסקוואט עמוק',
      today: '—',
      target: '2 דק׳ רצוף, עקבים על הרצפה',
    });
  }

  return rows.slice(0, 8);
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

/* ------------------------------------------------------------------ *
 * Diet filtering
 * ------------------------------------------------------------------ */

const EXCLUDE_BY_DIET = {
  vegan: ['meat', 'fish', 'dairy', 'egg', 'honey'],
  vegetarian: ['meat', 'fish'],
  gluten_free: ['gluten'],
  lactose_free: ['dairy'],
};

function passesDiet(variant, diet) {
  const tags = variant.tags || [];
  for (const d of diet) {
    const banned = EXCLUDE_BY_DIET[d];
    if (banned && banned.some((t) => tags.includes(t))) return false;
    // Kosher and halal: no meat and dairy in the same dish.
    if ((d === 'kosher' || d === 'halal') && tags.includes('meat') && tags.includes('dairy')) return false;
  }
  return true;
}

/*
 * Hebrew words people actually type, mapped to the tags the bank already carries.
 *
 * Matching the typed text against the dish text was the bug, and it failed in
 * the worst possible direction: someone writes "שומשום" — sesame — and every
 * tahini dish sails through, because the word "שומשום" does not appear in
 * "כף טחינה". Someone writes "אגוזים" and misses "חמאת בוטנים". The user is
 * shown a plan built "for them" and reasonably assumes the food they declared
 * was taken out. Silent non-filtering is worse than no filter at all, because
 * being asked the question is what creates the trust.
 *
 * These are prefixes, matched against the typed word in both directions, so
 * "אגוז", "אגוזים" and "אגוזי מלך" all reach the nuts tag.
 */
const ALLERGEN_TERMS = {
  nuts: ['אגוז', 'בוטנ', 'שקד', 'פיסטוק', 'קשיו', 'לוז', 'פקאן', 'מקדמי'],
  sesame: ['שומשום', 'טחינ', 'חלווה', 'חומוס טחינה'],
  egg: ['ביצ', 'חלבון ביצה'],
  dairy: ['חלב', 'יוגורט', 'קוטג', 'גבינ', 'לקטוז', 'שוקו', 'חמאה', 'מוצרי חלב'],
  fish: ['דג', 'דגים', 'טונה', 'סלמון', 'בורי', 'פירות ים'],
  soy: ['סויה', 'טופו', 'אדממה'],
  legume: ['קטני', 'חומוס', 'עדש', 'שעוע', 'אפונ', 'פול'],
  gluten: ['גלוטן', 'חיט', 'קמח', 'לחם', 'שעור'],
};

/** The tags a typed allergy list implicates. */
function allergyTags(terms) {
  const tags = new Set();
  for (const typed of terms) {
    for (const [tag, words] of Object.entries(ALLERGEN_TERMS)) {
      for (const w of words) {
        // Either direction: the typed word may be shorter than the canonical
        // one ("אגוז" vs "אגוזים") or longer ("אגוזי מלך").
        if (typed.includes(w) || w.includes(typed)) { tags.add(tag); break; }
      }
    }
  }
  return tags;
}

function passesAllergies(variant, terms, tags) {
  if (!terms.length) return true;
  // Tags first, because they are the reliable half: a dish is excluded whether
  // or not the user happened to type the word that appears in its ingredients.
  for (const t of (variant.tags || [])) if (tags.has(t)) return false;
  // Then the literal text as well, for anything the tag vocabulary does not
  // cover — a specific fruit, a spice, a brand.
  const hay = `${variant.n} ${variant.i}`;
  return !terms.some((t) => hay.includes(t));
}

function allergyTerms(profile) {
  return String(profile.allergies || '')
    // Punctuation only. Splitting on the letter ו — meaning "and" — shatters
    // the words it is inside: "שומשום" contains two of them and comes apart
    // into fragments that match nothing.
    .split(/[,،;\n/]|\s+ו(?=[א-ת])/)
    .map((t) => t.trim())
    // A leading ו is the conjunction only when a real word follows it. Stripping
    // ל or מ as well would maul "מלח" into "לח".
    .map((t) => (t.length >= 4 && t.startsWith('ו') ? t.slice(1) : t))
    .filter((t) => t.length >= 2);
}

/**
 * Filtered variants for a slot.
 *
 * Neither filter is ever relaxed. An allergy is a medical constraint and a
 * declared diet is the whole reason the user answered the question — showing
 * a vegan a cottage cheese bowl because the list ran short is worse than
 * showing them a shorter list.
 *
 * So this can and does return fewer than four, and once returned nothing at
 * all: a long free-text allergy list emptied dinner completely and the tab
 * crashed on the swap counter. The tail of the bank now covers the realistic
 * stacks, nutritionPlan drops whatever still comes back empty, and warnings()
 * says out loud that the restrictions are what thinned the plan. Padding the
 * list to four with food the user cannot eat is not the alternative.
 */
function variantsFor(slot, profile, count) {
  const diet = profile.diet || [];
  const terms = allergyTerms(profile);
  const bank = BANK[slot] || [];
  const tags = allergyTags(terms);
  const list = bank.filter((v) => passesDiet(v, diet) && passesAllergies(v, terms, tags));
  return list.slice(0, Math.max(count, 4)).map(({ n, i }) => ({ n, i }));
}

/* ------------------------------------------------------------------ *
 * Energy
 * ------------------------------------------------------------------ */

function mifflin(profile) {
  const w = profile.weightKg;
  const h = profile.heightCm;
  const a = profile.age;
  const male = 10 * w + 6.25 * h - 5 * a + 5;
  const female = 10 * w + 6.25 * h - 5 * a - 161;
  if (profile.sex === 'male') return male;
  if (profile.sex === 'female') return female;
  return (male + female) / 2;
}

function activityFactor(profile) {
  const weeklyMinutes = (profile.daysPerWeek || 3) * (profile.minutesPerSession || 60);
  if (weeklyMinutes <= 90) return 1.30;
  if (weeklyMinutes <= 180) return 1.40;
  if (weeklyMinutes <= 300) return 1.50;
  if (weeklyMinutes <= 450) return 1.62;
  return 1.72;
}

const FACTOR_HE = {
  1.30: 'פעילות נמוכה', 1.40: 'פעילות קלה', 1.50: 'פעילות בינונית',
  1.62: 'פעילות גבוהה', 1.72: 'פעילות גבוהה מאוד',
};

/*
 * BMI is only consulted at the bottom of its range, where it says the one thing
 * it is actually good for: there is nothing here to take off.
 */
function bmiOf(profile) {
  const m = (Number(profile.heightCm) || 0) / 100;
  return m > 0 ? (Number(profile.weightKg) || 0) / (m * m) : 0;
}

/*
 * Protein and fat are prescribed per kilo of a reference weight rather than per
 * kilo of whatever the scale says, because for someone carrying a lot of fat
 * the two stop being the same number. 2.2 g/kg of 200 kg came out as 440 g of
 * protein and 160 g of fat, which used the whole day's energy before a single
 * gram of carbohydrate — the card printed "פחמימה 0 ג׳" next to a 2460 kcal
 * target that its own macros missed by 740. Nobody eats that; it is arithmetic
 * that ran off the end of the plan.
 *
 * Fat mass carries no protein requirement of its own, so the reference stops
 * counting above BMI 28 — the adjusted-body-weight move every clinic makes, in
 * one line. Below that it changes nothing, which is most people.
 */
function referenceKg(profile) {
  const m = (Number(profile.heightCm) || 0) / 100;
  const w = Number(profile.weightKg) || 0;
  return m > 0 ? Math.min(w, 28 * m * m) : w;
}

function strategy(profile) {
  const bmr = Math.round(mifflin(profile));
  const factor = activityFactor(profile);
  const tdee = Math.round(bmr * factor);

  // Size the change by the achievable weekly rate, not by a round percentage.
  let wanted = 0;
  let hold = null;
  const w = profile.weightKg;
  switch (profile.goal) {
    case 'fatloss':
      /*
       * Under 18 there is no deficit, whatever the goal chip says.
       *
       * This used to say "targets.js refuses to put an under-18 into a
       * deficit" and leave it there. targets.js does refuse — but only when a
       * target weight was entered, because that is the only thing it is asked
       * about. A seventeen-year-old who picked "חיטוב" and left the target
       * blank came through here and was handed 2210 kcal against a TDEE of
       * 2720: a real 510 kcal deficit, with weekly weigh-in check-ins beside
       * it, on the same screen as a heading that calls them a minor.
       *
       * Two files agreeing about a rule and neither of them enforcing it is
       * the shape of every age bug in this app so far. This one asks.
       */
      if (withholdsFatLoss(profile)) { hold = 'minor'; break; }
      // Being underweight is the same refusal for a different reason: under
      // BMI 18.5 there is no fat to spend, so the deficit comes out of muscle,
      // bone and hormones instead. Whether to diet anyway is a conversation
      // with a doctor, and an app that has seen two numbers does not get to
      // open it.
      if (bmiOf(profile) < 18.5) { hold = 'underweight'; break; }
      wanted = -Math.round(Math.min(tdee * 0.22, (0.006 * w * 7700) / 7));
      break;
    case 'muscle': wanted = Math.round(Math.min(tdee * 0.12, (0.003 * w * 7700) / 7)); break;
    case 'strength': wanted = Math.round(tdee * 0.05); break;
    case 'sport': wanted = Math.round(tdee * 0.03); break;
    default: wanted = 0;
  }

  // A deficit is meant to come out of the day's activity, not out of what the
  // body spends lying still. Without this floor a light, short, twice-a-week
  // adult was handed 970 kcal — a number no dietitian would write down, and one
  // this file arrived at purely by taking 22% of an already small TDEE.
  const kcal = Math.round(Math.max(tdee + wanted, bmr) / 10) * 10;

  // Report the change that survived the floor and the rounding: this is the
  // number printed beside the target, and it has to match it. Maintenance stays
  // exactly zero instead of becoming a 5 kcal "deficit" made of rounding.
  const deltaKcal = wanted === 0 ? 0 : kcal - tdee;
  // Whether the floor bit, asked of the floor rather than of the rounded
  // result — the 10 kcal rounding alone would otherwise claim it did.
  const trimmed = tdee + wanted < bmr;

  const ref = referenceKg(profile);
  const proteinPerKg = profile.goal === 'fatloss' ? 2.2 : profile.goal === 'muscle' ? 1.9 : 1.7;

  /*
   * Per-kilo protein and fat are floors, and a floor does not know how big the
   * day is. On a compressed budget they ate it whole: a 45-year-old woman at
   * 165 cm and 75 kg who trains twice a week was handed 165 g protein and 55 g
   * carbohydrate — an accidental ketogenic diet, prescribed to someone whose
   * entire reason for being here is that the training should get better.
   * Carbohydrate is the first thing the sessions lose.
   *
   * So both are also capped at 35% of the target. Fat is floored at 25%, which
   * lands it in the 25–35% band it belongs in, and what the two leave behind is
   * never less than 30% carbohydrate. On an uncompressed budget — most people —
   * neither cap binds and the numbers are unchanged.
   */
  const proteinG = Math.min(Math.round(ref * proteinPerKg), Math.round(kcal * 0.35 / 4));
  const fatG = Math.min(Math.round(Math.max(ref * 0.8, kcal * 0.25 / 9)), Math.round(kcal * 0.35 / 9));
  // The clamp below is a guard, not a plan: with the caps in place the
  // remainder stays positive across the whole range the intake accepts.
  const carbsG = Math.max(0, Math.round((kcal - proteinG * 4 - fatG * 9) / 4));

  return {
    bmr,
    tdee,
    kcal,
    proteinG,
    carbsG,
    fatG,
    deltaKcal,
    hold,
    basis: `חושב לפי נוסחת מיפלין־סנט ז׳ור: מטבוליזם במנוחה ${bmr} קק״ל, `
      + `מוכפל ב־${factor} (${FACTOR_HE[factor] || 'פעילות'}) לפי ${profile.daysPerWeek} אימונים של ${profile.minutesPerSession} דקות. `
      + (deltaKcal === 0
        ? (hold === 'underweight'
          ? 'המשקל שלך כבר בקצה התחתון של הטווח לגובה, ולכן אין כאן גירעון אלא אחזקה. מכאן ההרכב משתנה מהאימון ומהחלבון, לא מהמאזניים.'
          : hold === 'minor'
            ? 'בגיל הזה הגוף עוד בונה גובה, עצם ומסה, וגירעון מכוון לוקח מכל השלושה. לכן זו אחזקה — ההרכב משתנה מהאימון ומהחלבון.'
            : 'ללא גירעון או עודף — אחזקה.')
        : `${deltaKcal < 0 ? 'גירעון' : 'עודף'} של ${Math.abs(deltaKcal)} קק״ל ביום, בקצב שאפשר להחזיק לאורך זמן.`)
      + (trimmed ? ' הגירעון קוצר כדי שהיעד לא ירד מתחת למטבוליזם במנוחה.' : ''),
  };
}

/* ------------------------------------------------------------------ *
 * Main
 * ------------------------------------------------------------------ */

function nutritionPlan(profile) {
  const p = profile || {};
  const minor = withholdsBodyNumbers(p);
  const meals = [];

  const trainHour = TRAIN_TIME[p.timeOfDay] || 18;
  const sessionEnd = trainHour + (Number(p.minutesPerSession) || 60) / 60;

  /*
   * A meal that lands inside the session is not a meal. The grid is fixed, so
   * whoever trains at noon was told to eat lunch at 13:00 — under the bar — and
   * whoever trains at 07:00 got breakfast at 07:00 for the same reason. Meals
   * caught inside the session slide to half an hour after it, which is where
   * the post-workout meal belongs anyway.
   */
  const sched = scheduleFor(p.mealsPerDay || 4)
    .map(([slot, hour]) => [slot, hour >= trainHour - 0.25 && hour < sessionEnd ? sessionEnd + 0.5 : hour]);

  let snackIndex = 0;
  for (const [slot, hour] of sched) {
    const label = slot === 'snack'
      ? `${SLOT_LABEL.snack} ${snackIndex++ === 0 ? 'בוקר' : 'אחר הצהריים'}`
      : SLOT_LABEL[slot];
    meals.push({
      time: hhmm(hour),
      slot: label,
      job: JOB[slot],
      trainingOnly: false,
      variants: variantsFor(slot, p, 5),
    });
  }

  // 90 minutes before is right for the afternoon and absurd in the morning: it
  // puts a 07:00 session's meal at 05:30, which nobody gets up for, so they
  // train on nothing instead. An early session gets a small one 45 minutes out.
  const early = trainHour <= 8;
  const preHour = trainHour - (early ? 0.75 : 1.5);

  // The pre-workout meal only exists on training days, and only when it does
  // not collide with a meal that is already within an hour of the session.
  const collides = sched.some(([, hour]) => Math.abs(hour - preHour) < 1);
  if (!collides) {
    meals.push({
      time: hhmm(preHour),
      slot: SLOT_LABEL.preworkout,
      job: early ? JOB.preworkoutEarly : JOB.preworkout,
      trainingOnly: true,
      variants: variantsFor('preworkout', p, 5),
    });
  }
  meals.sort((a, b) => a.time.localeCompare(b.time));

  // A slot the filters emptied is dropped rather than rendered: a meal card
  // with no options divides by zero in its own swap counter and takes the whole
  // tab down with it. The warning below is what the user gets instead.
  const served = meals.filter((m) => m.variants.length > 0);
  const thin = served.length < meals.length || served.some((m) => m.variants.length < 4);

  /*
   * Without age, height and weight there is no formula to run, and Mifflin
   * happily returns NaN rather than saying so — the macro card then reads
   * "קלוריות NaN". A profile we cannot measure gets the same answer a minor
   * gets: the plate, the meals and the habits, with no invented numbers. This
   * also settles what a missing age means, which Number() otherwise answers two
   * different ways (null is 0 and counts as a minor, undefined is NaN and does
   * not); either way it now lands on "no numbers".
   */
  const measurable = Number(p.age) > 0 && Number(p.heightCm) > 0 && Number(p.weightKg) > 0;
  const strat = minor || !measurable ? null : strategy(p);
  // Cutting means the plan is in a deficit, not that the goal chip says so.
  const cutting = !!strat && strat.deltaKcal < 0;

  return {
    strategy: strat,
    plate: plate(p, minor),
    meals: served,
    eatingOut: eatingOut(p, minor, cutting),
    checkins: checkins(p, minor, cutting),
    warnings: warnings(p, minor, strat, thin),
  };
}

function plate(p, minor) {
  /*
   * The plate is the only quantity guidance a minor is given, so it gets its
   * own version rather than one of the adult ones. The cutting plate is a diet;
   * the bulking plate tells you not to overdo the vegetables, which is written
   * for an adult chasing a surplus and is nonsense advice for a fourteen-year-
   * old. What is left is the growth plate: eat all four, every meal.
   */
  if (minor) {
    return [
      {
        k: 'חלבון',
        title: 'כף יד בכל ארוחה',
        body: 'שתיים בערב. עוף, בשר, דגים, טונה, ביצים, קוטג׳, יוגורט, קטניות, טופו. בגיל הזה זה חומר גלם לגובה ולעצם, לא רק לשריר.',
      },
      {
        k: 'פחמימה',
        title: 'אגרוף בכל ארוחה, שניים אחרי אימון',
        body: 'אורז, פסטה, לחם, פיתה, תפוח אדמה, קוסקוס, שיבולת שועל. זה הדלק של האימון, של הגדילה ושל יום הלימודים — הוא לא מיועד לקיצוץ.',
      },
      {
        k: 'שומן',
        title: 'כף מלאה',
        body: 'שמן זית, טחינה, אבוקדו, חמאת בוטנים, אגוזים. הדרך הכי קלה להוסיף אנרגיה ליום כשאין תיאבון לאכול עוד צלחת.',
      },
      {
        k: 'ירקות',
        title: 'מה שיש בבית',
        body: 'לצד הפחמימה ולא במקומה. הם לא אמורים למלא אותך בגיל הזה — הם אמורים פשוט להיות שם.',
      },
    ];
  }

  const bulking = p.goal === 'muscle' || p.goal === 'strength';
  return [
    {
      k: 'חלבון',
      title: 'כף יד אחת',
      body: 'שתיים בארוחת הערב. עוף, בשר, דגים, טונה, ביצים, קוטג׳, יוגורט יווני, קטניות, טופו.',
    },
    {
      k: 'פחמימה',
      title: bulking ? 'אגרוף עד שניים' : 'אגרוף אחד',
      body: bulking
        ? 'אורז, פסטה, לחם, פיתה, תפוח אדמה, קוסקוס, שיבולת שועל. זה הדלק וזה מה שמעלה משקל.'
        : 'אורז, פסטה, לחם, תפוח אדמה, קוסקוס. לא לאפס — בלי פחמימה האימונים נופלים ראשונים.',
    },
    {
      k: 'שומן',
      title: bulking ? 'כף מלאה' : 'כף שטוחה',
      body: 'שמן זית, טחינה, אבוקדו, חמאת בוטנים, אגוזים. הדרך הכי קלה להוסיף או להוריד אנרגיה.',
    },
    {
      k: 'ירקות',
      title: bulking ? 'מה שנכנס' : 'חצי מהצלחת',
      body: bulking
        ? 'לא צריך להגזים — הם ממלאים בלי לתת אנרגיה, וזה בדיוק מה שאתה לא רוצה עכשיו.'
        : 'הם מה שיגרום לך לקום מהשולחן שבע בלי לחרוג. אל תוותר עליהם.',
    },
  ];
}

/*
 * This table used to ignore the diet chips completely. Someone who ticked
 * "טבעוני" two screens earlier was told that grilled chicken is the best option
 * in any situation — the same failure as the allergy filter, where the question
 * is asked, answered, and then not used. And `cutting` came straight off the
 * goal chip, so a fourteen-year-old whose warnings say the app deliberately
 * does not diet at this age was reading "two slices, not four".
 */
function eatingOut(p, minor, cutting) {
  const diet = p.diet || [];
  const vegan = diet.includes('vegan');
  const out = vegan || diet.includes('vegetarian')
    ? eatingOutVeg(vegan, cutting)
    : eatingOutMeat(cutting);

  if (diet.includes('gluten_free')) {
    // Written as an override of the rows above rather than a sixth opinion —
    // half of them recommend a pita, and this is the line that takes it back.
    out.push({
      where: 'בלי גלוטן',
      pick: 'כל מה שלמעלה נכון חוץ מהפיתה, מהלחמנייה ומהבצק — קח אורז, תפוחי אדמה או מנה בצלחת במקום. תשאל על הרוטב ועל הציפוי, שם הקמח מתחבא',
    });
  }
  if (p.whoCooks === 'outside') {
    // Someone who buys ready-made eats from a shelf every day, not from a
    // restaurant once a week. Their version of this table is the makolet.
    out.push({
      where: 'סופר ומכולת',
      pick: `${vegan ? 'חומוס, טופו, אורז מוכן, ירקות חתוכים, פירות ואגוזים' : 'קוטג׳, טונה, ביצים קשות, אורז מוכן, ירקות חתוכים ופירות'} — מי שלא מבשל בונה את היום מהמדף הזה, וזה עובד בדיוק כמו בישול`,
    });
  }
  if (minor) {
    out.push({
      where: 'קיוסק ואוטומט',
      pick: 'בתוספת לארוחה, לא במקומה. חטיף בהפסקה הוא בעיה רק כשהוא מחליף את הצהריים',
    });
  }
  return out;
}

function eatingOutMeat(cutting) {
  return [
    {
      where: 'שווארמה',
      pick: cutting
        ? 'בצלחת, בלי פיתה, עם הרבה סלט. תבקש רזה ותוותר על הצ׳יפס'
        : 'בצלחת עם אורז וסלט — יותר בשר מאשר בפיתה',
    },
    {
      where: 'המבורגר',
      pick: cutting
        ? 'בלי רוטב ובלי צ׳יפס, או חצי לחמנייה. הבשר עצמו הוא לא הבעיה'
        : 'בסדר גמור. תוסיף ביצה או קציצה שנייה',
    },
    {
      where: 'פיצה',
      pick: cutting
        ? 'שתי משולשים עם סלט גדול לפני — לא ארבעה בלי'
        : 'עם תוספת טונה או עוף, לא רק גבינה',
    },
    {
      where: 'על האש',
      pick: 'האופציה הכי טובה בכל מצב — פרגית או כנפיים עם סלט וטחינה',
    },
    {
      where: 'סושי',
      pick: cutting
        ? 'סשימי ומאקי פשוט. הימנע מהמטוגן ומרטבים מתוקים'
        : 'מעט מאוד חלבון ואנרגיה ליחידת נפח, וקל לצאת משם רעב. תוסיף אדממה, מרק ואורז',
    },
  ];
}

function eatingOutVeg(vegan, cutting) {
  const out = [
    {
      where: 'חומוס',
      pick: cutting
        ? 'מנה עם הרבה סלט ופיתה אחת, לא שתיים. הטחינה והשמן הם רוב הקלוריות כאן, לא הגרגרים'
        : 'מנת חומוס עם פול ופיתה — חלבון, פחמימה ושומן במנה אחת, וזמין בכל פינה',
    },
    {
      where: 'פלאפל',
      pick: cutting
        ? 'בצלחת עם סלט וחומוס, בלי פיתה. הכדורים מטוגנים וזה כל הסיפור כאן'
        : 'בפיתה עם הרבה סלט וטחינה. אחת הארוחות הצמחוניות הזמינות בארץ עם חלבון אמיתי',
    },
    {
      where: 'על האש',
      pick: 'ירקות בגריל, תפוחי אדמה ופיתה עם טחינה. אם אתה יכול — תביא איתך קציצות עדשים או טופו, שם החלבון',
    },
    {
      where: 'סושי',
      pick: 'מאקי ירקות ואבוקדו עם אדממה. בלי האדממה כמעט ואין כאן חלבון',
    },
  ];
  out.push(vegan
    ? {
      where: 'פיצה',
      pick: 'בלי גבינה עם המון תוספות ירקות — או פשוט לבחור אחרת. בלי הגבינה נשאר בעיקר בצק',
    }
    : {
      where: 'שקשוקה בבית קפה',
      pick: 'שקשוקה או חביתה עם לחם וסלט — ארוחת חלבון שלמה כמעט בכל תפריט, גם כשאין שום דבר אחר',
    });
  return out;
}

function checkins(p, minor, cutting) {
  /*
   * The markers are the diet. A weekly weigh-in and "stuck for three weeks?
   * drop a snack" are what dieting consists of once you delete the calorie
   * count — which is exactly what this screen used to hand a fourteen-year-old,
   * two panels below a warning saying we do not diet at this age. Under 16 the
   * question is not whether the number moved, it is whether the day held: did
   * breakfast happen, are the training numbers climbing, does the afternoon
   * still have energy in it. All three answer "are you eating enough", and none
   * of them teaches a growing kid to watch a scale.
   */
  if (minor) {
    return [
      {
        k: 'ארוחת בוקר',
        title: 'אכלת אותה היום?',
        body: 'הסימן הכי טוב שהיום מסודר, וההרגל הראשון שנופל. מי שמדלג עליה מגיע לצהריים מורעב, אוכל פחות טוב עד הערב, ומגיע לאימון ריק.',
      },
      {
        k: 'המספרים באימון',
        title: 'עוד חזרה, עוד קצת משקל',
        body: 'זו העדות שצריך בגיל הזה. אם המספרים עולים משבוע לשבוע אתה אוכל מספיק. אם הם תקועים חודש — קודם תוסיף אוכל, לא אימון.',
      },
      {
        k: 'אנרגיה',
        title: 'איך אחר הצהריים',
        body: 'עייפות כבדה בשיעורים האחרונים או בדרך לאימון היא כמעט תמיד ארוחה חסרה, לא חוסר שינה. נשנוש בין הצהריים לאימון פותר את זה.',
      },
      {
        k: 'בלי מאזניים',
        title: 'לא שוקלים כל שבוע',
        body: 'אתה עוד גדל, ולכן המספר אמור לעלות. מעקב שבועי אחריו מלמד להסתכל על הדבר הלא נכון בדיוק בגיל שבו זה נדבק. הבגדים, הכוח והמראה מספרים את זה טוב יותר.',
      },
    ];
  }

  const out = [
    {
      k: 'שקילה',
      title: 'פעם בשבוע, אותו יום',
      body: 'בבוקר, אחרי שירותים, לפני שאתה אוכל. משקל יומי קופץ קילו בין בוקר לערב ולא אומר כלום.',
    },
    {
      k: 'אם המשקל תקוע',
      title: cutting ? 'הורד נשנוש' : 'הוסף נשנוש',
      body: cutting
        ? 'שבועיים־שלושה בלי תזוזה? הורד נשנוש אחד ביום, או החלף אותו בפרי. אל תוריד ארוחה שלמה.'
        : 'שבועיים־שלושה בלי תזוזה? תוסיף עוד נשנוש ביום. בדרך כלל הבעיה היא ארוחת הבוקר.',
    },
    {
      k: 'אם המספרים באימון עולים',
      title: 'אתה בכיוון',
      body: 'עוד חזרה, עוד 2.5 ק״ג — זו עדות טובה יותר מכל מספר על המאזניים.',
    },
  ];
  if (cutting) {
    out.push({
      k: 'סימן אזהרה',
      title: 'אם הביצועים נופלים',
      body: 'ירידה חדה בכוח, שינה גרועה ורעב מתמיד אומרים שהגירעון גדול מדי. תוסיף 200 קק״ל ותמשיך.',
    });
  }
  return out;
}

function warnings(p, minor, strat, thin) {
