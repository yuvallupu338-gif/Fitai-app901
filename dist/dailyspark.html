/*
 * tokens.css — the palette and scale from the design spec.
 *
 * Three theme states, not two. An explicit choice stamps data-theme on the root
 * and wins in both directions; with no stamp, prefers-color-scheme decides.
 * Every colour is defined at :root first and only *redefined* in the other two
 * blocks — a colour whose only definition lives inside a media query renders as
 * nothing at all in the unstamped state, which is the classic way a themed page
 * ends up as black text on a black ground.
 */

:root {
  /* surfaces — warm paper, not white. The whole visual thesis is "a page in a
     book", and #FFFFFF reads as a form. */
  --canvas: #FBF7F2;
  --surface: #FFFFFF;
  --sunken: #F3EDE5;

  /* ink — three levels, and the third one is still legible. #9C9289 measured
     2.9:1 on the card surface, which fails AA for the captions, timestamps and
     field labels that make up most of the text on the settings screen. */
  --ink: #1A1613;
  --ink-2: #6B6259;
  --ink-3: #746A61;

  /* ember — the brand. Used for one thing per screen. */
  --ember: #C24A18;
  --ember-bright: #E8622C;
  --ember-wash: #FBE3D6;

  /* moss marks completion, gold marks the streak. Two accents rather than one
     so "done" and "kept going" never compete for the same colour. */
  --moss: #2F7A5C;
  --moss-wash: #DCEEE5;
  --gold: #A87C14;
  --dusk: #4A5578;

  --danger: #A8412C;
  --line: #E8DFD4;
  --line-soft: #F0E9E0;

  /* type */
  --serif: "Frank Ruhl Libre", "Times New Roman", serif;
  --sans: "Assistant", "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* geometry */
  --r-card: 24px;
  --r: 14px;
  --r-sm: 11px;
  --r-pill: 999px;
  --wrap: 620px;

  /* elevation — warm shadows. A neutral black shadow on warm paper reads as
     dirt rather than as depth. */
  --sh-1: 0 1px 2px rgba(78, 52, 32, .06);
  --sh-2: 0 4px 14px rgba(78, 52, 32, .08);
  --sh-3: 0 12px 32px rgba(78, 52, 32, .12);

  /* motion */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-both: cubic-bezier(.65, 0, .35, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #131110;
    --surface: #1E1B19;
    --sunken: #262220;

    --ink: #F2EDE6;
    --ink-2: #A79D93;
    --ink-3: #8C8279;

    --ember: #FF8552;
    --ember-bright: #FF9E72;
    --ember-wash: #3A2117;

    --moss: #5FB08D;
    --moss-wash: #163026;
    --gold: #DDB554;
    --dusk: #8894BC;

    --danger: #E0705A;
    --line: #322C28;
    --line-soft: #272220;

    --sh-1: 0 1px 2px rgba(0, 0, 0, .4);
    --sh-2: 0 4px 14px rgba(0, 0, 0, .35);
    --sh-3: 0 12px 32px rgba(0, 0, 0, .45);
  }
}

:root[data-theme="dark"] {
  --canvas: #131110;
  --surface: #1E1B19;
  --sunken: #262220;

  --ink: #F2EDE6;
  --ink-2: #A79D93;
  --ink-3: #8C8279;

  --ember: #FF8552;
  --ember-bright: #FF9E72;
  --ember-wash: #3A2117;

  --moss: #5FB08D;
  --moss-wash: #163026;
  --gold: #DDB554;
  --dusk: #8894BC;

  --danger: #E0705A;
  --line: #322C28;
  --line-soft: #272220;

  --sh-1: 0 1px 2px rgba(0, 0, 0, .4);
  --sh-2: 0 4px 14px rgba(0, 0, 0, .35);
  --sh-3: 0 12px 32px rgba(0, 0, 0, .45);
}


/*
 * base.css — document, typography, and the primitives every screen shares.
 */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  background: var(--canvas);
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  /* Safe areas so the tab bar clears the home indicator on a phone. */
  padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* Hebrew has no italic. Emphasis is carried by weight and colour instead;
   leaving the browser to synthesise a slanted Hebrew face looks like a bug. */
em, i { font-style: normal; font-weight: 600; }

h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }

a { color: var(--ember); }

:focus-visible {
  outline: 2px solid var(--ember);
  outline-offset: 3px;
  border-radius: 4px;
}
:focus:not(:focus-visible) { outline: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.wrap, .screen {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 20px 18px 108px;
}

/* ---------------------------------------------------------------- cards */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 20px;
  box-shadow: var(--sh-1);
  margin-bottom: 16px;
}

.card-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.card-lede { color: var(--ink-2); font-size: 15px; margin-bottom: 14px; }
.card-foot { color: var(--ink-3); font-size: 13.5px; margin-top: 12px; line-height: 1.5; }

.screen-head { margin-bottom: 18px; }
.screen-title { font-size: 27px; font-weight: 750; letter-spacing: -.02em; }
.screen-lede { color: var(--ink-2); font-size: 15px; margin-top: 4px; }

.empty { text-align: center; padding: 40px 24px; }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); font-size: 15px; }

/* ---------------------------------------------------------------- buttons */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 16px; font-weight: 600;
  cursor: pointer;
  transition: transform .12s var(--ease-out), background .16s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }

.btn-primary {
  background: var(--ember);
  border-color: var(--ember);
  color: #fff;
}
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); width: 100%; margin-top: 10px; }

.row-actions { display: flex; gap: 10px; }
.row-actions .btn { flex: 1; }

/* ---------------------------------------------------------------- chips */

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip-grid-tight { gap: 6px; }
.chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }

.chip {
  min-height: 40px; padding: 0 15px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  font-size: 15px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
  transition: background .16s, border-color .16s, color .16s;
}
.chip.is-on {
  background: var(--ember-wash);
  border-color: var(--ember);
  color: var(--ember);
}
.chip-sm { min-height: 34px; padding: 0 12px; font-size: 14px; }

/* ---------------------------------------------------------------- segmented */

.seg {
  display: flex; gap: 4px; padding: 4px;
  background: var(--sunken);
  border-radius: var(--r);
}
.seg-wide { margin-bottom: 16px; }
.seg-item {
  flex: 1; min-height: 40px; padding: 0 10px;
  background: transparent; border: 0; border-radius: var(--r-sm);
  font-size: 15px; font-weight: 600; color: var(--ink-2);
  cursor: pointer;
}
.seg-item.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

/* ---------------------------------------------------------------- fields */

.field { display: block; margin-bottom: 16px; }
.field-label {
  display: block; font-size: 13px; font-weight: 700;
  color: var(--ink-3); margin-bottom: 8px;
  letter-spacing: .01em;
}
.input {
  width: 100%; min-height: 46px; padding: 10px 14px;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: var(--r);
  color: var(--ink); font-family: inherit; font-size: 16px;
}
.input::placeholder { color: var(--ink-3); }
.note { resize: vertical; min-height: 74px; line-height: 1.5; }
.time { max-width: 160px; }

/* ---------------------------------------------------------------- switch */

.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 8px 0; }
.switch-input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track {
  flex: none; width: 48px; height: 29px; border-radius: var(--r-pill);
  background: var(--sunken); border: 1px solid var(--line);
  position: relative; transition: background .18s;
}
.switch-thumb {
  position: absolute; inset-inline-start: 3px; top: 2px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); box-shadow: var(--sh-1);
  transition: transform .18s var(--ease-out);
}
.switch-input:checked + .switch-track { background: var(--ember); border-color: var(--ember); }
/* Moves toward the inline end, which is leftwards in this RTL document. */
.switch-input:checked + .switch-track .switch-thumb { transform: translateX(-19px); }
.switch-input:focus-visible + .switch-track { outline: 2px solid var(--ember); outline-offset: 3px; }
.switch-label { font-size: 15.5px; }

/* ---------------------------------------------------------------- stats */

.stat { text-align: center; }
.stat dt { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.stat dd { margin: 2px 0 0; font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; }

.stat-strip { display: flex; justify-content: space-around; padding: 16px; }

.notice {
  margin-top: 12px; padding: 11px 14px;
  background: var(--sunken); border-radius: var(--r-sm);
  font-size: 14px; color: var(--ink-2);
}
.notice-warn { border: 1px solid var(--danger); color: var(--danger); }

/* ---------------------------------------------------------------- toast */

.toast {
  position: fixed; inset-inline: 16px; bottom: 88px;
  max-width: 420px; margin: 0 auto;
  padding: 13px 18px;
  background: var(--ink); color: var(--canvas);
  border-radius: var(--r); font-size: 15px; font-weight: 600;
  text-align: center;
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s var(--ease-out);
  pointer-events: none; z-index: 60;
}
.toast.is-on { opacity: 1; transform: none; }

/* ---------------------------------------------------------------- sheet */

.sheet-back {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(26, 22, 19, .42);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .18s var(--ease-out);
}
.sheet-back.is-leaving { animation: fade .16s var(--ease-out) reverse forwards; }
.sheet {
  width: 100%; max-width: var(--wrap);
  max-height: 88vh; overflow-y: auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow: var(--sh-3);
  animation: rise .26s var(--ease-out);
}
.sheet-title { font-size: 21px; font-weight: 700; margin-bottom: 10px; }
.sheet-lede { color: var(--ink-2); font-size: 15.5px; margin-bottom: 16px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.sheet-skip { width: 100%; margin-top: 12px; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(22px); opacity: .6; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;

/*
 * components.css — the screens.
 *
 * The spark card gets the most attention here because it is the product. It is
 * the only place the serif face appears: a serif gives the text the weight of
 * something written, while the rest of the interface stays in the sans and gets
 * out of the way.
 */

/* ---------------------------------------------------------------- onboarding */

.ob { max-width: var(--wrap); margin: 0 auto; padding: 28px 20px 40px; min-height: 100vh; display: flex; flex-direction: column; }
.ob-progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 30px; }
.ob-dot { width: 26px; height: 3px; border-radius: 2px; background: var(--line); transition: background .2s; }
.ob-dot.is-on { background: var(--ember); }

.ob-step { flex: 1; display: flex; flex-direction: column; }
.ob-mark { color: var(--ember); margin-bottom: 18px; }
.ob-title { font-size: 30px; font-weight: 750; letter-spacing: -.025em; margin-bottom: 10px; }
.ob-lede { color: var(--ink-2); font-size: 16.5px; margin-bottom: 22px; }
.ob-count { color: var(--ink-3); font-weight: 700; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }

.ob-points { list-style: none; margin: 0 0 26px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ob-points li { position: relative; padding-inline-start: 22px; color: var(--ink-2); font-size: 15.5px; }
.ob-points li::before {
  content: ""; position: absolute; inset-inline-start: 4px; top: .62em;
  width: 7px; height: 7px; border-radius: 50%; background: var(--ember);
}

.ob-footer { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; gap: 6px; }
.ob-footer .btn { width: 100%; }
.ob-back {
  align-self: flex-start; margin-top: 14px; padding: 8px 4px;
  background: none; border: 0; color: var(--ink-3); font-size: 15px; cursor: pointer;
}
.tone-sample {
  margin-top: 12px; padding: 14px 16px;
  background: var(--sunken); border-radius: var(--r);
  font-family: var(--serif); font-size: 17px; color: var(--ink);
}

/* ---------------------------------------------------------------- home */

.home-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.streak {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 13px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-pill);
  font-weight: 750; font-size: 16px; color: var(--gold);
  font-variant-numeric: tabular-nums; cursor: pointer;
}
.streak-flame { font-size: 15px; animation: flicker 2.4s var(--ease-both) 3; }
@keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
.home-date { color: var(--ink-3); font-size: 14.5px; }

.streak-stats { display: flex; justify-content: space-between; margin: 0; }
.streak-stats div { text-align: center; }
.streak-stats dt { font-size: 12.5px; color: var(--ink-3); }
.streak-stats dd { margin: 2px 0 0; font-size: 24px; font-weight: 750; }

.spark-card {
  position: relative;
  padding: 30px 26px 28px;
  box-shadow: var(--sh-3);
  cursor: pointer;
  animation: reveal .52s var(--ease-out) both;
  overflow: hidden;
}
@keyframes reveal {
  from { opacity: 0; transform: translateY(12px) scale(.965); }
  to { opacity: 1; transform: none; }
}
.spark-card::before {
  /* The ember glow behind the text — the same gesture the share card makes. */
  content: ""; position: absolute; inset: -40% -20% auto -20%; height: 70%;
  background: radial-gradient(closest-side, var(--ember-wash), transparent 78%);
  opacity: .75; pointer-events: none;
}
.spark-meta {
  position: relative;
  font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
  color: var(--ember); margin-bottom: 14px;
}
.spark-title {
  position: relative;
  font-family: var(--serif); font-weight: 700;
  font-size: 30px; line-height: 1.16; letter-spacing: -.01em;
  margin-bottom: 12px;
}
.spark-body { position: relative; color: var(--ink-2); font-size: 16.5px; line-height: 1.55; }
.spark-rule { height: 1px; background: var(--line); margin: 18px 0 14px; }
.spark-action { position: relative; font-size: 17px; font-weight: 700; line-height: 1.45; }
.spark-done {
  position: absolute; inset-inline-end: 20px; top: 20px;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--moss-wash); color: var(--moss);
  display: grid; place-items: center; font-weight: 800;
}

.responses { display: flex; gap: 8px; margin: 16px 0 12px; }
.resp {
  flex: 1; min-height: 54px; padding: 0 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); font-size: 15.5px; font-weight: 700;
  color: var(--ink-2); cursor: pointer;
  transition: transform .12s var(--ease-out);
}
.resp:active { transform: scale(.97); }
.resp-done { background: var(--ember); border-color: var(--ember); color: #fff; flex: 1.35; }

.after { text-align: center; padding: 18px 0 6px; }
.after-line { font-size: 17px; font-weight: 700; }
.after-next { color: var(--ink-3); font-size: 14px; margin-top: 4px; }

.secondary { display: flex; gap: 8px; justify-content: center; }
.mini {
  min-height: 40px; padding: 0 14px;
  background: transparent; border: 0; border-radius: var(--r-sm);
  color: var(--ink-3); font-size: 14.5px; font-weight: 600; cursor: pointer;
}
.mini:disabled { opacity: .4; }
.coach { margin-top: 18px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* ---------------------------------------------------------------- mood */

.mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood {

  padding: 16px 6px;
  background: var(--sunken); border: 1px solid transparent;
  border-radius: var(--r); color: var(--ink-2); cursor: pointer;
}
.mood:active { border-color: var(--ember); }
.mood-glyph { width: 26px; height: 26px; color: var(--ink); }
.mood-label { font-size: 14px; font-weight: 600; }

.reason-list { display: flex; flex-direction: column; gap: 8px; }
.reason {
  min-height: 50px; padding: 0 16px; text-align: start;
  background: var(--sunken); border: 0; border-radius: var(--r);
  font-size: 16px; font-weight: 600; cursor: pointer;
}

/* ---------------------------------------------------------------- detail */

.detail-why { color: var(--ember); font-size: 14.5px; font-weight: 600; margin-bottom: 12px; }
.detail-expansion { color: var(--ink-2); font-size: 15.5px; line-height: 1.6; margin-bottom: 14px; }
.detail-easier {
  padding: 14px 16px; background: var(--sunken); border-radius: var(--r); margin-bottom: 14px;
}
.detail-easier-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; }
.detail-actions { margin-bottom: 14px; }
.btn-timer { width: 100%; font-variant-numeric: tabular-nums; }
.timer-time { color: var(--ember); font-weight: 750; }
.detail-date { color: var(--ink-3); font-size: 14px; margin-bottom: 10px; }
.detail-note {
  margin: 12px 0 0; padding: 12px 14px;
  border-inline-start: 3px solid var(--line);
  color: var(--ink-2); font-size: 15px;
}
.detail-foot { margin-top: 16px; }
.detail-foot .btn { width: 100%; }

/* ---------------------------------------------------------------- support */

/* Quiet by construction: no red, no icon, no raised voice. */
.support { background: var(--sunken); border-color: var(--line); }
.support-line { font-size: 17px; line-height: 1.5; margin-bottom: 16px; }
.support-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.support-list a {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 13px 15px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r);
  text-decoration: none; color: var(--ink);
}
.support-name { font-weight: 600; font-size: 15.5px; }
.support-detail { color: var(--ink-3); font-size: 14px; }
.support-actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------------------------------------------------------------- book */

.filters { margin-bottom: 14px; }
.search { margin-bottom: 10px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline-month {
  position: sticky; top: 0; z-index: 2;
  padding: 10px 2px 6px; margin-top: 10px;
  background: var(--canvas);
  font-size: 13px; font-weight: 700; color: var(--ink-3);
}
.tl-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; margin-bottom: 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); cursor: pointer;
}
.tl-mark {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px; font-weight: 800;
  background: var(--sunken); color: var(--ink-3);
}
.tl-row.is-done .tl-mark { background: var(--moss-wash); color: var(--moss); }
.tl-row.is-later .tl-mark { background: var(--ember-wash); color: var(--ember); }
.tl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl-title { font-weight: 650; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-meta { color: var(--ink-3); font-size: 13px; }
.tl-saved { color: var(--gold); }

.year-stats { display: flex; justify-content: space-around; margin-bottom: 18px; }
.heat-frame { display: flex; gap: 7px; align-items: flex-start; }
.heat-days {
  display: grid; grid-template-rows: repeat(7, 11px); gap: 3px;
  flex: none; direction: rtl;
  font-size: 9.5px; line-height: 11px; color: var(--ink-3);
}
.heat-wrap { overflow-x: auto; padding-bottom: 6px; flex: 1; min-width: 0; }
/* LTR inside an RTL page: time runs left to right here, and an RTL scroll
   container reports scrollLeft inconsistently across browsers. */
.heat {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px);
  gap: 3px; direction: ltr; width: max-content;
}
.heat-cell { width: 11px; height: 11px; border-radius: 2.5px; background: var(--sunken); }
.heat-cell.is-pad { background: transparent; }
.heat-cell.is-open { background: var(--ember-wash); }
.heat-cell.is-later { background: var(--ember-wash); }
.heat-cell.is-frozen { background: var(--line); }
.heat-cell.is-done { background: var(--ember); }
.heat-legend {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-top: 14px; color: var(--ink-3); font-size: 12.5px;
}
.heat-legend .heat-cell { margin-inline-start: 6px; }

/* ---------------------------------------------------------------- insights */

.insight-narrative { font-size: 18px; line-height: 1.5; margin-bottom: 20px; }
.chart { margin-bottom: 20px; }
.chart-title { font-size: 13px; font-weight: 700; color: var(--ink-3); margin-bottom: 10px; }

.bars { display: flex; gap: 6px; align-items: flex-end; height: 76px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 5px 5px 3px 3px; background: var(--sunken); height: 18%; }
.bar.is-done { background: var(--ember); height: 100%; }
.bar.is-later { background: var(--ember-wash); height: 55%; }
.bar.is-open { background: var(--line); height: 36%; }
.bar-label { font-size: 11.5px; color: var(--ink-3); }

.ratio-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.ratio { display: grid; grid-template-columns: 88px 1fr 42px; align-items: center; gap: 10px; }
.ratio-label { font-size: 14.5px; color: var(--ink-2); }
.ratio-track { height: 8px; background: var(--sunken); border-radius: var(--r-pill); overflow: hidden; }
.ratio-fill { display: block; height: 100%; background: var(--ember); border-radius: var(--r-pill); }
.ratio-value { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: start; }

.suggest { border-color: var(--ember); }
.suggest-title { font-size: 13px; font-weight: 700; color: var(--ember); margin-bottom: 6px; }
.suggest-body { font-size: 16.5px; margin-bottom: 14px; }
.suggest .btn { width: 100%; }

.model-list { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.model-list div { display: flex; justify-content: space-between; align-items: baseline; }
.model-list dt { color: var(--ink-2); font-size: 15px; }
.model-list dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.model-note { color: var(--ink-3); font-size: 13.5px; margin-top: 12px; }

.interest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.interest {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 12px 14px; text-align: start;
  background: var(--sunken); border: 1px solid transparent;
  border-radius: var(--r); cursor: pointer;
}
.interest-name { font-size: 15px; font-weight: 650; }
.interest-state { font-size: 12.5px; color: var(--ink-3); }
.interest.lvl-2 { background: var(--ember-wash); border-color: var(--ember); }
.interest.lvl-2 .interest-state { color: var(--ember); }
.interest.lvl-0 { opacity: .55; }

.ladder { display: flex; flex-direction: column; gap: 6px; }
.ladder-step {
  min-height: 44px; padding: 0 14px; text-align: start;
  background: var(--sunken); border: 1px solid transparent;
  border-radius: var(--r); font-size: 15px; font-weight: 600;
  color: var(--ink-2); cursor: pointer;
}
.ladder-step.is-on { background: var(--ember-wash); border-color: var(--ember); color: var(--ember); }

.preview {
  margin-top: 6px; padding: 16px 18px;
  background: var(--sunken); border-radius: var(--r);
}
.preview-label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 8px; }
.preview-title { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.preview-action { font-size: 15px; color: var(--ink-2); }

/* ---------------------------------------------------------------- tabs */

.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 50;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));

}
@supports not (backdrop-filter: blur(1px)) { .tabs { background: var(--canvas); } }
.tab {
  flex: 1; max-width: 120px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px; min-height: 52px;
  background: none; border: 0; border-radius: var(--r-sm);
  color: var(--ink-3); cursor: pointer;
}
.tab.is-on { color: var(--ember); }
.tab-icon { width: 23px; height: 23px; }
.tab-label { font-size: 11.5px; font-weight: 650; }

/* ---------------------------------------------------------------- effects */

.particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute; bottom: 24%; inset-inline-start: var(--x);
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--ember-bright);
  opacity: 0;

}
@keyframes float {

  100% { opacity: 0; transform: translateY(-90px) scale(calc(var(--s) * .4)); }

.celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.confetti {
  position: absolute; top: -14px; inset-inline-start: var(--x);
  width: 7px; height: 12px; border-radius: 2px;

.confetti:nth-child(3n) { background: var(--gold); }

.skeleton { padding-top: 10px; }
.sk-line { height: 14px; border-radius: 6px; background: var(--sunken); margin-bottom: 14px; }
.sk-w40 { width: 40%; }
.sk-card { height: 230px; border-radius: var(--r-card); background: var(--sunken); }

.share-preview { width: 100%; border-radius: var(--r); display: block; }
.share-body { display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- wide */

@media (min-width: 720px) {
  .screen { padding-top: 34px; }
  .tabs {
    inset-inline: auto; inset-inline-start: 50%; transform: translateX(50%);
    bottom: 18px; border-radius: var(--r-pill); border: 1px solid var(--line);
    box-shadow: var(--sh-2); padding: 6px;
  }
  .tab { max-width: 92px; }
}
